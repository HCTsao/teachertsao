<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相等的比賽車 - 教師管理後台</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <!-- Firebase Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: radial-gradient(circle at 15% 15%, #1e1b4b 0%, #0f172a 45%, #020617 100%);
            min-height: 100vh;
            color: #f8fafc;
        }
        .font-racing {
            font-family: 'Orbitron', 'Noto Sans TC', sans-serif;
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 45px -10px rgba(0, 0, 0, 0.6);
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: all 0.2s ease;
        }
        .glass-card:hover {
            border-color: rgba(234, 179, 8, 0.35);
            transform: translateY(-2px);
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #111827;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
    </style>
</head>
<body class="p-3 sm:p-6 flex flex-col items-center">

    <!-- 左上角固定導覽按鈕 (回到遊戲) -->
    <div class="fixed top-3 left-3 z-50">
        <a href="相等的比賽車.html" class="px-3.5 py-1.5 rounded-xl bg-slate-900/95 hover:bg-slate-800 text-xs sm:text-sm font-bold text-slate-100 border border-slate-700/80 hover:border-amber-400 shadow-xl backdrop-blur transition flex items-center gap-1.5 cursor-pointer no-underline text-white">
            <span>🎮</span> 回到遊戲
        </a>
    </div>

    <!-- 主容器 -->
    <div class="max-w-7xl w-full flex flex-col gap-5 pt-8 sm:pt-4">

        <!-- 頂部導航標題列 -->
        <header class="glass-panel rounded-3xl p-4 sm:p-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3.5">
                <a href="相等的比賽車.html" class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-red-600 via-amber-500 to-yellow-400 flex items-center justify-center text-2xl shadow-lg shadow-red-500/30 hover:scale-105 transition-transform" title="返回賽車遊戲">
                    🏎️
                </a>
                <div>
                    <div class="flex items-center gap-2.5 flex-wrap">
                        <h1 class="text-2xl sm:text-3xl font-black font-racing text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-orange-400 to-red-500">
                            相等的比賽車 · 教師管理後台
                        </h1>
                        <span id="connStatusBadge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> Firebase 即時連線
                        </span>
                    </div>
                    <p class="text-slate-400 text-xs sm:text-sm mt-0.5">
                        國小六年級數學：最簡整數比・找相等的比・學生競賽成績與錯題分析
                    </p>
                </div>
            </div>

            <!-- 右側功能動作按鈕 -->
            <div class="flex items-center gap-2.5 w-full md:w-auto justify-end flex-wrap">
                <a href="相等的比賽車.html" class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs sm:text-sm border border-slate-700 flex items-center gap-1.5 transition no-underline">
                    <span>🎮</span> 返回遊戲
                </a>
                <button onclick="exportToExcel()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs sm:text-sm flex items-center gap-1.5 shadow-lg shadow-emerald-950/40 transition cursor-pointer">
                    <i class="fa-solid fa-file-excel"></i> 匯出 Excel
                </button>
                <button onclick="confirmClearData()" class="px-3.5 py-2 rounded-xl bg-red-950/40 hover:bg-red-800/60 text-red-300 border border-red-700/50 font-bold text-xs sm:text-sm flex items-center gap-1 transition cursor-pointer" title="清除所有資料庫紀錄">
                    <i class="fa-solid fa-trash"></i> 清除紀錄
                </button>
            </div>
        </header>

        <!-- 統計數據卡片列 -->
        <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4">
            <div class="glass-card rounded-2xl p-4 flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-xl bg-blue-500/20 border border-blue-500/30 flex items-center justify-center text-2xl text-blue-400">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">總參賽人次</div>
                    <div id="stat-total-count" class="text-2xl font-black font-racing text-white mt-0.5">0</div>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-4 flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-xl bg-emerald-500/20 border border-emerald-500/30 flex items-center justify-center text-2xl text-emerald-400">
                    <i class="fa-solid fa-bullseye"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">平均正確率</div>
                    <div id="stat-avg-acc" class="text-2xl font-black font-racing text-emerald-400 mt-0.5">0%</div>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-4 flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-xl bg-yellow-500/20 border border-yellow-500/30 flex items-center justify-center text-2xl text-yellow-400">
                    <i class="fa-solid fa-trophy"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">奪冠次數 (1st)</div>
                    <div id="stat-champion-count" class="text-2xl font-black font-racing text-yellow-300 mt-0.5">0</div>
                </div>
            </div>

            <div class="glass-card rounded-2xl p-4 flex items-center gap-3.5">
                <div class="w-12 h-12 rounded-xl bg-red-500/20 border border-red-500/30 flex items-center justify-center text-2xl text-red-400">
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <div>
                    <div class="text-xs text-slate-400 font-bold">全場最高時速</div>
                    <div id="stat-top-speed" class="text-2xl font-black font-racing text-red-400 mt-0.5">0 km/h</div>
                </div>
            </div>
        </div>

        <!-- 篩選與搜尋工具列 -->
        <div class="glass-panel rounded-2xl p-3.5 sm:p-4 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center gap-2 w-full md:w-auto flex-wrap">
                <!-- 難度模式篩選 -->
                <div class="flex items-center gap-1 bg-slate-900 border border-slate-700/80 rounded-xl p-1 text-xs font-bold">
                    <button class="filter-mode-btn active px-3 py-1.5 rounded-lg bg-amber-500 text-slate-950 font-black" data-mode="all">全部難度</button>
                    <button class="filter-mode-btn px-3 py-1.5 rounded-lg text-slate-300 hover:text-white" data-mode="50cc">50cc</button>
                    <button class="filter-mode-btn px-3 py-1.5 rounded-lg text-slate-300 hover:text-white" data-mode="100cc">100cc</button>
                    <button class="filter-mode-btn px-3 py-1.5 rounded-lg text-slate-300 hover:text-white" data-mode="150cc">150cc</button>
                </div>

                <!-- 班級篩選 -->
                <select id="filter-class-select" onchange="applyFilters()" class="bg-slate-900 border border-slate-700/80 rounded-xl px-3 py-1.5 text-xs text-slate-200 font-bold outline-none">
                    <option value="all">全部班級</option>
                </select>
            </div>

            <!-- 關鍵字搜尋 -->
            <div class="relative w-full md:w-64">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
                <input type="text" id="filter-search-input" oninput="applyFilters()" placeholder="搜尋姓名或座號..." class="w-full pl-8 pr-3 py-1.5 rounded-xl bg-slate-900 border border-slate-700/80 text-xs text-white placeholder-slate-500 font-bold outline-none focus:border-amber-400">
            </div>
        </div>

        <!-- 成績資料主表格 -->
        <div class="glass-panel rounded-3xl p-4 sm:p-6 overflow-hidden">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-amber-400"></i> 即時競賽紀錄列表
                    <span id="record-count-badge" class="text-xs px-2 py-0.5 rounded-full bg-slate-800 text-slate-300 font-mono">0 筆</span>
                </h3>
                <span class="text-xs text-slate-400">每當學生完賽時將即時同步更新</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead>
                        <tr class="border-b border-slate-800 text-slate-400 text-[11px] font-bold uppercase tracking-wider">
                            <th class="py-3 px-3">時間</th>
                            <th class="py-3 px-3">班級</th>
                            <th class="py-3 px-3">座號</th>
                            <th class="py-3 px-3">車手姓名</th>
                            <th class="py-3 px-3">挑戰難度</th>
                            <th class="py-3 px-3">最終名次</th>
                            <th class="py-3 px-3 text-center">答對 / 總題數</th>
                            <th class="py-3 px-3 text-center">正確率</th>
                            <th class="py-3 px-3 text-center">最高時速</th>
                            <th class="py-3 px-3 text-center">錯題詳情</th>
                        </tr>
                    </thead>
                    <tbody id="records-table-body" class="divide-y divide-slate-800/60 font-medium">
                        <tr>
                            <td colspan="10" class="py-8 text-center text-slate-500">
                                <i class="fa-solid fa-spinner fa-spin text-xl mr-2 text-amber-400"></i> 連線載入紀錄中...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <!-- 錯題詳情查看彈窗 (Modal) -->
    <div id="modal-mistakes" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-900 border border-slate-800 rounded-3xl max-w-2xl w-full p-5 sm:p-7 shadow-2xl relative max-h-[85vh] flex flex-col">
            <button onclick="closeMistakesModal()" class="absolute top-5 right-5 text-slate-400 hover:text-white text-xl font-bold cursor-pointer">
                ✕
            </button>

            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 rounded-xl bg-red-500/20 border border-red-500/30 flex items-center justify-center text-xl text-red-400">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
                <div>
                    <h3 id="modal-mistake-student" class="text-base sm:text-lg font-bold text-white">學生錯題分析</h3>
                    <p id="modal-mistake-meta" class="text-xs text-slate-400">答題詳情與標準計算過程</p>
                </div>
            </div>

            <div id="modal-mistakes-list" class="flex-1 overflow-y-auto space-y-2.5 pr-1 text-xs">
                <!-- 動態注入錯題項目 -->
            </div>

            <div class="mt-4 pt-3 border-t border-slate-800 flex justify-end">
                <button onclick="closeMistakesModal()" class="px-5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-white font-bold text-xs transition cursor-pointer">
                    關閉
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT 後台邏輯與 FIREBASE 連線 -->
    <script>
    // ==========================================
    // 進入教師後台密碼驗證 (8888)
    // ==========================================
    function verifyTeacherAccess() {
        const urlParams = new URLSearchParams(window.location.search);
        const isParamAuthed = urlParams.get('auth') === '8888';
        let isSessionAuthed = false;
        try {
            isSessionAuthed = sessionStorage.getItem('equal_ratio_teacher_authed') === 'true';
        } catch (e) {}

        if (isParamAuthed || isSessionAuthed) {
            try {
                sessionStorage.setItem('equal_ratio_teacher_authed', 'true');
            } catch (e) {}
            if (isParamAuthed) {
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            return true;
        }

        const inputPwd = prompt("🔒 請輸入教師後台管理密碼：");
        if (inputPwd === "8888") {
            try {
                sessionStorage.setItem('equal_ratio_teacher_authed', 'true');
            } catch (e) {}
            return true;
        } else {
            if (inputPwd !== null) {
                alert("❌ 密碼錯誤，無法進入教師後台！");
            }
            window.location.href = "相等的比賽車.html";
            return false;
        }
    }

    if (!verifyTeacherAccess()) {
        throw new Error("Teacher authentication failed");
    }

    // ==========================================
    // Firebase 連線設定
    // ==========================================
    const firebaseConfig = {
        apiKey: "AIzaSyCFNaVRETt062_As1hF7Mfyr22pKMG-lvk",
        authDomain: "chickenrabbit-ea442.firebaseapp.com",
        databaseURL: "https://chickenrabbit-ea442-default-rtdb.firebaseio.com",
        projectId: "chickenrabbit-ea442",
        storageBucket: "chickenrabbit-ea442.firebasestorage.app",
        messagingSenderId: "65728951973",
        appId: "1:65728951973:web:eb52738ca86ed7175abf4c"
    };

    let allRecords = [];
    let currentFilterMode = 'all';

    try {
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        console.log("Firebase 教師後台初始化成功！");

        // 即時監聽 EqualRatioRacing/records
        database.ref('EqualRatioRacing/records').on('value', (snapshot) => {
            const data = snapshot.val();
            allRecords = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    allRecords.push({ id: key, ...data[key] });
                });
                // 依時間倒序排列 (最新在前)
                allRecords.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            }
            updateClassSelectOptions();
            applyFilters();
        }, (error) => {
            console.error("Firebase 讀取失敗:", error);
            document.getElementById('records-table-body').innerHTML = `
                <tr><td colspan="10" class="py-8 text-center text-red-400">
                    <i class="fa-solid fa-circle-exclamation text-xl mb-1 block"></i>
                    無法讀取 Firebase 資料，請檢查網路連線。
                </td></tr>`;
        });

    } catch (e) {
        console.error("Firebase 連線初始化失敗:", e);
    }

    // 更新班級下拉清單
    function updateClassSelectOptions() {
        const select = document.getElementById('filter-class-select');
        const currentVal = select.value;
        const classes = new Set();
        allRecords.forEach(r => {
            if (r.className) classes.add(r.className);
        });

        select.innerHTML = '<option value="all">全部班級</option>';
        Array.from(classes).sort().forEach(cls => {
            const opt = document.createElement('option');
            opt.value = cls;
            opt.innerText = cls;
            select.appendChild(opt);
        });
        if (currentVal && Array.from(classes).includes(currentVal)) {
            select.value = currentVal;
        }
    }

    // 篩選與渲染表格
    function applyFilters() {
        const selectedClass = document.getElementById('filter-class-select').value;
        const keyword = document.getElementById('filter-search-input').value.trim().toLowerCase();

        const filtered = allRecords.filter(r => {
            // 模式過濾
            if (currentFilterMode !== 'all' && r.mode !== currentFilterMode) return false;
            // 班級過濾
            if (selectedClass !== 'all' && r.className !== selectedClass) return false;
            // 關鍵字搜尋 (姓名或座號)
            if (keyword) {
                const name = (r.studentName || '').toLowerCase();
                const seat = String(r.seatNumber || '');
                if (!name.includes(keyword) && !seat.includes(keyword)) return false;
            }
            return true;
        });

        renderStatistics(filtered);
        renderTable(filtered);
    }

    // 渲染統計卡片
    function renderStatistics(records) {
        document.getElementById('stat-total-count').innerText = records.length;

        if (records.length === 0) {
            document.getElementById('stat-avg-acc').innerText = '0%';
            document.getElementById('stat-champion-count').innerText = '0';
            document.getElementById('stat-top-speed').innerText = '0 km/h';
            return;
        }

        let totalAcc = 0;
        let champions = 0;
        let maxSpeed = 0;

        records.forEach(r => {
            totalAcc += (r.accuracy || 0);
            if (r.rank === 1) champions++;
            const spd = parseInt(r.topSpeed, 10) || 0;
            if (spd > maxSpeed) maxSpeed = spd;
        });

        const avgAcc = Math.round(totalAcc / records.length);
        document.getElementById('stat-avg-acc').innerText = `${avgAcc}%`;
        document.getElementById('stat-champion-count').innerText = champions;
        document.getElementById('stat-top-speed').innerText = `${maxSpeed} km/h`;
    }

    // 渲染表格內容
    function renderTable(records) {
        const tbody = document.getElementById('records-table-body');
        document.getElementById('record-count-badge').innerText = `${records.length} 筆`;

        if (records.length === 0) {
            tbody.innerHTML = `
                <tr><td colspan="10" class="py-8 text-center text-slate-500">
                    尚無符合條件的競賽紀錄
                </td></tr>`;
            return;
        }

        tbody.innerHTML = records.map((r, index) => {
            const mistakes = r.mistakes || [];
            const mistakeCount = mistakes.length;
            const rankBadges = {
                1: '<span class="text-yellow-300 font-black">🥇 冠軍</span>',
                2: '<span class="text-slate-300 font-bold">🥈 亞軍</span>',
                3: '<span class="text-amber-500 font-bold">🥉 季軍</span>'
            };
            const rankDisplay = rankBadges[r.rank] || `<span class="text-slate-400">${r.rank || '-'}th</span>`;

            const modeLabels = {
                '50cc': '<span class="px-2 py-0.5 rounded-md bg-emerald-500/20 text-emerald-400 font-bold text-xs">50cc</span>',
                '100cc': '<span class="px-2 py-0.5 rounded-md bg-amber-500/20 text-amber-400 font-bold text-xs">100cc</span>',
                '150cc': '<span class="px-2 py-0.5 rounded-md bg-red-500/20 text-red-400 font-bold text-xs">150cc</span>'
            };

            const accColor = (r.accuracy >= 80) ? 'text-emerald-400' : (r.accuracy >= 60 ? 'text-yellow-400' : 'text-red-400');

            return `
                <tr class="hover:bg-slate-800/40 transition-colors">
                    <td class="py-3 px-3 text-slate-400 font-mono text-xs whitespace-nowrap">${r.dateStr || '-'}</td>
                    <td class="py-3 px-3 font-bold text-slate-200">${r.className || '-'}</td>
                    <td class="py-3 px-3 font-bold text-amber-400 font-mono">${r.seatNumber || '-'}</td>
                    <td class="py-3 px-3 font-bold text-white">${r.studentName || '訪客'}</td>
                    <td class="py-3 px-3">${modeLabels[r.mode] || r.mode}</td>
                    <td class="py-3 px-3 font-bold">${rankDisplay}</td>
                    <td class="py-3 px-3 text-center font-mono font-bold">${r.correctCount || 0} / ${r.totalAnswered || 0}</td>
                    <td class="py-3 px-3 text-center font-mono font-black ${accColor}">${r.accuracy || 0}%</td>
                    <td class="py-3 px-3 text-center font-mono font-bold text-slate-200">${r.topSpeed || '-'} km/h</td>
                    <td class="py-3 px-3 text-center">
                        ${mistakeCount > 0 ? `
                            <button onclick="viewMistakes(${index})" class="px-2.5 py-1 rounded-lg bg-red-500/20 hover:bg-red-500/40 text-red-300 font-bold text-xs border border-red-500/30 transition cursor-pointer">
                                錯題 (${mistakeCount})
                            </button>
                        ` : `
                            <span class="text-emerald-400 text-xs font-bold">全對 ✔️</span>
                        `}
                    </td>
                </tr>
            `;
        }).join('');
    }

    // 錯題彈窗
    let currentRenderedRecords = [];
    function viewMistakes(index) {
        const selectedClass = document.getElementById('filter-class-select').value;
        const keyword = document.getElementById('filter-search-input').value.trim().toLowerCase();
        const filtered = allRecords.filter(r => {
            if (currentFilterMode !== 'all' && r.mode !== currentFilterMode) return false;
            if (selectedClass !== 'all' && r.className !== selectedClass) return false;
            if (keyword) {
                const name = (r.studentName || '').toLowerCase();
                const seat = String(r.seatNumber || '');
                if (!name.includes(keyword) && !seat.includes(keyword)) return false;
            }
            return true;
        });

        const r = filtered[index];
        if (!r) return;

        document.getElementById('modal-mistake-student').innerText = `${r.className || ''} ${r.seatNumber ? r.seatNumber + '號' : ''} ${r.studentName || '車手'} 的錯題紀錄`;
        document.getElementById('modal-mistake-meta').innerText = `挑戰模式: ${r.mode} | 正確率: ${r.accuracy}% | 完賽時間: ${r.dateStr || ''}`;

        const listEl = document.getElementById('modal-mistakes-list');
        const mistakes = r.mistakes || [];

        if (mistakes.length === 0) {
            listEl.innerHTML = '<div class="py-4 text-center text-emerald-400 font-bold">本場比賽零失誤，全部答對！</div>';
        } else {
            listEl.innerHTML = mistakes.map((m, idx) => `
                <div class="p-3 rounded-xl bg-slate-950 border border-slate-800">
                    <div class="flex items-center justify-between font-bold mb-1">
                        <span class="text-amber-400">錯題 #${idx + 1}：題目比【${m.target || '-'}】</span>
                        <span class="text-red-400 font-bold">答錯 ❌</span>
                    </div>
                    <div class="text-slate-400 text-xs mt-1">
                        學生選擇：<span class="text-red-300 line-through mr-3">${m.chosen || '-'}</span>
                        正確答案：<span class="text-emerald-300 font-bold">${m.correct || '-'}</span>
                    </div>
                    ${m.explanation ? `<div class="mt-2 p-2 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-slate-300 font-mono leading-relaxed">${m.explanation}</div>` : ''}
                </div>
            `).join('');
        }

        document.getElementById('modal-mistakes').classList.remove('hidden');
    }

    function closeMistakesModal() {
        document.getElementById('modal-mistakes').classList.add('hidden');
    }

    // 難度模式標籤切換
    document.querySelectorAll('.filter-mode-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.filter-mode-btn').forEach(b => {
                b.classList.remove('active', 'bg-amber-500', 'text-slate-950', 'font-black');
                b.classList.add('text-slate-300');
            });
            btn.classList.add('active', 'bg-amber-500', 'text-slate-950', 'font-black');
            btn.classList.remove('text-slate-300');
            currentFilterMode = btn.dataset.mode;
            applyFilters();
        });
    });

    // 匯出 Excel
    function exportToExcel() {
        if (allRecords.length === 0) {
            alert("目前尚無資料可匯出！");
            return;
        }

        const dataToExport = allRecords.map(r => ({
            "完賽時間": r.dateStr || '',
            "班級": r.className || '',
            "座號": r.seatNumber || '',
            "姓名": r.studentName || '訪客',
            "挑戰難度": r.mode || '',
            "最終名次": r.rank || '',
            "答對題數": r.correctCount || 0,
            "總作答題數": r.totalAnswered || 0,
            "正確率(%)": r.accuracy || 0,
            "最高時速(km/h)": r.topSpeed || '',
            "錯題數": (r.mistakes || []).length
        }));

        const ws = XLSX.utils.json_to_sheet(dataToExport);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "等比賽車紀錄");
        XLSX.writeFile(wb, `相等的比賽車_學生學習紀錄_${new Date().toISOString().slice(0, 10)}.xlsx`);
    }

    // 清除全部紀錄 (需二次密碼確認)
    function confirmClearData() {
        const confirmPwd = prompt("⚠️ 注意：清除後所有學生的競賽紀錄將無法復原！\n請輸入管理員清除密碼：");
        if (confirmPwd === "0987912307") {
            try {
                firebase.database().ref('EqualRatioRacing/records').remove().then(() => {
                    alert("✅ 已成功清空所有紀錄！");
                });
            } catch (e) {
                alert("❌ 清除失敗: " + e.message);
            }
        } else if (confirmPwd !== null) {
            alert("❌ 密碼錯誤，已取消操作。");
        }
    }
    </script>
</body>
</html>
