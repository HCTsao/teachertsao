<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圓面積</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "Heiti TC", sans-serif;
            text-align: center;
            background-color: #f5f7fa;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: inline-block;
            padding: 20px;
            max-width: 950px;
            width: 100%;
        }
        
        .canvas-wrapper {
            position: relative;
            width: 900px;
            height: 400px;
            margin: 10px auto;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            background-color: #fff;
        }
        
        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls {
            margin: 20px 0;
            text-align: left;
            padding: 15px 40px;
            background-color: #fafafa;
            border-radius: 10px;
        }
        .control-group {
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        label {
            font-weight: bold;
            width: 130px;
            color: #333;
            text-align: right;
            margin-right: 15px;
        }
        input[type=range] {
            flex-grow: 1;
            max-width: 400px;
            cursor: pointer;
        }
        .value-display {
            width: 100px;
            color: #2980b9;
            font-family: monospace;
            font-size: 1.1em;
            font-weight: bold;
            text-align: left;
            margin-left: 15px;
        }
        
        /* 按鈕樣式 */
        #btnNext {
            position: absolute;
            right: 50px;
            bottom: 80px;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            transition: all 0.2s;
            font-family: "Microsoft JhengHei", sans-serif;
            display: none;
            z-index: 10;
        }
        #btnNext:hover {
            background-color: #27ae60;
            transform: scale(1.05);
        }
        #btnNext:active {
            transform: scale(0.95);
        }

        /* 公式區 */
        #formulaArea {
            margin-top: 20px;
            display: none; /* 由 JS 改成 display: grid */
            grid-template-columns: auto auto 1fr;
            gap: 0 10px;
            padding: 20px 40px;
            background-color: #fdfefe;
            border: 2px dashed #bdc3c7;
            border-radius: 10px;
            min-height: 200px;
            font-size: 1.2em;
            color: #2c3e50;
            line-height: 2.2em;
        }
        .formula-line {
            display: contents; /* 讓子元素直接參與外層 grid 排版 */
        }
        .formula-part {
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.5s ease-out;
            font-weight: bold;
            text-align: left; /* 強制靠左對齊，不受外層置中樣式影響 */
        }
        .formula-line.visible .formula-part {
            opacity: 1;
            transform: translateY(0);
        }
        
        .fraction {
            display: inline-block;
            vertical-align: middle;
            text-align: center;
            font-size: 0.9em;
            margin: 0 2px;
        }
        .fraction > span {
            display: block;
            padding: 0 2px;
        }
        .fraction span.num {
            border-bottom: 2px solid #2c3e50;
        }
        .fraction span.den {
            padding-top: 1px;
        }

        h2 { color: #2c3e50; margin-bottom: 5px;}
    </style>
</head>
<body>

<div class="container">
    <h2>圓面積公式推導</h2>
    
    <div class="controls">
        <div class="control-group">
            <label>1. 切割份數 (n)</label>
            <input type="range" id="sliderN" min="0" max="5" step="1" value="0">
            <span id="valN" class="value-display">16</span>
        </div>
        <div style="text-align: center; font-size: 0.8em; color: #999; margin-bottom: 10px;">
            (可選份數: 16, 32, 64, 128, 256, 360)
        </div>

        <div class="control-group">
            <label>2. 變形過程</label>
            <input type="range" id="sliderProgress" min="0" max="2" step="0.005" value="0">
            <span id="valProgress" class="value-display">0%</span>
        </div>
    </div>

    <div class="canvas-wrapper">
        <canvas id="myCanvas" width="900" height="400"></canvas>
        <button id="btnNext">下一步 ➜</button>
    </div>
    
    <!-- 修正後的公式文字 -->
    <div id="formulaArea">
        <div id="line1" class="formula-line">
            <span class="formula-part" style="text-align: right;">圓面積</span>
            <span class="formula-part">＝</span>
            <span class="formula-part"><span style="color:#d35400">圓周長的一半</span> × <span style="color:#e74c3c">半徑</span></span>
        </div>
        <div id="line2" class="formula-line">
            <span class="formula-part"></span>
            <span class="formula-part">＝</span>
            <span class="formula-part">(圓周長 ÷ 2) × 半徑</span>
        </div>
        <div id="line3" class="formula-line">
            <span class="formula-part"></span>
            <span class="formula-part">＝</span>
            <span class="formula-part">(直徑 × 圓周率 ÷ 2) × 半徑</span>
        </div>
        <div id="line4" class="formula-line">
            <span class="formula-part"></span>
            <span class="formula-part">＝</span>
            <span class="formula-part">半徑 × 圓周率 × 半徑</span>
        </div>
        <div id="line5" class="formula-line">
            <span class="formula-part"></span>
            <span class="formula-part">＝</span>
            <span class="formula-part">半徑 × 半徑 × 圓周率 <span style="font-size:0.8em; color:#7f8c8d">(圓周率=3.14)</span></span>
        </div>
    </div>
</div>

<script>
    window.onload = function() {
        const canvas = document.getElementById('myCanvas');
        const ctx = canvas.getContext('2d');
        const sliderN = document.getElementById('sliderN');
        const sliderProgress = document.getElementById('sliderProgress');
        const valN = document.getElementById('valN');
        const valProgress = document.getElementById('valProgress');
        const btnNext = document.getElementById('btnNext');
        const formulaArea = document.getElementById('formulaArea');
        const lines = [
            document.getElementById('line1'),
            document.getElementById('line2'),
            document.getElementById('line3'),
            document.getElementById('line4'),
            document.getElementById('line5')
        ];

        let currentStep = 0;

        if(parseInt(sliderN.value) > 5) sliderN.value = 0;
        if(parseFloat(sliderProgress.value) > 2) sliderProgress.value = 0;

        const nValues = [16, 32, 64, 128, 256, 360];
        const r = 100; 
        const cx = 450; 
        const cy = canvas.height / 2 + 20;

        function lerp(start, end, t) {
            return start + (end - start) * t;
        }

        // 重置教學狀態函式
        function resetTeaching() {
            currentStep = 0;
            // 恢復按鈕外觀
            btnNext.style.display = 'none';
            btnNext.textContent = "下一步 ➜";
            btnNext.style.backgroundColor = "#2ecc71";
            btnNext.style.cursor = "pointer";
            
            // 隱藏公式區
            formulaArea.style.display = 'none';
            lines.forEach(line => line.classList.remove('visible'));
            
            draw();
        }

        function rotatePoint(px, py, cx, cy, angle) {
            const s = Math.sin(angle);
            const c = Math.cos(angle);
            const tempX = px - cx;
            const tempY = py - cy;
            return {
                x: tempX * c - tempY * s + cx,
                y: tempX * s + tempY * c + cy
            };
        }

        function drawArc(ctx, p_tip, p_c1, p_c2, r) {
            const ang1 = Math.atan2(p_c1.y - p_tip.y, p_c1.x - p_tip.x);
            let ang2 = Math.atan2(p_c2.y - p_tip.y, p_c2.x - p_tip.x);
            let diff = ang2 - ang1;
            while (diff < -Math.PI) diff += 2 * Math.PI;
            while (diff > Math.PI) diff -= 2 * Math.PI;
            ctx.arc(p_tip.x, p_tip.y, r, ang1, ang1 + diff, diff < 0);
        }

        function draw() {
            let nIndex = parseInt(sliderN.value);
            if (isNaN(nIndex) || nIndex < 0 || nIndex >= nValues.length) nIndex = 0;
            const totalN = nValues[nIndex]; 
            const halfN = totalN / 2; // n in GeoGebra is half of totalN
            
            let progress = parseFloat(sliderProgress.value);
            if (isNaN(progress)) progress = 0;
            if (progress > 2) progress = 2;

            valN.textContent = totalN;
            let percentText = Math.round(progress * 50) + "%";
            valProgress.textContent = percentText;

            // 邏輯判斷：按鈕顯示控制
            if (!(totalN === 360 && progress >= 1.99)) {
                if (currentStep > 0) resetTeaching(); 
            } else if (currentStep === 0) {
                btnNext.style.display = 'block'; 
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // 每個扇形的弦長與寬度常數
            const stepWidth = 2 * r * Math.sin(Math.PI / totalN);
            const paraWidth = stepWidth * halfN; 
            
            const ox = cx; // 圓心 X 座標 (450)
            const oy = cy - 50 + r; // 圓底端點 (展開的幾何基準點)

            let m = 0;
            let j = 0;
            if (progress <= 1) {
                const t = progress;
                m = t * t * (3 - 2 * t);
                j = 0;
            } else {
                const t = progress - 1;
                m = 1;
                j = t * t * (3 - 2 * t);
            }

            // 圓周邊緣點座標計算
            let circum = [];
            let A_y = oy - r;
            if (m < 0.999) {
                const R_A = r / (1 - m);
                A_y = oy - R_A;
                for (let idx = -halfN; idx <= halfN; idx++) {
                    const angle_idx = (Math.PI * (1 - m)) * idx / halfN;
                    const px = ox + R_A * Math.sin(angle_idx);
                    const py = A_y + R_A * Math.cos(angle_idx);
                    circum.push({x: px, y: py});
                }
            } else {
                for (let idx = -halfN; idx <= halfN; idx++) {
                    circum.push({x: ox + idx * stepWidth, y: oy});
                }
            }

            // 計算每個扇形的頂角(圓心)座標
            let centre = [];
            for (let i = 0; i < totalN; i++) {
                const P1 = circum[i];
                const P2 = circum[i+1];
                const dx = P2.x - P1.x;
                const dy = P2.y - P1.y;
                const d_chord = Math.sqrt(dx * dx + dy * dy);
                const h_temp = Math.sqrt(Math.max(0, r * r - (d_chord / 2) * (d_chord / 2)));
                
                const mx = (P1.x + P2.x) / 2;
                const my = (P1.y + P2.y) / 2;
                
                // 朝向內側/上方的法向量
                const nx = dy / (d_chord || 1);
                const ny = -dx / (d_chord || 1);
                
                centre.push({
                    x: mx + h_temp * nx,
                    y: my + h_temp * ny
                });
            }

            // 計算拼合階段 (progress > 1) 旋轉所使用的 Pivot 點 (右半邊橘色旋轉到左半邊，且錯開半個 stepWidth 以便完美插合)
            const h = Math.sqrt(r * r - (stepWidth / 2) * (stepWidth / 2));
            const pivot_x = ox - stepWidth / 4;
            // 透過正弦波在旋轉途中抬高 Pivot，使橘色部分高高繞起不與紫色碰撞
            const lift = 120 * Math.sin(j * Math.PI);
            const pivot_y = oy - h / 2 - lift;
            const rotationAngle = -j * Math.PI; // 逆時針旋轉（在 Canvas 中，負值代表逆時針向上）至左側上方並插入

            for (let i = 0; i < totalN; i++) {
                let isLeftHalf = (i < halfN);
                
                let p_tip = {x: centre[i].x, y: centre[i].y};
                let p_c1 = {x: circum[i].x, y: circum[i].y};
                let p_c2 = {x: circum[i+1].x, y: circum[i+1].y};

                // 當進度大於 1 時，右半邊橘色扇形繞著 Pivot 旋轉
                if (progress > 1) {
                    if (!isLeftHalf) {
                        p_tip = rotatePoint(p_tip.x, p_tip.y, pivot_x, pivot_y, rotationAngle);
                        p_c1 = rotatePoint(p_c1.x, p_c1.y, pivot_x, pivot_y, rotationAngle);
                        p_c2 = rotatePoint(p_c2.x, p_c2.y, pivot_x, pivot_y, rotationAngle);
                    }
                }

                // 填滿扇形 (進度未達 50% 時全部為紫色；超過 50% 拼合時，右半邊改為橘色，以示對比)
                const isOrange = (progress > 1 && !isLeftHalf);
                ctx.fillStyle = isOrange ? "rgba(255, 200, 100, 1)" : "rgba(200, 160, 255, 1)";
                ctx.beginPath();
                ctx.moveTo(p_tip.x, p_tip.y);
                ctx.lineTo(p_c1.x, p_c1.y);
                drawArc(ctx, p_tip, p_c1, p_c2, r);
                ctx.closePath();
                ctx.fill();

                // 繪製半徑邊線
                ctx.strokeStyle = "rgba(100, 0, 150, 0.4)";
                if (totalN >= 128) ctx.lineWidth = 0.1;
                else if (totalN >= 32) ctx.lineWidth = 0.3;
                else ctx.lineWidth = 0.5;

                ctx.beginPath();
                ctx.moveTo(p_tip.x, p_tip.y);
                ctx.lineTo(p_c1.x, p_c1.y);
                ctx.moveTo(p_tip.x, p_tip.y);
                ctx.lineTo(p_c2.x, p_c2.y);
                ctx.stroke();

                // 繪製圓弧邊線 (未達 50% 時全部為藍色；超過 50% 時，右半邊改為紅色，以示對比)
                ctx.strokeStyle = isOrange ? "red" : "blue";
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                drawArc(ctx, p_tip, p_c1, p_c2, r);
                ctx.stroke();
            }

            // 紅色半徑線 (僅在 n=360 時最頂層繪製，以防被其他扇形邊線覆蓋)
            if (totalN === 360) {
                ctx.beginPath();
                ctx.moveTo(centre[0].x, centre[0].y);
                ctx.lineTo(circum[0].x, circum[0].y);
                ctx.strokeStyle = "#e74c3c"; // 紅色
                ctx.lineWidth = 3.5;
                ctx.stroke();
            }

            // === 標示文字 ===
            if (progress >= 1.99 && totalN === 360) {
                ctx.save();
                ctx.fillStyle = "#333";
                ctx.strokeStyle = "#666";
                ctx.font = "bold 16px Microsoft JhengHei";
                ctx.lineWidth = 1;

                let textH = (currentStep < 1) ? "寬" : "半徑";
                let textW = (currentStep < 1) ? "長" : "圓周長的一半";
                
                let colorH = (currentStep < 1) ? "#333" : "#e74c3c";
                let colorW = (currentStep < 1) ? "#333" : "#d35400";

                const labelX_Radius = ox - paraWidth - 25; 
                const bottomY = oy;
                const topY = oy - h;
                
                ctx.beginPath();
                ctx.moveTo(labelX_Radius + 5, bottomY);
                ctx.lineTo(labelX_Radius + 5, topY);
                ctx.moveTo(labelX_Radius, bottomY); ctx.lineTo(labelX_Radius + 10, bottomY);
                ctx.moveTo(labelX_Radius, topY); ctx.lineTo(labelX_Radius + 10, topY);
                ctx.stroke();
                
                ctx.textAlign = "right";
                ctx.textBaseline = "middle";
                ctx.fillStyle = colorH;
                ctx.fillText(textH, labelX_Radius - 5, bottomY - h/2);

                const labelY_Width = oy + 25; 
                const lineStart = ox - paraWidth; 
                const lineEnd = ox;

                ctx.beginPath();
                ctx.moveTo(lineStart, labelY_Width);
                ctx.lineTo(lineEnd, labelY_Width);
                ctx.moveTo(lineStart, labelY_Width - 5); ctx.lineTo(lineStart, labelY_Width + 5);
                ctx.moveTo(lineEnd, labelY_Width - 5); ctx.lineTo(lineEnd, labelY_Width + 5);
                ctx.strokeStyle = "#666";
                ctx.stroke();

                ctx.textAlign = "center";
                ctx.textBaseline = "top"; 
                ctx.fillStyle = colorW;
                ctx.fillText(textW, lineStart + paraWidth/2, labelY_Width + 5);
                ctx.restore();
            }
        }

        // 修改後的按鈕點擊邏輯
        btnNext.onclick = function() {
            // 如果已經是完成狀態 (Step 6)，點擊則是重置
            if (currentStep === 6) {
                resetTeaching();
                return;
            }

            currentStep++;
            if (currentStep === 1) {
                draw(); // 重繪更新畫布文字
            }
            if (currentStep === 2) {
                formulaArea.style.display = 'grid'; 
                setTimeout(() => lines[0].classList.add('visible'), 50);
            }
            if (currentStep === 3) lines[1].classList.add('visible');
            if (currentStep === 4) lines[2].classList.add('visible');
            if (currentStep === 5) lines[3].classList.add('visible');
            if (currentStep === 6) {
                lines[4].classList.add('visible');
                this.textContent = "完成 (重置)";
                this.style.backgroundColor = "#95a5a6"; 
                // 這裡不用再覆寫 onclick，因為開頭已經判斷 currentStep === 6 了
            }
        };

        sliderN.addEventListener('input', () => { resetTeaching(); draw(); });
        sliderProgress.addEventListener('input', () => { if(currentStep > 0) resetTeaching(); draw(); });

        draw();
    };
</script>

</body>
