<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>寶可夢訓練師 - 老師控制台</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>

  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --success-color: #10b981;
      --danger-color: #ef4444;
      --text-light: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #020617 100%);
      color: var(--text-light);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 20px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 900;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      margin-bottom: 30px;
    }

    .card-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #38bdf8;
    }

    /* Grid Layout */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1.2fr 1.8fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-light);
    }

    select, input[type="number"] {
      width: 100%;
      padding: 12px;
      background: #1e293b;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-light);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }

    select:focus, input[type="number"]:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.3);
    }

    .btn-group {
      display: flex;
      gap: 10px;
    }

    .btn {
      flex: 1;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-danger {
      background: var(--danger-color);
      color: white;
    }
    .btn-danger:hover { background: #dc2626; }

    /* Student List Overview */
    .student-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      margin-bottom: 12px;
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 48px;
      height: 48px;
      background: rgba(255,255,255,0.05);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .avatar img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }

    .student-name {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .student-pokemon-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .student-badge {
      background: #0369a1;
      color: #e0f2fe;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    /* Admin Tabs */
    .admin-tabs {
      display: flex;
      gap: 12px;
      margin-bottom: 25px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .admin-tab-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      color: var(--text-light);
      padding: 10px 22px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.95rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .admin-tab-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: white;
    }
    .admin-tab-btn.active {
      background: var(--primary-color);
      color: #0f172a;
      border-color: var(--primary-color);
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    /* Homework Editor Form */
    .homework-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .subject-input-group {
      display: grid;
      grid-template-columns: 100px 1fr;
      align-items: center;
      gap: 15px;
      background: rgba(15, 23, 42, 0.3);
      padding: 15px;
      border-radius: 14px;
      border: 1px solid var(--border-color);
    }
    .subject-label-badge {
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      color: white;
      text-align: center;
      font-size: 0.9rem;
    }
    .badge-chinese { background: #f97316; }
    .badge-math { background: #3b82f6; }
    .badge-english { background: #10b981; }
    .badge-memo { background: #ec4899; }
    
    textarea.homework-textarea {
      width: 100%;
      height: 60px;
      padding: 10px;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: white;
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      outline: none;
    }
    textarea.homework-textarea:focus {
      border-color: var(--primary-color);
    }

    /* Notice Upload UI */
    .notice-upload-box {
      border: 2px dashed var(--border-color);
      padding: 20px;
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      background: rgba(15, 23, 42, 0.3);
      transition: all 0.2s;
    }
    .notice-upload-box:hover {
      border-color: var(--primary-color);
      background: rgba(59, 130, 246, 0.05);
    }
    .notice-preview-container {
      margin-top: 15px;
      text-align: center;
      position: relative;
      border-radius: 10px;
      overflow: hidden;
      max-height: 250px;
      display: none;
      border: 1px solid var(--border-color);
    }
    .notice-preview-img {
      max-width: 100%;
      max-height: 250px;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1><i class="fa-solid fa-gear"></i> 寶可夢訓練師 - 老師控制台</h1>
      <div style="display: flex; align-items: center; gap: 10px; flex-wrap: wrap;">
        <a href="pokemon_trainer.html" style="display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.08); color: #94a3b8; text-decoration: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; border: 1px solid rgba(255,255,255,0.12); transition: all 0.2s;" onmouseover="this.style.background='rgba(255,255,255,0.15)'; this.style.color='white';" onmouseout="this.style.background='rgba(255,255,255,0.08)'; this.style.color='#94a3b8';">
          <i class="fa-solid fa-gamepad"></i> 回訓練師頁面
        </a>
        <button onclick="window.location.href='二年甲班電子聯絡簿.html'" style="display: flex; align-items: center; gap: 8px; background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 100%); color: #0f172a; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: transform 0.2s; font-family: inherit;">
          <i class="fa-solid fa-book-open"></i> 回電子聯絡簿
        </button>
        <span style="color: var(--text-muted); font-size: 0.9rem;">後台管理系統</span>
      </div>
    </header>

    <div class="admin-tabs">
      <button class="admin-tab-btn active" id="tab-btn-pokemon" onclick="switchAdminTab('pokemon')"><i class="fa-solid fa-gamepad"></i> 學生寶可夢管理</button>
      <button class="admin-tab-btn" id="tab-btn-homework" onclick="switchAdminTab('homework')"><i class="fa-solid fa-book-open"></i> 發佈作業</button>
    </div>

    <!-- 寶可夢管理分頁 -->
    <div id="tab-content-pokemon">
      <div class="dashboard-grid">
        <!-- Left Side: Controls -->
        <div class="glass-card">
          <div class="card-title"><i class="fa-solid fa-wand-magic-sparkles"></i> 點數操作</div>
          
          <div class="form-group">
            <label for="student-select">選擇學生</label>
            <select id="student-select" onchange="updateSelectedInfo()">
              <option value="1">1號 陳洪福</option>
              <option value="2">2號 蕭廷恩</option>
              <option value="3">3號 江岳泰</option>
              <option value="4">4號 陳冠宏</option>
            </select>
          </div>

          <div class="form-group" id="points-group">
            <label for="points-input">給予分數 (可輸入負數扣分)</label>
            <input type="number" id="points-input" value="1" min="-200" max="200">
          </div>

          <div class="form-group">
            <button class="btn btn-primary" onclick="modifyPoints()"><i class="fa-solid fa-plus-minus"></i> 送出增減分</button>
          </div>

          <div style="margin-top: 30px; border-top: 1px solid var(--border-color); padding-top: 20px;">
            <button class="btn btn-danger" onclick="resetStudent()"><i class="fa-solid fa-trash-can"></i> 重設該學生資料</button>
          </div>
        </div>

        <!-- Right Side: Overview -->
        <div class="glass-card">
          <div class="card-title"><i class="fa-solid fa-list"></i> 學生狀態總覽</div>
          <div id="students-list">
            <!-- Rendered via JS -->
          </div>
        </div>
      </div>
    </div>

    <!-- 聯絡簿發佈作業分頁 -->
    <div id="tab-content-homework" style="display: none;">
      <div class="dashboard-grid">
        <!-- 左欄：發佈作業與日期選擇 -->
        <div class="glass-card">
          <div class="card-title"><i class="fa-solid fa-pen-to-square"></i> 發佈今日作業</div>
          
          <div class="form-group">
            <label for="homework-date">選擇日期</label>
            <input type="date" id="homework-date" onchange="loadHomeworkForDate()">
          </div>

          <div class="homework-form">
            <div class="form-group">
              <label for="hw-content">作業內容 (可自由輸入多行文字，直接按 Enter 換行)</label>
              <textarea id="hw-content" class="homework-textarea" style="height: 220px;" placeholder="例如：&#10;1. 國語甲本生字第 1~3 頁&#10;2. 數學習作第 3、4 頁&#10;3. 發下視力篩檢通知單，請家長確認簽字"></textarea>
            </div>

            <div style="display: flex; gap: 12px; margin-top: 10px;">
              <button class="btn btn-primary" onclick="saveHomework()"><i class="fa-solid fa-cloud-arrow-up"></i> 儲存今日作業</button>
              <button class="btn btn-danger" onclick="clearHomework()"><i class="fa-solid fa-trash-can"></i> 清除今日作業</button>
            </div>
          </div>
        </div>

        <!-- 右欄：上傳/管理通知單 -->
        <div class="glass-card">
          <div class="card-title"><i class="fa-solid fa-image"></i> 上傳今日通知單</div>
          
          <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 15px;">
            請上傳本地通知單圖片。圖片將自動壓縮並透過雲端實時同步至學生端聯絡簿。
          </p>

          <div class="notice-upload-box" onclick="triggerNoticeUpload()">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size: 2.5rem; color: var(--primary-color); margin-bottom: 10px;"></i>
            <h4 style="margin: 0 0 5px 0;">點擊選擇通知單圖片檔案</h4>
            <span style="font-size: 0.8rem; color: var(--text-muted);">支援 JPG, PNG 等常見圖檔</span>
            <input type="file" id="notice-file-input" style="display: none;" accept="image/*" onchange="handleNoticeFileSelect(event)">
          </div>

          <div id="notice-preview-container" class="notice-preview-container">
            <img id="notice-preview-img" class="notice-preview-img" src="" alt="預覽圖">
            <button class="btn btn-danger" style="position: absolute; bottom: 10px; right: 10px; padding: 6px 12px; font-size: 0.85rem;" onclick="removeNotice()"><i class="fa-solid fa-trash"></i> 移除通知單</button>
          </div>

          <div class="form-group" style="margin-top: 20px; display: flex; gap: 12px;">
            <button class="btn btn-primary" id="save-notice-btn" onclick="saveNotice()" disabled style="flex: 1;"><i class="fa-solid fa-circle-check"></i> 儲存今日通知單</button>
            <button class="btn btn-danger" onclick="clearNotice()" style="flex: 1;"><i class="fa-solid fa-trash"></i> 清除今日通知單</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Pokedex Configuration
    const POKEMON_DATA = {
      fire: [
        { id: 4, name: '小火龍', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/4.png' },

      ],

        { id: 9, name: '水箭龜', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/9.png' }
      ],
      grass: [
        { id: 1, name: '妙蛙種子', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/1.png' },
        { id: 2, name: '妙蛙草', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/2.png' },
        { id: 3, name: '妙蛙花', url: 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/other/official-artwork/3.png' }
      ]
    };

    const defaultStudents = {
      "1": { name: "陳洪福", pokemons: [] },
      "2": { name: "蕭廷恩", pokemons: [] },
      "3": { name: "江岳泰", pokemons: [] },
      "4": { name: "陳冠宏", pokemons: [] }
    };    // 2026 與 2027 國定假日與連假對照表（連假期間一律沿用連假前最後一個上學日）
    const HOLIDAY_FALLBACKS = {
      // 2026 元旦
      "2026-01-01": "2025-12-31",
      // 2026 農曆春節 (2/14 - 2/22)

      "2026-06-19": "2026-06-18",
      "2026-06-20": "2026-06-18",

      // 2026 國慶連假 (10/9 - 10/11)
      "2026-10-09": "2026-10-08",

      "2027-10-09": "2027-10-08",

      // 2027/2028跨年連假 (12/31 - 1/2)
      "2027-12-31": "2027-12-30"
    };

    let students = null;

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyCQK6Ex0zHb13uAKwhvHAH6OFGVBiyodts",
      authDomain: "pokemon-7bd40.firebaseapp.com",
      projectId: "pokemon-7bd40",

      appId: "1:641379923525:web:fda369e1f7c84d6218552c",
      databaseURL: "https://pokemon-7bd40-default-rtdb.asia-southeast1.firebasedatabase.app"
    };

    let database = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        database = firebase.database();
      }
    } catch (err) {
      console.warn("Firebase 載入失敗，切換為離線模式：", err);
    }

    function loadData() {
      // 1. Load local cache first
      try {
        const rawData = localStorage.getItem('pokemon_trainer_data');
        if (rawData) {
          students = JSON.parse(rawData);
        }
        if (!students || typeof students !== 'object' || Array.isArray(students) || !students["1"]) {
          students = JSON.parse(JSON.stringify(defaultStudents));
        } else {
          // Upgrade old schema if any
          for(let id in defaultStudents) {
            if(!students[id]) {
              students[id] = JSON.parse(JSON.stringify(defaultStudents[id]));
            }
            if(!students[id].pokemons) {
              students[id].pokemons = [];
            }
          }
        }
      } catch (e) {
        students = JSON.parse(JSON.stringify(defaultStudents));
      }

      // 2. Connect live real-time Firebase listener on 'studentData' node
      if (database) {
        database.ref('studentData').on('value', (snapshot) => {
          const val = snapshot.val();
          if (val && typeof val === 'object' && val["1"]) {
            students = val;
            localStorage.setItem('pokemon_trainer_data', JSON.stringify(val));
            renderOverview();
          }
        });
      } else {
        renderOverview();
      }
    }

    function saveData() {
      localStorage.setItem('pokemon_trainer_data', JSON.stringify(students));
      if (database) {
        // Use Object.assign to ensure plain object (not array) is stored
        const payload = Object.assign({}, students);
        database.ref('studentData').set(payload).catch(err => {
          console.error("Firebase 寫入失敗：", err);
        });
      }
    }

    function getStage(level) {
      if (level < 10) return 0;
      if (level < 20) return 1;
      return 2;
    }

    function getCurrentPokemon(poke) {
      if (!poke || !poke.family) return null;
      const familyArr = POKEMON_DATA[poke.family];
      const level = Math.floor(poke.points / 10);
      const stageIndex = getStage(level);
      return familyArr[stageIndex];
    }

    function renderOverview() {
      const container = document.getElementById('students-list');
      container.innerHTML = '';

      for(let id in students) {
        const student = students[id];
        const pokes = student.pokemons || [];
        const activeIndex = (student.activePokemonIndex !== undefined && student.activePokemonIndex >= 0 && student.activePokemonIndex < pokes.length) ? student.activePokemonIndex : (pokes.length - 1);
        const activePoke = pokes.length > 0 ? pokes[activeIndex] : null;
        
        let pName = "尚未選擇";
        let pLv = 0;
        let pPoints = 0;
        let imgUrl = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png";

        if(activePoke) {
          const currentPoke = getCurrentPokemon(activePoke);
          if (currentPoke) {
            pName = currentPoke.name;
            pLv = Math.floor(activePoke.points / 10);
            pPoints = activePoke.points;
            imgUrl = currentPoke.url;
          }
        }

        const item = document.createElement('div');
        item.className = 'student-item';
        item.innerHTML = `
          <div class="student-info">
            <div class="avatar">
              <img src="${imgUrl}" alt="${pName}">
            </div>
            <div>
              <div class="student-name">${id}號 ${student.name}</div>
              <div class="student-pokemon-desc">
                寶可夢數量: ${pokes.length} 隻 | 目前夥伴: ${pName}
              </div>
            </div>
          </div>
          <div>
            <span class="student-badge" style="background: ${activePoke && activePoke.points >= 300 ? '#10b981' : '#0369a1'}">
              Lv. ${pLv} (${pPoints}分)
            </span>
          </div>
        `;
        container.appendChild(item);
      }
    }

    function modifyPoints() {
      const selectedId = document.getElementById('student-select').value;
      const pointsToAdd = parseInt(document.getElementById('points-input').value) || 0;
      const student = students[selectedId];

      if (!student.pokemons || student.pokemons.length === 0) {
        alert("這位學生還沒有在學生端網頁上選擇初始寶可夢夥伴喔！無法進行加分。");
        return;
      }

      const activeIndex = (student.activePokemonIndex !== undefined && student.activePokemonIndex >= 0 && student.activePokemonIndex < student.pokemons.length) ? student.activePokemonIndex : (student.pokemons.length - 1);
      const activePoke = student.pokemons[activeIndex];

      if (activePoke.points >= 300 && pointsToAdd > 0) {
        alert("該寶可夢已達滿級 (30等)！請請學生先到網頁端選擇下一隻寶可夢！");
        return;
      }

      activePoke.points += pointsToAdd;
      if (activePoke.points > 300) activePoke.points = 300;
      if (activePoke.points < 0) activePoke.points = 0;

      saveData();
      renderOverview();
      alert(`已成功為 ${student.name} 送出增減分！`);
    }

    function resetStudent() {
      const selectedId = document.getElementById('student-select').value;
      const student = students[selectedId];
      if (confirm(`確定要清除 ${student.name} 的所有寶可夢歷程與分數嗎？清除後將需重新選擇初始寶可夢！`)) {
        student.pokemons = [];
        delete student.activePokemonIndex;
        saveData();
        renderOverview();
        alert(`已成功重設 ${student.name} 的資料。`);
      }
    }

    function updateSelectedInfo() {
      // Custom sync if needed
    }

    // 頁籤切換邏輯
    function switchAdminTab(tabName) {
      document.querySelectorAll('.admin-tab-btn').forEach(btn => btn.classList.remove('active'));
      document.getElementById(`tab-btn-${tabName}`).classList.add('active');
      
      if (tabName === 'pokemon') {
        document.getElementById('tab-content-pokemon').style.display = 'block';
        document.getElementById('tab-content-homework').style.display = 'none';
      } else {
        document.getElementById('tab-content-pokemon').style.display = 'none';
        document.getElementById('tab-content-homework').style.display = 'block';
        
        // 預設填入今日日期並載入 (若西元日期早於 2026-08-31，預設帶入開學日 2026-08-31)
        const dateInput = document.getElementById('homework-date');
        if (!dateInput.value) {
          let today = new Date();
          const targetDefault = new Date(2026, 7, 31);
          if (today < targetDefault || today.getFullYear() < 2026) {
            today = targetDefault;
          }
          const y = today.getFullYear();
          const m = String(today.getMonth() + 1).padStart(2, '0');
          const d = String(today.getDate()).padStart(2, '0');
          dateInput.value = `${y}-${m}-${d}`;
        }
        loadHomeworkForDate();
      }
    }



    // 📖 聯絡簿與通知單本機快取與同步變數
    let adminHomeworkDb = {};
    let adminNoticeDb = {};
    let currentSelectedFileBase64 = null;

    // 啟動 Firebase 監聽作業與通知單資料
    if (database) {
      database.ref('homeworkDatabase').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          adminHomeworkDb = val;
          // 若當前在作業分頁，刷新顯示
          if (document.getElementById('tab-content-homework').style.display === 'block') {
            loadHomeworkForDate();
          }
        }
      });

      database.ref('noticeDatabase').on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          adminNoticeDb = val;
          if (document.getElementById('tab-content-homework').style.display === 'block') {
            loadHomeworkForDate();
          }
        }
      });
    }

    // 載入指定日期的作業與通知單至欄位
    function loadHomeworkForDate() {
      const targetDate = document.getElementById('homework-date').value;
      if (!targetDate) return;

      // 國定假日或連假自動引導至連假前最後一個上學日
      if (HOLIDAY_FALLBACKS[targetDate]) {
        const queryDate = HOLIDAY_FALLBACKS[targetDate];
        alert(`您選擇的日期 (${targetDate}) 是國定假日/連假期間，系統將自動為您讀取並操作放假前最後一個上學日 (${queryDate}) 的作業與通知單！`);
        document.getElementById('homework-date').value = queryDate;
        loadHomeworkForDate();
        return;
      }

      // 假日自動引導至星期五
      const parsedDate = new Date(targetDate);
      const dayOfWeek = parsedDate.getDay();
      if (dayOfWeek === 6) { // 星期六 -> 沿用星期五
        const fri = new Date(parsedDate);
        fri.setDate(parsedDate.getDate() - 1);
        const y = fri.getFullYear();
        const m = String(fri.getMonth() + 1).padStart(2, '0');
        const d = String(fri.getDate()).padStart(2, '0');
        const queryDate = `${y}-${m}-${d}`;
        alert(`您選擇的是星期六，系統將自動為您讀取並操作該週星期五 (${queryDate}) 的作業與通知單！`);
        document.getElementById('homework-date').value = queryDate;
        loadHomeworkForDate();
        return;
      } else if (dayOfWeek === 0) { // 星期日 -> 沿用星期五
        const fri = new Date(parsedDate);
        fri.setDate(parsedDate.getDate() - 2);
        const y = fri.getFullYear();
        const m = String(fri.getMonth() + 1).padStart(2, '0');
        const d = String(fri.getDate()).padStart(2, '0');
        const queryDate = `${y}-${m}-${d}`;
        alert(`您選擇的是星期日，系統將自動為您讀取並操作該週星期五 (${queryDate}) 的作業與通知單！`);
        document.getElementById('homework-date').value = queryDate;
        loadHomeworkForDate();
        return;
      }

      // 1. 載入作業
      const todayHw = adminHomeworkDb[targetDate];
      const textarea = document.getElementById('hw-content');
      
      if (Array.isArray(todayHw)) {
        // 相容舊的分科陣列資料格式
        textarea.value = todayHw.map(item => `${item.type}: ${item.content}`).join('\n');
      } else {
        textarea.value = todayHw || '';
      }

      // 2. 載入通知單預覽
      const noticeSrc = adminNoticeDb[targetDate];
      const previewContainer = document.getElementById('notice-preview-container');
      const previewImg = document.getElementById('notice-preview-img');
      const saveBtn = document.getElementById('save-notice-btn');

      if (noticeSrc) {
        previewContainer.style.display = 'block';
        previewImg.src = noticeSrc;
        currentSelectedFileBase64 = noticeSrc;
        saveBtn.disabled = true; // 已經儲存了
      } else {
        previewContainer.style.display = 'none';
        previewImg.src = '';
        currentSelectedFileBase64 = null;
        saveBtn.disabled = true;
      }
    }

    // 儲存作業
    function saveHomework() {
      const targetDate = document.getElementById('homework-date').value;
      if (!targetDate) {
        alert('請選擇日期！');
        return;
      }

      const content = document.getElementById('hw-content').value.trim();

      // 更新本地跟 Firebase (直接存成純文字)
      adminHomeworkDb[targetDate] = content;
      if (database) {
        database.ref('homeworkDatabase').set(adminHomeworkDb)
          .then(() => alert(`${targetDate} 作業儲存並同步成功！`))
          .catch(err => alert('同步失敗：' + err.message));
      } else {
        alert('作業已儲存於本機快取！');
      }
    }

    // 清除今日作業
    function clearHomework() {
      const targetDate = document.getElementById('homework-date').value;
      if (!targetDate) {
        alert('請選擇日期！');
        return;
      }

      if (confirm(`確定要清除 ${targetDate} 的作業內容嗎？`)) {
        // 從本機資料庫刪除
        delete adminHomeworkDb[targetDate];

        // 同步至 Firebase
        if (database) {
          database.ref('homeworkDatabase').set(adminHomeworkDb)
            .then(() => {
              alert(`${targetDate} 的作業已清除並同步成功！`);
              document.getElementById('hw-content').value = '';
            })
            .catch(err => alert('清除同步失敗：' + err.message));
        } else {
          document.getElementById('hw-content').value = '';
          alert('作業已從本機快取清除！');
        }
      }
    }

    // 清除今日通知單
    function clearNotice() {
      const targetDate = document.getElementById('homework-date').value;
      if (!targetDate) {
        alert('請選擇日期！');
        return;
      }

      if (confirm(`確定要清除 ${targetDate} 的通知單圖片嗎？`)) {
        // 從本機資料庫刪除
        delete adminNoticeDb[targetDate];

        // 同步至 Firebase
        if (database) {
          database.ref('noticeDatabase').set(adminNoticeDb)
            .then(() => {
              alert(`${targetDate} 的通知單已清除並同步成功！`);
              // 重設 UI
              document.getElementById('notice-preview-container').style.display = 'none';
              document.getElementById('notice-preview-img').src = '';
              document.getElementById('notice-file-input').value = '';
              currentSelectedFileBase64 = null;
              // 啟用儲存按鈕
              document.getElementById('save-notice-btn').disabled = true;
            })
            .catch(err => alert('清除同步失敗：' + err.message));
        } else {
          document.getElementById('notice-preview-container').style.display = 'none';
          document.getElementById('notice-preview-img').src = '';
          document.getElementById('notice-file-input').value = '';
          currentSelectedFileBase64 = null;
          alert('通知單已從本機快取清除！');
        }
      }
    }

    // 觸發上傳檔案
    function triggerNoticeUpload() {
      document.getElementById('notice-file-input').click();
    }

    // 處理檔案選取與壓縮成 Base64
    function handleNoticeFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;

      if (!file.type.startsWith('image/')) {
        alert('只能上傳圖片檔案！');
        return;
      }

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          // 畫布壓縮圖片，避免 Base64 過大
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;

          // 最大寬高限制在 800px 以內以利極速存取
          const MAX_SIZE = 800;
          if (width > height) {
            if (width > MAX_SIZE) {
              height *= MAX_SIZE / width;
              width = MAX_SIZE;
            }
          } else {
            if (height > MAX_SIZE) {
              width *= MAX_SIZE / height;
              height = MAX_SIZE;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          // 壓縮品質 0.7 輸出 jpg
          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);
          
          // 顯示預覽
          document.getElementById('notice-preview-container').style.display = 'block';
          document.getElementById('notice-preview-img').src = compressedBase64;
          currentSelectedFileBase64 = compressedBase64;
          document.getElementById('save-notice-btn').disabled = false; // 開啟儲存按鈕
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    // 儲存今日通知單
    function saveNotice() {
      const targetDate = document.getElementById('homework-date').value;
      if (!targetDate) {
        alert('請選擇日期！');
        return;
      }

      if (!currentSelectedFileBase64) {
        alert('尚未選擇任何圖片！');
        return;
      }

      adminNoticeDb[targetDate] = currentSelectedFileBase64;
      if (database) {
        database.ref('noticeDatabase').set(adminNoticeDb)
          .then(() => {
            alert(`${targetDate} 通知單上傳並同步成功！`);
            document.getElementById('save-notice-btn').disabled = true;
          })
          .catch(err => alert('同步失敗：' + err.message));
      } else {
        alert('通知單已儲存於本機！');
      }
    }

    // 移除今日通知單
    function removeNotice() {
      const targetDate = document.getElementById('homework-date').value;
      if (!targetDate) return;

      if (confirm(`確定要移除 ${targetDate} 的通知單嗎？`)) {
        delete adminNoticeDb[targetDate];
        currentSelectedFileBase64 = null;
        document.getElementById('notice-preview-container').style.display = 'none';
        document.getElementById('notice-preview-img').src = '';
        document.getElementById('notice-file-input').value = '';

        if (database) {
          database.ref('noticeDatabase').set(adminNoticeDb)
            .then(() => {
              alert('通知單已成功移除並同步！');
              loadHomeworkForDate();
            })
            .catch(err => alert('同步失敗：' + err.message));
        } else {
          loadHomeworkForDate();
        }
      }
    }

    // Window storage listener to sync admin overview with student pages in real-time
    window.addEventListener('storage', (e) => {
      if (e.key === 'pokemon_trainer_data') {
        loadData();
        renderOverview();
      }
    });

    // Init
    loadData();
    renderOverview();

    // 依據跳轉來源決定預設顯示分頁
    const urlParams = new URLSearchParams(window.location.search);
    const defaultTab = urlParams.get('tab');
    if (defaultTab === 'homework') {
      switchAdminTab('homework');
    }
  </script>
