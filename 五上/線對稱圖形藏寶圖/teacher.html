<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>線對稱藏寶圖・本機學習紀錄</title><link rel="stylesheet" href="treasure.css?v=2"></head><body><main class="app"><nav class="topbar"><a href="線對稱圖形尋寶圖.html">回遊戲主選單</a><a href="../../index.html">回首頁</a></nav><section class="board"><h1>📋 本機學習紀錄</h1><a href="teacher-cloud.html">前往教師 Google 登入</a><p class="task">此頁顯示目前裝置留下的紀錄。跨裝置查詢須另行設定教師登入與雲端權限；完整歷程先保留本機；教師確認權限後，可使用教師 Google 登入查詢雲端。</p><div class="fields"><label>班級<input id="cls"></label><label>姓名／暱稱<input id="name"></label><label>類型<select id="kind"><option value="">全部</option><option value="complete">完成</option><option value="check">檢查</option><option value="hint">提示</option></select></label></div><button id="query">查詢</button><button id="download">匯出目前篩選 CSV</button><p id="count" role="status"></p><div class="table-wrap"><table><thead><tr><th>時間</th><th>班級</th><th>姓名</th><th>關卡</th><th>類型</th><th>重試</th><th>提示</th><th>秒數</th><th>多畫</th><th>漏畫</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let selected=[];const $=id=>document.getElementById(id);function query(){let all=[];try{all=JSON.parse(localStorage.getItem('symmetryTreasure.records.v2')||'[]');}catch{}selected=all.filter(r=>(!$('cls').value||r.student.className.includes($('cls').value))&&(!$('name').value||r.student.name.includes($('name').value))&&(!$('kind').value||r.kind===$('kind').value)).reverse();$('rows').replaceChildren();for(const r of selected){let tr=document.createElement('tr');for(const v of values(r)){let td=document.createElement('td');td.textContent=v;tr.append(td);}$('rows').append(tr);}$('count').textContent=`共 ${selected.length} 筆；最近2000筆保留在此裝置，清除瀏覽器資料前請先匯出。`;}
function values(r){return [new Date(r.at).toLocaleString(),r.student.className,r.student.name,r.level,({check:'檢查',complete:'完成',hint:'提示'})[r.kind],r.attempts,r.hints,r.elapsed,r.wrong?.length??'',r.missing?.length??''];}function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replaceAll('"','""')+'"';}$('query').onclick=query;$('download').onclick=()=>{let csv='\ufeff'+[['時間','班級','姓名','關卡','類型','重試','提示','秒數','多畫','漏畫'],...selected.map(values)].map(row=>row.map(csvCell).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='線對稱學習紀錄.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};query();
</script></body></html>
