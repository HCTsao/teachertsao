<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寶藏獵人：線對稱尋寶圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&family=Noto+Sans+TC:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="treasure.css?v=3">
</head>
<body>
  <main class="app">
    <!-- Top Navigation -->
    <nav class="topbar" aria-label="遊戲導覽">
      <a href="../../index.html" class="nav-btn">🏠 回首頁</a>
      <button id="menuBtn" class="nav-btn" hidden>🗺️ 探險地圖</button>
      <button id="teacherLink" class="nav-btn admin-btn">👨‍🏫 教師後台</button>
    </nav>

    <!-- HUD Status Panel -->
    <div class="hud">
      <div class="hud-card">
        <span class="hud-icon">🏝️</span>
        <div>
          <small>目前島嶼</small>
          <strong id="levelLabel">準備出發</strong>
        </div>
      </div>
      <div class="hud-card">
        <span class="hud-icon">🪙</span>
        <div>
          <small>探險金幣</small>
          <strong id="gold">0</strong>
        </div>
      </div>
      <div class="hud-card">
        <span class="hud-icon">⭐</span>
        <div>
          <small>尋寶之星</small>
          <strong id="stars">0 / 5</strong>
        </div>
      </div>
    </div>

    <!-- Island Progress Track -->
    <div id="islands" aria-label="關卡進度"></div>

    <!-- Start / Registration Screen -->
    <section id="startScreen" class="board">
      <div class="hero-banner">
        <div class="mascot-badge">🏴‍☠️🦜💎</div>
        <h1>寶藏獵人：失落的藏寶圖</h1>
        <p class="hero-subtitle">找到紅線對應格，拼出完整藏寶圖，收集 5 座島嶼的神祕寶藏！</p>
      </div>

      <div class="player-form-card">
        <div class="form-title">🧭 獵人登錄</div>
        <div class="fields">
          <label>班級<input id="inClass" maxlength="10" autocomplete="off" placeholder="例如：501"></label>
          <label>姓名或暱稱<input id="inName" maxlength="10" autocomplete="off" placeholder="例如：小明"></label>
          <label>座號<input id="inSeat" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="例如：01"></label>
        </div>
        <label class="check-direction">
          <input type="checkbox" id="variant" checked> 🎲 隨機變換對稱方向（增加挑戰趣味）
        </label>
      </div>

      <button class="primary wide glow-btn" id="startBtn">🚀 展開尋寶探險！</button>
    </section>

    <!-- Main Game Play Screen -->
    <section id="gameScreen" class="board" hidden>
      <div class="heading">
        <h1 id="levelTitle">第 1 關 · 左右對稱</h1>
        <button id="resultBtn" class="secondary-btn">📊 探險背包</button>
      </div>

      <!-- Compact Visual Legend -->
      <div class="legend-bar">
        <span class="lg-item"><span class="swatch swatch-given"></span> 黑色題目格</span>
        <span class="lg-item"><span class="swatch swatch-mine"></span> 綠色你畫的</span>
        <span class="lg-item red"><span class="swatch swatch-axis"></span> 紅色對稱軸</span>
      </div>

      <!-- The Board Grid -->
      <div id="gridWrap">
        <div id="gridBox">
          <div id="grid" role="grid" aria-label="線對稱作答棋盤"></div>
          <div id="axisLine" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Tool Palette -->
      <div class="tools">
        <button id="drawBtn" aria-pressed="true">🖌️ 塗格筆</button>
        <button id="eraseBtn" aria-pressed="false">🧼 擦布</button>
        <button id="undoBtn">↶ 上一步</button>
        <button id="clearBtn">🗑️ 重塗</button>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="hintBtn" class="btn-hint">💡 鸚鵡提示</button>
        <button id="checkBtn" class="primary btn-check">🔍 檢查藏寶圖！</button>
      </div>

      <p id="msg" role="status" aria-live="polite">💡 觀察紅線距離，在對應側畫出另一半吧！</p>
      <button id="nextBtn" class="primary wide pulse-btn" hidden>前往下一座島嶼 ⛵ →</button>
    </section>

    <!-- End Results Screen -->
    <section id="endScreen" class="board" hidden>
      <div class="end-banner">
        <div class="big-chest">👑🏆🎁</div>
        <h1>探險大成功！</h1>
        <p id="finalScore" class="final-score"></p>
      </div>
      <div id="summary" class="summary-list"></div>
      <button id="againBtn" class="primary wide">⛵ 回探險起點</button>
    </section>

    <p id="saveStatus" class="save-status" role="status"></p>
  </main>

  <!-- Teacher Auth Prompt Listener -->
  <script>
    document.getElementById("teacherLink").addEventListener("click", function(e) {
      e.preventDefault();
      const pwd = prompt("🔒 請輸入教師後台密碼：");
      if (pwd === "8888") {
        sessionStorage.setItem("symmetry_teacher_authed", "true");
        window.open("teacher.html", "_blank");
      } else if (pwd !== null) {
        alert("❌ 密碼錯誤！");
      }
    });
  </script>

  <!-- Game Scripts -->
  <script src="treasure.js?v=3"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="cloud.js?v=3"></script>
</body>
</html>
