<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>寶藏獵人：線對稱尋寶圖</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;800&family=Noto+Sans+TC:wght@600;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="treasure.css?v=4">
</head>
<body>
  <main class="app">
    <!-- Top Navigation -->
    <nav class="topbar" aria-label="遊戲導覽">
      <div class="topbar-left">
        <a href="../../index.html" class="nav-btn">🏠 回首頁</a>
        <button id="menuBtn" class="nav-btn" hidden>📋 回主選單</button>
      </div>
      <button id="teacherLink" class="nav-btn admin-btn">👨‍🏫 教師後台</button>
    </nav>

    <!-- HUD Status Panel -->
    <div class="hud">
      <div class="hud-card">
        <span class="hud-icon">🏝️</span>
        <div>
          <small>目前島嶼</small>
          <strong id="levelLabel">準備出發</strong>
        </div>
      </div>
      <div class="hud-card">
        <span class="hud-icon">🪙</span>
        <div>
          <small>探險金幣</small>
          <strong id="gold">0</strong>
        </div>
      </div>
      <div class="hud-card">
        <span class="hud-icon">⭐</span>
        <div>
          <small>尋寶之星</small>
          <strong id="stars">0 / 5</strong>
        </div>
      </div>
    </div>

    <!-- 藏寶圖拼圖進度區（5題隨進度越來越明顯） -->
    <div class="map-progress-wrap" id="mapProgressWrap" aria-label="藏寶圖線索進度">
      <div class="map-progress-header">
        <span class="map-title">🗺️ 傳說中的海盜藏寶圖線索</span>
        <span class="map-clarity-badge" id="mapClarityBadge">模糊迷霧中 (0/5)</span>
      </div>
      <div class="map-viewport" id="mapViewport">
        <!-- SVG 精裝羊皮紙藏寶圖 -->
        <svg id="treasureMapSvg" viewBox="0 0 600 240" class="treasure-map-svg" preserveAspectRatio="xMidYMid meet">
          <defs>
            <!-- 羊皮紙質感漸層 -->
            <linearGradient id="parchmentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#fdf5dc"/>
              <stop offset="50%" stop-color="#f5e4ba"/>
              <stop offset="100%" stop-color="#e8cf99"/>
            </linearGradient>
            <!-- 海水漸層 -->
            <radialGradient id="seaGrad" cx="50%" cy="50%" r="70%">
              <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#0284c7" stop-opacity="0.45"/>
            </radialGradient>
            <!-- 濾鏡：金光光暈 -->
            <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
              <feGaussianBlur stdDeviation="4" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- 藏寶圖底紙 -->
          <rect x="8" y="8" width="584" height="224" rx="16" fill="url(#parchmentGrad)" stroke="#6b3e18" stroke-width="4"/>
          <!-- 燒邊飾紋 -->
          <rect x="14" y="14" width="572" height="212" rx="12" fill="none" stroke="#b48348" stroke-width="1.5" stroke-dasharray="8 4"/>

          <!-- 蔚藍海灣水波 -->
          <path d="M 20 60 Q 90 40 180 70 T 360 50 T 540 80 L 570 210 L 20 210 Z" fill="url(#seaGrad)"/>

          <!-- 羅盤玫瑰（右上角裝飾） -->
          <g transform="translate(530, 52) scale(0.68)">
            <circle cx="0" cy="0" r="32" fill="#fff5d6" stroke="#854d0e" stroke-width="2"/>
            <polygon points="0,-28 6,-8 0,-12 -6,-8" fill="#dc2626"/>
            <polygon points="0,28 6,8 0,12 -6,8" fill="#78350f"/>
            <polygon points="-28,0 -8,6 -12,0 -8,-6" fill="#78350f"/>
            <polygon points="28,0 8,6 12,0 8,-6" fill="#78350f"/>
            <text x="0" y="-32" font-size="12" font-weight="900" fill="#dc2626" text-anchor="middle">N</text>
          </g>

          <!-- 海怪與小海浪飾圖 -->
          <g fill="#0284c7" opacity="0.45" font-size="16">
            <text x="120" y="200">🌊</text>
            <text x="320" y="210">🌊</text>
            <text x="460" y="195">🐙</text>
          </g>

          <!-- 航海虛線路線 (連接 5 座島嶼至終極寶藏) -->
          <path id="routePath" d="M 60 140 Q 110 80 160 125 T 270 95 T 380 135 T 480 85 L 530 145"
                fill="none" stroke="#b91c1c" stroke-width="3" stroke-dasharray="6 6" stroke-linecap="round"/>

          <!-- 5 座島嶼座標節點 -->
          <!-- 島 1 -->
          <g id="mapNode1" class="map-node" transform="translate(60, 140)">
            <ellipse cx="0" cy="4" rx="26" ry="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
            <text x="0" y="3" font-size="18" text-anchor="middle">🏝️</text>
            <circle cx="0" cy="18" r="8" fill="#15803d"/>
            <text x="0" y="22" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">1</text>
          </g>

          <!-- 島 2 -->
          <g id="mapNode2" class="map-node" transform="translate(160, 125)">
            <ellipse cx="0" cy="4" rx="26" ry="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
            <text x="0" y="3" font-size="18" text-anchor="middle">🌴</text>
            <circle cx="0" cy="18" r="8" fill="#15803d"/>
            <text x="0" y="22" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">2</text>
          </g>

          <!-- 島 3 -->
          <g id="mapNode3" class="map-node" transform="translate(270, 95)">
            <ellipse cx="0" cy="4" rx="26" ry="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
            <text x="0" y="3" font-size="18" text-anchor="middle">🗿</text>
            <circle cx="0" cy="18" r="8" fill="#15803d"/>
            <text x="0" y="22" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">3</text>
          </g>

          <!-- 島 4 -->
          <g id="mapNode4" class="map-node" transform="translate(380, 135)">
            <ellipse cx="0" cy="4" rx="26" ry="14" fill="#fde68a" stroke="#92400e" stroke-width="2"/>
            <text x="0" y="3" font-size="18" text-anchor="middle">🌋</text>
            <circle cx="0" cy="18" r="8" fill="#15803d"/>
            <text x="0" y="22" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">4</text>
          </g>

          <!-- 島 5 (寶藏聖地) -->
          <g id="mapNode5" class="map-node" transform="translate(480, 85)">
            <ellipse cx="0" cy="4" rx="28" ry="15" fill="#fef08a" stroke="#b45309" stroke-width="2.5"/>
            <text x="0" y="3" font-size="20" text-anchor="middle">🏰</text>
            <circle cx="0" cy="18" r="8" fill="#b45309"/>
            <text x="0" y="22" font-size="10" font-weight="900" fill="#fff" text-anchor="middle">5</text>
          </g>

          <!-- 終點紅叉叉與黃金大寶箱標誌 (X Marks the spot) -->
          <g id="mapXMark" transform="translate(530, 145)">
            <text x="-16" y="8" font-size="28" font-weight="900" fill="#dc2626" filter="drop-shadow(0 2px 3px rgba(0,0,0,0.3))">❌</text>
            <text x="12" y="10" font-size="26" id="mapChestIcon">🎁</text>
          </g>

          <!-- 小帆船/獵人地圖位置標記 (隨關卡前進) -->
          <g id="hunterToken" transform="translate(60, 105)">
            <circle cx="0" cy="0" r="16" fill="#fef08a" stroke="#b45309" stroke-width="2.5" filter="drop-shadow(0 3px 4px rgba(0,0,0,0.35))"/>
            <text x="0" y="6" font-size="16" text-anchor="middle">⛵</text>
          </g>
        </svg>

        <!-- 迷霧覆蓋層 (隨解題數 0~5 逐漸消散) -->
        <div id="mapFogOverlay" class="map-fog-layer fog-level-0">
          <div class="fog-clouds"></div>
          <div class="fog-text-tip" id="fogTextTip">🧩 尚有 5 片線索拼圖，解開謎題即可驅散迷霧！</div>
        </div>
      </div>
    </div>

    <!-- Island Progress Track -->
    <div id="islands" aria-label="關卡進度"></div>

    <!-- Start / Registration Screen -->
    <section id="startScreen" class="board">
      <div class="hero-banner">
        <div class="mascot-badge">🏴‍☠️🦜💎</div>
        <h1>寶藏獵人：失落的藏寶圖</h1>
        <p class="hero-subtitle">解開 5 道對稱謎題，驅散迷霧，找出埋藏在神祕島的終極寶藏！</p>
      </div>

      <div class="player-form-card">
        <div class="form-title">🧭 獵人登錄</div>
        <div class="fields">
          <label>班級<input id="inClass" maxlength="10" autocomplete="off" placeholder="例如：501"></label>
          <label>姓名或暱稱<input id="inName" maxlength="10" autocomplete="off" placeholder="例如：小明"></label>
          <label>座號<input id="inSeat" maxlength="5" inputmode="numeric" autocomplete="off" placeholder="例如：01"></label>
        </div>
      </div>

      <button class="primary wide glow-btn" id="startBtn">🚀 展開尋寶探險！</button>
    </section>

    <!-- Main Game Play Screen -->
    <section id="gameScreen" class="board" hidden>
      <div class="heading">
        <h1 id="levelTitle">第 1 關 · 左右對稱</h1>
      </div>

      <!-- Compact Visual Legend -->
      <div class="legend-bar">
        <span class="lg-item"><span class="swatch swatch-given"></span> 黑色題目格</span>
        <span class="lg-item"><span class="swatch swatch-mine"></span> 綠色你畫的</span>
        <span class="lg-item red"><span class="swatch swatch-axis"></span> 紅色對稱軸</span>
      </div>

      <!-- The Board Grid -->
      <div id="gridWrap">
        <div id="gridBox">
          <div id="grid" role="grid" aria-label="線對稱作答棋盤"></div>
          <div id="axisLine" aria-hidden="true"></div>
        </div>
      </div>

      <!-- Tool Palette -->
      <div class="tools">
        <button id="drawBtn" aria-pressed="true">🖌️ 塗格筆</button>
        <button id="eraseBtn" aria-pressed="false">🧼 擦布</button>
        <button id="undoBtn">↶ 上一步</button>
        <button id="clearBtn">🗑️ 重塗</button>
      </div>

      <!-- Action Buttons -->
      <div class="actions">
        <button id="hintBtn" class="btn-hint">💡 鸚鵡提示</button>
        <button id="checkBtn" class="primary btn-check">🔍 檢查藏寶圖！</button>
      </div>

      <p id="msg" role="status" aria-live="polite">💡 觀察紅線距離，在對應側畫出另一半吧！</p>
      <button id="nextBtn" class="primary wide pulse-btn" hidden>前往下一座島嶼 ⛵ →</button>
    </section>

    <!-- End Results Screen (含獵人出發找到寶藏之生動動畫) -->
    <section id="endScreen" class="board" hidden>
      <!-- 獵人出發尋寶動畫舞台 -->
      <div class="treasure-hunt-stage" id="huntStage">
        <div class="stage-sky">
          <div class="stage-sun">☀️</div>
          <div class="stage-cloud c1">☁️</div>
          <div class="stage-cloud c2">☁️</div>
        </div>
        <div class="stage-ground">
          <div class="stage-cave">⛰️</div>
          <!-- 獵人角色 -->
          <div class="hunter-actor" id="hunterActor">🤠</div>
          <!-- 鏟子/挖土特效 -->
          <div class="dig-dust" id="digDust">💨⛏️</div>
          <!-- 終極大寶箱 -->
          <div class="stage-chest-wrap" id="stageChestWrap">
            <div class="stage-chest" id="stageChest">📦</div>
            <div class="chest-gold-burst" id="goldBurst">💰✨👑💎🪙✨🎉</div>
          </div>
        </div>
        <div class="hunt-status-banner" id="huntStatusBanner">
          🤠 獵人準備出發前往寶藏地點...
        </div>
      </div>

      <div class="end-banner">
        <div class="big-chest">👑🏆🎁</div>
        <h1>🎉 恭喜找到傳說中的終極大寶藏！</h1>
        <p id="finalScore" class="final-score"></p>
      </div>
      <div id="summary" class="summary-list"></div>
      <button id="againBtn" class="primary wide">📋 回主選單</button>
    </section>

    <p id="saveStatus" class="save-status" role="status"></p>
  </main>

  <!-- Teacher Auth Prompt Listener -->
  <script>
    document.getElementById("teacherLink").addEventListener("click", function(e) {
      e.preventDefault();
      const pwd = prompt("🔒 請輸入教師後台密碼：");
      if (pwd === "8888") {
        sessionStorage.setItem("symmetry_teacher_authed", "true");
        window.open("teacher.html", "_blank");
      } else if (pwd !== null) {
        alert("❌ 密碼錯誤！");
      }
    });
  </script>

  <!-- Game Scripts -->
  <script src="treasure.js?v=4"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <script src="cloud.js?v=4"></script>
</body>
</html>
