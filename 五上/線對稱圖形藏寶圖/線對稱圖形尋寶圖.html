<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>寶藏獵人：藏寶圖 | 五年級線對稱</title>
<style>
  :root{ --brown:#5b3a1e; --red:#d63030; --blue:#2a9d8f; --gold:#f4b400; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
    background:#10293e; color:#2b2118; min-height:100vh; display:flex; justify-content:center; padding:14px;}
  .app{width:100%; max-width:760px;}
  .hud{display:flex; gap:10px; margin-bottom:10px;}
  .hud-card{flex:1; background:#f7e8c3; border:3px solid var(--brown); border-radius:14px;
    padding:6px; text-align:center; box-shadow:0 3px 0 var(--brown);}
  .hud-card small{display:block; font-size:13px; color:#7a5a33; font-weight:700;}
  .hud-card b{font-size:22px;}
  #islands{display:flex; gap:8px; justify-content:center; margin:8px 0;}
  .island{width:46px; height:46px; border-radius:50%; border:3px solid var(--brown);
    background:#fff8e6; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:18px; opacity:.5;}
  .island.active{opacity:1; background:var(--gold); transform:scale(1.12);}
  .island.done{opacity:1; background:#8fd18f;}
  .board{background:#f7e8c3; border:4px solid var(--brown); border-radius:18px; padding:16px;}
  h1{margin:0; font-size:23px; color:var(--brown);}
  .task{background:#fff8e6; border:2px dashed var(--brown); border-radius:12px; padding:10px 12px; margin:10px 0; font-size:17px; line-height:1.6;}
  .legend{display:flex; gap:12px; flex-wrap:wrap; font-size:15px; font-weight:700; margin:8px 0; color:#5b3a1e;}
  .dot{display:inline-block; width:16px; height:16px; border-radius:4px; vertical-align:-2px; margin-right:4px; border:1px solid #555;}
  .btn{border:3px solid var(--brown); border-radius:12px; padding:10px 14px; font-size:18px; font-weight:900; cursor:pointer; background:#fff; box-shadow:0 4px 0 var(--brown);}
  .btn:active{transform:translateY(3px); box-shadow:0 1px 0 var(--brown);}
  .btn.primary{background:var(--gold);}
  .btn.blue{background:#bfe9e4;}
  .btn.big{font-size:21px; padding:12px 18px; width:100%; margin-top:8px;}
  .tool-row{display:flex; gap:10px; margin:10px 0;}
  .tool-row .btn{flex:1;}
  .tool-active{outline:4px solid var(--blue); background:#e6f7f4 !important;}
  #gridWrap{display:flex; justify-content:center; margin:10px 0;}
  #gridBox{position:relative; display:inline-block;}
  #grid{display:grid; gap:3px; background:#8a6a3e; padding:10px; border-radius:12px; touch-action:none; user-select:none;}
  .cell{width:38px; height:38px; background:#fffdf4; border-radius:3px; display:flex; align-items:center; justify-content:center; font-size:20px; cursor:pointer;}
  @media (max-width:600px){ .cell{width:26px; height:26px; font-size:15px;} }
  .cell.given{background:#222; color:#fff; cursor:default;}
  .cell.mine{background:var(--blue); color:#fff;}
  .cell.wrong{background:#ff6b6b !important;}
  .cell.missing{outline:3px solid var(--gold);}
  /* 對稱軸：一條線，浮在格子中間，不佔格子 */
  #axisLine{position:absolute; pointer-events:none; z-index:5;}
  #axisLine.v{top:4px; bottom:4px; left:50%; width:0; border-left:5px dashed var(--red); transform:translateX(-50%);}
  #axisLine.h{left:4px; right:4px; top:50%; height:0; border-top:5px dashed var(--red); transform:translateY(-50%);}
  #axisTag{position:absolute; z-index:6; background:var(--red); color:#fff; font-size:13px; font-weight:900;
    padding:2px 8px; border-radius:10px; pointer-events:none; white-space:nowrap;}
  #axisTag.v{top:-12px; left:50%; transform:translateX(-50%);}
  #axisTag.h{top:50%; left:-8px; transform:translate(-100%,-50%);}
  #msg{min-height:48px; font-size:18px; font-weight:700; background:#fff; border-radius:10px; padding:10px; border:2px solid var(--brown); margin-top:8px;}
  .success{color:#0a7a3d;} .fail{color:var(--red);}
  .hidden{display:none !important;}
  .tip{font-size:14px; color:#6b4d26; margin-top:8px; line-height:1.6;}
  .field{font-size:18px; padding:8px 10px; border:3px solid var(--brown); border-radius:10px; width:110px; margin:2px 4px;}
  #pwBox{background:#fff; border:3px solid var(--brown); border-radius:12px; padding:12px; margin-top:10px;}
  #pwMsg{min-height:24px; font-weight:700;}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="hud-card"><small>第幾關</small><b id="levelLabel">1 / 5</b></div>
    <div class="hud-card"><small>金幣</small><b id="gold">0</b></div>
    <div class="hud-card"><small>星星</small><b id="stars">☆☆☆☆☆</b></div>
  </div>
  <div id="islands"></div>

  <div class="board" id="startScreen">
    <h1>寶藏獵人：失落的藏寶圖</h1>
    <div class="task">
      海盜的藏寶圖只剩一半！把另一半畫出來，讓兩邊完全一樣，就能找到寶藏。<br>
      <b>玩法只有 3 步：</b><br>
      1. 看黑色格子（題目）<br>
      2. 點空格子，把對稱的另一半塗出來<br>
      3. 按「檢查」過關
    </div>
    <div class="legend"><span><span class="dot" style="background:#222"></span>題目</span>
      <span><span class="dot" style="background:#2a9d8f"></span>你畫的</span>
      <span><span style="color:#d63030; font-weight:900;">┆ 紅線＝對稱軸</span></span></div>
    <div class="task">
      <b>先寫下你的資料（不寫也沒關係，會當作訪客）：</b><br>
      班級 <input class="field" id="inClass" maxlength="10" placeholder="例如 501">
      姓名 <input class="field" id="inName" maxlength="10" placeholder="你的名字">
      座號 <input class="field" id="inSeat" maxlength="5" placeholder="例如 12" inputmode="numeric">
    </div>
    <button class="btn primary big" onclick="startGame()">出發尋寶！</button>
    <div style="text-align:center; margin-top:10px;">
      <button class="btn" onclick="openAdmin()">教室後台（老師專用）</button>
    </div>
    <div id="pwBox" class="hidden">
      <b>請輸入老師密碼：</b><br><br>
      <input class="field" type="password" id="pwInput" maxlength="20" autocomplete="off" style="width:160px;">
      <button class="btn primary" onclick="checkPw()">進入</button>
      <button class="btn" onclick="closeAdmin()">取消</button>
      <div id="pwMsg"></div>
    </div>
    <div class="tip">五年級數學・線對稱圖形・方格紙練習。</div>
  </div>

  <div class="board hidden" id="gameScreen">
    <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
      <h1 id="levelTitle" style="margin:0;">第1關</h1>
      <a class="btn" href="https://hctsao.github.io/teachertsao/index.html">回首頁</a>
    </div>
    <div class="task" id="levelStory"></div>
    <div class="legend"><span><span class="dot" style="background:#222"></span>題目</span>
      <span><span class="dot" style="background:#2a9d8f"></span>你畫的</span>
      <span style="color:#d63030;">紅線＝對稱軸（在格子中間）</span></div>

    <div id="gridWrap"><div id="gridBox"><div id="grid"></div><div id="axisLine" class="v"></div><div id="axisTag" class="v">對稱軸</div></div></div>

    <div class="tool-row">
      <button class="btn tool-active" id="toolDraw" onclick="setTool('draw')">畫筆</button>
      <button class="btn" id="toolErase" onclick="setTool('erase')">擦掉</button>
    </div>
    <div class="tool-row">
      <button class="btn blue" id="hintBtn" onclick="useHint()">提示（錯3次後才有）</button>
      <button class="btn" onclick="clearMine()">全部清除</button>
    </div>
    <button class="btn primary big" onclick="checkAnswer()">檢查藏寶圖！</button>
    <div id="msg">點空格子，把另一半塗出來！</div>
    <button class="btn primary big hidden" id="nextBtn" onclick="nextLevel()">下一關 →</button>
  </div>

  <div class="board hidden" id="endScreen">
    <h1 style="text-align:center;">找到大寶藏！你是對稱大師！</h1>
    <p id="finalScore" style="text-align:center; font-size:20px; font-weight:900;"></p>
    <div class="task">5 關全部完成，你好厲害！</div>
    <div style="text-align:center; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button class="btn primary" onclick="restart()">再玩一次</button>
      <a class="btn" href="https://hctsao.github.io/teachertsao/index.html">回首頁</a>
    </div>
  </div>
</div>

<script>
const W = 12, H = 10;
const LEVELS = [
  { title:"第1關", axis:"V",
    story:"左邊是圖形的一半，把右邊補完整。",
    given:["4,2","4,3","4,4","5,2","5,4","6,2","6,3","6,4","3,3","3,4"] },
  { title:"第2關", axis:"H",
    story:"上面是圖形的一半，把下面補完整。",
    given:["1,4","1,5","1,6","1,7","2,3","2,8","3,4","3,5","3,6","3,7","4,5","4,6"] },
  { title:"第3關", axis:"V",
    story:"左邊是圖形的一半，把右邊補完整。圖形變難了，慢慢畫。",
    given:["2,3","3,3","3,4","4,3","4,4","4,5","5,3","6,3","6,4","7,2","7,3","2,4","5,4"] },
  { title:"第4關", axis:"V",
    story:"左邊是圖形的一半，把右邊補完整。",
    given:["3,3","3,4","4,2","4,5","5,2","5,5","6,3","6,4"] },
  { title:"第5關", axis:"V",
    story:"最後一關！把圖形補完整，就能找到寶藏！",
    given:["2,3","2,4","3,2","3,5","4,2","4,3","4,4","4,5","5,3","5,4","6,4","7,3","7,4","7,5","3,3","3,4"] }
];
let levelIndex=0, tool="draw", mine=new Set(), gold=0, starsArr=[], passed=false, failCount=0;
let isDragging=false, dragValue=true;

function mirror(rc, axis){
  const p=rc.split(",").map(Number);
  if(axis==="V") return p[0]+","+(W-1-p[1]);
  return (H-1-p[0])+","+p[1];
}
function answerSet(lv){
  const s=new Set();
  lv.given.forEach(g=>{ const m=mirror(g,lv.axis); if(!lv.given.includes(m)) s.add(m); });
  return s;
}
function drawable(r,c,lv){ return lv.axis==="V" ? c>=W/2 : r>=H/2; }

function startGame(){
  student.className=document.getElementById("inClass").value.trim();
  const nm=document.getElementById("inName").value.trim();
  student.name=nm||"訪客";
  student.seat=document.getElementById("inSeat").value.trim();
  levelIndex=0; gold=0; starsArr=[];
  document.getElementById("startScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.add("hidden");
  document.getElementById("gameScreen").classList.remove("hidden");
  loadLevel();
}
function restart(){ startGame(); }
const SB_URL="https://xkhlpjlrvbaocgoealbm.supabase.co", SB_ANON="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhraGxwamxydmJhb2Nnb2VhbGJtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIwNjQwNzQsImV4cCI6MjEwNzY0MDA3NH0.tbmjvpzu20S5HUmThdciV5x4tx9OQ-RFeRxCzqsg-lo";
let student={className:"",name:"訪客",seat:""};
function openAdmin(){
  document.getElementById("pwBox").classList.remove("hidden");
  document.getElementById("pwMsg").textContent="";
  document.getElementById("pwInput").value="";
  document.getElementById("pwInput").focus();
}
function closeAdmin(){ document.getElementById("pwBox").classList.add("hidden"); }
function checkPw(){
  if(document.getElementById("pwInput").value==="8888"){
    location.href="https://hongchitsao.github.io/teacher.html";
  }else{
    document.getElementById("pwMsg").innerHTML="<span class='fail'>密碼錯誤，請找老師確認。</span>";
  }
}
function saveMistake(wrong, missing){
  if(!SB_URL || SB_URL.indexOf("__")===0 || !SB_ANON || SB_ANON.indexOf("__")===0) return;
  try{
    fetch(SB_URL+"/rest/v1/mistake_records",{
      method:"POST",
      headers:{"apikey":SB_ANON,"Authorization":"Bearer "+SB_ANON,"Content-Type":"application/json","Prefer":"return=minimal"},
      body:JSON.stringify({
        class_name:student.className, student_name:student.name, seat_no:student.seat,
        level:levelIndex+1, student_cells:[...mine].join(";"),
        wrong_count:wrong.length, missing_count:missing.length, attempt_no:failCount
      })
    }).catch(function(){});
  }catch(e){}
}
function renderIslands(){
  const box=document.getElementById("islands"); box.innerHTML="";
  LEVELS.forEach((_,i)=>{
    const d=document.createElement("div");
    d.className="island"+(i===levelIndex?" active":"")+(starsArr[i]?" done":"");
    d.textContent=starsArr[i]?"★":(i+1);
    box.appendChild(d);
  });
  document.getElementById("levelLabel").textContent=(levelIndex+1)+" / "+LEVELS.length;
  document.getElementById("gold").textContent=gold;
  document.getElementById("stars").textContent=LEVELS.map((_,i)=>starsArr[i]?"★":"☆").join("");
}
function loadLevel(){
  const lv=LEVELS[levelIndex];
  mine=new Set(); passed=false; failCount=0;
  document.getElementById("levelTitle").textContent=lv.title;
  document.getElementById("levelStory").textContent=lv.story;
  document.getElementById("nextBtn").classList.add("hidden");
  document.getElementById("msg").textContent="點空格子，把另一半塗出來！";
  updateHintBtn();
  renderIslands(); buildGrid(); setTool("draw");
}
function updateHintBtn(){
  const b=document.getElementById("hintBtn");
  if(!b) return;
  b.textContent = failCount>=3 ? "提示" : "提示（錯3次後才有）";
}
function setTool(t){
  tool=t;
  document.getElementById("toolDraw").classList.toggle("tool-active", t==="draw");
  document.getElementById("toolErase").classList.toggle("tool-active", t==="erase");
}
function buildGrid(){
  const lv=LEVELS[levelIndex];
  const g=document.getElementById("grid");
  g.style.gridTemplateColumns="repeat("+W+", 1fr)";
  g.innerHTML="";
  const givenSet=new Set(lv.given);
  for(let r=0;r<H;r++) for(let c=0;c<W;c++){
    const d=document.createElement("div");
    d.className="cell"; d.dataset.rc=r+","+c;
    if(givenSet.has(r+","+c)){ d.classList.add("given"); d.textContent="■"; }
    else if(drawable(r,c,lv)){
      d.addEventListener("pointerdown", e=>{ e.preventDefault(); isDragging=true; paint(d,true); });
      d.addEventListener("pointerenter", ()=>{ if(isDragging) paint(d,false); });
    } else { d.style.cursor="default"; d.style.opacity=".45"; }
    g.appendChild(d);
  }
  window.addEventListener("pointerup", ()=>isDragging=false);
  // 對稱軸：一條線，放在格子中間
  const line=document.getElementById("axisLine"), tag=document.getElementById("axisTag");
  line.className = lv.axis==="V" ? "v" : "h";
  line.id="axisLine";
  tag.className = lv.axis==="V" ? "v" : "h";
  tag.id="axisTag"; tag.textContent="對稱軸";
  refreshCells();
}
function paint(cell,isFirst){
  if(passed) return;
  const key=cell.dataset.rc;
  if(tool==="draw"){ if(isFirst) dragValue=!mine.has(key); if(dragValue) mine.add(key); else mine.delete(key); }
  else mine.delete(key);
  // 清掉這格舊的檢查標記，這樣紅格點一下變白，再點一下變綠
  cell.classList.remove("wrong","missing");
  refreshCells();
}
function refreshCells(){
  document.querySelectorAll(".cell").forEach(cell=>{
    if(cell.classList.contains("given")) return;
    const has=mine.has(cell.dataset.rc);
    cell.classList.toggle("mine",has);
    if(!cell.classList.contains("wrong") && !cell.classList.contains("missing")) cell.textContent=has?"■":"";
    else if(has) cell.textContent="■";
  });
}
function clearMine(){
  if(passed) return;
  mine=new Set();
  document.querySelectorAll(".cell").forEach(cell=>cell.classList.remove("wrong","missing"));
  refreshCells();
  document.getElementById("msg").textContent="已經清空，再試一次吧！";
}
function useHint(){
  if(passed) return;
  if(failCount<3){
    document.getElementById("msg").innerHTML="<span class='fail'>再自己試試看！錯滿3次才有提示（目前已檢查 "+failCount+" 次）。</span>";
    return;
  }
  const ans=answerSet(LEVELS[levelIndex]);
  const missing=[...ans].filter(k=>!mine.has(k));
  if(!missing.length){ document.getElementById("msg").textContent="已經畫滿了，按檢查吧！"; return; }
  mine.add(missing[Math.floor(Math.random()*missing.length)]);
  refreshCells();
  document.getElementById("msg").textContent="幫你補了一格！";
}
function checkAnswer(){
  const lv=LEVELS[levelIndex], msg=document.getElementById("msg");
  const ans=answerSet(lv);
  let wrong=[...mine].filter(k=>!ans.has(k));
  let missing=[...ans].filter(k=>!mine.has(k));
  if(!wrong.length && !missing.length){
    passed=true; gold+=50; starsArr[levelIndex]="★";
    msg.innerHTML="<span class='success'>過關！寶箱打開 +50 金幣！</span>";
    document.getElementById("nextBtn").classList.toggle("hidden", levelIndex===LEVELS.length-1);
    if(levelIndex===LEVELS.length-1) setTimeout(showEnd,800);
    renderIslands();
    return;
  }
  failCount++;
  updateHintBtn();
  if(failCount<3){
    // 前兩次：不標出答案位置，讓學生自己再試
    saveMistake(wrong, missing);
    document.querySelectorAll(".cell").forEach(cell=>cell.classList.remove("wrong","missing"));
    refreshCells();
    msg.innerHTML="<span class='fail'>再試試看！這是第 "+failCount+" 次，錯滿3次才有提示。</span>";
    return;
  }
  // 第3次起：先記錄錯題，再幫補一格，並標出要修正的地方
  saveMistake(wrong, missing);
  if(missing.length){
    mine.add(missing[Math.floor(Math.random()*missing.length)]);
    wrong=[...mine].filter(k=>!ans.has(k));
    missing=[...ans].filter(k=>!mine.has(k));
  }
  document.querySelectorAll(".cell").forEach(cell=>cell.classList.remove("wrong","missing"));
  refreshCells();
  document.querySelectorAll(".cell").forEach(cell=>{
    const k=cell.dataset.rc;
    if(wrong.includes(k)) cell.classList.add("wrong");
    if(missing.includes(k)) cell.classList.add("missing");
  });
  msg.innerHTML="<span class='fail'>幫你補了一格！紅色是多畫的（點一下擦掉），白框是還沒畫的。</span>";
}
function nextLevel(){ if(levelIndex<LEVELS.length-1){ levelIndex++; loadLevel(); } else showEnd(); }
function showEnd(){
  document.getElementById("gameScreen").classList.add("hidden");
  document.getElementById("endScreen").classList.remove("hidden");
  document.getElementById("finalScore").textContent="金幣 "+gold+"｜星星 "+starsArr.filter(Boolean).length+" / 5";
  renderIslands();
}
</script>
</body>
</html>
