<script id="engine">(() => {
  const levels={easy:{name:'簡單',maxSides:6,images:true,sums:false,aiDelay:[10000,30000],aiReply:[1000,2800]},normal:{name:'普通',maxSides:10,images:false,sums:false,aiDelay:[10000,30000],aiReply:[1000,2800]},hard:{name:'困難',maxSides:12,images:false,sums:true,aiDelay:[10000,30000],aiReply:[1000,2800]}};
  const numerals={3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',11:'十一',12:'十二'};
  const shapes=['prism','pyramid'].flatMap(kind=>Object.keys(numerals).map(Number).map(sides=>({id:`${kind}-${sides}`,kind,sides,name:`${numerals[sides]}角${kind==='prism'?'柱':'錐'}`,v:kind==='prism'?2*sides:sides+1,e:kind==='prism'?3*sides:2*sides,f:kind==='prism'?sides+2:sides+1})));
  const components={v:['v'],e:['e'],f:['f'],vf:['v','f'],ve:['v','e'],fe:['f','e'],vfe:['v','f','e']};
  const labels={v:'頂點數',e:'邊數',f:'面數',vf:'頂點數＋面數',ve:'頂點數＋邊數',fe:'面數＋邊數',vfe:'頂點數＋面數＋邊數'};
  const allowedKeys=level=>levels[level].sums?['vf','ve','fe','vfe']:['v','e','f'];
  const value=(shape,key)=>components[key].reduce((sum,component)=>sum+shape[component],0);
  const shuffle=(list,random=Math.random)=>{const copy=[...list];for(let index=copy.length-1;index>0;index--){const other=Math.floor(random()*(index+1));[copy[index],copy[other]]=[copy[other],copy[index]];}return copy;};
  const poolFor=level=>shapes.filter(shape=>shape.sides<=levels[level].maxSides);
  const remaining=(pool,clues)=>pool.filter(shape=>clues.every(clue=>value(shape,clue.key)===clue.value));
  const clueText=clue=>({v:`它共有 ${clue.value} 個頂點。`,e:`它共有 ${clue.value} 條邊。`,f:`它共有 ${clue.value} 個面。`,vf:`它的頂點數＋面數＝${clue.value}。`,ve:`它的頂點數＋邊數＝${clue.value}。`,fe:`它的面數＋邊數＝${clue.value}。`,vfe:`它的頂點數＋面數＋邊數＝${clue.value}。`})[clue.key];
  const selectTarget=(level,previous,random)=>{const pool=poolFor(level);const fresh=pool.filter(shape=>!previous.slice(-5).includes(shape.id));return shuffle(fresh.length?fresh:pool,random)[0];};
  const explanation=shape=>shape.kind==='prism'?[
    `面：${shape.sides} 個側面＋2 個底面＝${shape.f} 個。`,
    `頂點：兩個底面各 ${shape.sides} 個，共 ${shape.v} 個。`,
    `邊：${shape.sides}＋${shape.sides} 條底邊，再加 ${shape.sides} 條連接邊，共 ${shape.e} 條。`
  ]:[
    `面：${shape.sides} 個三角形側面＋1 個底面＝${shape.f} 個。`,
    `頂點：底面 ${shape.sides} 個＋尖頂 1 個＝${shape.v} 個。`,
    `邊：${shape.sides} 條底邊＋${shape.sides} 條連向尖頂的邊＝${shape.e} 條。`
  ];
  function makeReverse(level,previous=[],random=Math.random,stage=0){
    const target=selectTarget(level,previous,random),keys=allowedKeys(level).filter(key=>stage>=3||key!=='vfe'),first=shuffle(keys,random)[0];
    const distance=shape=>Math.abs(value(shape,first)-value(target,first));
    const structureDistance=shape=>Math.abs(shape.v-target.v)+Math.abs(shape.e-target.e)+Math.abs(shape.f-target.f);
    const distractors=shuffle(poolFor(level).filter(shape=>shape.kind===target.kind&&shape.id!==target.id),random).sort((firstShape,secondShape)=>distance(firstShape)-distance(secondShape)||structureDistance(firstShape)-structureDistance(secondShape)).slice(0,3);
    const pool=shuffle([target,...distractors],random),clues=[{key:first,value:value(target,first)}];
    const available=shuffle(keys.filter(key=>key!==first),random);
    while(clues.length<3){const current=remaining(pool,clues);available.sort((firstKey,secondKey)=>remaining(current,[{key:firstKey,value:value(target,firstKey)}]).length-remaining(current,[{key:secondKey,value:value(target,secondKey)}]).length);const key=available.shift();clues.push({key,value:value(target,key)});}
    return{kind:'reverse',form:'reverse',level,stage,target,pool,clues,category:target.kind==='prism'?'角柱':'角錐',options:pool.map(shape=>({id:shape.id,label:shape.name})),answerId:target.id};
  }
  function makeForward(level,previous=[],random=Math.random,stage=0,form='named'){
    const target=selectTarget(level,previous,random);
    const key=levels[level].sums?shuffle(allowedKeys(level).filter(item=>stage>=3||item!=='vfe'),random)[0]:level==='normal'&&stage>=2?'pair':shuffle(['f','v','e'],random)[0];
    const fields=key==='pair'?shuffle([['f','v'],['f','e'],['v','e']],random)[0]:[key],correct=fields.map(field=>value(target,field));
    const candidates=[];
    const add=values=>{if(values.every(number=>Number.isInteger(number)&&number>=0)&&!candidates.some(option=>option.every((number,index)=>number===values[index])))candidates.push(values);};
    add(correct);
    if(fields.length>1){
      const misconceptions=[];
      fields.forEach((field,index)=>{
        const errors=field==='f'?[target.sides,target.f-1,target.f+1]:field==='v'?[target.sides,target.v-1,target.v+1]:[target.e-target.sides,target.e+target.sides,target.e-1,target.e+1];
        errors.forEach(number=>{const values=[...correct];values[index]=number;misconceptions.push(values);});
      });shuffle(misconceptions,random).forEach(add);
    }else{
      shuffle(poolFor(level).map(shape=>value(shape,key)),random).sort((first,second)=>Math.abs(first-correct[0])-Math.abs(second-correct[0])).forEach(number=>add([number]));
    }
    const wrong=fields.length>1?shuffle(candidates.slice(1),random).slice(0,3):candidates.slice(1,4);
    const itemLabels={f:'面',v:'頂點',e:'邊'},units={f:'個',v:'個',e:'條'};
    const options=shuffle([correct,...wrong],random).map((values,index)=>({id:`choice-${index}`,values,label:fields.length>1?fields.map((field,position)=>`${itemLabels[field]} ${values[position]} ${units[field]}`).join('・'):String(values[0])}));
    const answer=options.find(option=>option.values.every((number,index)=>number===correct[index]));
    const baseShape=target.sides===3?'三角形':`${numerals[target.sides]}邊形`;
    const subject=form==='base'?`有一個${target.kind==='prism'?'角柱':'角錐'}的底面是${baseShape}，它`:target.name;
    const question=fields.length>1?`${subject}有${fields.map(field=>`幾${units[field]}${itemLabels[field]}`).join('、')}？`:components[key].length===1?`${subject}有幾${units[key]}${itemLabels[key]}？`:`${subject}的${labels[key]}是多少？`;
    const hints=fields.length>1?[
      target.kind==='prism'?'先分開數：側面和底面都要算進面的總數。':'先分開數：三角形側面和底面都要算進面的總數。',
      explanation(target).join(' ')
    ]:components[key].length>1?[
      `先分別算出${components[key].map(component=>labels[component]).join('、')}，最後再相加。`,
      `${labels[key]}：${components[key].map(component=>target[component]).join('＋')}，試著加加看！`
    ]:[
      key==='f'?'把側面和底面一起算進去。':key==='v'?(target.kind==='prism'?'兩個底面的頂點都要數。':'底面的頂點和尖頂都要數。'):(target.kind==='prism'?'邊可分成兩圈底邊和連接兩個底面的邊。':'邊可分成底邊與連向尖頂的邊。'),
      explanation(target).find(line=>line.startsWith(key==='f'?'面：':key==='v'?'頂點：':'邊：'))
    ];
    return{kind:'forward',form,level,stage,target,key,fields,correct,options,answerId:answer.id,question,hints};
  }
  function solveAi(mystery,random=Math.random){
    if(mystery.kind==='forward'){
      let candidates=[...mystery.options];const fields=shuffle(mystery.fields,random),notes=[];
      for(const field of fields){const fieldIndex=mystery.fields.indexOf(field),answer=value(mystery.target,field);notes.push({key:field,value:answer});candidates=candidates.filter(option=>option.values[fieldIndex]===answer);if(candidates.length===1)break;}
      return{steps:notes.length,answerId:candidates[0].id,notes};
    }
    let candidates=[...mystery.pool];const available=shuffle(allowedKeys(mystery.level),random),notes=[];
    while(candidates.length>1&&available.length){
      if(notes.length){const partitionSize=key=>{const groups=new Map();candidates.forEach(shape=>groups.set(value(shape,key),(groups.get(value(shape,key))||0)+1));return [...groups.values()].reduce((sum,count)=>sum+count*count,0);};available.sort((first,second)=>partitionSize(first)-partitionSize(second));}
      const key=available.shift(),clue={key,value:value(mystery.target,key)};notes.push(clue);candidates=remaining(candidates,[clue]);
    }
    return{steps:notes.length,answerId:candidates.length===1?candidates[0].id:null,notes};
  }

      },
      async joinRoom(code,id){return transaction(codePath(code),room=>{if(!room)throw Error('找不到房間，請確認房號');if(room.players?.guest?.id===id)return;if(room.phase!=='lobby'||room.players?.guest)throw Error('房間已滿或已開始');if(room.players.host.id===id)throw Error('請用另一部裝置或分頁加入');room.players.guest={id};room.heartbeat.guest=serverNow();room.updatedAt=timestamp();return room;});},
      async startRoom(code,id){return transaction(codePath(code),room=>{assertMember(room,'host',id);if(room.phase!=='lobby')return;if(!room.players.guest)throw Error('請等候另一位玩家加入');room.phase='playing';room.startsAt=serverNow()+3500;room.updatedAt=timestamp();return room;});},
      async answer(code,role,id,round,answerId,elapsed){return transaction(codePath(code),room=>{assertMember(room,role,id);if(room.round!==round||room.phase!=='playing')return;if(serverNow()<room.startsAt)throw Error('題目尚未開始');if(!room.deck[round].options.some(option=>option.id===answerId))throw Error('答案無效');if(room.answers?.[round]?.[role])return;room.answers||={};room.answers[round]||={};room.answers[round][role]={id:serverNow()>=room.startsAt+60000?null:answerId,elapsed:Math.max(0,Math.min(60000,Math.round(elapsed)))};room.updatedAt=timestamp();return settle(room);});},
      async settle(code){return transaction(codePath(code),room=>{if(!room||room.phase!=='playing'||serverNow()<room.startsAt+60000)return;return settle(room);});},

    };
  }

  if(globalThis.GeometryBackendConfig&&globalThis.fetch)globalThis.GeometryCloud=createGeometryCloud({root:GeometryBackendConfig.root});

</script>
<script id="records">(() => {
  'use strict';
  const E=globalThis.SherlockGeometry,config=globalThis.GeometryBackendConfig,encoder=new TextEncoder(),decoder=new TextDecoder();
  const to64=bytes=>{let text='';for(const byte of new Uint8Array(bytes))text+=String.fromCharCode(byte);return btoa(text);};
  const from64=text=>Uint8Array.from(atob(text),char=>char.charCodeAt(0));
  const dateKey=value=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(value));
  const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  let publicKey=null,epoch=null,flushing=false;
  const storageKey='geometry-encrypted-outbox-v1';
  const readQueue=()=>{try{return JSON.parse(localStorage.getItem(storageKey)||'[]');}catch{return[];}};
  const writeQueue=queue=>{try{localStorage.setItem(storageKey,JSON.stringify(queue));}catch{}};
  function questionText(mystery){return mystery.kind==='forward'?mystery.question:`有一個${mystery.category}，${E.raceClues(mystery).map(E.clueText).join('')}它是幾${mystery.category}？`;}
  function diagnose(mystery,response){
    const option=mystery.options.find(item=>item.id===response.id),shape=mystery.target;
    if(response.id===null)return{reason:'未在時間內作答',concepts:[{key:'timeout',label:'作答時間',correct:false}]};
    const fields=mystery.kind==='forward'?mystery.fields:E.raceClues(mystery).map(clue=>clue.key);
    const concepts=fields.map((key,index)=>({key,label:E.labels[key],correct:mystery.kind==='forward'?option?.values[index]===E.value(shape,key):response.correct}));
    if(response.correct)return{reason:'答對',concepts};
    const possibilities=[];
    if(mystery.kind==='forward')fields.forEach((key,index)=>{
      const guess=option?.values[index];if(guess===E.value(shape,key))return;
      if(key==='f'&&guess===shape.sides)possibilities.push(shape.kind==='prism'?'可能只數側面，漏算兩個底面':'可能只數側面，漏算底面');
      else if(key==='v'&&guess===shape.sides)possibilities.push(shape.kind==='prism'?'可能只數一個底面的頂點':'可能漏算尖頂');
      else if(key==='e'&&guess===shape.sides*2&&shape.kind==='prism')possibilities.push('可能只數兩圈底面邊，漏算連接邊');
      else if(key==='e'&&guess===shape.sides)possibilities.push(shape.kind==='prism'?'可能只數一個底面的邊':'可能漏算連向尖頂的邊');
      else if(E.components[key].length>1)possibilities.push(`需再檢查${E.labels[key]}的個別數量與加總`);
      else possibilities.push(`需再檢查${E.labels[key]}，避免漏數或重複計數`);
    });
    if(mystery.kind==='reverse')possibilities.push(`需練習用${fields.map(key=>E.labels[key]).join('、')}反推底面的邊數`);
    return{reason:[...new Set(possibilities)].join('；')||'需再確認形體的構成要素',concepts};
  }
  function makeAttempt(mystery,response,profile,{mode='single',matchId='match',round=1,roomCode=''}={}){
    const timestamp=Date.now(),option=mystery.options.find(item=>item.id===response.id),answer=mystery.options.find(item=>item.id===mystery.answerId),analysis=diagnose(mystery,response);
    return{id:`${matchId}-${round}`,timestamp,dateStr:dateKey(timestamp),className:String(profile.className||'未填班級').slice(0,30),seat:String(profile.seat||'').slice(0,8),studentName:String(profile.studentName||'訪客').slice(0,30),mode,roomCode,level:mystery.level,form:mystery.form||'reverse',questionText:questionText(mystery),studentAnswer:response.id===null?'未作答':option?.label||'無效答案',correctAnswer:answer.label,isCorrect:!!response.correct,elapsedMs:response.elapsed,score:response.score,shape:{name:mystery.target.name,kind:mystery.target.kind,sides:mystery.target.sides,v:mystery.target.v,e:mystery.target.e,f:mystery.target.f},errorReason:analysis.reason,concepts:analysis.concepts};
  }
  async function encrypt(record){
    if(!publicKey)publicKey=crypto.subtle.importKey('jwk',config.publicKey,{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);
    const aes=await crypto.subtle.generateKey({name:'AES-GCM',length:256},true,['encrypt']),iv=crypto.getRandomValues(new Uint8Array(12)),raw=await crypto.subtle.exportKey('raw',aes);
    const [cipher,wrapped]=await Promise.all([crypto.subtle.encrypt({name:'AES-GCM',iv},aes,encoder.encode(JSON.stringify(record))),crypto.subtle.encrypt({name:'RSA-OAEP'},await publicKey,raw)]);

  }
  async function flush(){
    const cloud=globalThis.GeometryCloud;if(flushing||!cloud)return;flushing=true;
    try{epoch=await cloud.recordEpoch();const pending=readQueue();for(const item of pending){if(item.epoch&&item.epoch!==epoch){writeQueue(readQueue().filter(row=>row.id!==item.id));continue;}await cloud.saveRecord(epoch,item.id,item.envelope);writeQueue(readQueue().filter(row=>row.id!==item.id));}}
    catch{ /* Keep encrypted attempts queued; logging never blocks a question. */ }finally{flushing=false;}
  }
  async function log(record){
    try{const envelope=await encrypt(record),queue=readQueue();if(!queue.some(item=>item.id===record.id))queue.push({id:record.id,epoch,envelope});writeQueue(queue);await flush();}catch{ /* The game remains usable when storage or networking is unavailable. */ }
  }
  const filter=(rows,{className='',studentName='',start='',end='',wrongOnly=false}={})=>rows.filter(row=>(!className||row.className===className)&&(!studentName||row.studentName.toLocaleLowerCase().includes(studentName.trim().toLocaleLowerCase()))&&(!start||row.dateStr>=start)&&(!end||row.dateStr<=end)&&(!wrongOnly||!row.isCorrect));
  function statistics(rows){
    const students=new Set(rows.map(row=>`${row.className}|${row.studentName}|${row.seat}`)),wrong=rows.filter(row=>!row.isCorrect),focus=Object.create(null);
    for(const row of rows)for(const concept of row.concepts||[]){const entry=focus[concept.key]||={label:concept.label,total:0,wrong:0};entry.total++;if(concept.correct===false)entry.wrong++;}
    return{students:students.size,total:rows.length,correct:rows.length-wrong.length,wrong:wrong.length,accuracy:rows.length?Math.round((rows.length-wrong.length)/rows.length*100):0,average:rows.length?Math.round(rows.reduce((sum,row)=>sum+row.score,0)/rows.length):0,focus:Object.values(focus).sort((a,b)=>b.wrong-a.wrong||b.total-a.total)};
  }
  globalThis.GeometryRecords={dateKey,escape,questionText,diagnose,makeAttempt,encrypt,log,flush,filter,statistics};
  if(globalThis.addEventListener){globalThis.addEventListener('online',flush);if(globalThis.GeometryCloud){globalThis.GeometryCloud.recordEpoch().then(value=>{epoch=value;flush();}).catch(()=>{});}}
})();
</script>

  }
  function questionContent(){if(mystery.kind==='forward')return `<div class="forward-question">${Engine.levels[level].images?model(mystery.target,false,mystery.form==='base'?(mystery.target.kind==='prism'?'角柱':'角錐'):mystery.target.name):''}<strong>${mystery.question}</strong></div>`;const clues=Engine.raceClues(mystery);return `<div class="reverse-question"><strong>有一個${mystery.category}，${clues.map(clue=>Engine.clueText(clue)).join('')}</strong><span>它是幾${mystery.category}？</span></div>`;}

  function finishQuestion(){if(phase!=='playing')return;stopClock();phase='review';Sound.result(humanAnswer.correct);yourTotal+=humanAnswer.score;aiTotal+=aiAnswer.score;history.push({human:humanAnswer.score,ai:aiAnswer.score,kind:mystery.kind});logResponse();updateHeader();renderReview();}

  function renderReview(){

    app.innerHTML=`<section class="result race-result compact-review"><span class="solved-mark">${questionNumber} / ${roundCount}</span><h2>${humanAnswer.correct?'答對了！':'再接再厲！'}</h2><div class="round-points"><div class="human"><span>${yourName()}</span><strong id="your-score">${yourTotal}</strong><small>本題 +${humanAnswer.score} · ${responseText(humanAnswer)}</small></div><div class="ai"><span>${otherName()}</span><strong id="ai-score">${aiTotal}</strong><small>本題 +${aiAnswer.score} · ${aiAnswer.correct?'答對':'答錯'}</small></div></div><p class="verdict">正解：<strong class="answer-name">${correctOption.label}</strong></p><section class="count-explanation" aria-label="${mystery.target.name}的構成要素計數動畫"><div class="count-tabs">${keys.map(key=>`<button id="count-tab-${key}" data-metric="${key}" aria-pressed="false">${names[key]}</button>`).join('')}</div><button class="count-replay" data-replay aria-label="重播計數動畫" title="重播計數動畫">↻</button><div id="count-diagram" tabindex="0" role="group" aria-label="形體視圖，可拖曳或使用方向鍵旋轉"></div><p class="rotation-hint">按住可以旋轉圖形</p><div class="count-number"><strong id="count-current">0</strong><span id="count-total"></span></div>${Engine.levels[level].sums?'<div id="count-sum" class="count-sum"></div>':''}<div class="count-caption">${mystery.target.name}</div></section><button class="primary" id="next">${questionNumber<roundCount?'下一題 →':'總成績 →'}</button></section>`;

  function drawVisual(){
    if(!visualState||visualState.manual||phase!=='review')return;const state=visualState,key=state.keys[state.index],total=mystery.target[key],elapsed=performance.now()-state.started;
    const frame=Engine.countFrame(state.plan,state.reduced?state.plan.duration:elapsed);if(state.reduced){frame.view=Engine.defaultView;frame.active=null;frame.phase='static';}state.frame=frame;
    const signature=[key,frame.count,frame.active,frame.phase,frame.view.yaw.toFixed(5),frame.view.tilt.toFixed(5),frame.view.quaternion?.map(number=>number.toFixed(5)).join(',')].join(':');
    if(signature!==state.last){state.last=signature;document.getElementById('count-diagram').innerHTML=Engine.drawCountModel(mystery.target,key,frame);}
    document.getElementById('count-current').textContent=frame.count;document.getElementById('count-total').textContent=` / ${total}`;
    state.keys.forEach(item=>document.getElementById(`count-tab-${item}`).setAttribute('aria-pressed',String(item===key)));
    if(Engine.levels[level].sums){const numbers=state.keys.map(item=>mystery.target[item]);document.getElementById('count-sum').textContent=`${numbers.join(' ＋ ')} ＝ ${numbers.reduce((sum,number)=>sum+number,0)}`;}
    if(!state.reduced&&frame.done){if(state.index<state.keys.length-1){state.index++;state.plan=Engine.countingPlan(mystery.target,state.keys[state.index],frame.view);state.started=performance.now();state.last='';drawVisual();}else if(animationClock!==null){clearInterval(animationClock);animationClock=null;}}
  }
  function selectVisual(key){if(!visualState)return;const state=visualState,index=state.keys.indexOf(key);if(index<0)return;if(rotationFrame!==null){cancelAnimationFrame(rotationFrame);rotationFrame=null;}state.pendingView=null;state.manual=false;state.drag=null;state.index=index;state.plan=Engine.countingPlan(mystery.target,key,state.frame?.view);state.started=performance.now();state.last='';drawVisual();if(!state.reduced&&animationClock===null)animationClock=setInterval(drawVisual,80);}
  function finishMatch(){stopClock();phase='finished';updateHeader();const title=yourTotal>aiTotal?'你是搶答王！':yourTotal===aiTotal?'不分上下！':'下次再挑戰！';app.innerHTML=`<section class="result final-result"><div class="result-character">${character()}</div><span class="solved-mark">5 題完成</span><h1>${title}</h1><div class="round-points"><div class="human"><span>${yourName()}</span><strong id="your-score">${yourTotal}</strong></div><div class="ai"><span>${otherName()}</span><strong id="ai-score">${aiTotal}</strong></div></div><button class="primary" id="again">${online?'回到主選單':'再比一場！'}</button></section>`;window.scrollTo({top:0,behavior:'smooth'});}
  app.addEventListener('click',event=>{const selected=event.target.closest('[data-level]');if(selected){start(selected.dataset.level);return;}const choice=event.target.closest('[data-answer]');if(choice){answer(choice.dataset.answer);return;}if(event.target.closest('[data-replay]')&&visualState){selectVisual(visualState.keys[visualState.index]);return;}const metric=event.target.closest('[data-metric]');if(metric){selectVisual(metric.dataset.metric);return;}if(event.target.closest('#next')&&phase==='review'){if(online){online.next();return;}if(questionNumber<roundCount)newQuestion();else finishMatch();}else if(event.target.closest('#again')&&phase==='finished'){if(online)menu();else start(level);}});
  function tickOnline(){
    if(!online)return;
    if(phase==='online-wait'){
      const remaining=online.room.startsAt-GeometryCloud.serverNow();
      if(remaining<=0){play();updateHeader();return;}
      const counter=document.getElementById('countdown-number');if(counter)counter.textContent=Math.min(3,Math.max(1,Math.ceil(remaining/1000)));return;
    }
    if(phase!=='playing')return;
    const elapsed=Math.max(0,GeometryCloud.serverNow()-online.room.startsAt),other=online.role==='host'?'guest':'host',answers=online.room.answers?.[online.room.round]||{};
    if(humanAnswer)app.querySelectorAll('[data-answer]').forEach(button=>button.disabled=true);
    if(answers[online.role])document.getElementById('human-status').textContent='已作答';
    if(answers[other])document.getElementById('ai-status').textContent='已作答';
    if(elapsed>=duration){if(!humanAnswer){humanAnswer={id:null,correct:false,elapsed:duration,score:0};document.getElementById('human-status').textContent='時間到！';app.querySelectorAll('[data-answer]').forEach(button=>button.disabled=true);}online.timeout();}
    const seconds=Math.max(0,Math.ceil((duration-elapsed)/1000));if(!humanAnswer)Sound.countdown(seconds);document.getElementById('seconds').textContent=seconds;document.getElementById('time-fill').style.width=`${Math.max(0,1-elapsed/duration)*100}%`;document.getElementById('time-track').setAttribute('aria-valuenow',seconds);document.getElementById('time-track').classList.toggle('urgent',seconds<=5);
  }
  function answerOnline(id){
    if(phase!=='playing'||humanAnswer||!mystery.options.some(option=>option.id===id))return;tickOnline();if(humanAnswer)return;
    const current=online,elapsed=Math.max(0,GeometryCloud.serverNow()-online.room.startsAt),correct=id===mystery.answerId;
    humanAnswer={id,correct,elapsed,score:Engine.scoreAnswer(correct,elapsed)};Sound.choose();app.querySelectorAll('[data-answer]').forEach(button=>{button.disabled=true;if(button.dataset.answer===id)button.classList.add('user-pick');});document.getElementById('human-status').textContent='傳送中…';
    current.submit(id,elapsed).then(()=>{if(online===current&&phase==='playing')document.getElementById('human-status').textContent='已作答';}).catch(()=>{if(online===current&&phase==='playing'){humanAnswer=null;app.querySelectorAll('[data-answer]').forEach(button=>button.disabled=false);document.getElementById('human-status').textContent='尚未送出，請再點一次';}});
  }
  function startOnlineRound(room,role,callbacks){
    stopClock();online={room,role,code:room.code,...callbacks};level=room.level;questionNumber=room.round+1;mystery=room.deck[room.round];yourTotal=room.scores[role]||0;const other=role==='host'?'guest':'host';aiTotal=room.scores[other]||0;matchId=`${room.code}-${room.createdAt}-${role}`;humanAnswer=room.answers?.[room.round]?.[role]||null;aiAnswer=null;Sound.resetCountdown();Sound.unlock();
    if(GeometryCloud.serverNow()<room.startsAt){phase='online-wait';app.innerHTML=questionNumber===1?`<section class="countdown-screen"><span class="eyebrow">1 / 5</span>${character()}<div class="countdown-number" id="countdown-number">3</div></section>`:'<section class="network-message"><h2>準備下一題…</h2></section>';}
    else play();updateHeader();window.scrollTo({top:0,behavior:'instant'});clock=setInterval(tick,100);
  }
  function onlineReview(room){
    stopClock();online.room=room;phase='review';const role=online.role,other=role==='host'?'guest':'host';mystery=room.deck[room.round];questionNumber=room.round+1;humanAnswer=room.results[room.round][role];aiAnswer=room.results[room.round][other];yourTotal=room.scores[role];aiTotal=room.scores[other];Sound.result(humanAnswer.correct);logResponse();updateHeader();renderReview();
  }
  function showPanel(html){stopClock();phase='lobby';app.innerHTML=html;updateHeader();window.scrollTo({top:0,behavior:'instant'});}
  globalThis.GeometryGame={readProfile,profileFields,showPanel,startOnlineRound,onlineReview,menu,getOnline:()=>online,updateOnline:room=>{if(online)online.room=room;},onlineFinal:room=>{if(online){online.room=room;yourTotal=room.scores[online.role];aiTotal=room.scores[online.role==='host'?'guest':'host'];finishMatch();}},disconnect:()=>{online=null;}};
  function pauseForRotation(){
    const state=visualState;if(!state||phase!=='review')return null;
    if(animationClock!==null){clearInterval(animationClock);animationClock=null;}
    state.manual=true;state.frame={...state.frame,phase:'manual',active:null};return state;
  }
  function rotateView(view){
    const state=visualState;if(!state)return;
    state.frame={...state.frame,view,phase:'manual',active:null};
    document.getElementById('count-diagram').innerHTML=Engine.drawCountModel(mystery.target,state.keys[state.index],state.frame);
  }
  function flushRotation(){
    if(rotationFrame!==null){cancelAnimationFrame(rotationFrame);rotationFrame=null;}
    const state=visualState;if(state?.pendingView){const view=state.pendingView;state.pendingView=null;rotateView(view);}
  }
  function queueRotation(view){
    if(!visualState)return;visualState.pendingView=view;
    if(rotationFrame===null)rotationFrame=requestAnimationFrame(()=>{rotationFrame=null;flushRotation();});
  }
  app.addEventListener('pointerdown',event=>{
    const diagram=event.target.closest('#count-diagram');if(!diagram||event.isPrimary===false||event.button>0)return;
    flushRotation();const state=pauseForRotation();if(!state)return;
    state.drag={id:event.pointerId,rotation:Engine.rotationStart(state.frame.view,event.clientX,event.clientY,diagram.getBoundingClientRect())};
    diagram.setPointerCapture?.(event.pointerId);diagram.focus?.({preventScroll:true});diagram.classList.add('dragging');rotateView(state.frame.view);event.preventDefault();
  });
  app.addEventListener('pointermove',event=>{
    const drag=visualState?.drag;if(!drag||drag.id!==event.pointerId)return;
    const samples=event.getCoalescedEvents?.(),point=samples?.length?samples[samples.length-1]:event;
    queueRotation(Engine.dragRotation(drag.rotation,point.clientX,point.clientY));event.preventDefault();
  });
  const endRotation=event=>{if(visualState?.drag?.id!==event.pointerId)return;flushRotation();visualState.drag=null;const diagram=document.getElementById('count-diagram');diagram.classList.remove('dragging');if(diagram.hasPointerCapture?.(event.pointerId))diagram.releasePointerCapture(event.pointerId);};
  ['pointerup','pointercancel','lostpointercapture'].forEach(type=>app.addEventListener(type,endRotation));
  app.addEventListener('keydown',event=>{
    if(!event.target.closest('#count-diagram')||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(event.key))return;
    flushRotation();const state=pauseForRotation();if(!state)return;
    rotateView(Engine.nudgeRotation(state.frame.view,event.key==='ArrowRight'?.16:event.key==='ArrowLeft'?-.16:0,event.key==='ArrowUp'?.16:event.key==='ArrowDown'?-.16:0));event.preventDefault();
  });
  document.getElementById('menu-button').addEventListener('click',menu);
  document.getElementById('sound-button').addEventListener('click',()=>{const on=Sound.toggle(),button=document.getElementById('sound-button');button.textContent=on?'🔊':'🔇';button.setAttribute('aria-pressed',String(on));button.setAttribute('aria-label',on?'關閉聲音':'開啟聲音');button.title=on?'關閉聲音':'開啟聲音';});
  window.addEventListener('pagehide',stopClock);
  menu();
})();
</script>
<script id="online">(() => {
  'use strict';
  const G=GeometryGame,C=GeometryCloud,E=SherlockGeometry,app=document.getElementById('app'),safe=GeometryRecords.escape;
  let session=null,unwatch=null,heartbeat=null,lastView='',busy=false,settling=false;
  const storageKey='geometry-online-session-v1';
  const saveSession=()=>{try{if(session)sessionStorage.setItem(storageKey,JSON.stringify(session));else sessionStorage.removeItem(storageKey);}catch{}};
  const setStatus=text=>{const node=document.getElementById('network-status');if(node)node.textContent=text;};
  const notice=text=>{const node=document.getElementById('connection-status');if(node){node.textContent=text;node.hidden=!text;}};
  function leave(){
    const previous=session;session=null;saveSession();if(unwatch){unwatch();unwatch=null;}if(heartbeat!==null){clearInterval(heartbeat);heartbeat=null;}lastView='';notice('');
    if(previous)C.leave(previous.code,previous.role,previous.id).catch(()=>{});
  }
  function lobby(){
    G.readProfile();leave();G.disconnect();G.showPanel(`<section class="online-lobby"><h1>雙人連線</h1>${G.profileFields()}<div class="lobby-columns"><section class="lobby-card"><h2>建立房間</h2><label>難度<select id="room-level"><option value="easy">簡單</option><option value="normal">普通</option><option value="hard">困難</option></select></label><button class="primary" data-create-room>建立房間</button></section><section class="lobby-card"><h2>加入房間</h2><label>房號<input id="room-code" maxlength="4" inputmode="numeric" pattern="[0-9]{4}" autocomplete="off" spellcheck="false" placeholder="4 碼數字房號"></label><button class="primary" data-join-room>加入房間</button></section></div><p class="helper" id="network-status" role="status"></p></section>`);
  }
  function makeDeck(level){const deck=[],recent=[];let bag=[];for(let index=0;index<5;index++){if(!bag.length)bag=E.shuffle(['named','base','reverse']);const form=bag.pop(),mystery=form==='reverse'?E.makeReverse(level,recent,Math.random,index):E.makeForward(level,recent,Math.random,index,form);recent.push(mystery.target.id);deck.push(mystery);}return JSON.parse(JSON.stringify(deck));}
  function callbacks(){return{leave,next:ready,timeout:settle,submit:async(id,elapsed)=>{const current=session,room=await C.answer(current.code,current.role,current.id,current.round,id,elapsed);if(session===current)accept(room);}};}
  function accept(room){
    if(!session)return;notice('');
    if(!room||room.players?.[session.role]?.id!==session.id||room.phase==='closed'){
      leave();G.disconnect();G.showPanel('<section class="network-message"><h2>房間已結束</h2><p>對手已離開或房間已關閉。</p><button class="primary" data-room-close>回到主選單</button></section>');return;
    }
    const rank={lobby:0,playing:1,review:2,finished:3}[room.phase]||0;
    if(room.round<session.round||room.round===session.round&&rank<(session.phaseRank||0))return;
    session.phaseRank=rank;session.round=room.round;saveSession();G.updateOnline(room);
    const key=`${room.phase}:${room.round}:${!!room.players.guest}`;
    if(key===lastView)return;lastView=key;
    if(room.phase==='lobby'){
      G.showPanel(`<section class="online-room"><h1>房間已建立</h1><div class="room-code" aria-label="房號 ${room.code}">${room.code}</div><p>${room.players.guest?'兩位玩家已到齊':'等候另一位玩家加入…'}</p><div class="room-players"><span>🙂 玩家 1</span><span>${room.players.guest?'🙂':'⌛'} 玩家 2</span></div>${session.role==='host'?`<button class="primary" data-start-room ${room.players.guest?'':'disabled'}>開始對戰</button>`:'<p class="helper">等候房主開始</p>'}<p class="helper" id="network-status" role="status"></p><button class="secondary" data-leave-room>離開房間</button></section>`);return;
    }
    if(room.phase==='playing')G.startOnlineRound(room,session.role,callbacks());
    else if(room.phase==='review'){if(!G.getOnline())G.startOnlineRound(room,session.role,callbacks());G.onlineReview(room);}
    else if(room.phase==='finished'){if(!G.getOnline())G.startOnlineRound(room,session.role,callbacks());G.onlineFinal(room);if(unwatch){unwatch();unwatch=null;}if(heartbeat!==null){clearInterval(heartbeat);heartbeat=null;}session=null;saveSession();}
  }
  function watch(){
    if(unwatch)unwatch();unwatch=C.watch(session.code,accept,()=>notice('連線中，請稍候…'));
    const beat=()=>{if(session)C.heartbeat(session.code,session.role,session.id).catch(()=>{});};beat();if(heartbeat!==null)clearInterval(heartbeat);heartbeat=setInterval(beat,10000);
  }
  async function connect(joining){
    if(busy)return;busy=true;G.readProfile();GeometryAudio.unlock();setStatus('連線中…');
    const buttons=[...app.querySelectorAll('[data-create-room],[data-join-room]')];buttons.forEach(button=>button.disabled=true);
    try{
      const id=crypto.randomUUID().replaceAll('-','');await C.syncClock();
      const room=joining?await C.joinRoom(document.getElementById('room-code').value.trim(),id):await C.createRoom(document.getElementById('room-level').value,makeDeck(document.getElementById('room-level').value),id);
      session={id,code:room.code,role:joining?'guest':'host',round:room.round};saveSession();lastView='';accept(room);watch();
    }catch(error){setStatus(error.message||'無法連線，請重試');}finally{busy=false;buttons.forEach(button=>button.disabled=false);}
  }
  async function start(){if(!session||busy)return;busy=true;setStatus('準備開始…');try{accept(await C.startRoom(session.code,session.id));}catch(error){setStatus(error.message);}finally{busy=false;}}
  async function ready(){
    if(!session||busy)return;busy=true;const button=document.getElementById('next');if(button){button.disabled=true;button.textContent='等候對方…';}
    try{accept(await C.ready(session.code,session.role,session.id,session.round));}catch(error){notice(error.message);if(button){button.disabled=false;button.textContent='再試一次 →';}}finally{busy=false;}
  }
  async function settle(){if(!session||settling)return;settling=true;try{accept(await C.settle(session.code));}catch{notice('連線中，請稍候…');}finally{setTimeout(()=>{settling=false;},1200);}}
  app.addEventListener('click',event=>{if(event.target.closest('[data-online]'))lobby();else if(event.target.closest('[data-create-room]'))connect(false);else if(event.target.closest('[data-join-room]'))connect(true);else if(event.target.closest('[data-start-room]'))start();else if(event.target.closest('[data-leave-room]')){leave();G.disconnect();G.menu();}else if(event.target.closest('[data-room-close]'))G.menu();});
  app.addEventListener('input',event=>{if(event.target.id==='room-code')event.target.value=event.target.value.replace(/[^0-9]/g,'').slice(0,4);});
  globalThis.GeometryOnline={leave};
  try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(saved?.code&&saved?.id&&['host','guest'].includes(saved.role)){session=saved;G.showPanel('<section class="network-message"><h2>重新連回房間…</h2></section>');C.syncClock().then(watch).catch(()=>{leave();G.menu();});}}catch{}
  window.addEventListener('pagehide',()=>{if(unwatch)unwatch();if(heartbeat!==null)clearInterval(heartbeat);});
})();
</script>
