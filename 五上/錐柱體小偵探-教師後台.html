</main><script>(() => {
  const levels={easy:{name:'簡單',maxSides:6,images:true,sums:false,aiDelay:[10000,30000],aiReply:[1000,2800]},normal:{name:'普通',maxSides:10,images:false,sums:false,aiDelay:[10000,30000],aiReply:[1000,2800]},hard:{name:'困難',maxSides:12,images:false,sums:true,aiDelay:[10000,30000],aiReply:[1000,2800]}};
  const numerals={3:'三',4:'四',5:'五',6:'六',7:'七',8:'八',9:'九',10:'十',11:'十一',12:'十二'};
  const shapes=['prism','pyramid'].flatMap(kind=>Object.keys(numerals).map(Number).map(sides=>({id:`${kind}-${sides}`,kind,sides,name:`${numerals[sides]}角${kind==='prism'?'柱':'錐'}`,v:kind==='prism'?2*sides:sides+1,e:kind==='prism'?3*sides:2*sides,f:kind==='prism'?sides+2:sides+1})));
  const components={v:['v'],e:['e'],f:['f'],vf:['v','f'],ve:['v','e'],fe:['f','e'],vfe:['v','f','e']};
  const labels={v:'頂點數',e:'邊數',f:'面數',vf:'頂點數＋面數',ve:'頂點數＋邊數',fe:'面數＋邊數',vfe:'頂點數＋面數＋邊數'};
  const allowedKeys=level=>levels[level].sums?['vf','ve','fe','vfe']:['v','e','f'];
  const value=(shape,key)=>components[key].reduce((sum,component)=>sum+shape[component],0);
  const shuffle=(list,random=Math.random)=>{const copy=[...list];for(let index=copy.length-1;index>0;index--){const other=Math.floor(random()*(index+1));[copy[index],copy[other]]=[copy[other],copy[index]];}return copy;};
  const poolFor=level=>shapes.filter(shape=>shape.sides<=levels[level].maxSides);
  const remaining=(pool,clues)=>pool.filter(shape=>clues.every(clue=>value(shape,clue.key)===clue.value));
  const clueText=clue=>({v:`它共有 ${clue.value} 個頂點。`,e:`它共有 ${clue.value} 條邊。`,f:`它共有 ${clue.value} 個面。`,vf:`它的頂點數＋面數＝${clue.value}。`,ve:`它的頂點數＋邊數＝${clue.value}。`,fe:`它的面數＋邊數＝${clue.value}。`,vfe:`它的頂點數＋面數＋邊數＝${clue.value}。`})[clue.key];
  const selectTarget=(level,previous,random)=>{const pool=poolFor(level);const fresh=pool.filter(shape=>!previous.slice(-5).includes(shape.id));return shuffle(fresh.length?fresh:pool,random)[0];};
  const explanation=shape=>shape.kind==='prism'?[
    `面：${shape.sides} 個側面＋2 個底面＝${shape.f} 個。`,
    `頂點：兩個底面各 ${shape.sides} 個，共 ${shape.v} 個。`,
    `邊：${shape.sides}＋${shape.sides} 條底邊，再加 ${shape.sides} 條連接邊，共 ${shape.e} 條。`
  ]:[
    `面：${shape.sides} 個三角形側面＋1 個底面＝${shape.f} 個。`,
    `頂點：底面 ${shape.sides} 個＋尖頂 1 個＝${shape.v} 個。`,
    `邊：${shape.sides} 條底邊＋${shape.sides} 條連向尖頂的邊＝${shape.e} 條。`
  ];
  function makeReverse(level,previous=[],random=Math.random,stage=0){
    const target=selectTarget(level,previous,random),keys=allowedKeys(level).filter(key=>stage>=3||key!=='vfe'),first=shuffle(keys,random)[0];
    const distance=shape=>Math.abs(value(shape,first)-value(target,first));
    const structureDistance=shape=>Math.abs(shape.v-target.v)+Math.abs(shape.e-target.e)+Math.abs(shape.f-target.f);
    const distractors=shuffle(poolFor(level).filter(shape=>shape.kind===target.kind&&shape.id!==target.id),random).sort((firstShape,secondShape)=>distance(firstShape)-distance(secondShape)||structureDistance(firstShape)-structureDistance(secondShape)).slice(0,3);
    const pool=shuffle([target,...distractors],random),clues=[{key:first,value:value(target,first)}];
    const available=shuffle(keys.filter(key=>key!==first),random);
    while(clues.length<3){const current=remaining(pool,clues);available.sort((firstKey,secondKey)=>remaining(current,[{key:firstKey,value:value(target,firstKey)}]).length-remaining(current,[{key:secondKey,value:value(target,secondKey)}]).length);const key=available.shift();clues.push({key,value:value(target,key)});}
    return{kind:'reverse',form:'reverse',level,stage,target,pool,clues,category:target.kind==='prism'?'角柱':'角錐',options:pool.map(shape=>({id:shape.id,label:shape.name})),answerId:target.id};
  }
  function makeForward(level,previous=[],random=Math.random,stage=0,form='named'){
    const target=selectTarget(level,previous,random);
    const key=levels[level].sums?shuffle(allowedKeys(level).filter(item=>stage>=3||item!=='vfe'),random)[0]:level==='normal'&&stage>=2?'pair':shuffle(['f','v','e'],random)[0];
    const fields=key==='pair'?shuffle([['f','v'],['f','e'],['v','e']],random)[0]:[key],correct=fields.map(field=>value(target,field));
    const candidates=[];
    const add=values=>{if(values.every(number=>Number.isInteger(number)&&number>=0)&&!candidates.some(option=>option.every((number,index)=>number===values[index])))candidates.push(values);};
    add(correct);
    if(fields.length>1){
      const misconceptions=[];
      fields.forEach((field,index)=>{
        const errors=field==='f'?[target.sides,target.f-1,target.f+1]:field==='v'?[target.sides,target.v-1,target.v+1]:[target.e-target.sides,target.e+target.sides,target.e-1,target.e+1];
        errors.forEach(number=>{const values=[...correct];values[index]=number;misconceptions.push(values);});
      });shuffle(misconceptions,random).forEach(add);
    }else{
      shuffle(poolFor(level).map(shape=>value(shape,key)),random).sort((first,second)=>Math.abs(first-correct[0])-Math.abs(second-correct[0])).forEach(number=>add([number]));
    }
    const wrong=fields.length>1?shuffle(candidates.slice(1),random).slice(0,3):candidates.slice(1,4);
    const itemLabels={f:'面',v:'頂點',e:'邊'},units={f:'個',v:'個',e:'條'};
    const options=shuffle([correct,...wrong],random).map((values,index)=>({id:`choice-${index}`,values,label:fields.length>1?fields.map((field,position)=>`${itemLabels[field]} ${values[position]} ${units[field]}`).join('・'):String(values[0])}));
    const answer=options.find(option=>option.values.every((number,index)=>number===correct[index]));
    const baseShape=target.sides===3?'三角形':`${numerals[target.sides]}邊形`;
    const subject=form==='base'?`有一個${target.kind==='prism'?'角柱':'角錐'}的底面是${baseShape}，它`:target.name;
    const question=fields.length>1?`${subject}有${fields.map(field=>`幾${units[field]}${itemLabels[field]}`).join('、')}？`:components[key].length===1?`${subject}有幾${units[key]}${itemLabels[key]}？`:`${subject}的${labels[key]}是多少？`;
    const hints=fields.length>1?[
      target.kind==='prism'?'先分開數：側面和底面都要算進面的總數。':'先分開數：三角形側面和底面都要算進面的總數。',
      explanation(target).join(' ')
    ]:components[key].length>1?[
      `先分別算出${components[key].map(component=>labels[component]).join('、')}，最後再相加。`,
      `${labels[key]}：${components[key].map(component=>target[component]).join('＋')}，試著加加看！`
    ]:[
      key==='f'?'把側面和底面一起算進去。':key==='v'?(target.kind==='prism'?'兩個底面的頂點都要數。':'底面的頂點和尖頂都要數。'):(target.kind==='prism'?'邊可分成兩圈底邊和連接兩個底面的邊。':'邊可分成底邊與連向尖頂的邊。'),
      explanation(target).find(line=>line.startsWith(key==='f'?'面：':key==='v'?'頂點：':'邊：'))
    ];
    return{kind:'forward',form,level,stage,target,key,fields,correct,options,answerId:answer.id,question,hints};
  }
  function solveAi(mystery,random=Math.random){
    if(mystery.kind==='forward'){
      let candidates=[...mystery.options];const fields=shuffle(mystery.fields,random),notes=[];
      for(const field of fields){const fieldIndex=mystery.fields.indexOf(field),answer=value(mystery.target,field);notes.push({key:field,value:answer});candidates=candidates.filter(option=>option.values[fieldIndex]===answer);if(candidates.length===1)break;}
      return{steps:notes.length,answerId:candidates[0].id,notes};
    }
    let candidates=[...mystery.pool];const available=shuffle(allowedKeys(mystery.level),random),notes=[];
    while(candidates.length>1&&available.length){
      if(notes.length){const partitionSize=key=>{const groups=new Map();candidates.forEach(shape=>groups.set(value(shape,key),(groups.get(value(shape,key))||0)+1));return [...groups.values()].reduce((sum,count)=>sum+count*count,0);};available.sort((first,second)=>partitionSize(first)-partitionSize(second));}
      const key=available.shift(),clue={key,value:value(mystery.target,key)};notes.push(clue);candidates=remaining(candidates,[clue]);
    }
    return{steps:notes.length,answerId:candidates.length===1?candidates[0].id:null,notes};
  }
  const evidence=(shape,key)=>components[key].length===1?`${shape.name}的${labels[key]}是 ${value(shape,key)}`:`${shape.name}的${labels[key]}＝${components[key].map(component=>shape[component]).join('＋')}＝${value(shape,key)}`;
  const geometry=shape=>{
    const bottom=Array.from({length:shape.sides},(_,index)=>{const angle=index*Math.PI*2/shape.sides+.24;return[Math.cos(angle)*.86,-.67,Math.sin(angle)*.86];});
    const vertices=shape.kind==='prism'?[...bottom,...bottom.map(point=>[point[0],.67,point[2]])]:[...bottom,[0,.98,0]];
    const edges=[],faces=[];
    for(let index=0;index<shape.sides;index++){const next=(index+1)%shape.sides;edges.push([index,next]);if(shape.kind==='prism'){edges.push([index+shape.sides,next+shape.sides],[index,index+shape.sides]);faces.push({indices:[index,next,next+shape.sides,index+shape.sides],base:false});}else{edges.push([index,shape.sides]);faces.push({indices:[index,next,shape.sides],base:false});}}
    faces.push({indices:bottom.map((_,index)=>index),base:true});if(shape.kind==='prism')faces.push({indices:bottom.map((_,index)=>index+shape.sides),base:true});return{vertices,edges,faces};
  };
  const raceClues=mystery=>mystery.kind!=='reverse'?[]:mystery.clues.slice(0,mystery.level==='normal'&&mystery.stage>=2?2:1);
  const scoreAnswer=(correct,elapsedMs,limitMs=60000)=>!correct||elapsedMs<0||elapsedMs>=limitMs?0:Math.max(200,Math.round(1000-800*elapsedMs/limitMs));
  const createOpponent=(mystery,random=Math.random)=>{
    const accuracy={easy:.82,normal:.76,hard:.66}[mystery.level];
    const range=levels[mystery.level].aiDelay;
    const delayMs=Math.round(range[0]+random()*(range[1]-range[0]));
    const correct=random()<accuracy;
    const wrong=mystery.options.filter(option=>option.id!==mystery.answerId);
    const answerId=correct?mystery.answerId:wrong[Math.floor(random()*wrong.length)].id;
    return{delayMs,answerId};
  };
  const explanationMetrics=mystery=>[...new Set((mystery.kind==='forward'?mystery.fields:raceClues(mystery).map(clue=>clue.key)).flatMap(key=>components[key]))];
  const afterPlayerAnswer=(opponent,elapsedMs,level,random=Math.random)=>{
    const range=levels[level].aiReply,replyMs=Math.round(range[0]+random()*(range[1]-range[0]));
    return{...opponent,delayMs:Math.min(opponent.delayMs,elapsedMs+replyMs)};
  };
  const dot=(a,b)=>a.reduce((sum,value,index)=>sum+value*b[index],0);
  const unit=vector=>{const length=Math.hypot(...vector);return vector.map(value=>value/length);};
  const difference=(a,b)=>a.map((value,index)=>value-b[index]);
  const average=points=>[0,1,2].map(axis=>points.reduce((sum,point)=>sum+point[axis],0)/points.length);
  const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
  const multiplyQuaternion=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
  const viewQuaternion=view=>view.quaternion||multiplyQuaternion([Math.sin(view.tilt/2),0,0,Math.cos(view.tilt/2)],[0,Math.sin(view.yaw/2),0,Math.cos(view.yaw/2)]);
  const rotateQuaternion=(point,q)=>{const t=cross(q.slice(0,3),point).map(value=>value*2),u=cross(q.slice(0,3),t);return point.map((value,index)=>value+q[3]*t[index]+u[index]);};
  const viewDirection=view=>view.quaternion?rotateQuaternion([0,0,1],view.quaternion.map((value,index)=>index<3?-value:value)):[-Math.sin(view.yaw)*Math.cos(view.tilt),Math.sin(view.tilt),Math.cos(view.yaw)*Math.cos(view.tilt)];
  const turnPoint=(point,view)=>{if(view.quaternion)return rotateQuaternion(point,view.quaternion);const x=point[0]*Math.cos(view.yaw)+point[2]*Math.sin(view.yaw),z=point[2]*Math.cos(view.yaw)-point[0]*Math.sin(view.yaw);return[x,point[1]*Math.cos(view.tilt)-z*Math.sin(view.tilt),point[1]*Math.sin(view.tilt)+z*Math.cos(view.tilt)];};
  const quaternionView=quaternion=>{const normalized=unit(quaternion),direction=viewDirection({quaternion:normalized});return{yaw:Math.atan2(-direction[0],direction[2]),tilt:Math.asin(Math.max(-1,Math.min(1,direction[1]))),quaternion:normalized};};
  const ballPoint=(x,y,rect)=>{const radius=Math.max(1,Math.min(rect.width,rect.height)*.48),px=(x-rect.left-rect.width/2)/radius,py=(rect.top+rect.height/2-y)/radius,r2=px*px+py*py;return unit([px,py,r2<=.5?Math.sqrt(1-r2):.5/Math.sqrt(r2)]);};
  const rotationStart=(view,x,y,rect)=>({anchor:ballPoint(x,y,rect),quaternion:viewQuaternion(view),rect});
  function dragRotation(drag,x,y){
    const target=ballPoint(x,y,drag.rect),axis=cross(drag.anchor,target),w=1+dot(drag.anchor,target);
    const change=w<1e-8?unit([...cross(drag.anchor,Math.abs(drag.anchor[0])<.8?[1,0,0]:[0,1,0]),0]):unit([...axis,w]);
    return quaternionView(multiplyQuaternion(change,drag.quaternion));

  const nudgeRotation=(view,x,y)=>quaternionView(multiplyQuaternion(multiplyQuaternion([Math.sin(y/2),0,0,Math.cos(y/2)],[0,Math.sin(x/2),0,Math.cos(x/2)]),viewQuaternion(view)));
  function blendView(from,to,amount){

  async function checkAdmin(password){const hash=await crypto.subtle.digest('SHA-256',encoder.encode(password));return Array.from(new Uint8Array(hash),byte=>byte.toString(16).padStart(2,'0')).join('')===config.adminHash;}

  function statistics(rows){
    const students=new Set(rows.map(row=>`${row.className}|${row.studentName}|${row.seat}`)),wrong=rows.filter(row=>!row.isCorrect),focus=Object.create(null);
    for(const row of rows)for(const concept of row.concepts||[]){const entry=focus[concept.key]||={label:concept.label,total:0,wrong:0};entry.total++;if(concept.correct===false)entry.wrong++;}

  }

})();
</script><script>(() => {
  'use strict';
  const storageKey='geometry-teacher-settings-v1',config=GeometryBackendConfig;
  const panel=document.getElementById('teacher-setup'),form=document.getElementById('teacher-login'),message=document.getElementById('setup-status');
  function validate(value){
    if(value?.root!==config.root||JSON.stringify(value.publicKey)!==JSON.stringify(config.publicKey)||!value.protectedKey?.cipher||!value.protectedKey?.salt||!value.protectedKey?.iv||!Number.isInteger(value.protectedKey.iterations)||value.protectedKey.iterations<100000||!/^[a-f0-9]{64}$/.test(value.adminHash||''))throw Error('教師設定檔不適用於這個遊戲');
    return{root:value.root,publicKey:value.publicKey,protectedKey:value.protectedKey,adminHash:value.adminHash};
  }
  function activate(value){Object.assign(config,validate(value));panel.hidden=true;form.hidden=false;}
  form.hidden=true;
  try{const saved=localStorage.getItem(storageKey);if(saved)activate(JSON.parse(saved));}catch{localStorage.removeItem(storageKey);}
  document.getElementById('teacher-settings').addEventListener('change',async event=>{
    const file=event.target.files[0];if(!file)return;
    try{if(file.size>20000)throw Error('設定檔格式不正確');const value=validate(JSON.parse(await file.text()));localStorage.setItem(storageKey,JSON.stringify(value));activate(value);document.getElementById('teacher-password').focus();}
    catch(error){message.textContent=error.message||'無法載入設定檔';event.target.value='';}
  });

</script><script>(() => {
  'use strict';
  const R=GeometryRecords,C=GeometryCloud,$=id=>document.getElementById(id),escape=R.escape;
  let privateKey=null,rows=[],epoch=null,filtered=[],page=0,pending=null,loading=false,loadGeneration=0;
  const pageSize=50;
  const showStatus=(text,error=false)=>{$('teacher-status').textContent=text;$('teacher-status').classList.toggle('error',error);};
  function applyFilters(){
    const start=$('filter-start').value,end=$('filter-end').value;
    if(start&&end&&start>end){showStatus('開始日期不可晚於結束日期',true);return;}
    if($('teacher-status').classList.contains('error'))showStatus('');
    filtered=R.filter(rows,{className:$('filter-class').value,studentName:$('filter-name').value,start,end,wrongOnly:$('filter-wrong').checked});page=0;render();
  }
  function render(){
    const stats=R.statistics(filtered);$('stat-students').textContent=stats.students;$('stat-attempts').textContent=stats.total;$('stat-accuracy').textContent=`${stats.accuracy}%`;$('stat-wrong').textContent=stats.wrong;
    $('concept-focus').innerHTML=stats.focus.filter(item=>item.wrong).map(item=>`<div class="focus-item"><strong>${escape(item.label)}</strong><span>答錯 ${item.wrong}／作答 ${item.total}</span></div>`).join('')||'<p class="muted">目前篩選範圍沒有錯題。</p>';

    $('record-table').innerHTML=shown.map(row=>`<tr class="${row.isCorrect?'good':'wrong'}"><td>${escape(new Date(row.timestamp).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}))}</td><td>${escape(row.className)}</td><td>${escape(row.seat)}</td><td>${escape(row.studentName)}</td><td class="question-cell">${escape(row.questionText)}<small>${escape(row.shape?.name)} · ${escape({easy:'簡單',normal:'普通',hard:'困難'}[row.level])} · ${row.mode==='online'?'雙人':'單人'}</small></td><td>${escape(row.studentAnswer)}</td><td>${escape(row.correctAnswer)}</td><td>${row.isCorrect?'答對':'答錯'}<small>${(row.elapsedMs/1000).toFixed(1)} 秒 · ${row.score} 分</small></td><td class="reason-cell">${escape(row.errorReason)}</td><td><button class="small-danger" data-delete="${escape(row.id)}">刪除</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty">沒有符合條件的作答紀錄。</td></tr>';
    $('record-count').textContent=`符合 ${filtered.length} 筆／全部 ${rows.length} 筆`;
    $('page-info').textContent=`${page+1} / ${Math.max(1,Math.ceil(filtered.length/pageSize))}`;$('previous-page').disabled=page===0;$('next-page').disabled=(page+1)*pageSize>=filtered.length;
  }
  async function load(){
    if(!privateKey||loading)return;loading=true;const generation=++loadGeneration,key=privateKey;$('refresh-records').disabled=true;showStatus('讀取紀錄中…');
    try{
      const data=await C.listRecords();epoch=data.epoch;const entries=Object.entries(data.records),decoded=[];let failed=0;
      for(let index=0;index<entries.length;index+=16){if(generation!==loadGeneration)return;await Promise.all(entries.slice(index,index+16).map(async([id,envelope])=>{try{const row=await R.decrypt(envelope,key);decoded.push({...row,id});}catch{failed++;}}));}
      if(generation!==loadGeneration||!privateKey)return;
      rows=decoded.sort((a,b)=>b.timestamp-a.timestamp);const selected=$('filter-class').value;
      $('filter-class').innerHTML='<option value="">全部班級</option>'+[...new Set(rows.map(row=>row.className))].sort((a,b)=>a.localeCompare(b,'zh-TW',{numeric:true})).map(value=>`<option value="${escape(value)}">${escape(value)}</option>`).join('');$('filter-class').value=selected;
      applyFilters();showStatus(failed?`已讀取 ${rows.length} 筆；有 ${failed} 筆紀錄無法解讀`:`已更新 · ${new Date().toLocaleTimeString('zh-TW',{hour12:false})}`,failed>0);
    }catch(error){if(generation===loadGeneration)showStatus(error.message||'讀取失敗，請確認網路',true);}finally{if(generation===loadGeneration){loading=false;$('refresh-records').disabled=false;}}
  }
  $('teacher-login').addEventListener('submit',async event=>{
    event.preventDefault();const button=$('login-submit');button.disabled=true;$('login-error').textContent='';
    try{privateKey=await R.unlock($('teacher-password').value);$('teacher-password').value='';$('login-panel').hidden=true;$('dashboard').hidden=false;await load();}
    catch{$('login-error').textContent='密碼錯誤';$('teacher-password').value='';$('teacher-password').focus();}finally{button.disabled=false;}
  });
  function requestAdmin(action){pending=action;$('admin-password').value='';$('admin-error').textContent='';$('admin-title').textContent=action.kind==='clear'?'清除本遊戲所有作答紀錄':action.kind==='delete'?'刪除這筆作答紀錄':'匯出目前篩選的作答紀錄';$('admin-overlay').hidden=false;$('admin-password').focus();}
  const closeAdmin=()=>{pending=null;$('admin-overlay').hidden=true;$('admin-password').value='';};
  $('admin-form').addEventListener('submit',async event=>{
    event.preventDefault();if(!pending)return;const action=pending;$('admin-confirm').disabled=true;

      if(!await R.checkAdmin($('admin-password').value)){$('admin-error').textContent='密碼錯誤';$('admin-password').value='';return;}

      else if(action.kind==='delete'){await C.deleteRecord(epoch,action.id);rows=rows.filter(row=>row.id!==action.id);applyFilters();closeAdmin();}

    }catch(error){$('admin-error').textContent=error.message||'操作失敗，請重試';showStatus(error.message||'操作失敗',true);}finally{$('admin-confirm').disabled=false;}
  });
  async function exportExcel(){
    const values=filtered.map(row=>({'作答時間':new Date(row.timestamp).toLocaleString('zh-TW',{timeZone:'Asia/Taipei',hour12:false}),'班級':row.className,'座號':row.seat,'姓名':row.studentName,'難度':{easy:'簡單',normal:'普通',hard:'困難'}[row.level],'模式':row.mode==='online'?'雙人':'單人','題目':row.questionText,'學生作答':row.studentAnswer,'正解':row.correctAnswer,'結果':row.isCorrect?'答對':'答錯','作答秒數':+(row.elapsedMs/1000).toFixed(1),'分數':row.score,'錯誤分析':row.errorReason}));

      if(!globalThis.XLSX)await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';script.onload=resolve;script.onerror=reject;document.head.append(script);});
      const workbook=XLSX.utils.book_new(),sheet=XLSX.utils.json_to_sheet(values);sheet['!cols']=[{wch:22},{wch:10},{wch:7},{wch:12},{wch:8},{wch:8},{wch:60},{wch:22},{wch:22},{wch:8},{wch:10},{wch:8},{wch:60}];XLSX.utils.book_append_sheet(workbook,sheet,'作答紀錄');XLSX.writeFile(workbook,`錐柱體小偵探_${$('filter-class').value||'全部班級'}_${R.dateKey(Date.now())}_作答成果.xlsx`);showStatus('已匯出目前篩選的紀錄');
    }catch{
      const safe=value=>{const text=String(value??'');return '"'+(/^\s*[=+@-]/.test(text)?"'":'')+text.replaceAll('"','""')+'"';},columns=Object.keys(values[0]||{'作答時間':'','班級':'','姓名':''}),csv='\uFEFF'+[columns,...values.map(row=>columns.map(key=>row[key]))].map(row=>row.map(safe).join(',')).join('\r\n');
      const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),link=document.createElement('a');link.href=url;link.download='錐柱體小偵探_作答成果.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);showStatus('Excel 元件暫時無法載入，已改用可由 Excel 開啟的 CSV');
    }
  }
  for(const id of ['filter-class','filter-name','filter-start','filter-end','filter-wrong'])$(id).addEventListener(id==='filter-name'?'input':'change',applyFilters);
  $('reset-filters').addEventListener('click',()=>{for(const id of ['filter-class','filter-name','filter-start','filter-end'])$(id).value='';$('filter-wrong').checked=false;applyFilters();});
  $('refresh-records').addEventListener('click',load);$('export-records').addEventListener('click',()=>requestAdmin({kind:'export'}));$('clear-records').addEventListener('click',()=>requestAdmin({kind:'clear'}));$('admin-cancel').addEventListener('click',closeAdmin);
  $('record-table').addEventListener('click',event=>{const button=event.target.closest('[data-delete]');if(button)requestAdmin({kind:'delete',id:button.dataset.delete});});
  $('previous-page').addEventListener('click',()=>{if(page>0){page--;render();}});$('next-page').addEventListener('click',()=>{if((page+1)*pageSize<filtered.length){page++;render();}});
  $('teacher-logout').addEventListener('click',()=>{privateKey=null;loadGeneration++;loading=false;rows=[];filtered=[];$('record-table').innerHTML='';$('concept-focus').innerHTML='';$('filter-class').innerHTML='<option value="">全部班級</option>';$('record-count').textContent='尚未讀取';for(const id of ['stat-students','stat-attempts','stat-wrong'])$(id).textContent='0';$('stat-accuracy').textContent='0%';showStatus('');$('dashboard').hidden=true;$('login-panel').hidden=false;$('teacher-password').focus();});
})();
