<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紅旗老師的AI教學天地 🎈</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
    background: linear-gradient(180deg, #aee9ff 0%, #d8f5ff 35%, #fff7e6 100%);
    min-height: 100vh; color: #4a3b2a;
  }
  .cloud { position: fixed; font-size: 44px; opacity: .85; animation: drift linear infinite; z-index: 0; pointer-events: none; }
  @keyframes drift { from { transform: translateX(-15vw); } to { transform: translateX(115vw); } }
  #app { position: relative; z-index: 1; width: min(720px, 100%); margin: 0 auto; padding: 18px 14px 40px; }
  header { text-align: center; margin: 10px 0 18px; }
  .mascots { font-size: 40px; animation: bounce 1.6s infinite ease-in-out; }
  @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  h1 {
    margin: 6px 0 4px; font-size: clamp(30px, 7vw, 46px); font-weight: 900; letter-spacing: 2px;
    background: linear-gradient(90deg, #ff5e78, #ff9f1c, #2ec4b6, #5e60ce, #ff5e78);
    background-size: 300% auto; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: rainbow 6s linear infinite;
  }
  @keyframes rainbow { to { background-position: 300% center; } }
  .subtitle { font-size: 17px; font-weight: 700; color: #7a6a55; }
  .card {
    background: #fff; border: 4px solid #4a3b2a; border-radius: 26px;
    box-shadow: 0 8px 0 rgba(74,59,42,.9); padding: 20px; margin: 16px 0;
  }
  .card h2 { margin: 0 0 8px; font-size: 22px; }
  .qr-wrap { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; justify-content: center; text-align: center; }
  .qr-wrap img {
    width: 170px; height: 170px; border-radius: 18px; border: 4px dashed #ff5e78; padding: 6px; background: #fff;
  }
  .qr-text { font-size: 18px; font-weight: 900; line-height: 1.8; }
  .qr-text small { font-size: 14px; color: #7a6a55; }
  .game-card { display: flex; gap: 14px; align-items: center; transition: transform .15s; text-decoration: none; color: inherit; }
  .game-card:hover { transform: translateY(-4px) rotate(-.5deg); }
  .game-emoji { font-size: 64px; line-height: 1; animation: wiggle 2s infinite ease-in-out; flex-shrink: 0; }
  @keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
  .badge {
    display: inline-block; font-size: 13px; font-weight: 900; color: #fff;
    background: #5e60ce; border-radius: 20px; padding: 3px 12px; margin-bottom: 6px;
  }
  .game-card h3 { margin: 0 0 4px; font-size: 22px; }
  .game-card p { margin: 0 0 10px; font-size: 15px; color: #7a6a55; }
  .play-btn {
    display: inline-block; font-size: 19px; font-weight: 900; color: #fff; text-decoration: none;
    background: linear-gradient(180deg, #ff8fa3, #ff5e78); border-radius: 16px; padding: 10px 26px;
    box-shadow: 0 5px 0 #b23a4e;
  }
  .play-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #b23a4e; }
  .coming {
    border-style: dashed; background: rgba(255,255,255,.6); text-align: center;
    font-size: 18px; font-weight: 700; color: #a08b6f;
  }
  .coming .big { font-size: 44px; }
  footer { text-align: center; font-size: 14px; color: #a08b6f; margin-top: 20px; }
</style>
</head>
<body>
<span class="cloud" style="top:8%; animation-duration:38s;">☁️</span>
<span class="cloud" style="top:22%; animation-duration:55s; animation-delay:-20s;">☁️</span>
<span class="cloud" style="top:5%; animation-duration:70s; animation-delay:-45s; font-size:30px;">⭐</span>
<span class="cloud" style="top:32%; animation-duration:60s; animation-delay:-35s; font-size:30px;">🎈</span>

<div id="app">
  <header>
    <div class="mascots">🦊 📚 🚀</div>
    <h1>紅旗老師的AI教學天地</h1>
    <div class="subtitle">小朋友最愛的遊戲學習樂園 🎮✨</div>
  </header>

  <div class="card">
    <h2>📱 平板掃描進教室</h2>
    <div class="qr-wrap">
      <img src="qrcode.png" alt="首頁 QR Code">
      <div class="qr-text">拿平板掃我！👆<br><small>直接進入遊戲天地首頁</small></div>
    </div>
  </div>

  <div class="card">
    <h2>🎮 我的遊戲</h2>
    <a class="game-card" href="三角泡泡對戰.html">
      <div class="game-emoji">👾</div>
      <div>
        <span class="badge">數學・五年級</span>
        <h3>三角泡泡對戰 🫧</h3>
        <p>判斷三根邊能不能拼成三角形，發射泡泡困住怪獸！</p>
        <span class="play-btn">開始玩 ▶</span>
      </div>
    </a>
  </div>

  <div class="card coming">
    <div class="big">🎁</div>
    更多好玩的遊戲<br>敬請期待…
  </div>

  <footer>❤️ 紅旗老師用愛製作・上課開心玩、開心學 📝</footer>
</div>
</body>
</html>
