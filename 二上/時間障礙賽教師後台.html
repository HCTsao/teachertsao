<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>森林運動會時間障礙賽・教師後台</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--ink:#183c36;--green:#246b52;--line:#dce5df;--muted:#5a7168}
*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:var(--ink);font:16px/1.6 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1320px;margin:auto;padding:28px}nav,.actions{display:flex;gap:12px;flex-wrap:wrap}a{color:var(--green);font-weight:700}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin:22px 0}h1{font-size:clamp(1.4rem,3vw,2rem);margin:0}p{margin:8px 0}header p,.note{color:var(--muted)}button,input,select{font:inherit}button,.button{border:0;border-radius:9px;padding:9px 14px;background:var(--green);color:white;cursor:pointer;font-weight:700}button:hover{filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c6a844;outline-offset:2px}.secondary{background:#e2ebe6;color:var(--ink)}.danger{background:#b63e40}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.filters,.table-wrap{background:white;border:1px solid var(--line);border-radius:14px}.card{padding:20px}.card span{color:var(--muted)}.card strong{display:block;font-size:1.8rem;margin-top:10px;overflow-wrap:anywhere}.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:end;padding:20px;margin-top:20px}label{display:flex;flex-direction:column;gap:6px;flex:1 1 210px;font-size:.9rem;font-weight:700}input,select{min-width:0;width:100%;padding:9px;border:1px solid #bdcfc4;border-radius:7px;background:white;color:var(--ink)}.check{flex:1 1 210px;flex-direction:row;align-items:center;padding:10px 0}.check input{width:auto}.note{font-size:.88rem;margin:14px 0}.table-wrap{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:1100px;text-align:left}th,td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere;max-width:260px}th{background:#e9f0eb;white-space:nowrap;font-size:.9rem}tbody tr{background:#fffafa}tbody tr:nth-child(even){background:#fff0f0}td button{padding:5px 10px;font-size:.85rem}.status{padding:30px;text-align:center;color:var(--muted)}#filter-error{color:#b91c1c}body.locked main{display:none}.badge{border-radius:20px;padding:3px 9px;background:#fbe0df;color:#a22e36;white-space:nowrap}@media(max-width:650px){main{padding:16px}.stats{grid-template-columns:1fr}.card{padding:14px}.card strong{font-size:1.5rem}label{flex-basis:100%}}
</style>
</head>
<body class="locked">
<p id="login-status" class="status">教師後台需要密碼驗證。</p>
<main>
<nav><a href="https://hctsao.github.io/teachertsao/index.html">🏠 回首頁</a><a href="森林運動會時間障礙賽.html">🎮 進入遊戲</a></nav>
<header><div><h1>森林運動會・教師後台</h1><p>時間障礙賽｜學生錯題紀錄與補救教學</p></div><div class="actions"><button id="export-btn">下載篩選結果 Excel</button><button class="danger" id="clear-btn">清空全部錯題</button></div></header>
<section class="stats" aria-label="篩選結果統計"><div class="card"><span>錯題總筆數</span><strong id="stat-errors">0 筆</strong></div><div class="card"><span>錯題學生人數</span><strong id="stat-students">0 人</strong></div><div class="card"><span>最常答錯的時間</span><strong id="stat-common">無</strong></div></section>
<p class="note">統計依目前篩選結果計算。遊戲僅記錄錯題，不計算答對率；人數依班級、座號與姓名合併估算，未填資料的訪客可能合併計算。舊紀錄未含班級者顯示「未填班級」。</p>
<section class="filters" aria-label="錯題篩選">
<label>班級<select id="class-filter"><option value="">全部班級</option></select></label>
<label>姓名<input type="search" id="name-filter" placeholder="輸入姓名關鍵字（含訪客）"></label>
<label>作答日期區間<input type="date" id="date-start" title="起始日期"> ～ <input type="date" id="date-end" title="結束日期"></label>
<label>作答開始時間<input type="datetime-local" id="time-start" step="1"></label>
<label>作答結束時間<input type="datetime-local" id="time-end" step="1"></label>
<label class="check"><input type="checkbox" checked disabled>只看錯題（目前僅記錄錯題）</label>
<button class="secondary" id="reset-btn">清除全部篩選</button>
</section>
<p id="filter-error" role="alert"></p><p class="note" id="result-count" aria-live="polite"></p>
<div class="table-wrap"><div class="status" id="loading">正在連線至資料庫…</div><table id="records-table" hidden><thead><tr><th>作答時間</th><th>班級</th><th>座號</th><th>姓名</th><th>題目時間</th><th>學生作答</th><th>正解</th><th>結果</th><th>管理</th></tr></thead><tbody id="records-body"></tbody></table><div class="status" id="empty" hidden></div></div>
<p class="note">時間依本機時區顯示；日期及起訖時間條件會同時套用。可清除全部篩選以查看歷史紀錄。</p>
</main>
<script>
'use strict';
const firebaseConfig = {
    apiKey: "AIzaSyCfg0RqupJq1ZpUkZVJdVuUODQd2C-hGuw",
    authDomain: "mathgame-eb605.firebaseapp.com",
    databaseURL: "https://mathgame-eb605-default-rtdb.firebaseio.com",
    projectId: "mathgame-eb605",
    storageBucket: "mathgame-eb605.firebasestorage.app",
    messagingSenderId: "128497079299",
    appId: "1:128497079299:web:d88fd651b9ae18cda2aa36"
};
const ACCESS_KEY = 'time-race-teacher-access';
const ACCESS_TTL = 12 * 60 * 60 * 1000;
let accessExpires = 0;
let db = null;
let allRecords = [];
let filteredRecords = [];
const el = id => document.getElementById(id);
function authorize() {
    try { accessExpires = Number(sessionStorage.getItem(ACCESS_KEY)); } catch (_) {}
    if (!(accessExpires > Date.now() && accessExpires <= Date.now() + ACCESS_TTL)) {
        const password = prompt('請輸入教師後台密碼：');
        if (password !== '8888') {
            el('login-status').textContent = password === null ? '已取消登入。重新整理可再次登入。' : '密碼錯誤。重新整理可再次登入。';
            return false;
        }
        accessExpires = Date.now() + ACCESS_TTL;
        try { sessionStorage.setItem(ACCESS_KEY, String(accessExpires)); } catch (_) {}
    }
    try { window.opener = null; } catch (_) {}
    document.body.classList.remove('locked');
    el('login-status').hidden = true;
    return true;
}
function requireAccess() {
    if (Date.now() < accessExpires) return true;
    location.reload();
    return false;
}
function adminAccess(message) {
    if (!requireAccess()) return false;
    const password = prompt(message);
    if (password === null) return false;
    if (password !== '0987912307') { alert('管理密碼錯誤'); return false; }
    return true;
}
function text(value, fallback) { return String(value == null ? '' : value).trim() || fallback; }
function normalizeRecords(data) {
    return Object.entries(data || {}).filter(([, r]) => r && typeof r === 'object').map(([id, r]) => ({
        id, className: text(r.className, '未填班級'), seat: text(r.seat, '無'),
        name: text(r.name || r.studentName, '訪客'), question: text(r.question || r.questionText, '未記錄'),
        correctAnswer: text(r.correctAnswer || r.question, '未記錄'),
        wrongChoice: text(r.wrongChoice || r.studentAnswer, '未記錄'),
        timestamp: typeof r.timestamp === 'number' && Number.isFinite(r.timestamp) ? r.timestamp : null
    })).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
}
function localDate(timestamp) {
    const d = new Date(timestamp);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function selectRecords(records, filters) {
    const from = filters.from ? new Date(filters.from).getTime() : null;
    const to = filters.to ? new Date(filters.to).getTime() : null;
    return records.filter(r =>
        (!filters.className || r.className === filters.className) &&
        (!filters.name || r.name.toLocaleLowerCase().includes(filters.name.toLocaleLowerCase())) &&
        (!filters.dateStart || (r.timestamp !== null && localDate(r.timestamp) >= filters.dateStart)) &&
        (!filters.dateEnd || (r.timestamp !== null && localDate(r.timestamp) <= filters.dateEnd)) &&
        (from === null || (r.timestamp !== null && r.timestamp >= from)) &&
        (to === null || (r.timestamp !== null && r.timestamp <= to))
    );
}
function updateOptions(id, values, label) {
    const select = el(id), previous = select.value;
    select.replaceChildren(new Option(label, ''));
    [...new Set(values)].sort((a,b) => a.localeCompare(b, 'zh-Hant', {numeric:true})).forEach(value => select.add(new Option(value, value)));
    select.value = [...select.options].some(o => o.value === previous) ? previous : '';
}
function updateStats(records) {
    el('stat-errors').textContent = records.length + ' 筆';
    el('stat-students').textContent = new Set(records.map(r => JSON.stringify([r.className,r.seat,r.name]))).size + ' 人';
    const counts = new Map();
    records.forEach(r => counts.set(r.question, (counts.get(r.question)||0)+1));
    const common = [...counts].sort((a,b) => b[1]-a[1])[0];
    el('stat-common').textContent = common ? common[0] + '（' + common[1] + '次）' : '無';
}
function formatTime(timestamp) {
    return timestamp === null ? '未記錄時間' : new Date(timestamp).toLocaleString('zh-TW', {hour12:false});
}
function renderTable() {
    if (!requireAccess()) return;
    const filters = {className:el('class-filter').value, name:el('name-filter').value.trim(), dateStart:el('date-start').value, dateEnd:el('date-end').value,
        from:el('time-start').value, to:el('time-end').value};
    const invalid = filters.from && filters.to && new Date(filters.from) > new Date(filters.to);
    el('filter-error').textContent = invalid ? '開始時間不可晚於結束時間，請調整時間範圍。' : '';
    filteredRecords = invalid ? [] : selectRecords(allRecords, filters);
    updateStats(filteredRecords);
    el('result-count').textContent = '符合篩選 ' + filteredRecords.length + ' 筆／全部 ' + allRecords.length + ' 筆';
    const tbody = el('records-body');
    tbody.replaceChildren();
    filteredRecords.forEach(r => {
        const row = document.createElement('tr');
        [formatTime(r.timestamp),r.className,r.seat,r.name,r.question,r.wrongChoice,r.correctAnswer,'答錯'].forEach(value => {
            const cell = document.createElement('td'); cell.textContent = value; row.appendChild(cell);
        });
        const cell = document.createElement('td'), button = document.createElement('button');
        button.className = 'danger'; button.textContent = '刪除';
        button.addEventListener('click', () => deleteRecord(r.id)); cell.appendChild(button); row.appendChild(cell); tbody.appendChild(row);
    });
    el('empty').textContent = invalid ? '請先修正時間範圍。' : allRecords.length ? '沒有符合條件的錯題，可按「清除全部篩選」查看歷史紀錄。' : '目前尚無學生錯題紀錄。';
    el('empty').hidden = filteredRecords.length > 0;
    el('records-table').hidden = filteredRecords.length === 0;
}
async function deleteRecord(id) {
    if (!db || !adminAccess('請輸入管理者密碼以刪除此筆錯題紀錄：')) return;
    if (!confirm('確定刪除此筆錯題紀錄？')) return;
    try { await db.ref('time_race_errors').child(id).remove(); }
    catch (_) { alert('刪除失敗，請檢查網路或資料庫權限。'); }
}
async function clearLogs() {
    if (!db || !adminAccess('請輸入管理者密碼以清除全部錯題紀錄：')) return;
    if (!confirm('確定清除所有班級的全部錯題紀錄？包含目前篩選範圍以外的資料，刪除後無法復原。')) return;
    try { await db.ref('time_race_errors').remove(); }
    catch (_) { alert('清除失敗，請檢查網路或資料庫權限。'); }
}
function exportExcel() {
    if (!filteredRecords.length) { alert('目前沒有可匯出的紀錄。'); return; }
    if (!adminAccess('請輸入管理者密碼以下載篩選結果：')) return;
    if (typeof XLSX === 'undefined') { alert('Excel 元件載入失敗，請檢查網路後重新整理。'); return; }
    const rows = [['作答時間','班級','座號','姓名','題目','學生作答','正解','結果'],
        ...filteredRecords.map(r => [formatTime(r.timestamp),r.className,r.seat,r.name,r.question,r.wrongChoice,r.correctAnswer,'答錯'])];
    const sheet = XLSX.utils.aoa_to_sheet(rows);
    sheet['!cols'] = [24,16,8,16,18,18,18,10].map(wch => ({wch}));
    const book = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(book,sheet,'錯題紀錄');
    const className = (el('class-filter').value || '全部班級').replace(/[\/:*?"<>|]/g,'_');
    XLSX.writeFile(book, '森林運動會時間障礙賽_' + className + '_' + ((el('date-start').value || '') + (el('date-end').value ? '_' + el('date-end').value : '') || '全部日期') + '_作答成果.xlsx');
}
function initialize() {
    if (!authorize()) return;
    ['class-filter','date-start','date-end','time-start','time-end'].forEach(id => el(id).addEventListener('change',renderTable));
    el('name-filter').addEventListener('input',renderTable);
    el('export-btn').addEventListener('click',exportExcel);
    el('clear-btn').addEventListener('click',clearLogs);
    el('reset-btn').addEventListener('click', () => {
        ['class-filter','date-start','date-end','time-start','time-end','name-filter'].forEach(id => { el(id).value = ''; }); renderTable();
    });
    try {
        firebase.initializeApp(firebaseConfig); db = firebase.database();
        db.ref('time_race_errors').on('value', snapshot => {
            if (!requireAccess()) return;
            allRecords = normalizeRecords(snapshot.val());
            el('loading').hidden = true;
            updateOptions('class-filter',allRecords.map(r => r.className),'全部班級');
            renderTable();
        }, () => {
            el('loading').hidden = false;
            el('loading').textContent = '讀取失敗，請檢查網路或 Firebase 資料庫讀取權限後重新整理。';
        });
        setTimeout(() => location.reload(), Math.max(0, accessExpires - Date.now()));
    } catch (_) { el('loading').textContent = '資料庫連線失敗，請檢查網路後重新整理。'; }
}
initialize();
</script>
</body>
</html>
