<style>
:root{--ink:#183c36;--green:#246b52;--line:#dce5df;--muted:#5a7168}
*{box-sizing:border-box}body{margin:0;background:#f3f6f2;color:var(--ink);font:16px/1.6 system-ui,"Microsoft JhengHei",sans-serif}main{max-width:1380px;margin:auto;padding:28px}nav,.actions{display:flex;gap:12px;flex-wrap:wrap}a{color:var(--green);font-weight:700}header{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin:22px 0}h1{font-size:clamp(1.4rem,3vw,2rem);margin:0}p{margin:8px 0}header p,.note{color:var(--muted)}button,input,select{font:inherit}button,.button{border:0;border-radius:9px;padding:9px 14px;background:var(--green);color:white;cursor:pointer;font-weight:700}button:hover{filter:brightness(.92)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #c6a844;outline-offset:2px}.secondary{background:#e2ebe6;color:var(--ink)}.danger{background:#b63e40}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card,.filters,.table-wrap{background:white;border:1px solid var(--line);border-radius:14px}.card{padding:20px}.card span{color:var(--muted)}.card strong{display:block;font-size:1.8rem;margin-top:10px;overflow-wrap:anywhere}.filters{display:flex;gap:16px;flex-wrap:wrap;align-items:end;padding:20px;margin-top:20px}label{display:flex;flex-direction:column;gap:6px;flex:1 1 180px;font-size:.9rem;font-weight:700}input,select{min-width:0;width:100%;padding:9px;border:1px solid #bdcfc4;border-radius:7px;background:white;color:var(--ink)}.check{flex:1 1 200px;flex-direction:row;align-items:center;gap:8px;padding:10px 0;cursor:pointer}.check input{width:auto;cursor:pointer;transform:scale(1.2)}.note{font-size:.88rem;margin:14px 0}.table-wrap{overflow:auto;margin-top:12px}table{border-collapse:collapse;width:100%;min-width:1150px;text-align:left}th,td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle;overflow-wrap:anywhere}th{background:#e9f0eb;white-space:nowrap;font-size:.9rem}tbody tr{background:#fff}tbody tr.is-wrong{background:#fffafa}tbody tr.is-wrong:nth-child(even){background:#fff0f0}tbody tr.is-correct{background:#f8fcf9}tbody tr.is-correct:nth-child(even){background:#f0f9f3}td button{padding:5px 10px;font-size:.85rem}.status{padding:30px;text-align:center;color:var(--muted)}#filter-error{color:#b91c1c}body.locked main{display:none}.badge{border-radius:20px;padding:4px 10px;font-weight:bold;font-size:0.85rem;display:inline-block;white-space:nowrap}.badge.wrong{background:#fbe0df;color:#a22e36}.badge.correct{background:#dcfce7;color:#166534}.clock-thumb{display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform 0.15s}.clock-thumb:hover{transform:scale(1.1)}
.login-card{max-width:380px;margin:12vh auto 0;background:white;border:1px solid var(--line);border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,0.06);text-align:center}
.login-card h2{margin:0 0 8px 0;font-size:1.5rem;color:var(--ink)}
.login-card p{margin:0 0 20px 0;color:var(--muted);font-size:0.9rem}
.login-form{display:flex;flex-direction:column;gap:16px}
.login-form input[type="password"]{font-size:1.1rem;letter-spacing:3px;text-align:center;padding:11px;border-radius:10px}
.error-msg{color:#dc2626;font-size:0.88rem;margin:4px 0 0;min-height:20px}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(3px);display:none;justify-content:center;align-items:center;z-index:9999}
.modal-box{background:#fff;border-radius:18px;padding:26px;max-width:380px;width:90%;box-shadow:0 12px 32px rgba(0,0,0,0.25);text-align:center}

.modal-box input[type="password"]{font-size:1.1rem;letter-spacing:3px;text-align:center;padding:10px;border-radius:8px;margin-bottom:8px}
.modal-actions{display:flex;gap:10px;justify-content:center;margin-top:14px}
.modal-actions button{flex:1}#clock-preview-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);display:none;justify-content:center;align-items:center;z-index:9999}#clock-preview-card{background:#fff;border-radius:20px;padding:24px;text-align:center;box-shadow:0 12px 36px rgba(0,0,0,0.3);max-width:340px;width:90%}@media(max-width:768px){main{padding:16px}.stats{grid-template-columns:1fr 1fr}.card{padding:14px}.card strong{font-size:1.5rem}label{flex-basis:100%}}
</style>

<body class="locked">
<section class="login-card" id="login-panel">
    <h2>教師管理後台</h2>
    <p>請輸入密碼以解鎖後台管理系統</p>
    <form class="login-form" id="login-form" onsubmit="handleLogin(event)">

        <p id="login-error" class="error-msg"></p>
    </form>
    <div style="margin-top:16px;">
        <a href="森林運動會時間障礙賽.html" style="font-size:0.9rem; text-decoration:none;">🎮 回到遊戲</a>
    </div>
</section>
<main id="main-content" style="display:none;">
<nav><a href="森林運動會時間障礙賽.html">🎮 回到遊戲</a></nav>
<header><div><h1>森林運動會・教師後台</h1><p>時間障礙賽｜學生作答成果與錯題補救分析</p></div><div class="actions"><button id="export-btn">下載篩選結果 Excel</button><button class="danger" id="clear-btn">清空所有作答紀錄</button></div></header>
<section class="stats" aria-label="篩選結果統計">
<div class="card"><span>作答總筆數</span><strong id="stat-errors">0 筆</strong></div>
<div class="card"><span>答題正確率</span><strong id="stat-accuracy">0%</strong></div>
<div class="card"><span>參與學生人數</span><strong id="stat-students">0 人</strong></div>
<div class="card"><span>最常答錯的時間</span><strong id="stat-common">無</strong></div>
</section>
<p class="note">統計依目前篩選結果即時計算。點擊表格中的時鐘圖片可放大檢視鐘面細節。</p>
<section class="filters" aria-label="錯題篩選">
<label>班級<select id="class-filter"><option value="">全部班級</option></select></label>
<label>姓名<input type="search" id="name-filter" placeholder="輸入姓名關鍵字（含訪客）"></label>
<label>作答日期區間<input type="date" id="date-start" title="起始日期"> ～ <input type="date" id="date-end" title="結束日期"></label>
<label>作答開始時間<input type="datetime-local" id="time-start" step="1"></label>
<label>作答結束時間<input type="datetime-local" id="time-end" step="1"></label>
<label class="check"><input type="checkbox" id="only-errors-check">只看錯題</label>
<button class="secondary" id="reset-btn">清除全部篩選</button>
</section>
<p id="filter-error" role="alert"></p><p class="note" id="result-count" aria-live="polite"></p>
<div class="table-wrap"><div class="status" id="loading">正在連線至資料庫…</div><table id="records-table" hidden><thead><tr><th>作答時間</th><th>班級</th><th>座號</th><th>姓名</th><th style="text-align:center;">題目圖片</th><th>題目時間</th><th>學生作答</th><th>正解</th><th>結果</th><th>管理</th></tr></thead><tbody id="records-body"></tbody></table><div class="status" id="empty" hidden></div></div>
<p class="note">時間依本機時區顯示；日期及起訖時間條件會同時套用。可清除全部篩選以查看歷史紀錄。</p>
</main>

<!-- 管理者驗證彈窗 (黑點遮蔽、無密碼提示) -->
<div id="admin-modal" class="modal-overlay">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3 id="admin-modal-title">管理者驗證</h3>
        <p id="admin-modal-desc">請輸入管理密碼以確認操作</p>

            <input type="password" id="admin-modal-pwd" autocomplete="off" required>

            <div class="modal-actions">
                <button type="button" class="secondary" onclick="closeAdminModal()">取消</button>
                <button type="submit" class="danger" id="admin-modal-submit-btn">確認執行</button>
            </div>
        </form>
    </div>
</div>

<!-- 時鐘放大預覽彈窗 -->
<div id="clock-preview-modal" onclick="closeClockModal(event)">
    <div id="clock-preview-card" onclick="event.stopPropagation()">
        <h3 id="clock-preview-title" style="margin:0 0 14px 0; color:var(--ink);">題目鐘面</h3>

</div>

<script>
'use strict';
const firebaseConfig = {
    apiKey: "AIzaSyCfg0RqupJq1ZpUkZVJdVuUODQd2C-hGuw",
    authDomain: "mathgame-eb605.firebaseapp.com",
    databaseURL: "https://mathgame-eb605-default-rtdb.firebaseio.com",
    projectId: "mathgame-eb605",
    storageBucket: "mathgame-eb605.firebasestorage.app",
    messagingSenderId: "128497079299",
    appId: "1:128497079299:web:d88fd651b9ae18cda2aa36"
};
const ACCESS_KEY = 'time-race-teacher-access';
const ACCESS_TTL = 12 * 60 * 60 * 1000;
let accessExpires = 0;
let db = null;
let allRecords = [];
let filteredRecords = [];
const el = id => document.getElementById(id);

function checkSessionAuth() {
    try {
        accessExpires = Number(sessionStorage.getItem(ACCESS_KEY));
        if (accessExpires > Date.now() && accessExpires <= Date.now() + ACCESS_TTL) {
            unlockDashboard();
            return true;
        }
    } catch (_) {}
    document.body.classList.add('locked');
    el('login-panel').style.display = 'block';
    el('main-content').style.display = 'none';
    setTimeout(() => { const p = el('login-pwd'); if (p) p.focus(); }, 100);
    return false;
}

function unlockDashboard() {
    document.body.classList.remove('locked');
    el('login-panel').style.display = 'none';
    el('main-content').style.display = 'block';
    startApp();
}

function handleLogin(e) {
    e.preventDefault();
    const pwdInput = el('login-pwd');
    const errEl = el('login-error');
    if (pwdInput.value === '8888') {
        accessExpires = Date.now() + ACCESS_TTL;
        try { sessionStorage.setItem(ACCESS_KEY, String(accessExpires)); } catch (_) {}
        pwdInput.value = '';
        errEl.textContent = '';
        unlockDashboard();
    } else {
        errEl.textContent = '密碼錯誤，請重新輸入';
        pwdInput.value = '';
        pwdInput.focus();
    }
}

function requireAccess() {
    if (Date.now() < accessExpires) return true;
    location.reload();
    return false;
}

let pendingAdminAction = null;
function requestAdminConfirm(actionInfo) {
    if (!requireAccess()) return;
    pendingAdminAction = actionInfo;
    el('admin-modal-title').textContent = actionInfo.title || '管理者驗證';
    el('admin-modal-desc').textContent = actionInfo.desc || '請輸入管理密碼以確認操作';
    el('admin-modal-pwd').value = '';
    el('admin-modal-error').textContent = '';
    el('admin-modal-submit-btn').className = actionInfo.btnClass || 'danger';
    el('admin-modal-submit-btn').textContent = actionInfo.btnText || '確認執行';
    el('admin-modal').style.display = 'flex';
    setTimeout(() => el('admin-modal-pwd').focus(), 100);
}

function closeAdminModal() {
    pendingAdminAction = null;
    el('admin-modal').style.display = 'none';
    el('admin-modal-pwd').value = '';
}

function handleAdminSubmit(e) {
    e.preventDefault();
    if (!pendingAdminAction) return;
    const pwd = el('admin-modal-pwd').value;
    if (pwd !== '0987912307') {
        el('admin-modal-error').textContent = '密碼錯誤，請重新輸入';
        el('admin-modal-pwd').value = '';
        el('admin-modal-pwd').focus();
        return;
    }
    const action = pendingAdminAction;
    closeAdminModal();
    if (action.callback) action.callback();
}
function text(value, fallback) { return String(value == null ? '' : value).trim() || fallback; }

// 解析 "8時45分" 字串為 { h: 8, m: 45 }
function parseTime(q) {
    if (!q) return null;
    const match = String(q).match(/(\d+)\s*時\s*(\d+)\s*分/);
    if (!match) return null;
    return { h: parseInt(match[1], 10), m: parseInt(match[2], 10) };
}

// 產生鐘面向量圖 (SVG)
function createClockSvg(h, m, size) {
    const cx = 100, cy = 100, r = 88;
    let ticks = '';
    for (let i = 0; i < 60; i++) {
        if (i % 5 === 0) continue;
        const a = i * 6 * Math.PI / 180;
        const x1 = cx + (r - 6) * Math.sin(a), y1 = cy - (r - 6) * Math.cos(a);
        const x2 = cx + (r - 12) * Math.sin(a), y2 = cy - (r - 12) * Math.cos(a);
        ticks += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#c0c0c0" stroke-width="1.5"/>';
    }
    let majors = '';
    for (let i = 1; i <= 12; i++) {
        const a = i * 30 * Math.PI / 180;
        const x1 = cx + (r - 6) * Math.sin(a), y1 = cy - (r - 6) * Math.cos(a);
        const x2 = cx + (r - 18) * Math.sin(a), y2 = cy - (r - 18) * Math.cos(a);
        majors += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#1d3557" stroke-width="2.5"/>';
        const tx = cx + (r - 24) * Math.sin(a);
        const ty = cy - (r - 24) * Math.cos(a);
        majors += '<text x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" font-family="Fredoka One, Noto Sans TC, sans-serif" font-size="20" font-weight="900" text-anchor="middle" dominant-baseline="central" fill="#1d3557">' + i + '</text>';
    }
    const minA = m * 6;
    const hourA = (h % 12) * 30 + m * 0.5;
    const hRad = hourA * Math.PI / 180;
    const mRad = minA * Math.PI / 180;
    const hx2 = cx + (r - 42) * Math.sin(hRad);
    const hy2 = cy - (r - 42) * Math.cos(hRad);
    const mx2 = cx + (r - 18) * Math.sin(mRad);
    const my2 = cy - (r - 18) * Math.cos(mRad);
    return '<svg width="' + size + '" height="' + size + '" viewBox="0 0 200 200" style="vertical-align:middle;filter:drop-shadow(0 2px 5px rgba(0,0,0,0.15));background:#fff9f0;border-radius:50%;">' +
        '<circle cx="100" cy="100" r="88" fill="#fff9f0" stroke="#2d3e46" stroke-width="5"/>' +
        ticks + majors +
        '<line x1="100" y1="100" x2="' + hx2.toFixed(1) + '" y2="' + hy2.toFixed(1) + '" stroke="#e63946" stroke-width="7" stroke-linecap="round"/>' +
        '<line x1="100" y1="100" x2="' + mx2.toFixed(1) + '" y2="' + my2.toFixed(1) + '" stroke="#1d3557" stroke-width="4.5" stroke-linecap="round"/>' +
        '<circle cx="100" cy="100" r="5" fill="#ffd166" stroke="#1d3557" stroke-width="2"/>' +
        '</svg>';
}

function openClockModal(timeText) {
    const t = parseTime(timeText);
    if (!t) return;
    el('clock-preview-title').textContent = '題目鐘面：' + timeText;
    el('clock-preview-svg').innerHTML = createClockSvg(t.h, t.m, 220);
    el('clock-preview-modal').style.display = 'flex';
}
function closeClockModal() {
    el('clock-preview-modal').style.display = 'none';
}

function normalizeRecords(data) {
    return Object.entries(data || {}).filter(([, r]) => r && typeof r === 'object').map(([id, r]) => {
        const question = text(r.question || r.questionText, '未記錄');
        const correctAnswer = text(r.correctAnswer || r.question, '未記錄');
        const studentAns = text(r.studentAnswer || r.wrongChoice, '未記錄');
        // 判定是否答對（相容舊版無 isCorrect 欄位的純錯題）
        const isCorrect = r.isCorrect === true || (r.isCorrect !== false && studentAns === correctAnswer && studentAns !== '未記錄');
        return {
            id, className: text(r.className, '未填班級'), seat: text(r.seat, '無'),
            name: text(r.name || r.studentName, '訪客'), question,
            correctAnswer,
            wrongChoice: studentAns,
            isCorrect,
            timestamp: typeof r.timestamp === 'number' && Number.isFinite(r.timestamp) ? r.timestamp : null
        };
    }).sort((a,b) => (b.timestamp || 0) - (a.timestamp || 0));
}

function localDate(timestamp) {
    const d = new Date(timestamp);
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function selectRecords(records, filters) {
    const from = filters.from ? new Date(filters.from).getTime() : null;
    const to = filters.to ? new Date(filters.to).getTime() : null;
    return records.filter(r =>
        (!filters.className || r.className === filters.className) &&
        (!filters.name || r.name.toLocaleLowerCase().includes(filters.name.toLocaleLowerCase())) &&
        (!filters.dateStart || (r.timestamp !== null && localDate(r.timestamp) >= filters.dateStart)) &&
        (!filters.dateEnd || (r.timestamp !== null && localDate(r.timestamp) <= filters.dateEnd)) &&
        (!filters.onlyErrors || !r.isCorrect) &&
        (from === null || (r.timestamp !== null && r.timestamp >= from)) &&
        (to === null || (r.timestamp !== null && r.timestamp <= to))
    );
}

function updateOptions(id, values, label) {
    const select = el(id), previous = select.value;
    select.replaceChildren(new Option(label, ''));
    [...new Set(values)].sort((a,b) => a.localeCompare(b, 'zh-Hant', {numeric:true})).forEach(value => select.add(new Option(value, value)));
    select.value = [...select.options].some(o => o.value === previous) ? previous : '';
}

function updateStats(records) {
    el('stat-errors').textContent = records.length + ' 筆';
    const correctCount = records.filter(r => r.isCorrect).length;
    const accuracy = records.length ? Math.round((correctCount / records.length) * 100) : 0;
    el('stat-accuracy').textContent = accuracy + '% (' + correctCount + '對 / ' + (records.length - correctCount) + '錯)';
    el('stat-students').textContent = new Set(records.map(r => JSON.stringify([r.className,r.seat,r.name]))).size + ' 人';
    
    // 最常答錯的時間（只統計答錯的）
    const wrongRecords = records.filter(r => !r.isCorrect);
    const counts = new Map();
    wrongRecords.forEach(r => counts.set(r.question, (counts.get(r.question)||0)+1));
    const common = [...counts].sort((a,b) => b[1]-a[1])[0];
    el('stat-common').textContent = common ? common[0] + '（' + common[1] + '次）' : '無';
}

function formatTime(timestamp) {
    return timestamp === null ? '未記錄時間' : new Date(timestamp).toLocaleString('zh-TW', {hour12:false});
}

function renderTable() {
    if (!requireAccess()) return;
    const filters = {
        className: el('class-filter').value,
        name: el('name-filter').value.trim(),
        dateStart: el('date-start').value,
        dateEnd: el('date-end').value,
        from: el('time-start').value,
        to: el('time-end').value,
        onlyErrors: el('only-errors-check').checked
    };
    const invalid = filters.from && filters.to && new Date(filters.from) > new Date(filters.to);
    el('filter-error').textContent = invalid ? '開始時間不可晚於結束時間，請調整時間範圍。' : '';
    filteredRecords = invalid ? [] : selectRecords(allRecords, filters);
    updateStats(filteredRecords);
    el('result-count').textContent = '符合篩選 ' + filteredRecords.length + ' 筆／全部 ' + allRecords.length + ' 筆';
    const tbody = el('records-body');
    tbody.replaceChildren();
    filteredRecords.forEach(r => {
        const row = document.createElement('tr');
        row.className = r.isCorrect ? 'is-correct' : 'is-wrong';

        // 1. 作答時間
        let td = document.createElement('td'); td.textContent = formatTime(r.timestamp); row.appendChild(td);
        // 2. 班級
        td = document.createElement('td'); td.textContent = r.className; row.appendChild(td);
        // 3. 座號
        td = document.createElement('td'); td.textContent = r.seat; row.appendChild(td);
        // 4. 姓名
        td = document.createElement('td'); td.textContent = r.name; td.style.fontWeight = 'bold'; row.appendChild(td);

        // 5. 題目圖片 (鐘面 SVG 縮圖，點擊可放大)
        td = document.createElement('td');
        td.style.textAlign = 'center';
        const parsed = parseTime(r.question);
        if (parsed) {
            const wrap = document.createElement('div');
            wrap.className = 'clock-thumb';
            wrap.title = '點擊放大檢視 ' + r.question;
            wrap.innerHTML = createClockSvg(parsed.h, parsed.m, 56);
            wrap.addEventListener('click', () => openClockModal(r.question));
            td.appendChild(wrap);
        } else {
            td.textContent = '—';
        }
        row.appendChild(td);

        // 6. 題目時間
        td = document.createElement('td'); td.textContent = r.question; td.style.fontWeight = 'bold'; row.appendChild(td);
        // 7. 學生作答
        td = document.createElement('td'); td.textContent = r.wrongChoice; row.appendChild(td);
        // 8. 正解
        td = document.createElement('td'); td.textContent = r.correctAnswer; td.style.color = '#15803d'; td.style.fontWeight = 'bold'; row.appendChild(td);

        // 9. 結果徽章
        td = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = 'badge ' + (r.isCorrect ? 'correct' : 'wrong');
        badge.textContent = r.isCorrect ? '✅ 答對' : '❌ 答錯';
        td.appendChild(badge);
        row.appendChild(td);

        // 10. 管理按鈕
        td = document.createElement('td');
        const button = document.createElement('button');
        button.className = 'danger'; button.textContent = '刪除';
        button.addEventListener('click', () => deleteRecord(r.id));
        td.appendChild(button);
        row.appendChild(td);

        tbody.appendChild(row);
    });
    el('empty').textContent = invalid ? '請先修正時間範圍。' : allRecords.length ? '沒有符合條件的紀錄，可按「清除全部篩選」或取消勾選「只看錯題」查看更多資料。' : '目前尚無學生作答紀錄。';
    el('empty').hidden = filteredRecords.length > 0;
    el('records-table').hidden = filteredRecords.length === 0;
}

async function deleteRecord(id) {
    if (!db || !adminAccess('請輸入管理者密碼以刪除此筆作答紀錄：')) return;
    if (!confirm('確定刪除此筆作答紀錄？')) return;
    try { await db.ref('time_race_errors').child(id).remove(); }
    catch (_) { alert('刪除失敗，請檢查網路或資料庫權限。'); }
}
async function clearLogs() {
    if (!db || !adminAccess('請輸入管理者密碼以清除全部作答紀錄：')) return;
    if (!confirm('確定清除所有班級的全部作答紀錄？包含目前篩選範圍以外的資料，刪除後無法復原。')) return;
    try { await db.ref('time_race_errors').remove(); }
    catch (_) { alert('清除失敗，請檢查網路或資料庫權限。'); }
}
function exportExcel() {
    if (!filteredRecords.length) { alert('目前沒有可匯出的紀錄。'); return; }
    if (!adminAccess('請輸入管理者密碼以下載篩選結果：')) return;
    if (typeof XLSX === 'undefined') { alert('Excel 元件載入失敗，請檢查網路後重新整理。'); return; }
    const rows = [['作答時間','班級','座號','姓名','題目','學生作答','正解','結果'],
        ...filteredRecords.map(r => [formatTime(r.timestamp),r.className,r.seat,r.name,r.question,r.wrongChoice,r.correctAnswer, r.isCorrect ? '答對' : '答錯'])];
    const sheet = XLSX.utils.aoa_to_sheet(rows);
    sheet['!cols'] = [24,16,8,16,18,18,18,10].map(wch => ({wch}));
    const book = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(book,sheet,'作答紀錄');
    const className = (el('class-filter').value || '全部班級').replace(/[\/:*?"<>|]/g,'_');
    XLSX.writeFile(book, '森林運動會時間障礙賽_' + className + '_' + ((el('date-start').value || '') + (el('date-end').value ? '_' + el('date-end').value : '') || '全部日期') + '_作答成果.xlsx');
}
let isAppStarted = false;
function startApp() {
    if (isAppStarted) return;
    isAppStarted = true;
    ['class-filter','date-start','date-end','time-start','time-end','only-errors-check'].forEach(id => el(id).addEventListener('change',renderTable));
    el('name-filter').addEventListener('input',renderTable);
    el('export-btn').addEventListener('click',exportExcel);
    el('clear-btn').addEventListener('click',clearLogs);
    el('reset-btn').addEventListener('click', () => {
        ['class-filter','date-start','date-end','time-start','time-end','name-filter'].forEach(id => { el(id).value = ''; });
        el('only-errors-check').checked = false;
        renderTable();
    });
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
        db.ref('time_race_errors').on('value', snapshot => {
            if (!requireAccess()) return;
            allRecords = normalizeRecords(snapshot.val());
            el('loading').hidden = true;
            updateOptions('class-filter',allRecords.map(r => r.className),'全部班級');
            renderTable();
        }, () => {
            el('loading').hidden = false;
            el('loading').textContent = '讀取失敗，請檢查網路或 Firebase 資料庫讀取權限後重新整理。';
        });
        setTimeout(() => location.reload(), Math.max(0, accessExpires - Date.now()));
    } catch (_) { el('loading').textContent = '資料庫連線失敗，請檢查網路後重新整理。'; }
}

checkSessionAuth();
</script>
</body>
</html>
