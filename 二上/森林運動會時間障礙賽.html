    },

    victory() {
        this.state = 'VICTORY';
        this.showScreen('victory-overlay');

        const baseScore = this.score;
        const initialTimeLeft = Math.ceil(this.timeLeft / 1000); // 秒

        // 初始化顯示
        document.getElementById('victory-base-score').textContent = `${baseScore} 分`;
        document.getElementById('victory-time-left').textContent = `${initialTimeLeft} 秒`;
        document.getElementById('victory-total-score').textContent = `${baseScore} 分`;
        document.getElementById('victory-cheer').textContent = '🏁 抵達終點！';

        const playAgainBtn = document.getElementById('play-again-btn');
        const menuBtn = document.getElementById('victory-menu-btn');
        playAgainBtn.disabled = true;
        menuBtn.disabled = true;

        let currentTimeLeft = initialTimeLeft;
        let currentTotalScore = baseScore;

        const duration = 2000; // 動畫總時長
        const steps = Math.min(initialTimeLeft, 40); // 最多40步
        if (steps <= 0) {
            document.getElementById('victory-cheer').textContent = '🎉 挑戰成功！';
            playAgainBtn.disabled = false;
            menuBtn.disabled = false;
            return;
        }

        const stepTime = duration / steps;
        const timePerStep = Math.ceil(initialTimeLeft / steps);
        const scorePerStep = timePerStep * 10; // 每秒 10 分

        let currentStep = 0;

        const interval = setInterval(() => {
            currentStep++;
            currentTimeLeft = Math.max(0, currentTimeLeft - timePerStep);
            currentTotalScore += scorePerStep;

            // 播放計分滴答聲
            playSound('tick');

            // 更新顯示
            document.getElementById('victory-time-left').textContent = `${currentTimeLeft} 秒`;
            document.getElementById('victory-total-score').textContent = `${currentTotalScore} 分`;

            if (currentStep >= steps || currentTimeLeft <= 0) {
                clearInterval(interval);

                // 確保最後結果絕對精準
                document.getElementById('victory-time-left').textContent = '0 秒';
                const finalTotalScore = baseScore + initialTimeLeft * 10;
                document.getElementById('victory-total-score').textContent = `${finalTotalScore} 分`;

                // 播放勝利結尾慶祝音
                playSound('victory');
                document.getElementById('victory-cheer').textContent = '🏆 榮譽完成！太棒了！';

                // 上傳分數至排行榜
                this.uploadLeaderboard(finalTotalScore);

                playAgainBtn.disabled = false;
                menuBtn.disabled = false;
            }
        }, stepTime);
    },

    // --- 主迴圈 ---
    loop(ts) {
        if (this.state !== 'RUNNING' && this.state !== 'WAIT_CHOICE' && this.state !== 'SPRINT_FINISH') return;
        const dt = Math.min(ts - this.lastTime, 100);
        this.lastTime = ts;
        this.update(dt);
        this.render();
        requestAnimationFrame(t => this.loop(t));
    },

    update(dt) {
        this.timeElapsed += dt;

        // 倒數計時更新 (只在沒顯示提示、且非過關或結束時扣除)
        if (this.state !== 'GAMEOVER' && this.state !== 'VICTORY' && !this.isShowingHint) {
            this.timeLeft = Math.max(0, this.timeLeft - dt);
            this.updateTimerHUD();
            if (this.timeLeft <= 0) {
                this.gameOver();
                return;
            }
        }

        if (this.stunnedTimer > 0) this.stunnedTimer -= dt;

        this.playerX += (this.playerTargetX - this.playerX) * 0.25;

        // 跳躍物理更新
        if (this.isJumping) {
            const gravity = 0.6;
            this.playerJumpY += this.playerJumpVel;
            this.playerJumpVel -= gravity;
            if (this.playerJumpY <= 0) {
                this.playerJumpY = 0;
                this.playerJumpVel = 0;
                this.isJumping = false;
            }
        }

        // 閃光效果淡出（每 ms 減少 0.003，約 0.33 秒消散）
        if (this.flashAlpha > 0) {
            this.flashAlpha = Math.max(0, this.flashAlpha - dt * 0.003);
        }

        // 浮層得分/懲罰文字更新
        this.updateFloatingTexts(dt);

        if (this.state === 'RUNNING') {
            let spd = this.baseSpeed;
            if (this.stunnedTimer > 0) {
                spd = 1.2;
            } else if (this.isActionActive && this.selectedChar === 'cheetah') {
                spd = 9.0; // 獵豹衝撞時速度提升！
            }
            this.speed += (spd - this.speed) * 0.15;

            // 能量冷卻/休息時間更新
            if (this.energy <= 0 && this.energyCooldown > 0) {
                this.energyCooldown -= dt;
                this.updateEnergyHUD(); // 動態更新秒數
                if (this.energyCooldown <= 0) {
                    this.energy = 3;
                    this.energyCooldown = 0;
                    this.updateEnergyHUD();
                }
            }
            this.distance += this.speed * (dt / 1000);
            this.scrollOffset += this.speed * (dt / 1000) * 60;

            // 時間到就出題（最多5題）
            if (this.questionCount < this.maxQuestions && this.timeElapsed >= this.nextQuestionTime) {
                this.spawnBarrier();
                this.questionCount++;
                // 下一題在本題答完後的5秒才會出現（由 scheduleNextQuestion 更新）
                this.nextQuestionTime = Infinity; // 先凍結，等答完再設
            }

            // 特殊技能/動作計時更新
            if (this.isActionActive) {
                this.actionTimer -= dt;
                if (this.actionTimer <= 0) {
                    this.isActionActive = false;
                    this.actionTimer = 0;
                }
            }

            // 生出障礙物（田徑跨欄）
            this.spawnObstacles();
            this.updateObstacles(dt);
            this.updateBarriers(dt);
        } else if (this.state === 'SPRINT_FINISH') {
            // 衝刺加速
            this.sprintSpeed = Math.min(this.sprintSpeed + dt * 0.015, 20);
            this.speed = this.sprintSpeed;
            this.distance += this.speed * (dt / 1000);
            this.scrollOffset += this.speed * (dt / 1000) * 60;

            // 終點線從畫面上方往下滑動
            if (this.finishLineY !== null) {
                this.finishLineY += this.speed * (dt / 1000) * 60;
            }

            // 隨機在天空中生成慶祝紙屑粒子
            if (Math.random() < 0.35) {
                const cols = ['#ffd166','#06d6a0','#ef476f','#118ab2','#fff','#ff9f1c'];
                this.particles.push({
                    x: Math.random() * this.canvas.width,
                    y: -20,
                    vx: Math.random() * 3 - 1.5,
                    vy: Math.random() * 2 + 3,
                    size: Math.random() * 7 + 4,
                    color: cols[Math.floor(Math.random() * cols.length)],
                    alpha: 1, life: 2500
                });
            }

            // 當終點線被角色越過
            const py = this.canvas.height * 0.78;
            if (this.finishLineY !== null && this.finishLineY >= py + 40) {
                this.victory();
            }
        }

        this.updateParticles(dt);
        this.updateScore();

        // 全部5題答完 + 最後一題結束後 = 進入最後衝刺模式
        if (this.questionCount >= this.maxQuestions && this.barriers.length === 0 && this.state === 'RUNNING' && this.stunnedTimer <= 0) {
            this.state = 'SPRINT_FINISH';
            this.sprintSpeed = this.speed;
            this.finishLineY = -120; // 從畫面上方滾入
            
            // 播放衝刺音效
            playSound('victory');
            
            // 浮層提示文字
            this.floatingTexts.push({
                x: this.canvas.width / 2,
                y: this.canvas.height * 0.4,
                text: '🏃 最後衝刺！💨',
                color: '#ffb703',
                strokeColor: '#000',
                size: 36,
                life: 2500,
                alpha: 1
            });
            
            // 大量彩帶碎紙從天而降
            const cols = ['#ffd166','#06d6a0','#ef476f','#118ab2','#fff','#ff9f1c'];
            for (let i = 0; i < 50; i++) {
                this.particles.push({
                    x: Math.random() * this.canvas.width,
                    y: Math.random() * -300 - 50,
                    vx: Math.random() * 3 - 1.5,
                    vy: Math.random() * 3 + 2,
                    size: Math.random() * 9 + 4,
                    color: cols[Math.floor(Math.random() * cols.length)],
                    alpha: 1, life: 3000 + Math.random() * 1000
                });
            }
        } else if (this.hearts <= 0) {
            this.gameOver();
        }
    },

    // --- 障礙門 ---

    spawnBarrier() {
        const q = generateQuestion();
        const b = {
            distance: this.distance,
            question: q,
            laneOptions: [...q.options],
            y: -100,
            passed: false,
            choiceTriggered: false
        };
        this.barriers.push(b);
        // 不強制清除障礙物，讓現有的自然滑出畫面（spawnObstacles 在出題前2秒就會停止生成新的）
    },

    // 答完一題後呼叫，讓角色再跑 6.5 秒才會出下一題
    scheduleNextQuestion() {
        this.nextQuestionTime = this.timeElapsed + 6500;
    },

    // --- 障礙物（田徑跨欄）--- 「波次制」生成
    spawnObstacles() {
        if (this.barriers.length > 0) return;
        if (this.nextQuestionTime !== Infinity && this.nextQuestionTime - this.timeElapsed <= 2000) return;
        if (this.timeElapsed < this.nextWaveTime) return;

        // 下一波間隔 1.3–2.1 秒（比之前更需要跳躍）
        this.nextWaveTime = this.timeElapsed + 1300 + Math.random() * 800;

        const roll = Math.random();
        const wave = [];   // { lane, yOff }

        if (roll < 0.18) {
            // A：單道——最簡單，可换道
            wave.push({ lane: Math.floor(Math.random() * 3), yOff: 0 });

        } else if (roll < 0.34) {
            // B：雙道並排——可换到空欄跟道或跳躍
            const f = Math.floor(Math.random() * 2); // 0或0或1
            wave.push({ lane: f,     yOff: 0 });
            wave.push({ lane: f + 1, yOff: 0 });

        } else if (roll < 0.48) {
            // C：左右道（中間放行）——可退進到中道或跳躍
            wave.push({ lane: 0, yOff: 0 });
            wave.push({ lane: 2, yOff: 0 });

        } else if (roll < 0.62) {
            // D：三道全满——必須跳躍
            wave.push({ lane: 0, yOff: 0 });
            wave.push({ lane: 1, yOff: 0 });
            wave.push({ lane: 2, yOff: 0 });

        } else if (roll < 0.74) {
            // E：鈔形雙道——两道但错開80px，要先换道再跳躍
            const f2 = Math.floor(Math.random() * 3);
            const s2 = (f2 + 1 + Math.floor(Math.random() * 2)) % 3;
            wave.push({ lane: f2, yOff: 0   });
            wave.push({ lane: s2, yOff: -90  });

        } else if (roll < 0.86) {
            // F：同道雙距——同一跟道两個連續跨欄，要跳躍且要跨到其他跟道
            const ln = Math.floor(Math.random() * 3);
            wave.push({ lane: ln, yOff:   0 });
            wave.push({ lane: ln, yOff: -95 });

        } else {
            // G：三道鈔形——三個跨欄分別錯開，鈴聲系列跩跳
            wave.push({ lane: 0, yOff:    0 });
            wave.push({ lane: 1, yOff:  -80 });
            wave.push({ lane: 2, yOff: -160 });
            // 隨機決定方向（從左到右或從右到左）
            if (Math.random() < 0.5) wave.forEach(o => o.lane = 2 - o.lane);
        }

        wave.forEach(o => {
            this.obstacles.push({ lane: o.lane, y: -80 + (o.yOff || 0) });
        });
    },

    updateObstacles(dt) {
        const speed = this.speed * (dt / 1000) * 60;
        const py = this.canvas.height * 0.78;

        for (let i = this.obstacles.length - 1; i >= 0; i--) {
            const o = this.obstacles[i];
            o.y += speed;

            // 碰撞檢測
            if (o.lane === this.lane) {
                const dist = Math.abs(o.y - py);
                if (dist < 28 && this.stunnedTimer <= 0) {
                    if (this.selectedChar === 'rabbit') {
                        if (this.isJumping) continue; // 兔子跳起時避開
                    } else if (this.selectedChar === 'turtle') {
                        if (this.isActionActive) {
                            // 烏龜縮入殼中：撞飛障礙物
                            this.createParticles(this.playerX, py, '#52b788');
                            this.floatingTexts.push({
                                x: this.playerX, y: py - 40,
                                text: '撞飛！💥', color: '#52b788', strokeColor: '#fff',
                                size: 24, life: 1000, alpha: 1
                            });
                            this.obstacles.splice(i, 1);
                            playSound('correct');
                            continue;
                        }
                    } else if (this.selectedChar === 'cheetah') {
                        if (this.isActionActive) {
                            // 獵豹撞擊：撞碎障礙物
                            this.createParticles(this.playerX, py, '#ffb703');
                            this.floatingTexts.push({
                                x: this.playerX, y: py - 40,
                                text: '撞碎！💥', color: '#ffb703', strokeColor: '#fff',
                                size: 24, life: 1000, alpha: 1
                            });
                            this.obstacles.splice(i, 1);
                            playSound('correct');
                            continue;
                        }
                    }

                    // 未閃避/未發動技能，撞到會減速
                    this.stunnedTimer = 1200;
                    playSound('hit');
                    this.createParticles(this.playerX, py, '#e76f51');
                    this.obstacles.splice(i, 1);
                    continue;
                }
            }

            if (o.y > this.canvas.height + 80) {
                this.obstacles.splice(i, 1);
            }
        }
    },

showChoice(barrier) {
        this.state = 'WAIT_CHOICE';
        const container = document.getElementById('choice-buttons-container');
        container.innerHTML = '';

        document.getElementById('clock-overlay').style.display = 'block';
        ClockDraw.draw(document.getElementById('svg-clock'), barrier.question.h, barrier.question.m);

        barrier.laneOptions.forEach((timeText, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = timeText;
            btn.addEventListener('click', () => {
                this.lane = idx;
                this.playerTargetX = this.getLaneX(idx);
                this.playerX = this.playerTargetX;

                document.getElementById('choice-overlay').style.display = 'none';
                document.getElementById('clock-overlay').style.display = 'none';

                // 記錄答題狀況以更新實體時間門的渲染
                barrier.passed = true;
                barrier.chosenLane = idx;
                barrier.correctLane = barrier.laneOptions.indexOf(barrier.question.correct);

                const correct = timeText === barrier.question.correct;
                if (correct) {
                    this.score += 50;
                    this.createParticles(this.playerX, this.canvas.height * 0.75, '#ffd166');
                    playSound('correct');
                    this.showCorrectFeedback();
                    // 答對：立即復跑
                    this.scheduleNextQuestion();
                    this.lastTime = performance.now();
                    this.state = 'RUNNING';
                } else {
                    this.hearts--;
                    this.stunnedTimer = 2000;
                    this.updateHearts();
                    this.createParticles(this.playerX, this.canvas.height * 0.75, '#e76f51');
                    playSound('wrong');
                    // 答錯：保持 WAIT_CHOICE（畫面凍結），由 showWrongFeedback 中的按鈕來復跑
                    this.showWrongFeedback(barrier.question, timeText);
                }
            });
            container.appendChild(btn);
        });

        document.getElementById('choice-overlay').style.display = 'flex';
    },

    // 答對獎勵動畫
    showCorrectFeedback() {
        // 1. 畫面綠光閃
        this.flashColor = 'rgba(82,183,136,0.45)';
        this.flashAlpha = 1;

        // 2. 浮層得分文字
        this.floatingTexts.push({
            x: this.playerX,
            y: this.canvas.height * 0.68,
            text: '+50分！',
            color: '#ffd166',
            strokeColor: '#2d6a4f',
            size: 32,
            life: 1600,
            alpha: 1
        });

        // 3. 獎勵卡出現
        const card = document.getElementById('correct-card');
        const scoreText = document.getElementById('correct-score-text');
        scoreText.textContent = '+50分';
        card.className = 'show';
        setTimeout(() => {
            card.className = 'hide';
            setTimeout(() => { card.className = ''; }, 450);
        }, 900);

        // 4. 金色星星爆炸粒子
        for (let i = 0; i < 18; i++) {
            const angle = (i / 18) * Math.PI * 2;
            this.particles.push({
                x: this.playerX, y: this.canvas.height * 0.75,
                vx: Math.cos(angle) * (2 + Math.random() * 3),
                vy: Math.sin(angle) * (2 + Math.random() * 3) - 2,
                size: Math.random() * 6 + 3,
                color: Math.random() < 0.5 ? '#ffd166' : '#52b788',
                alpha: 1, life: 700 + Math.random() * 300
            });
        }
    },

    // 答錯懲罰動畫 + 教學提示
    showWrongFeedback(question, wrongChoice) {
        // 1. 畫面紅光閃
        this.flashColor = 'rgba(231,111,81,0.45)';
        this.flashAlpha = 1;

        // 2. 浮層懲罰文字
        this.floatingTexts.push({
            x: this.playerX,
            y: this.canvas.height * 0.68,
            text: '-1命！',
            color: '#e63946',
            strokeColor: '#fff',
            size: 28,
            life: 1400,
            alpha: 1
        });

        // 3. 畫出鐘面（讓學生看到原本的時鐘）
        const h = question.h;
        const m = question.m;
        ClockDraw.draw(document.getElementById('hint-clock'), h, m);

        // 4. 讀法說明（仳照老師度讀時間的方式）

        // 小時部分
        const nextH = h === 12 ? 1 : h + 1;
        let hourLine;
        if (m === 0) {
            hourLine = `⏰ <b>時針（短針）</b>指向 <b style="color:#e63946">${h}</b>
                        &nbsp;→&nbsp;所以是 <b style="color:#e63946">${h}時</b>`;
        } else {
            hourLine = `⏰ <b>時針（短針）</b>超過 <b style="color:#e63946">${h}</b> 時，還沒到 ${nextH} 時
                        &nbsp;→&nbsp;所以是 <b style="color:#e63946">${h}時</b>`;
        }

        // 分鐘部分：逆數大格並列出吸盤數字
        let minuteLine;
        if (m === 0) {
            minuteLine = `⏰ <b>分針（長針）</b>指向 12，整點
                          &nbsp;→&nbsp;所以是 <b style="color:#1d3557">0分</b>`;
        } else {
            const bigSteps = m / 5;   // 大格數
            const stepList = [];
            for (let i = 5; i <= m; i += 5) stepList.push(i);
            const countStr = stepList.join('、');
            minuteLine = `⏰ <b>分針（長針）</b>走了 <b style="color:#1d3557">${bigSteps} </b> 大格
                          &nbsp;→&nbsp;數一數：<span style="color:#555;font-size:0.88em">${countStr}</span>
                          &nbsp;→&nbsp;所以是 <b style="color:#1d3557">${m}分</b>`;
        }

        const explainHTML = `
            <strong style="color:#e63946">怎麼讀這個時鐘？</strong><br><br>
            ${hourLine}<br><br>
            ${minuteLine}`;
        document.getElementById('hint-explain').innerHTML = explainHTML;
        document.getElementById('hint-answer').textContent = `✅ 正確答案：${h}時${m}分`;

        // 4.5. 上傳錯誤紀錄到 Firebase
        if (db) {
            const seat = document.getElementById('student-seat').value.trim() || '無';
            const name = document.getElementById('student-name').value.trim() || '匿名';
            db.ref('time_race_errors').push({
                seat: seat,
                name: name,
                question: `${h}時${m}分`,
                wrongChoice: wrongChoice || '未填',
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).catch(err => console.error("上傳錯誤紀錄失敗：", err));
        }

        // 5. 顯示覆蓋；學生按按鈕才繼續（不自動關閉）
        const overlay = document.getElementById('hint-overlay');
        overlay.style.display = 'flex';
        this.isShowingHint = true;

        document.getElementById('hint-tap-btn').onclick = () => {
            overlay.style.display = 'none';
            this.isShowingHint = false;
            // 現在才復跑：設定下一題時間并繼續迴圈
            this.scheduleNextQuestion();
            this.lastTime = performance.now();
            this.state = 'RUNNING';
        };
    },
        updateBarriers(dt) {
        const speed = this.speed * (dt / 1000) * 60;
        const py = this.canvas.height * 0.78;

        for (let i = this.barriers.length - 1; i >= 0; i--) {
            const b = this.barriers[i];
            b.y += speed;

            if (!b.choiceTriggered && b.y >= this.canvas.height * 0.35) {
                b.choiceTriggered = true;
                this.showChoice(b);
            }

            if (b.y > this.canvas.height + 100) {
                this.barriers.splice(i, 1);
            }
        }
    },

    // --- 粒子 ---
    createParticles(x, y, color) {
        for (let i = 0; i < 10; i++) {
            this.particles.push({
                x, y,
                vx: Math.random() * 4 - 2,
                vy: Math.random() * -4 - 1,
                size: Math.random() * 5 + 2,
                color, alpha: 1, life: 400 + Math.random() * 200
            });
        }
    },

    // 浮層得分文字
    updateFloatingTexts(dt) {
        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
            const t = this.floatingTexts[i];
            t.y -= 1.2;
            t.life -= dt;
            t.alpha = Math.max(t.life / 1600, 0);
            if (t.life <= 0) this.floatingTexts.splice(i, 1);
        }
    },

    drawFloatingTexts() {
        this.floatingTexts.forEach(t => {
            const ctx = this.ctx;
            ctx.save();
            ctx.globalAlpha = t.alpha;
            ctx.font = `900 ${t.size}px "Noto Sans TC", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            // 文字描邊（讓文字在任何背景上都清楚）
            ctx.lineWidth = 5;
            ctx.strokeStyle = t.strokeColor || 'rgba(0,0,0,0.5)';
            ctx.lineJoin = 'round';
            ctx.strokeText(t.text, t.x, t.y);
            ctx.fillStyle = t.color;
            ctx.fillText(t.text, t.x, t.y);
            ctx.restore();
        });
    },

    updateParticles(dt) {
        for (let i = this.particles.length - 1; i >= 0; i--) {
            const p = this.particles[i];
            p.x += p.vx; p.y += p.vy;
            p.vy += 0.15;
            p.life -= dt;
            p.alpha = Math.max(p.life / 500, 0);
            if (p.life <= 0) this.particles.splice(i, 1);
        }
    },

    // --- 動物角色繪製（向量圖）---
    drawCharacter(x, y, charType, isStunned, isJumping, isActionActive) {
        const ctx = this.ctx;
        const groundY = this.canvas.height * 0.78; // 地面基準高度

        // 地面陰影（跳躍時依然畫在地面，不隨角色上浮）
        const jumpPct = isJumping ? Math.min(this.playerJumpY / 80, 1) : 0; // 跳得越高陰影越小
        const shadowRx = 16 * (1 - jumpPct * 0.5);
        const shadowRy = 5  * (1 - jumpPct * 0.5);
        const shadowAlpha = 0.18 - jumpPct * 0.1;
        ctx.save();
        ctx.globalAlpha = shadowAlpha;
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(x, groundY, shadowRx, shadowRy, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.restore();

        ctx.save();
        ctx.translate(x, y);

        const runSpeed = isStunned ? 0.5 : 2.5;
        const cycle = (this.timeElapsed * 0.002 * runSpeed);

        if (charType === 'rabbit') this.drawRabbit(ctx, cycle, isStunned, isJumping);
        else if (charType === 'turtle') this.drawTurtle(ctx, cycle, isStunned, isActionActive);
        else if (charType === 'cheetah') this.drawCheetah(ctx, cycle, isStunned, isActionActive);

        if (isStunned) {
            ctx.font = '16px Arial';
            const starAngle = (this.timeElapsed * 0.005) % (Math.PI * 2);
            ctx.fillText('💫', 18 * Math.cos(starAngle), 6 * Math.sin(starAngle) - 38);
        }

        ctx.restore();
    },

    drawRabbit(ctx, cycle, isStunned, isJumping) {
        // 跳躍時不實施上下波動（bob），但保留跑步腿部動畫
        let bob = isJumping ? 0 : Math.sin(cycle * 2) * 2;
        ctx.translate(0, bob);
        if (!isStunned) ctx.rotate(0.04 * Math.sin(cycle));

        // 跳躍時陰影由 drawCharacter 統一處理，這裡不再畫
        if (!isJumping) {
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.beginPath(); ctx.ellipse(0, 0, 16, 5, 0, 0, Math.PI * 2); ctx.fill();
        }

        ctx.fillStyle = '#e5e5e5';
        ctx.save(); ctx.translate(-8, 2 + Math.sin(cycle) * 4);
        ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(8, 2 - Math.sin(cycle) * 4);
        ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 6, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(0, -10, 15, 13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(0, -1, 5, 0, Math.PI * 2); ctx.fill();

        ctx.save(); ctx.translate(-14, -16 + Math.sin(cycle + Math.PI) * 3);
        ctx.beginPath(); ctx.ellipse(0, 0, 3, 5, -0.1, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(14, -16 + Math.sin(cycle) * 3);
        ctx.beginPath(); ctx.ellipse(0, 0, 3, 5, 0.1, 0, Math.PI * 2); ctx.fill(); ctx.restore();

        ctx.beginPath(); ctx.arc(0, -25, 10, 0, Math.PI * 2); ctx.fill();

        ctx.save(); ctx.translate(-4, -33);
        ctx.rotate(-0.06 + Math.sin(cycle * 2) * 0.04);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(0, -8, 3, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffccd5';
        ctx.beginPath(); ctx.ellipse(0, -8, 1.5, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();

        ctx.save(); ctx.translate(4, -33);
        ctx.rotate(0.06 - Math.sin(cycle * 2) * 0.04);
        ctx.fillStyle = '#ffffff';
        ctx.beginPath(); ctx.ellipse(0, -8, 3, 10, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffccd5';
        ctx.beginPath(); ctx.ellipse(0, -8, 1.5, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
    },

    drawTurtle(ctx, cycle, isStunned, isActionActive) {
        if (isActionActive) {
            // 縮殼狀態：只畫殼，並旋轉
            ctx.save();
            ctx.rotate(cycle * 6);
            ctx.fillStyle = '#38b000';
            ctx.beginPath(); ctx.ellipse(0, -9, 15, 17, 0, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#007200'; ctx.lineWidth = 2.0;
            ctx.beginPath(); ctx.ellipse(0, -9, 10, 11, 0, 0, Math.PI * 2); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 2);
            ctx.moveTo(-10, -9); ctx.lineTo(10, -9); ctx.stroke();
            ctx.restore();
            return;
        }

        let bob = Math.sin(cycle * 1.5) * 1.5;
        ctx.translate(0, bob);
        if (!isStunned) ctx.rotate(0.02 * Math.sin(cycle));

        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.ellipse(0, 0, 18, 5, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#70e000';
        ctx.save(); ctx.translate(-13, -16 - Math.sin(cycle) * 3);
        ctx.beginPath(); ctx.ellipse(0, 0, 4, 7, -Math.PI / 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(13, -16 + Math.sin(cycle) * 3);
        ctx.beginPath(); ctx.ellipse(0, 0, 4, 7, Math.PI / 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(-11, -1 + Math.sin(cycle) * 3);
        ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 6, -0.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(11, -1 - Math.sin(cycle) * 3);
        ctx.beginPath(); ctx.ellipse(0, 0, 3.5, 6, 0.2, 0, Math.PI * 2); ctx.fill(); ctx.restore();

        ctx.beginPath();
        ctx.moveTo(0, 5); ctx.lineTo(-2, 10); ctx.lineTo(2, 10); ctx.closePath();
        ctx.fill();

        ctx.fillStyle = '#38b000';
        ctx.beginPath(); ctx.ellipse(0, -9, 15, 17, 0, 0, Math.PI * 2); ctx.fill();

        ctx.strokeStyle = '#007200'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(0, -9, 10, 11, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, -20); ctx.lineTo(0, 2);
        ctx.moveTo(-10, -9); ctx.lineTo(10, -9); ctx.stroke();

        ctx.fillStyle = '#70e000';
        ctx.beginPath(); ctx.ellipse(0, -28, 5, 7, 0, 0, Math.PI * 2); ctx.fill();
    },

    drawCheetah(ctx, cycle, isStunned, isActionActive) {
        let bob = Math.sin(cycle * 2.5) * 2;
        ctx.translate(0, bob);
        if (!isStunned) ctx.rotate(0.04 * Math.sin(cycle));

        ctx.fillStyle = 'rgba(0,0,0,0.15)';
        ctx.beginPath(); ctx.ellipse(0, 0, 15, 4, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffb703';
        ctx.save(); ctx.translate(-7, -18 - Math.sin(cycle) * 5);
        ctx.beginPath(); ctx.ellipse(0, 0, 2, 7, -0.05, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(7, -18 + Math.sin(cycle) * 5);
        ctx.beginPath(); ctx.ellipse(0, 0, 2, 7, 0.05, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(-7, -2 + Math.sin(cycle) * 5);
        ctx.beginPath(); ctx.ellipse(0, 0, 2.5, 7, 0.05, 0, Math.PI * 2); ctx.fill(); ctx.restore();
        ctx.save(); ctx.translate(7, -2 - Math.sin(cycle) * 5);
        ctx.beginPath(); ctx.ellipse(0, 0, 2.5, 7, -0.05, 0, Math.PI * 2); ctx.fill(); ctx.restore();

        ctx.strokeStyle = '#ffb703'; ctx.lineWidth = 3; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(0, 5);
        let tailW = Math.sin(cycle) * 8;
        ctx.quadraticCurveTo(tailW, 14, tailW * 1.5, 23);
        ctx.stroke();
        ctx.fillStyle = '#023047';
        ctx.beginPath(); ctx.arc(tailW * 1.5, 23, 1.8, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#ffb703';
        ctx.beginPath(); ctx.ellipse(0, -10, 10, 17, 0, 0, Math.PI * 2); ctx.fill();

        ctx.fillStyle = '#023047';
        ctx.beginPath();
        ctx.arc(-3, -16, 1.2, 0, Math.PI * 2); ctx.arc(3, -9, 1.2, 0, Math.PI * 2);
        ctx.arc(-2, -4, 1.2, 0, Math.PI * 2); ctx.arc(2, -18, 1.2, 0, Math.PI * 2);
        ctx.arc(0, -11, 1.2, 0, Math.PI * 2); ctx.arc(-4, -8, 1.2, 0, Math.PI * 2);
        ctx.arc(4, -3, 1.2, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#ffb703';
        ctx.beginPath(); ctx.arc(0, -29, 8, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(-6, -34, 2.2, 0, Math.PI * 2);
        ctx.arc(6, -34, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#023047';
        ctx.beginPath(); ctx.arc(-6, -34, 1.1, 0, Math.PI * 2);
        ctx.arc(6, -34, 1.1, 0, Math.PI * 2);
        ctx.fill();
    },

    // --- 繪製 ---
    render() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        this.drawRoad();
        this.drawScenery();
        this.drawFinishLine(); // 繪製終點線 (在背景上，但角色和障礙物之下)
        this.drawObstacles();
        this.drawBarriersBackground(); // 先畫傳送門光幕背景
        this.drawParticles();

        // 畫角色選手
        const groundY = this.canvas.height * 0.78;
        const py = groundY - this.playerJumpY;
        this.drawCharacter(this.playerX, py, this.selectedChar, this.stunnedTimer > 0, this.isJumping, this.isActionActive);

        this.drawBarriersForeground(); // 後畫傳送門的前景柱子與橫梁牌子

        // 跳躍中風劫粒子
        if (this.isJumping) {
            ctx.save();
            ctx.globalAlpha = 0.55;
            ctx.font = '18px Arial';
            ctx.textAlign = 'center';
            ctx.fillText('· · ·', this.playerX, groundY);
            ctx.globalAlpha = 1;
            ctx.restore();
        }

        // 獵豹衝撞風阻特效
        if (this.selectedChar === 'cheetah' && this.isActionActive) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 209, 102, 0.65)';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            for (let i = 0; i < 3; i++) {
                const xOff = -30 - Math.random() * 20;
                const yOff = groundY - 10 - i * 12;
                ctx.beginPath();
                ctx.moveTo(this.playerX + xOff, yOff);
                ctx.lineTo(this.playerX + xOff - 15, yOff);
                ctx.stroke();
            }
            ctx.restore();
        }

        // 浮層得分文字
        this.drawFloatingTexts();

        // 畫面閃光效果
        if (this.flashAlpha > 0) {
            ctx.save();
            ctx.globalAlpha = this.flashAlpha * 0.55;
            ctx.fillStyle = this.flashColor;
            ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            ctx.restore();
        }
    },

    drawFinishLine() {
        if (this.state !== 'SPRINT_FINISH' || this.finishLineY === null) return;
        const ctx = this.ctx;
        const y = this.finishLineY;

        // 1. 黑白棋盤格 (Checkerboard pattern)
        const sqSize = 16;
        const rows = 2;
        const colsCount = Math.ceil(this.roadWidth / sqSize);
        ctx.save();
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < colsCount; c++) {
                ctx.fillStyle = ((r + c) % 2 === 0) ? '#ffffff' : '#000000';
                ctx.fillRect(this.roadX + c * sqSize, y + r * sqSize, sqSize, sqSize);
            }
        }
        
        // 2. 邊緣黃黑相間警示條
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(this.roadX, y - 6, this.roadWidth, 6);
        ctx.fillStyle = '#000000';
        ctx.lineWidth = 2;
        for (let x = this.roadX; x < this.roadX + this.roadWidth; x += 20) {
            ctx.beginPath();
            ctx.moveTo(x, y - 6);
            ctx.lineTo(x + 10, y);
            ctx.strokeStyle = '#000000';
            ctx.stroke();
        }

        // 3. 紅色終點彩帶 (Finish ribbon)
        const py = this.canvas.height * 0.78;
        ctx.fillStyle = '#e63946';
        ctx.strokeStyle = '#e63946';
        ctx.lineWidth = 6;
        
        if (y < py) {
            // 還沒越過終點：彩帶拉直
            ctx.beginPath();
            ctx.moveTo(this.roadX, y + sqSize * rows);
            ctx.lineTo(this.roadX + this.roadWidth, y + sqSize * rows);
            ctx.stroke();

            // 終點文字橫幅 (Banner)
            ctx.fillStyle = '#e63946';
            ctx.fillRect(this.roadX + this.roadWidth / 2 - 50, y + sqSize * rows - 12, 100, 24);
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 14px "Noto Sans TC", sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('FINISH', this.roadX + this.roadWidth / 2, y + sqSize * rows);
        } else {
            // 已經越過終點：彩帶斷裂向兩邊飄開
            const breakOffset = Math.min((y - py) * 1.5, this.roadWidth / 2);
            
            // 左半邊
            ctx.beginPath();
            ctx.moveTo(this.roadX, y + sqSize * rows);
            ctx.lineTo(this.playerX - 20 - breakOffset * 0.5, y + sqSize * rows + breakOffset * 0.3);
            ctx.stroke();

            // 右半邊
            ctx.beginPath();
            ctx.moveTo(this.roadX + this.roadWidth, y + sqSize * rows);
            ctx.lineTo(this.playerX + 20 + breakOffset * 0.5, y + sqSize * rows + breakOffset * 0.3);
            ctx.stroke();
        }
        ctx.restore();
    },

    drawRoad() {
        const ctx = this.ctx;
        const pct = Math.min(this.distance / 1000, 1);
        let grass, road, border;

        if (pct < 0.5) {
            grass = '#40916c'; road = '#9b724c'; border = '#2d6a4f';
        } else {
            const t = (pct - 0.5) / 0.5;
            grass = this.lerpColor('#40916c', '#b56576', t);
            road = this.lerpColor('#9b724c', '#d4a373', t);
            border = this.lerpColor('#2d6a4f', '#6f1d1b', t);
        }

        ctx.fillStyle = grass;
        ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        ctx.fillStyle = road;
        ctx.fillRect(this.roadX, 0, this.roadWidth, this.canvas.height);

        ctx.strokeStyle = border;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(this.roadX, 0); ctx.lineTo(this.roadX, this.canvas.height);
        ctx.moveTo(this.roadX + this.roadWidth, 0); ctx.lineTo(this.roadX + this.roadWidth, this.canvas.height);
        ctx.stroke();

        ctx.strokeStyle = 'rgba(255,255,255,0.35)';
        ctx.lineWidth = 3;
        ctx.setLineDash([15, 25]);
        ctx.lineDashOffset = -this.scrollOffset;
        for (let i = 1; i < 3; i++) {
            const x = this.roadX + i * this.laneWidth;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.canvas.height);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    },

    drawScenery() {
        const spacing = 160;
        const offset = this.scrollOffset % spacing;
        this.ctx.font = '18px Arial';
        this.ctx.textAlign = 'center';
        for (let y = -spacing; y < this.canvas.height + spacing; y += spacing) {
            const curY = y + offset;
            this.ctx.fillText('🌲', this.roadX * 0.35, curY);
            this.ctx.fillText('🌲', this.canvas.width - this.roadX * 0.35, curY - 30);
            this.ctx.fillText('🌸', this.roadX * 0.3, curY + 50);
        }
    },

    drawObstacles() {
        this.obstacles.forEach(o => {
            const x = this.getLaneX(o.lane);
            const ctx = this.ctx;
            ctx.save();
            ctx.translate(x, o.y);

            // === 田徑跨欄 ===
            // 橫桿（紅白相間）
            const barHalfW = 36;
            const barY = -24;
            // 白底橫桿
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-barHalfW, barY - 5, barHalfW * 2, 10);
            // 紅色條紋（每隔12px）
            ctx.fillStyle = '#e63946';
            for (let sx = -barHalfW; sx < barHalfW; sx += 12) {
                ctx.fillRect(sx, barY - 5, 6, 10);
            }
            // 橫桿外框
            ctx.strokeStyle = '#2d3e46';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(-barHalfW, barY - 5, barHalfW * 2, 10);

            // 左支腳
            ctx.fillStyle = '#c1440e';
            ctx.fillRect(-barHalfW, barY, 6, 28);
            ctx.strokeStyle = '#2d3e46'; ctx.lineWidth = 1.2;
            ctx.strokeRect(-barHalfW, barY, 6, 28);

            // 右支腳
            ctx.fillRect(barHalfW - 6, barY, 6, 28);
            ctx.strokeRect(barHalfW - 6, barY, 6, 28);

            // 底座（小矩形）
            ctx.fillStyle = '#7b2d00';
            ctx.fillRect(-barHalfW - 4, barY + 24, 16, 6);
            ctx.fillRect(barHalfW - 12, barY + 24, 16, 6);

            ctx.restore();
        });
    },

drawBarriersBackground() {
        this.barriers.forEach(b => {
            const ctx = this.ctx;
            const gateY = b.y;

            b.laneOptions.forEach((timeText, lane) => {
                const left = this.roadX + lane * this.laneWidth;
                const width = this.laneWidth;

                // 傳送門光幕 (Portals energy shield)
                if (!b.passed) {
                    ctx.fillStyle = 'rgba(69, 123, 157, 0.25)';
                    ctx.fillRect(left + 2, gateY - 60, width - 4, 60);

                    ctx.strokeStyle = 'rgba(69, 123, 157, 0.7)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(left + 2, gateY - 60, width - 4, 60);
                } else {
                    if (lane === b.correctLane) {
                        ctx.strokeStyle = '#2ecc71';
                        ctx.lineWidth = 4;
                        ctx.strokeRect(left + 4, gateY - 60, width - 8, 60);

                        ctx.fillStyle = 'rgba(46, 204, 113, 0.2)';
                        ctx.fillRect(left + 4, gateY - 60, width - 8, 60);
                    } else {
                        ctx.fillStyle = 'rgba(231, 76, 60, 0.4)';
                        ctx.fillRect(left + 2, gateY - 60, width - 4, 60);

                        ctx.strokeStyle = '#e74c3c';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(left + 2, gateY - 60, width - 4, 60);
                    }
                }
            });
        });
    },

    drawBarriersForeground() {
        this.barriers.forEach(b => {
            const ctx = this.ctx;
            const gateY = b.y;

            // 1. 繪製 4 根大柱子
            ctx.save();
            for (let i = 0; i <= 3; i++) {
                const px = this.roadX + i * this.laneWidth;
                
                ctx.fillStyle = '#457b9d';
                ctx.fillRect(px - 4, gateY - 70, 8, 70);
                
                ctx.fillStyle = '#ffd166';
                ctx.beginPath();
                ctx.arc(px, gateY - 74, 6, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#1d3557';
                ctx.fillRect(px - 6, gateY - 4, 12, 4);
            }

            // 2. 橫跨整條路的橫樑
            ctx.fillStyle = '#1d3557';
            ctx.fillRect(this.roadX - 6, gateY - 70, this.roadWidth + 12, 10);

            // 3. 繪製勾勾與叉叉符號以及告示牌
            b.laneOptions.forEach((timeText, lane) => {
                const x = this.getLaneX(lane);
                const left = this.roadX + lane * this.laneWidth;
                const width = this.laneWidth;

                if (b.passed) {
                    ctx.save();
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    if (lane === b.correctLane) {
                        ctx.fillStyle = '#2ecc71';
                        ctx.font = '900 24px Arial';
                        ctx.fillText('⭕', x, gateY - 30);
                    } else {
                        ctx.fillStyle = '#e74c3c';
                        ctx.font = '900 24px Arial';
                        ctx.fillText('❌', x, gateY - 30);
                    }
                    ctx.restore();
                }

                // 4. 告示牌
                ctx.save();
                ctx.fillStyle = 'rgba(29, 53, 87, 0.95)';
                ctx.beginPath();
                ctx.roundRect(x - 52, gateY - 100, 104, 26, 8);
                ctx.fill();
                ctx.strokeStyle = '#ffd166';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.strokeStyle = '#1d3557';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x - 30, gateY - 70); ctx.lineTo(x - 30, gateY - 74);
                ctx.moveTo(x + 30, gateY - 70); ctx.lineTo(x + 30, gateY - 74);
                ctx.stroke();

                ctx.fillStyle = '#ffffff';
                ctx.font = '900 13px "Noto Sans TC", sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(timeText, x, gateY - 87);
                ctx.restore();
            });
            ctx.restore();
        });
    },

        drawParticles() {
        this.particles.forEach(p => {
            this.ctx.save();
            this.ctx.globalAlpha = p.alpha;
            this.ctx.fillStyle = p.color;
            this.ctx.beginPath();
            this.ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            this.ctx.fill();
            this.ctx.restore();
        });
    },

    lerpColor(c1, c2, t) {
        const r = (a, b) => Math.round(a + (b - a) * t);
        const p = (c) => ({ r: parseInt(c.slice(1,3),16), g: parseInt(c.slice(3,5),16), b: parseInt(c.slice(5,7),16) });
        const a = p(c1), b = p(c2);
        return `rgb(${r(a.r,b.r)},${r(a.g,b.g)},${r(a.b,b.b)})`;
    },

    updateHearts() {
        for (let i = 1; i <= 3; i++) {
            const el = document.getElementById(`heart-${i}`);
            if (i <= this.hearts) el.classList.remove('lost');
            else el.classList.add('lost');
        }
    },

    updateScore() {
        document.getElementById('hud-score').textContent = `⭐ ${this.score}分`;
    },

    updateTimerHUD() {
        const sec = Math.ceil(this.timeLeft / 1000);
        document.getElementById('hud-timer').textContent = `⏱️ ${sec}秒`;
    },

    uploadLeaderboard(finalScore) {
        if (!db) return;
        const seat = document.getElementById('student-seat').value.trim() || '無';
        const name = document.getElementById('student-name').value.trim() || '匿名';
        
        db.ref('time_race_leaderboard').push({
            seat: seat,
            name: name,
            score: finalScore,
            char: this.selectedChar,
            timestamp: firebase.database.ServerValue.TIMESTAMP
        }).catch(err => console.error("上傳排行失敗：", err));
    },

    showLeaderboard() {
        document.getElementById('leaderboard-overlay').style.display = 'flex';
        document.getElementById('leaderboard-loading').style.display = 'block';
        document.getElementById('leaderboard-table').style.display = 'none';

        if (!db) {
            document.getElementById('leaderboard-loading').innerHTML = '⚠️ Firebase 未連線';
            return;
        }

        db.ref('time_race_leaderboard')
            .orderByChild('score')
            .limitToLast(10)
            .once('value')
            .then(snapshot => {
                const data = snapshot.val();
                const list = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        list.push(data[key]);
                    });
                }
                list.sort((a, b) => b.score - a.score);

                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';

                if (list.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding:15px; color:#aaa;">📭 尚無排行紀錄，快來挑戰吧！</td></tr>';
                } else {
                    list.forEach((item, index) => {
                        const rank = index + 1;
                        let rankHtml = '';
                        if (rank === 1) rankHtml = '🥇';
                        else if (rank === 2) rankHtml = '🥈';
                        else if (rank === 3) rankHtml = '🥉';
                        else rankHtml = `<span style="font-weight:bold;color:#ccc;">${rank}</span>`;

                        const charEmoji = item.char === 'rabbit' ? '🐰' : (item.char === 'turtle' ? '🐢' : '🐆');
                        
                        const tr = document.createElement('tr');
                        tr.style.borderBottom = '1px solid rgba(255,255,255,0.1)';
                        tr.innerHTML = `
                            <td style="padding: 10px 8px; text-align: center; font-size: 1.15rem;">${rankHtml}</td>
                            <td style="padding: 10px 8px;">${this.escapeHtml(item.seat || '無')}</td>
                            <td style="padding: 10px 8px; font-weight: bold;">${this.escapeHtml(item.name || '匿名')}</td>
                            <td style="padding: 10px 8px; text-align: center; font-size: 1.25rem;">${charEmoji}</td>
                            <td style="padding: 10px 8px; text-align: right; font-weight: 900; color: #ffd166;">${item.score}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }

                document.getElementById('leaderboard-loading').style.display = 'none';
                document.getElementById('leaderboard-table').style.display = 'table';
            })
            .catch(err => {
                console.error(err);
                document.getElementById('leaderboard-loading').innerHTML = '⚠️ 載入排行失敗';
            });
    },

    escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, s => {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[s];
        });
    },

    useEnergy() {
        this.energy--;
        if (this.energy === 0) {
            this.energyCooldown = 5000; // 5秒
        }
        this.updateEnergyHUD();
    },

    updateEnergyHUD() {
        // 更新直立式能量條的三個 segment
        for (let i = 1; i <= 3; i++) {
            const seg = document.getElementById(`es-${i}`);
            if (seg) {
                if (this.energy >= i) {
                    seg.classList.add('active');
                } else {
                    seg.classList.remove('active');
                }
            }
        }
        
        const actionBtn = document.getElementById('jump-btn');
        if (actionBtn) {
            if (this.energy > 0) {
                // 恢復原先動物對應的文字
                if (this.selectedChar === 'rabbit') {
                    actionBtn.textContent = '跳躍';
                } else if (this.selectedChar === 'turtle') {
                    actionBtn.textContent = '縮殼';
                } else if (this.selectedChar === 'cheetah') {
                    actionBtn.textContent = '撞擊';
                }
                actionBtn.style.opacity = '1';
                actionBtn.style.pointerEvents = 'auto';
            } else {
                // 休息中：顯示剩餘倒數秒數
                const sec = Math.ceil(this.energyCooldown / 1000);
                actionBtn.textContent = `⏳ ${sec}s`;
                actionBtn.style.opacity = '0.4';
                actionBtn.style.pointerEvents = 'none';
            }
        }
    }
};

window.addEventListener('DOMContentLoaded', () => {
    Game.init();
    
    // 全域點擊/觸控事件監聽，用以解鎖並自動播放背景音樂 (BGM)
    const startBgmOnInteraction = () => {
        const bgm = document.getElementById('bgm');
        const slider = document.getElementById('volume-slider');
        if (bgm && bgm.paused) {
            const vol = slider ? parseFloat(slider.value) : 0.3;
            bgm.volume = vol;
            bgm.play().then(() => {
                console.log("BGM 自動播放成功！");
                // 成功播放後，移除此全域事件監聽，避免重複執行
                document.removeEventListener('click', startBgmOnInteraction);
                document.removeEventListener('touchstart', startBgmOnInteraction);
            }).catch(err => console.log("等待使用者點擊解鎖音訊...", err));
        }
    };
    document.addEventListener('click', startBgmOnInteraction);
    document.addEventListener('touchstart', startBgmOnInteraction);
});
</script>
</body>
</html>
