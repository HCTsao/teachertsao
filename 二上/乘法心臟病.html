<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>九九乘法心臟病 - 終極競賽版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel CDN -->
    <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.23.10/babel.min.js"></script>
    <!-- PeerJS for WebRTC P2P Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        /* 基礎飛行與動畫路徑 */
        @keyframes flyFrom0 { 0% { transform: translateY(300px) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes flyFrom1 { 0% { transform: translateX(-500px) scale(0.5); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        @keyframes flyFrom2 { 0% { transform: translateY(-400px) scale(0.5); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
        @keyframes flyFrom3 { 0% { transform: translateX(400px) scale(0.5); opacity: 0; } 100% { transform: translateX(0) scale(1); opacity: 1; } }
        
        /* 受罰回歸路徑：從中央牌堆原位 (translate(0,0)) 飛向各座位的牌庫 */
        @keyframes returnTo0 { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(0, 360px) scale(0.5); opacity: 0; } }
        @keyframes returnTo1 { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(-460px, 0) scale(0.5); opacity: 0; } }
        @keyframes returnTo2 { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(0, -360px) scale(0.5); opacity: 0; } }
        @keyframes returnTo3 { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(460px, 0) scale(0.5); opacity: 0; } }

        /* 初始發牌路徑 */
        @keyframes dealTo0 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%, 300px) rotate(var(--rot)); opacity: 1; } }
        @keyframes dealTo1 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(-500px, -50%) rotate(var(--rot)); opacity: 1; } }
        @keyframes dealTo2 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%, -400px) rotate(var(--rot)); opacity: 1; } }
        @keyframes dealTo3 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(400px, -50%) rotate(var(--rot)); opacity: 1; } }

        .animate-fly-0 { animation: flyFrom0 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fly-1 { animation: flyFrom1 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fly-2 { animation: flyFrom2 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fly-3 { animation: flyFrom3 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .animate-return-0 { animation: returnTo0 0.8s ease-in forwards; }
        .animate-return-1 { animation: returnTo1 0.8s ease-in forwards; }
        .animate-return-2 { animation: returnTo2 0.8s ease-in forwards; }
        .animate-return-3 { animation: returnTo3 0.8s ease-in forwards; }

        .animate-deal-0 { animation: dealTo0 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: 15deg; }
        .animate-deal-1 { animation: dealTo1 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: -20deg; }
        .animate-deal-2 { animation: dealTo2 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: 45deg; }
        .animate-deal-3 { animation: dealTo3 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: -10deg; }

        /* 拍牌波紋動畫 */
        @keyframes slapRipple { 0% { transform: translate(-50%,-50%) scale(0.2); opacity: 0.9; } 100% { transform: translate(-50%,-50%) scale(2.8); opacity: 0; } }
        .slap-ripple { position: absolute; top: 50%; left: 50%; width: 120px; height: 120px; border-radius: 50%; background: rgba(251,191,36,0.7); pointer-events: none; animation: slapRipple 0.5s ease-out forwards; }

        /* 四方向手部落下動畫 (0.75秒) */
        @keyframes handFrom0 { 0% { transform: translateX(-50%) translateY(120px); opacity:1; } 35% { transform: translateX(-50%) translateY(-8px); opacity:1; } 60% { transform: translateX(-50%) translateY(4px); opacity:1; } 100% { transform: translateX(-50%) translateY(120px); opacity:0; } }
        @keyframes handFrom1 { 0% { transform: translateY(-50%) translateX(-120px) rotate(-90deg); opacity:1; } 35% { transform: translateY(-50%) translateX(8px) rotate(-90deg); opacity:1; } 60% { transform: translateY(-50%) translateX(-4px) rotate(-90deg); opacity:1; } 100% { transform: translateY(-50%) translateX(-120px) rotate(-90deg); opacity:0; } }
        @keyframes handFrom2 { 0% { transform: translateX(-50%) translateY(-120px) rotate(180deg); opacity:1; } 35% { transform: translateX(-50%) translateY(8px) rotate(180deg); opacity:1; } 60% { transform: translateX(-50%) translateY(8px) rotate(180deg); opacity:1; } 100% { transform: translateX(-50%) translateY(-120px) rotate(180deg); opacity:0; } }
        @keyframes handFrom3 { 0% { transform: translateY(-50%) translateX(120px) rotate(90deg); opacity:1; } 35% { transform: translateY(-50%) translateX(-8px) rotate(90deg); opacity:1; } 60% { transform: translateY(-50%) translateX(4px) rotate(90deg); opacity:1; } 100% { transform: translateY(-50%) translateX(120px) rotate(90deg); opacity:0; } }
        .slap-hand { position: absolute; font-size: 52px; pointer-events: none; z-index: 350; line-height:1; }
        .slap-hand-0 { bottom: 0; left: 50%; animation: handFrom0 0.75s ease-out forwards; }
        .slap-hand-1 { left: 0; top: 50%; animation: handFrom1 0.75s ease-out forwards; }
        .slap-hand-2 { top: 0; left: 50%; animation: handFrom2 0.75s ease-out forwards; }
        .slap-hand-3 { right: 0; top: 50%; animation: handFrom3 0.75s ease-out forwards; }

        * { touch-action: manipulation; }
        .slap-area { touch-action: none !important; }
        body { overflow: hidden; background-color: #0f172a; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .custom-range::-webkit-slider-runnable-track { background: #334155; height: 8px; border-radius: 4px; }
        .custom-range::-webkit-slider-thumb { margin-top: -6px; height: 20px; width: 20px; border-radius: 50%; background: #fbbf24; cursor: pointer; -webkit-appearance: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, Fragment } = React;

        const Zap = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
        );
        const Trophy = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></svg>
        );
        const Users = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        );
        const Globe = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        );
        const Copy = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
        );
        const Check = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="20 6 9 17 4 12"/></svg>
        );
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
        );
        const Volume2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>
        );
        const VolumeX = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
        );

        // 九九乘法：移除 1 的乘法，乘數為 2~9。每一乘數包含 1~9 的倍數 (例如 2x1 到 2x9)，無10。
        // 9 種數值各 6 張，共 54 張牌。2人遊玩每人27張，3人遊玩每人18張，均可整除！
        const CARDS_PER_TYPE = 6;
        const MULTIPLIERS = [2, 3, 4, 5, 6, 7, 8, 9];

        const isDangerousPair = (cardVal, targetVal) => {
            const pairs = [
                [16, 18], [18, 16], [12, 21], [21, 12], 
                [24, 42], [42, 24], [18, 81], [81, 18], 
                [45, 54], [54, 45], [27, 72], [72, 27],
                [36, 63], [63, 36], [14, 41], [41, 14],
                [16, 61], [61, 16], [28, 82], [82, 28]
            ];
            return pairs.some(p => p[0] === cardVal && p[1] === targetVal);
        };

        // 使用 Unicode 跳脫字元，徹底避免任何檔案編碼問題
        const toChineseNum = (n) => {
            const mapping = { 
                0: "\u96f6", 1: "\u4e00", 2: "\u4e8c", 3: "\u4e09", 4: "\u56db", 
                5: "\u4e94", 6: "\u516d", 7: "\u4e03", 8: "\u516b", 9: "\u4e5d" 
            };
            if (n < 10) return mapping[n];
            if (n === 10) return "\u5341";
            if (n < 20) return "\u5341" + mapping[n % 10];
            if (n % 10 === 0) return mapping[Math.floor(n / 10)] + "\u5341";
            return mapping[Math.floor(n / 10)] + "\u5341" + mapping[n % 10];
        };

        const getChantText = (m, s, p) => {
            return toChineseNum(m) + toChineseNum(s) + toChineseNum(p);
        };

        const PEER_CONFIG = {
            host: '0.peerjs.com',
            port: 443,
            secure: true,
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' }
                ]
            }
        };

        const App = () => {
            // 基本遊戲狀態
            const [gameState, setGameState] = useState('menu'); // menu, lobby, dealing, starting, playing, slapping, gameOver
            const [mainTab, setMainTab] = useState('local'); // 'local' | 'online'
            const [playerCount, setPlayerCount] = useState(2); // 2 | 3 人遊玩
            const [multiplier, setMultiplier] = useState(2);
            const [difficulty, setDifficulty] = useState('easy'); // 'easy' (1->9), 'hard' (9->1)
            const [aiLevel, setAiLevel] = useState('normal'); // 'easy', 'normal', 'hard'

            // 連線相關狀態
            const [isOnline, setIsOnline] = useState(false);
            const [isHost, setIsHost] = useState(false);
            const [myPlayerName, setMyPlayerName] = useState(() => '玩家' + Math.floor(Math.random() * 900 + 100));
            const [mySeatIndex, setMySeatIndex] = useState(0);
            const [roomCode, setRoomCode] = useState('');
            const [joinInputCode, setJoinInputCode] = useState('');
            const [roomPlayers, setRoomPlayers] = useState([]);
            const [copied, setCopied] = useState(false);
            const [connStatus, setConnStatus] = useState('');

            // 牌局運行狀態
            const [players, setPlayers] = useState([]);
            const [turn, setTurn] = useState(0);
            const [currentStep, setCurrentStep] = useState(1);
            const [centerPile, setCenterPile] = useState([]);
            const [mainDeck, setMainDeck] = useState([]);
            const [slapResults, setSlapResults] = useState([]);
            const [winner, setWinner] = useState(null);
            const [isMuted, setIsMuted] = useState(false);
            const [dealingProgress, setDealingProgress] = useState(0); 
            const [flyingCard, setFlyingCard] = useState(null); 
            const [punishingCard, setPunishingCard] = useState(null); 
            const [isPenaltyCooling, setIsPenaltyCooling] = useState(false);
            const [isAnimating, setIsAnimating] = useState(false);
            const [currentCall, setCurrentCall] = useState(null); 
            const [startPrompt, setStartPrompt] = useState(""); 
            const [errorMsg, setErrorMsg] = useState(""); 
            const [showIdleHint, setShowIdleHint] = useState(false); 
            const [slapRipple, setSlapRipple] = useState(false);
            const [slapHands, setSlapHands] = useState([]);
            const [scale, setScale] = useState(1);

            const timeoutRef = useRef(null);
            const idleTimerRef = useRef(null);
            const audioCtxRef = useRef(null);
            const aiSlapScheduledRef = useRef(false);
            const flippedCardRef = useRef(null);
            const isFlipResolvedRef = useRef(false);

            // PeerJS 連線 Refs
            const peerRef = useRef(null);
            const hostConnsRef = useRef([]); // host 專用：所有客戶端連線
            const clientConnRef = useRef(null); // client 專用：連到 host 的連線

            // 狀態即時 Refs
            const gameStateRef = useRef(gameState);
            const playersRef = useRef(players);
            const centerPileRef = useRef(centerPile);
            const turnRef = useRef(turn);
            const currentStepRef = useRef(currentStep);
            const multiplierRef = useRef(multiplier);
            const difficultyRef = useRef(difficulty);
            const playerCountRef = useRef(playerCount);
            const roomPlayersRef = useRef(roomPlayers);
            const roomCodeRef = useRef(roomCode);
            const punishingCardRef = useRef(null);
            const isPenaltyCoolingRef = useRef(false);
            const penaltyScheduledRef = useRef(false);
            const isOnlineRef = useRef(isOnline);
            const isHostRef = useRef(isHost);
            const mySeatIndexRef = useRef(0);

            useEffect(() => { gameStateRef.current = gameState; }, [gameState]);
            useEffect(() => { playersRef.current = players; }, [players]);
            useEffect(() => { centerPileRef.current = centerPile; }, [centerPile]);
            useEffect(() => { turnRef.current = turn; }, [turn]);
            useEffect(() => { currentStepRef.current = currentStep; }, [currentStep]);
            useEffect(() => { multiplierRef.current = multiplier; }, [multiplier]);
            useEffect(() => { difficultyRef.current = difficulty; }, [difficulty]);
            useEffect(() => { playerCountRef.current = playerCount; }, [playerCount]);
            useEffect(() => { isOnlineRef.current = isOnline; }, [isOnline]);
            useEffect(() => { isHostRef.current = isHost; }, [isHost]);
            useEffect(() => { mySeatIndexRef.current = mySeatIndex; }, [mySeatIndex]);
            useEffect(() => { roomPlayersRef.current = roomPlayers; }, [roomPlayers]);
            useEffect(() => { roomCodeRef.current = roomCode; }, [roomCode]);
            useEffect(() => { punishingCardRef.current = punishingCard; }, [punishingCard]);
            useEffect(() => { isPenaltyCoolingRef.current = isPenaltyCooling; }, [isPenaltyCooling]);

            // 自動檢測網址是否有 ?room=XXXX 邀請碼
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const r = params.get('room');
                if (r) {
                    setJoinInputCode(r.trim());
                    setMainTab('online');
                }
            }, []);

            // 視窗自適應縮放
            useEffect(() => {
                const handleResize = () => {
                    const baseWidth = 1024;
                    const baseHeight = 768;
                    const scaleX = window.innerWidth / baseWidth;
                    const scaleY = window.innerHeight / baseHeight;
                    setScale(Math.min(scaleX, scaleY, 1));
                };
                window.addEventListener('resize', handleResize);
                handleResize();
                return () => window.removeEventListener('resize', handleResize);
            }, []);

            const isDealing = gameState === 'dealing';

            const triggerSlapHand = (playerIndex) => {
                const id = Date.now() + Math.random();
                setSlapHands(prev => [...prev, { id, playerIndex }]);
                setTimeout(() => setSlapHands(prev => prev.filter(h => h.id !== id)), 750);
            };

            const initAudio = () => {
                if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
            };

            const playSoundEffect = (type) => {
                if (isMuted) return;
                initAudio();
                const ctx = audioCtxRef.current;
                if (!ctx) return;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                if (type === 'flip' || type === 'deal') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08); gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'slap') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(220, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(40, ctx.currentTime + 0.25); gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, ctx.currentTime); osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3); gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    [440, 554, 659, 880].forEach((freq, idx) => {
                        const o = ctx.createOscillator(); const g = ctx.createGain();
                        o.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.1);
                        g.gain.setValueAtTime(0.15, ctx.currentTime + idx * 0.1);
                        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 0.3);
                        o.connect(g); g.connect(ctx.destination);
                        o.start(ctx.currentTime + idx * 0.1); o.stop(ctx.currentTime + idx * 0.1 + 0.3);
                    });
                }
            };

            // 建立 54 張牌 (1~9 各 6 張)
            const createDeck = (num) => {
                let deck = [];
                for (let i = 1; i <= 9; i++) {
                    for (let j = 0; j < CARDS_PER_TYPE; j++) {
                        deck.push({ 
                            id: `${i}-${j}-${Math.random()}`, 
                            value: num * i, 
                            stepNum: i,
                            rot: Math.random() * 20 - 10, 
                            ox: Math.random() * 10 - 5, 
                            oy: Math.random() * 10 - 5, 
                            dealRot: Math.random() * 60 - 30, 
                            dealOx: Math.random() * 30 - 15, 
                            dealOy: Math.random() * 30 - 15 
                        });
                    }
                }
                for (let i = deck.length - 1; i > 0; i--) { 
                    const j = Math.floor(Math.random() * (i + 1)); 
                    [deck[i], deck[j]] = [deck[j], deck[i]]; 
                }
                return deck;
            };

            // 取得下一個口訣步驟 (順數 1->9 或 倒數 9->1)
            const getNextStep = (step, diff) => {
                if (diff === 'easy') {
                    return step >= 9 ? 1 : step + 1;
                } else {
                    return step <= 1 ? 9 : step - 1;
                }
            };

            // 清理 PeerJS 連線
            const cleanupPeer = () => {
                if (clientConnRef.current) {
                    try { clientConnRef.current.close(); } catch(e){}
                    clientConnRef.current = null;
                }
                if (hostConnsRef.current && hostConnsRef.current.length > 0) {
                    hostConnsRef.current.forEach(c => { try { c.close(); } catch(e){} });
                    hostConnsRef.current = [];
                }
                if (peerRef.current) {
                    try { peerRef.current.destroy(); } catch(e){}
                    peerRef.current = null;
                }
                setIsOnline(false);
                setIsHost(false);
                setRoomCode('');
                setRoomPlayers([]);
                setConnStatus('');
            };

            // 廣播給所有連線客戶端 (Host 專用)
            const broadcastToClients = (data) => {
                if (!hostConnsRef.current) return;
                hostConnsRef.current.forEach(conn => {
                    if (conn && conn.open) {
                        conn.send(data);
                    }
                });
            };

            // 發送訊息給 Host (Client 專用)
            const sendToHost = (data) => {
                if (clientConnRef.current && clientConnRef.current.open) {
                    clientConnRef.current.send(data);
                }
            };

            // 創建房間 (Host)
            const handleCreateRoom = (selectedMult) => {
                cleanupPeer();
                initAudio();
                const code = Math.random().toString(36).substring(2, 8).toUpperCase();
                setRoomCode(code);
                setMultiplier(selectedMult);
                setIsOnline(true);
                setIsHost(true);
                setMySeatIndex(0);
                setConnStatus('正在建立房間伺服器...');

                const peer = new Peer('c99-' + code, PEER_CONFIG);
                peerRef.current = peer;

                peer.on('open', () => {
                    setConnStatus('房間已就緒！等待好友加入...');
                    const initialRoomPlayers = [{ seat: 0, name: myPlayerName || '房主', isHost: true }];
                    setRoomPlayers(initialRoomPlayers);
                    roomPlayersRef.current = initialRoomPlayers;
                    setGameState('lobby');
                });

                peer.on('connection', (conn) => {
                    conn.on('open', () => {
                        const currentPls = roomPlayersRef.current;
                        const targetCount = playerCountRef.current;
                        if (currentPls.length >= targetCount) {
                            conn.send({ type: 'ROOM_FULL', message: '房間人數已滿！' });
                            setTimeout(() => conn.close(), 500);
                            return;
                        }
                        const newSeat = currentPls.length;
                        hostConnsRef.current.push(conn);

                        conn.on('data', (data) => {
                            handleHostReceivedData(conn, data, newSeat);
                        });

                        conn.on('close', () => {
                            hostConnsRef.current = hostConnsRef.current.filter(c => c !== conn);
                            setRoomPlayers(prev => {
                                const remaining = prev.filter(p => p.seat !== newSeat);
                                broadcastToClients({ type: 'SYNC_LOBBY_PLAYERS', players: remaining });
                                return remaining;
                            });
                        });
                    });
                });

                peer.on('error', (err) => {
                    console.error('Peer error:', err);
                    setConnStatus('連線伺服器異常，請重試！');
                });
            };

            // Host 處理來自 Client 的訊息
            const handleHostReceivedData = (conn, data, seat) => {
                if (data.type === 'CLIENT_JOIN_REQUEST') {
                    const currentPls = roomPlayersRef.current;
                    const newPlayer = { seat: seat, name: data.playerName, isHost: false };
                    const updated = [...currentPls, newPlayer];
                    setRoomPlayers(updated);
                    roomPlayersRef.current = updated;

                    conn.send({
                        type: 'JOIN_ACCEPTED',
                        seat: seat,
                        playerCount: playerCountRef.current,
                        multiplier: multiplierRef.current,
                        difficulty: difficultyRef.current,
                        roomPlayers: updated
                    });

                    broadcastToClients({ type: 'SYNC_LOBBY_PLAYERS', players: updated });
                } else if (data.type === 'CLIENT_PLAY_CARD') {
                    if (gameStateRef.current === 'playing' && turnRef.current === data.seatIndex && !isAnimating && !punishingCardRef.current && !isPenaltyCoolingRef.current) {
                        executeCardPlay(data.seatIndex);
                    }
                } else if (data.type === 'CLIENT_SLAP') {
                    if (punishingCardRef.current || isPenaltyCoolingRef.current) return;
                    executeSlapAction(data.seatIndex);
                }
            };

            // 加入房間 (Client)
            const handleJoinRoom = () => {
                const code = joinInputCode.trim().toUpperCase();
                if (!code || code.length < 4) {
                    alert('請輸入正確的房間代碼！');
                    return;
                }
                cleanupPeer();
                initAudio();
                setRoomCode(code);
                setIsOnline(true);
                setIsHost(false);
                setConnStatus('正在連線至房間 ' + code + ' ...');

                const peer = new Peer(PEER_CONFIG);
                peerRef.current = peer;

                peer.on('open', () => {
                    const conn = peer.connect('c99-' + code, { reliable: true });
                    clientConnRef.current = conn;

                    conn.on('open', () => {
                        setConnStatus('已連上房主，傳送加入請求...');
                        conn.send({ type: 'CLIENT_JOIN_REQUEST', playerName: myPlayerName || '挑戰者' });
                    });

                    conn.on('data', (data) => {
                        handleClientReceivedData(data);
                    });

                    conn.on('close', () => {
                        alert('與房主的連線已中斷！');
                        cleanupPeer();
                        setGameState('menu');
                    });
                });

                peer.on('error', (err) => {
                    console.error('Join error:', err);
                    alert('無法連線到該房間，請確認代碼是否正確！');
                    cleanupPeer();
                });
            };

            // Client 接收來自 Host 的廣播
            const handleClientReceivedData = (data) => {
                if (data.type === 'JOIN_ACCEPTED') {
                    setMySeatIndex(data.seat);
                    mySeatIndexRef.current = data.seat;
                    setPlayerCount(data.playerCount);
                    setMultiplier(data.multiplier);
                    setDifficulty(data.difficulty);
                    setRoomPlayers(data.roomPlayers);
                    setGameState('lobby');
                    setConnStatus('已成功進入房間等待大廳！');
                } else if (data.type === 'ROOM_FULL') {
                    alert(data.message);
                    cleanupPeer();
                    setGameState('menu');
                } else if (data.type === 'SYNC_LOBBY_PLAYERS') {
                    setRoomPlayers(data.players);
                } else if (data.type === 'START_GAME_SYNC') {
                    setPlayers(data.players);
                    setMainDeck(data.mainDeck);
                    setCenterPile([]);
                    setCurrentStep(data.initialStep);
                    setCurrentCall(null);
                    setSlapResults([]);
                    setWinner(null);
                    setPunishingCard(null);
                    setErrorMsg('');
                    setShowIdleHint(false);
                    setTurn(data.startingTurn);
                    setGameState('dealing');
                    setDealingProgress(0);
                } else if (data.type === 'SYNC_CARD_FLIPPED') {
                    applyCardFlipped(data);
                } else if (data.type === 'SYNC_SLAP_TRIGGER') {
                    if (data.playerIndex !== mySeatIndexRef.current) {
                        triggerSlapHand(data.playerIndex);
                        playSoundEffect('slap');
                        setSlapRipple(true);
                        setTimeout(() => setSlapRipple(false), 500);
                    }
                } else if (data.type === 'SYNC_MATCH_SLAP') {
                    setGameState('slapping');
                    setSlapResults(data.slapResults);
                } else if (data.type === 'SYNC_PENALTY') {
                    applyPenalty(data.loserIndex, data.pileSnapshot, data.nextTurn, data.nextStep, data.updatedPlayers);
                } else if (data.type === 'SYNC_MISSLAP_PENALTY') {
                    playSoundEffect('error');
                    setErrorMsg(data.errorMsg);
                    applyPenalty(data.playerIndex, data.pileSnapshot, data.nextTurn, data.nextStep, data.updatedPlayers);
                } else if (data.type === 'SYNC_GAME_OVER') {
                    playSoundEffect('win');
                    setWinner(data.winner);
                    setGameState('gameOver');
                } else if (data.type === 'PLAYER_DISCONNECTED') {
                    setErrorMsg(data.message);
                    setTimeout(() => {
                        setGameState('menu');
                        cleanupPeer();
                    }, 2500);
                }
            };

            // 開始單機遊戲
            const startLocalGame = (num) => {
                cleanupPeer();
                initAudio();
                if (window.speechSynthesis) {
                    window.speechSynthesis.cancel();
                    window.speechSynthesis.resume();
                    const silent = new SpeechSynthesisUtterance('');
                    window.speechSynthesis.speak(silent);
                }

                setMultiplier(num);
                multiplierRef.current = num;
                const deck = createDeck(num);

                const avatarList = [
                    { name: myPlayerName || '你', avatar: '🧑‍🎓', isAI: false },
                    { name: '兔寶電腦', avatar: '🐰', isAI: true },
                    { name: '熊寶電腦', avatar: '🐻', isAI: true }
                ];

                const initialPlayers = Array.from({ length: playerCount }, (_, i) => ({
                    id: i,
                    name: avatarList[i].name,
                    avatar: avatarList[i].avatar,
                    cards: [],
                    isAI: avatarList[i].isAI
                }));

                setPlayers(initialPlayers);
                setMainDeck(deck);
                setCenterPile([]);
                centerPileRef.current = [];
                setCurrentStep(difficulty === 'easy' ? 1 : 9);
                currentStepRef.current = difficulty === 'easy' ? 1 : 9;
                setCurrentCall(null);
                setSlapResults([]);
                setWinner(null);
                setPunishingCard(null);
                setIsPenaltyCooling(false);
                setErrorMsg("");
                setShowIdleHint(false);
                setTurn(0);
                turnRef.current = 0;
                aiSlapScheduledRef.current = false;
                penaltyScheduledRef.current = false;
                setGameState('dealing');
                setDealingProgress(0);
            };

            // 連線模式：房主點擊「開始遊戲」
            const startOnlineGame = () => {
                if (!isHost) return;
                initAudio();
                const curMult = multiplierRef.current;
                const deck = createDeck(curMult);

                const initialPlayers = roomPlayers.map((rp, idx) => ({
                    id: idx,
                    name: rp.name,
                    avatar: idx === 0 ? '👑' : (idx === 1 ? '🦊' : '🐼'),
                    cards: [],
                    isAI: false
                }));

                const initialStepVal = difficultyRef.current === 'easy' ? 1 : 9;
                const startingTurnVal = 0;

                setPlayers(initialPlayers);
                setMainDeck(deck);
                setCenterPile([]);
                centerPileRef.current = [];
                setCurrentStep(initialStepVal);
                currentStepRef.current = initialStepVal;
                setCurrentCall(null);
                setSlapResults([]);
                setWinner(null);
                setPunishingCard(null);
                setIsPenaltyCooling(false);
                setErrorMsg("");
                setShowIdleHint(false);
                setTurn(startingTurnVal);
                turnRef.current = startingTurnVal;
                setGameState('dealing');
                setDealingProgress(0);

                broadcastToClients({
                    type: 'START_GAME_SYNC',
                    players: initialPlayers,
                    mainDeck: deck,
                    initialStep: initialStepVal,
                    startingTurn: startingTurnVal
                });
            };

            // 發牌循環效果 (平均分給 2 人各 27 張，或 3 人各 18 張)
            useEffect(() => {
                if (gameState === 'dealing') {
                    if (dealingProgress < 54 && mainDeck.length > 0) {
                        const timer = setTimeout(() => {
                            playSoundEffect('deal');
                            const targetSeat = dealingProgress % playerCount;
                            setPlayers(prev => prev.map((p, idx) => 
                                idx === targetSeat 
                                    ? { ...p, cards: [...p.cards, mainDeck[mainDeck.length - 1]] }
                                    : p
                            ));
                            setMainDeck(prev => prev.slice(0, -1));
                            setDealingProgress(prev => prev + 1);
                        }, 25);
                        return () => clearTimeout(timer);
                    } else if (dealingProgress >= 54) {
                        setGameState('starting');
                        setStartPrompt("3");
                        setTimeout(() => setStartPrompt("2"), 700);
                        setTimeout(() => setStartPrompt("1"), 1400);
                        setTimeout(() => {
                            setStartPrompt("開始！");
                            setTimeout(() => {
                                setGameState('playing');
                                setStartPrompt("");
                            }, 500);
                        }, 2100);
                    }
                }
            }, [gameState, dealingProgress, mainDeck, players, playerCount]);

            // 計算下一個有手牌的玩家
            const findNextPlayerWithCards = (currentTurn, currentPlayers) => {
                const countTotal = currentPlayers.length;
                let next = (currentTurn + 1) % countTotal;
                let loops = 0;
                while (currentPlayers[next].cards.length === 0 && loops < countTotal) {
                    next = (next + 1) % countTotal;
                    loops++;
                }
                return loops >= countTotal ? null : next;
            };

            // 執行受罰回歸動畫與手牌歸屬
            const applyPenalty = (loserIndex, pileSnapshot, nextTurn, nextStep, updatedPlayers) => {
                if (punishingCardRef.current) return;
                playSoundEffect('slap');
                setPunishingCard({ toPlayer: loserIndex, pileSnapshot: pileSnapshot.slice(-8) });
                setCurrentCall(null);

                // 第一階段：出牌飛到最慢拍的玩家動畫 (800ms)
                setTimeout(() => {
                    setPlayers(updatedPlayers);
                    setCenterPile([]);
                    centerPileRef.current = [];
                    setSlapResults([]);
                    setPunishingCard(null);
                    setTurn(nextTurn);
                    setCurrentStep(nextStep);
                    setIsPenaltyCooling(true);
                    isPenaltyCoolingRef.current = true;

                    const loserName = updatedPlayers[loserIndex]?.name || '';
                    setErrorMsg(`${loserName} 拍最慢，收下所有牌！`);

                    // 第二階段：明確間隔冷卻時間 (800ms)，確保動畫結束後不黏在一起，再翻開下一張牌
                    setTimeout(() => {
                        setErrorMsg("");
                        setIsPenaltyCooling(false);
                        isPenaltyCoolingRef.current = false;
                        setGameState('playing');
                        aiSlapScheduledRef.current = false;
                        penaltyScheduledRef.current = false;
                    }, 800);
                }, 800);
            };

            // 執行出牌 (統一路徑)
            const executeCardPlay = (fromSeat) => {
                if (gameStateRef.current !== 'playing' || isAnimating || punishingCardRef.current || isPenaltyCoolingRef.current) return;
                const currentPls = playersRef.current;
                if (!currentPls[fromSeat] || currentPls[fromSeat].cards.length === 0) return;

                playSoundEffect('flip');
                setIsAnimating(true);
                setShowIdleHint(false);

                const newPlayers = [...currentPls];
                const card = newPlayers[fromSeat].cards.pop();
                flippedCardRef.current = card;
                isFlipResolvedRef.current = false;

                const curStep = currentStepRef.current;
                const curMult = multiplierRef.current;
                const callValue = curMult * curStep;
                const isMatch = (card.value === callValue);

                const callText = `${curMult} × ${curStep} = ${callValue}`;
                const chantText = getChantText(curMult, curStep, callValue);

                // 計算下一個輪到誰
                let nextTurnVal = fromSeat;
                let nextStepVal = curStep;
                if (!isMatch) {
                    const next = findNextPlayerWithCards(fromSeat, newPlayers);
                    nextTurnVal = next !== null ? next : fromSeat;
                    nextStepVal = getNextStep(curStep, difficultyRef.current);
                }

                const eventData = {
                    type: 'SYNC_CARD_FLIPPED',
                    fromSeat: fromSeat,
                    card: card,
                    callValue: callValue,
                    callText: callText,
                    chantText: chantText,
                    isMatch: isMatch,
                    updatedPlayers: newPlayers,
                    nextTurn: nextTurnVal,
                    nextStep: nextStepVal
                };

                if (isOnlineRef.current && isHostRef.current) {
                    broadcastToClients(eventData);
                }
                applyCardFlipped(eventData);
            };

            // 客端與本機共用出牌動畫
            const applyCardFlipped = (data) => {
                playSoundEffect('flip');
                setIsAnimating(true);
                setShowIdleHint(false);
                flippedCardRef.current = data.card;
                isFlipResolvedRef.current = false;

                // 顯示出牌者口訣氣泡
                setCurrentCall({ playerIdx: data.fromSeat, text: data.callText });

                // 朗讀口訣：若開啟聲音，電腦出牌或對手出牌必定朗讀口訣；自己出牌亦提供語音回饋
                let speechPromise = Promise.resolve();
                if (!isMuted && window.speechSynthesis) {
                    speechPromise = new Promise((resolve) => {
                        try {
                            window.speechSynthesis.cancel();
                            window.speechSynthesis.resume();
                            const utterance = new SpeechSynthesisUtterance(data.chantText);
                            utterance.lang = 'zh-TW';
                            utterance.rate = 1.0;
                            let resolved = false;
                            const done = () => { if (!resolved) { resolved = true; resolve(); } };
                            utterance.onend = done;
                            utterance.onerror = done;
                            setTimeout(done, 1200); // 1.2 秒超時安全保護
                            window.speechSynthesis.speak(utterance);
                        } catch(e) {
                            resolve();
                        }
                    });
                }
                window.currentSpeechPromise = speechPromise;

                setFlyingCard({ value: data.card.value, fromPlayer: data.fromSeat });

                // 單機模式：翻出相符牌 (isMatch) 時，電腦排程拍牌！
                if (!isOnlineRef.current && data.isMatch) {
                    aiSlapScheduledRef.current = true;
                    const curPls = playersRef.current;
                    curPls.forEach((p, idx) => {
                        if (p.isAI) {
                            const baseTime = aiLevel === 'easy' ? 1000 : (aiLevel === 'normal' ? 700 : 480);
                            const delay = baseTime + Math.random() * 200;
                            setTimeout(() => {
                                if ((gameStateRef.current === 'playing' || gameStateRef.current === 'slapping') && !punishingCardRef.current && !penaltyScheduledRef.current) {
                                    executeSlapAction(idx);
                                }
                            }, delay);
                        }
                    });
                } else if (!isOnlineRef.current && !data.isMatch) {
                    // 電腦誘敵拍錯
                    const curPls = playersRef.current;
                    curPls.forEach((p, idx) => {
                        if (p.isAI && isDangerousPair(data.card.value, data.callValue)) {
                            const chance = aiLevel === 'easy' ? 0.35 : aiLevel === 'normal' ? 0.20 : 0.06;
                            if (Math.random() < chance) {
                                const delay = Math.random() * 300 + 450;
                                setTimeout(() => {
                                    if (gameStateRef.current === 'playing' && !punishingCardRef.current && !penaltyScheduledRef.current) {
                                        executeSlapAction(idx);
                                    }
                                }, delay);
                            }
                        }
                    });
                }

                const advanceTurn = () => {
                    if (isFlipResolvedRef.current) return;
                    isFlipResolvedRef.current = true;
                    setCenterPile(prev => [...prev, data.card]);
                    centerPileRef.current = [...centerPileRef.current, data.card];
                    setFlyingCard(null);
                    setPlayers(data.updatedPlayers);

                    if (data.isMatch) {
                        setGameState('slapping');
                        setIsAnimating(false);
                    } else {
                        setTurn(data.nextTurn);
                        setCurrentStep(data.nextStep);
                        setIsAnimating(false);
                    }
                };

                setTimeout(() => {
                    const speechDone = window.currentSpeechPromise || Promise.resolve();
                    speechDone.then(advanceTurn);
                }, 500);
            };

            // 點卡牌出牌
            const playTurn = (isManual = false) => {
                if (gameState !== 'playing' || isAnimating || punishingCardRef.current || isPenaltyCoolingRef.current) return;
                if (isManual && turn !== mySeatIndex) return;

                if (isOnline) {
                    if (isHost) {
                        executeCardPlay(0);
                    } else {
                        sendToHost({ type: 'CLIENT_PLAY_CARD', seatIndex: mySeatIndex });
                    }
                } else {
                    executeCardPlay(turn);
                }
            };

            // 執行拍牌動作
            const executeSlapAction = (playerIndex) => {
                if (punishingCardRef.current || isPenaltyCoolingRef.current) return;
                if (window.speechSynthesis) window.speechSynthesis.cancel();
                const curPile = centerPileRef.current;
                const curCardVal = flyingCard ? flyingCard.value : (curPile.length > 0 ? curPile[curPile.length - 1].value : (flippedCardRef.current ? flippedCardRef.current.value : null));
                if (curCardVal === null) return;

                const curMult = multiplierRef.current;
                const curStep = currentStepRef.current;
                const isMatch = (curCardVal === curMult * curStep);
                const curPls = playersRef.current;
                const totalCount = curPls.length;

                // 觸發拍牌手勢與音效 (手部動畫 750ms)
                triggerSlapHand(playerIndex);
                playSoundEffect('slap');
                setSlapRipple(true);
                setTimeout(() => setSlapRipple(false), 500);

                if (isOnlineRef.current && isHostRef.current) {
                    broadcastToClients({ type: 'SYNC_SLAP_TRIGGER', playerIndex });
                }

                // 正確拍牌
                if ((gameStateRef.current === 'playing' && isMatch) || gameStateRef.current === 'slapping') {
                    if (gameStateRef.current === 'playing') {
                        if (!isFlipResolvedRef.current && flippedCardRef.current) {
                            isFlipResolvedRef.current = true;
                            setCenterPile(prev => [...prev, flippedCardRef.current]);
                            centerPileRef.current = [...centerPileRef.current, flippedCardRef.current];
                            setFlyingCard(null);
                            setIsAnimating(false);
                        }
                        setGameState('slapping');
                    }

                    setSlapResults(prev => {
                        if (prev.includes(playerIndex)) return prev;
                        const newResults = [...prev, playerIndex];

                        if (isOnlineRef.current && isHostRef.current) {
                            broadcastToClients({ type: 'SYNC_MATCH_SLAP', slapResults: newResults });
                        }

                        // 如果該玩家手牌已為0，且成功在前 (N-1) 名拍下，則獲勝！
                        if (curPls[playerIndex].cards.length === 0 && newResults.length <= totalCount - 1) {
                            const winPl = curPls[playerIndex];
                            playSoundEffect('win');
                            setWinner(winPl);
                            setGameState('gameOver');
                            if (isOnlineRef.current && isHostRef.current) {
                                broadcastToClients({ type: 'SYNC_GAME_OVER', winner: winPl });
                            }
                            return newResults;
                        }

                        // 當已有 (playerCount - 1) 位玩家拍牌，剩下最後 1 人即為輸家受罰！
                        if (newResults.length === totalCount - 1 && !penaltyScheduledRef.current) {
                            penaltyScheduledRef.current = true;
                            const allSeats = Array.from({ length: totalCount }, (_, i) => i);
                            const loserIndex = allSeats.find(idx => !newResults.includes(idx));
                            const activePile = centerPileRef.current.length > 0 ? centerPileRef.current : (flippedCardRef.current ? [flippedCardRef.current] : []);
                            const nextStepVal = getNextStep(currentStepRef.current, difficultyRef.current);

                            const updatedPlayers = curPls.map((p, idx) => 
                                idx === loserIndex 
                                    ? { ...p, cards: [...activePile, ...p.cards] } 
                                    : p
                            );

                            const loserName = curPls[loserIndex]?.name || '';
                            setErrorMsg(`${loserName} 拍最慢！`);

                            // 重要：先確定所有玩家拍牌的動畫都結束 (750ms)，延遲 850ms 後再做出牌飛到最慢拍的玩家的動畫！
                            setTimeout(() => {
                                if (isOnlineRef.current && isHostRef.current) {
                                    broadcastToClients({
                                        type: 'SYNC_PENALTY',
                                        loserIndex: loserIndex,
                                        pileSnapshot: activePile,
                                        nextTurn: loserIndex,
                                        nextStep: nextStepVal,
                                        updatedPlayers: updatedPlayers
                                    });
                                }
                                applyPenalty(loserIndex, activePile, loserIndex, nextStepVal, updatedPlayers);
                            }, 850);
                        }
                        return newResults;
                    });
                } else if (gameStateRef.current === 'playing' && !isMatch) {
                    // 拍錯了！單獨受罰
                    if (slapResults.length === 0 && !penaltyScheduledRef.current) {
                        penaltyScheduledRef.current = true;
                        playSoundEffect('error');
                        triggerSlapHand(playerIndex);
                        const err = `${curPls[playerIndex].name} 拍錯了！`;
                        setErrorMsg(err);
                        setSlapResults([playerIndex]);
                        setGameState('slapping');

                        let activePile = centerPileRef.current;
                        if (!isFlipResolvedRef.current && flippedCardRef.current) {
                            isFlipResolvedRef.current = true;
                            activePile = [...activePile, flippedCardRef.current];
                            setCenterPile(activePile);
                            centerPileRef.current = activePile;
                            setFlyingCard(null);
                            setIsAnimating(false);
                        }

                        const nextStepVal = getNextStep(currentStepRef.current, difficultyRef.current);
                        const updatedPlayers = curPls.map((p, idx) => 
                            idx === playerIndex 
                                ? { ...p, cards: [...activePile, ...p.cards] } 
                                : p
                        );

                        // 等待拍牌手部動作結束 (850ms) 再執行牌卡飛回收牌
                        setTimeout(() => {
                            if (isOnlineRef.current && isHostRef.current) {
                                broadcastToClients({
                                    type: 'SYNC_MISSLAP_PENALTY',
                                    playerIndex: playerIndex,
                                    errorMsg: err,
                                    pileSnapshot: activePile,
                                    nextTurn: playerIndex,
                                    nextStep: nextStepVal,
                                    updatedPlayers: updatedPlayers
                                });
                            }
                            applyPenalty(playerIndex, activePile, playerIndex, nextStepVal, updatedPlayers);
                        }, 850);
                    }
                }
            };

            // 玩家點擊拍牌區
            const handleSlap = (playerIndex) => {
                if (punishingCardRef.current || isPenaltyCoolingRef.current) return;
                if (isOnline) {
                    if (isHost) {
                        executeSlapAction(0);
                    } else {
                        // Client 觸發本地音效與手部，並送給 Host
                        triggerSlapHand(mySeatIndex);
                        playSoundEffect('slap');
                        setSlapRipple(true);
                        setTimeout(() => setSlapRipple(false), 500);
                        sendToHost({ type: 'CLIENT_SLAP', seatIndex: mySeatIndex });
                    }
                } else {
                    executeSlapAction(playerIndex);
                }

                    idleTimerRef.current = setTimeout(() => {
                        setShowIdleHint(true);

                    setShowIdleHint(false);

                return () => clearTimeout(idleTimerRef.current);

            useEffect(() => {

                    const delay = 1000; // 穩定保持 1 秒節奏，絕不在 100ms 瞬間出牌
                    timeoutRef.current = setTimeout(() => playTurn(false), delay);

                return () => clearTimeout(timeoutRef.current);

            useEffect(() => {

                const total = players.length || playerCount;
                const rel = (seatIdx - mySeatIndex + total) % total;

                    return rel === 0 ? 0 : 2; // 0: 底部, 2: 頂端

                                                        <div className="flex items-center gap-1.5">
                                                            <span className="font-extrabold text-sm text-white">{p.name}</span>
                                                            {isMe && <span className="text-[10px] font-bold bg-amber-400 text-slate-900 px-1.5 py-0.2 rounded">你</span>}
                                                            {p.isAI && <span className="text-[10px] font-bold bg-indigo-500 text-white px-1.5 py-0.2 rounded">電腦</span>}
                                                        </div>
                                                        <div className="text-xs text-amber-400 font-bold">
                                                            剩餘手牌：<span className="text-sm font-black text-white">{p.cards.length}</span> 張
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* 玩家手牌堆 (點擊出牌) */}
                                                <div 
                                                    className="relative mt-2 cursor-pointer group"
                                                    onClick={() => isMe && playTurn(true)}
                                                >
                                                    <div className={`relative w-24 h-32 rounded-xl transition-transform duration-200 ${isCurrentTurn && isMe && !isAnimating && !punishingCard && !isPenaltyCooling ? 'ring-4 ring-amber-400 shadow-[0_0_20px_rgba(251,191,36,0.6)] animate-pulse scale-105' : ''}`}>
                                                        {p.cards.length > 0 ? (
                                                            [...Array(Math.min(p.cards.length, 12))].map((_, i) => (
                                                                <div 
                                                                    key={i} 
                                                                    className="absolute inset-0 bg-blue-600 rounded-xl border-2 border-white shadow-md flex items-center justify-center"
                                                                    style={{ transform: `translate(${i * 1.5}px, ${-i * 1.5}px)` }}
                                                                >
                                                                    <div className="w-16 h-24 border border-blue-400/40 rounded-lg flex items-center justify-center">
                                                                        <span className="text-xl font-black text-white/40">99</span>
                                                                    </div>
                                                                </div>
                                                            ))
                                                        ) : (
                                                            <div className="w-24 h-32 border-2 border-dashed border-slate-600 rounded-xl flex items-center justify-center text-slate-500 font-bold text-xs">
                                                                已無手牌
                                                            </div>
                                                        )}
                                                    </div>

                                                    {/* 輪到出牌氣泡 */}
                                                    {currentCall && currentCall.playerIdx === idx && (
                                                        <div className={`absolute ${conf.call} z-30 bg-white text-slate-900 px-4 py-2 rounded-2xl font-black text-base shadow-2xl border-2 border-amber-400 animate-bounce whitespace-nowrap`}>
                                                            {currentCall.text}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        </Fragment>
                                    );
                                })}

                                {/* 中央出牌與拍牌區 */}
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-52 h-64">
                                    <div 
                                        className={`relative w-full h-full bg-emerald-800/40 rounded-[40px] border-4 border-dashed transition-all duration-300 flex items-center justify-center cursor-pointer select-none slap-area ${gameState === 'slapping' ? 'border-amber-400 shadow-[0_0_35px_rgba(251,191,36,0.8)] scale-105 bg-amber-500/20' : 'border-emerald-600/50 hover:border-emerald-400/80 hover:bg-emerald-800/60'}`}
                                        onClick={() => handleSlap(mySeatIndex)}
                                    >
                                        {/* 發牌動畫展示 */}
                                        {isDealing ? (
                                            <div className="relative w-36 h-48">
                                                {[...Array(Math.min(mainDeck.length, 20))].map((_, i) => (
                                                    <div key={i} className="absolute inset-0 bg-blue-500 rounded-2xl shadow-xl border-2 border-white" style={{ transform: `translate(${i}px, ${-i}px)` }} />
                                                ))}
                                                {dealingProgress < 54 && (
                                                    <div className={`fixed top-1/2 left-1/2 w-20 h-28 bg-blue-500 rounded-xl border-2 border-white z-50 animate-deal-${getRelativeSlot(dealingProgress % playerCount)}`} />
                                                )}
                                            </div>
                                        ) : punishingCard ? (
                                            /* 受罰牌堆飛往輸家動畫 */
                                            <div className="relative w-36 h-48">
                                                {punishingCard.pileSnapshot.map((card, i) => (
                                                    <div 
                                                        key={card.id || i} 
                                                        className={`absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center text-5xl font-black text-slate-900 border-4 border-slate-50 animate-return-${getRelativeSlot(punishingCard.toPlayer)}`}
                                                        style={{ zIndex: i }}
                                                    >
                                                        {i === punishingCard.pileSnapshot.length - 1 ? card.value : ""}
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (centerPile.length > 0 || flyingCard) ? (
                                            /* 中央牌堆正常顯示 */
                                            <div className="relative w-36 h-48">
                                                {centerPile.slice(-8).map((card, i) => (
                                                    <div key={card.id} className="absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center text-5xl font-black text-slate-900 border-4 border-slate-50" style={{ transform: `rotate(${card.rot}deg) translate(${card.ox}px, ${card.oy}px)`, zIndex: i }}>
                                                        {i === centerPile.slice(-8).length - 1 ? card.value : ""}
                                                    </div>
                                                ))}
                                                {flyingCard && (
                                                    <div className={`absolute inset-0 bg-white rounded-2xl shadow-2xl flex items-center justify-center text-5xl font-black text-slate-900 border-4 border-amber-300 z-50 animate-fly-${getRelativeSlot(flyingCard.fromPlayer)}`}>
                                                        {flyingCard.value}
                                                    </div>
                                                )}
                                            </div>
                                        ) : (gameState !== 'dealing') && (
                                            <div className="text-white/20 font-black text-lg uppercase tracking-widest text-center pointer-events-none">
                                                乘法心臟病<br/><span className="text-xs">相符立即拍牌！</span>
                                            </div>
                                        )}

                                        {/* 拍牌特效 */}
                                        {slapRipple && <div className="slap-ripple" />}
                                        {slapHands.map(h => (
                                            <div key={h.id} className={`slap-hand slap-hand-${getRelativeSlot(h.playerIndex)}`}>
                                                ✋
                                            </div>
                                        ))}

                                        {/* 錯誤或狀態提示 */}
                                        {errorMsg && (
                                            <div className="absolute z-[160] bg-yellow-400 px-5 py-3 rounded-2xl border-4 border-yellow-500 text-yellow-950 font-black shadow-2xl animate-bounce text-center whitespace-nowrap">
                                                <h3 className="text-xl font-black">{errorMsg}</h3>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 閒置提示 */}
                                {showIdleHint && (
                                    <div className="fixed bottom-40 left-1/2 -translate-x-1/2 z-[100] bg-white text-emerald-800 px-6 py-2.5 rounded-full font-black text-sm shadow-2xl border-2 border-emerald-500 animate-bounce flex items-center gap-2">
                                        <AlertCircle className="text-yellow-500" /> 輪到你出牌囉！點擊你的手牌出牌！
                                    </div>
                                )}
                            </Fragment>
                        )}

                        {/* 開局倒數 3, 2, 1 */}
                        {gameState === 'starting' && (
                            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm pointer-events-none">
                                <h2 className="text-8xl font-black text-amber-400 animate-ping">
                                    {startPrompt}
                                </h2>
                            </div>
                        )}

                        {/* 遊戲結束勝利畫面 */}
                        {gameState === 'gameOver' && winner && (
                            <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/90 backdrop-blur-md">
                                <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center max-w-sm flex flex-col items-center">
                                    <Trophy size={64} className="text-amber-400 mb-2 animate-bounce" />
                                    <h2 className="text-3xl font-black text-white mb-2">🎉 恭喜獲勝！</h2>
                                    <div className="text-5xl my-2">{winner.avatar}</div>
                                    <div className="text-2xl font-black text-amber-300 mb-1">{winner.name}</div>
                                    <p className="text-slate-400 text-sm mb-6">成功出完所有手牌，奪得冠軍！</p>
                                    <div className="flex gap-3 w-full">
                                        <button 
                                            onClick={() => {
                                                if (isOnline) {
                                                    if (isHost) startOnlineGame();
                                                } else {
                                                    startLocalGame(multiplier);
                                                }
                                            }}
                                            className="flex-1 py-3 bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-xl font-black text-sm shadow-lg active:scale-95 transition"
                                        >
                                            再玩一局
                                        </button>
                                        <button 
                                            onClick={() => {
                                                cleanupPeer();
                                                setGameState('menu');
                                            }}
                                            className="flex-1 py-3 bg-slate-700 hover:bg-slate-600 text-white rounded-xl font-black text-sm active:scale-95 transition"
                                        >
                                            回主選單
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
