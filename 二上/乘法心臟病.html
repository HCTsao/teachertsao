        @keyframes flyFromBottom { 0% { transform: translate(-50%, 300px) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes flyFromLeft { 0% { transform: translate(-500px, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes flyFromTop { 0% { transform: translate(-50%, -400px) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        @keyframes flyFromRight { 0% { transform: translate(400px, -50%) scale(0.5); opacity: 0; } 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
        
        /* 受罰回歸路徑 */
        @keyframes returnTo0 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, 400px) scale(0.5); opacity: 0; } }
        @keyframes returnTo1 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-600px, -50%) scale(0.5); opacity: 0; } }
        @keyframes returnTo2 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -500px) scale(0.5); opacity: 0; } }
        @keyframes returnTo3 { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(500px, -50%) scale(0.5); opacity: 0; } }

        /* 初始發牌路徑 */
        @keyframes dealTo0 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%, 300px) rotate(var(--rot)); opacity: 1; } }
        @keyframes dealTo1 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(-500px, -50%) rotate(var(--rot)); opacity: 1; } }
        @keyframes dealTo2 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(-50%, -400px) rotate(var(--rot)); opacity: 1; } }
        @keyframes dealTo3 { 0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; } 100% { transform: translate(400px, -50%) rotate(var(--rot)); opacity: 1; } }

        .animate-fly-0 { animation: flyFromBottom 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fly-1 { animation: flyFromLeft 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fly-2 { animation: flyFromTop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        .animate-fly-3 { animation: flyFromRight 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        .animate-return-0 { animation: returnTo0 0.8s ease-in forwards; }
        .animate-return-1 { animation: returnTo1 0.8s ease-in forwards; }
        .animate-return-2 { animation: returnTo2 0.8s ease-in forwards; }
        .animate-return-3 { animation: returnTo3 0.8s ease-in forwards; }

        .animate-deal-0 { animation: dealTo0 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: 15deg; }
        .animate-deal-1 { animation: dealTo1 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: -20deg; }
        .animate-deal-2 { animation: dealTo2 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: 45deg; }
        .animate-deal-3 { animation: dealTo3 0.5s cubic-bezier(0.1, 0.5, 0.5, 1) forwards; --rot: -10deg; }

        * { touch-action: manipulation; }
        body { overflow: hidden; background-color: #0f172a; margin: 0; font-family: system-ui, -apple-system, sans-serif; }
        .custom-range::-webkit-slider-runnable-track { background: #334155; height: 8px; border-radius: 4px; }

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useRef, Fragment } = React;

        const Zap = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" /></svg>
        );
        const Trophy = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6" /><path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18" /><path d="M4 22h16" /><path d="M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22" /><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22" /><path d="M18 2H6v7a6 6 0 0 0 12 0V2Z" /></svg>
        );
        const Home = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" /><polyline points="9 22 9 12 15 12 15 22" /></svg>
        );
        const AlertCircle = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10" /><line x1="12" y1="8" x2="12" y2="12" /><line x1="12" y1="16" x2="12.01" y2="16" /></svg>
        );
        const Volume2 = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><path d="M15.54 8.46a5 5 0 0 1 0 7.07" /><path d="M19.07 4.93a10 10 0 0 1 0 14.14" /></svg>
        );
        const VolumeX = ({ size = 24, className = "" }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" /><line x1="23" y1="9" x2="17" y2="15" /><line x1="17" y1="9" x2="23" y2="15" /></svg>
        );

        const PLAYERS_COUNT = 4;
        const CARDS_PER_TYPE = 6;
        const MULTIPLIERS = [2, 3, 4, 5, 6, 7, 8, 9, 10];

        const isDangerousPair = (cardVal, targetVal) => {
            const pairs = [
                [10, 20], [20, 10], [16, 18], [18, 16], [12, 21], [21, 12], 
                [24, 42], [42, 24], [40, 80], [80, 40], [60, 90], [90, 60],
                [18, 81], [81, 18], [45, 54], [54, 45], [27, 72], [72, 27]
            ];
            return pairs.some(p => p[0] === cardVal && p[1] === targetVal);
        };

        const App = () => {
            const [gameState, setGameState] = useState('menu'); 
            const [multiplier, setMultiplier] = useState(2);
            const [difficulty, setDifficulty] = useState('easy'); 
            const [aiLevel, setAiLevel] = useState('normal'); 
            const [players, setPlayers] = useState([]);
            const [mainDeck, setMainDeck] = useState([]); 
            const [centerPile, setCenterPile] = useState([]); 
            const [turn, setTurn] = useState(0);
            const [currentStep, setCurrentStep] = useState(1);
            const [slapResults, setSlapResults] = useState([]);
            const [winner, setWinner] = useState(null);
            const [isMuted, setIsMuted] = useState(false);
            const [dealingProgress, setDealingProgress] = useState(0); 
            const [flyingCard, setFlyingCard] = useState(null); 
            const [punishingCard, setPunishingCard] = useState(null); 
            const [isAnimating, setIsAnimating] = useState(false);
            const [currentCall, setCurrentCall] = useState(null); 
            const [startPrompt, setStartPrompt] = useState(""); 
            const [errorMsg, setErrorMsg] = useState(""); 
            const [showIdleHint, setShowIdleHint] = useState(false); 

            // Multiplayer connection state
            const [isOnlineMode, setIsOnlineMode] = useState(false);
            const [onlineRole, setOnlineRole] = useState(null); // 'host' or 'guest'
            const [roomCode, setRoomCode] = useState('');
            const [lobbyPlayers, setLobbyPlayers] = useState([]);
            const [connections, setConnections] = useState([]);
            const [myPeer, setMyPeer] = useState(null);
            const [onlineStatusText, setOnlineStatusText] = useState('');
            const [onlineStatusType, setOnlineStatusType] = useState(''); // 'info', 'success', 'error'
            const [myPlayerIdx, setMyPlayerIdx] = useState(0);

            const timeoutRef = useRef(null);
            const idleTimerRef = useRef(null);
            const audioCtxRef = useRef(null);
            const aiSlapScheduledRef = useRef(false);

            const isDealing = gameState === 'dealing';
            const myIndex = isOnlineMode ? (onlineRole === 'host' ? 0 : myPlayerIdx) : 0;

            const getAiSpeedMultiplier = () => {
                if (aiLevel === 'easy') return 1.5;
                if (aiLevel === 'hard') return 0.5 / 1.3; 
                return 1.0;
            };

            const getAiSlapMultiplier = () => {
                if (aiLevel === 'easy') return 1.5 * 1.3;
                if (aiLevel === 'hard') return 0.5;
                return 1.0;
            };

            const initAudio = () => {
                if (!audioCtxRef.current) audioCtxRef.current = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtxRef.current.state === 'suspended') audioCtxRef.current.resume();
            };

            const playSoundEffect = (type) => {
                if (isMuted || !audioCtxRef.current) return;
                initAudio();
                const ctx = audioCtxRef.current;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                if (type === 'flip' || type === 'deal') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(800, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.08); gain.gain.setValueAtTime(0.08, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.08);
                } else if (type === 'slap') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(180, ctx.currentTime); gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.15);
                } else if (type === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(120, ctx.currentTime); gain.gain.setValueAtTime(0.1, ctx.currentTime);
                    osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + 0.3);
                }
            };

            // TTS implementation
            const getChineseReading = (a, b, c) => {
                const digits = ["零", "一", "二", "三", "四", "五", "六", "七", "八", "九", "十"];
                const readDigit = (n) => digits[n] || "";
                
                const strA = a === 10 ? "十" : readDigit(a);
                const strB = b === 10 ? "十" : readDigit(b);
                
                let strC = "";
                if (c < 10) {
                    strC = readDigit(c);
                } else if (c === 10) {
                    strC = "一十";
                } else if (c < 20) {
                    strC = "十" + readDigit(c - 10);
                } else if (c === 100) {
                    strC = "一百";
                } else {
                    const tens = Math.floor(c / 10);
                    const ones = c % 10;
                    strC = readDigit(tens) + "十" + (ones > 0 ? readDigit(ones) : "");
                }
                return strA + strB + strC;
            };

            window.activeUtterances = window.activeUtterances || [];
            const speakText = (text) => {
                if (isMuted) return;
                try {
                    if (window.speechSynthesis.speaking) {
                        window.speechSynthesis.cancel();
                    }
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'zh-TW';
                    utterance.rate = 1.0;
                    
                    window.activeUtterances.push(utterance);
                    utterance.onend = () => {
                        window.activeUtterances = window.activeUtterances.filter(u => u !== utterance);
                    };
                    utterance.onerror = () => {
                        window.activeUtterances = window.activeUtterances.filter(u => u !== utterance);
                    };
                    
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    console.error("Speech synthesis error", e);
                }
            };

            useEffect(() => {
                if (currentCall) {
                    // Do not speak if it is the local player's own turn
                    if (currentCall.playerIdx === myIndex) return;

                    const match = currentCall.text.match(/(\d+)\s*×\s*(\d+)\s*=\s*(\d+)/);
                    if (match) {
                        const a = parseInt(match[1]);
                        const b = parseInt(match[2]);
                        const c = parseInt(match[3]);
                        const t = getChineseReading(a, b, c);
                        speakText(t);
                    }
                }
            }, [currentCall, myIndex]);

            // Single player start
            const startGame = async (num) => {
                try {
                    const silent = new SpeechSynthesisUtterance("");
                    silent.lang = 'zh-TW';
                    window.speechSynthesis.speak(silent);
                } catch(e){}
                initAudio(); setMultiplier(num); 
                let deck = [];
                for (let i = 1; i <= 10; i++) {
                    for (let j = 0; j < CARDS_PER_TYPE; j++) {
                        deck.push({ id: `${i}-${j}-${Math.random()}`, value: num * i, rot: Math.random() * 20 - 10, ox: Math.random() * 10 - 5, oy: Math.random() * 10 - 5, dealRot: Math.random() * 60 - 30, dealOx: Math.random() * 30 - 15, dealOy: Math.random() * 30 - 15 });
                    }
                }
                for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
                const newPlayers = [];
                for (let i = 0; i < PLAYERS_COUNT; i++) { newPlayers.push({ id: i, name: i === 0 ? "你" : `電腦 ${i}`, cards: [], isAI: i !== 0 }); }
                setMainDeck(deck); setPlayers(newPlayers); setCenterPile([]);
                setCurrentStep(difficulty === 'easy' ? 1 : 10); setCurrentCall(null);
                setSlapResults([]); setWinner(null); setPunishingCard(null); setErrorMsg(""); setShowIdleHint(false); aiSlapScheduledRef.current = false;
                setGameState('dealing'); setDealingProgress(0);
            };

            // Online Room Handlers
            const destroyPeer = () => {
                if (myPeer) {
                    myPeer.destroy();
                    setMyPeer(null);
                }
                setConnections([]);
                setLobbyPlayers([]);
                setIsOnlineMode(false);
                setOnlineRole(null);
            };

            useEffect(() => {
                const handleUnload = () => {
                    destroyPeer();
                };
                window.addEventListener('beforeunload', handleUnload);
                return () => {
                    window.removeEventListener('beforeunload', handleUnload);
                };
            }, [myPeer, connections]);

            const handleGuestDisconnect = (closedConn) => {
                setConnections(prev => {
                    const nextConns = prev.filter(c => c !== closedConn);
                    
                    if (gameState === 'menu' || gameState === 'dealing') {
                        const updatedLobby = [
                            { id: 0, name: lobbyPlayers[0]?.name || '你 (房主)', isHost: true },
                            ...nextConns.map((c, i) => {
                                c.playerIdx = i + 1;
                                return { id: c.playerIdx, name: c.playerName, isHost: false };
                            })
                        ];
                        setLobbyPlayers(updatedLobby);
                        
                        nextConns.forEach((c) => {
                            c.send({
                                type: 'lobby_update',
                                lobbyPlayers: updatedLobby,
                                myIndex: c.playerIdx
                            });
                        });
                    } else {
                        setPlayers(prevPlayers => {
                            const nextPlayers = prevPlayers.map(p => {
                                if (p.id === closedConn.playerIdx) {
                                    return { ...p, name: `${p.name} (電腦代管)`, isAI: true };
                                }
                                return p;
                            });
                            nextConns.forEach(c => {
                                c.send({
                                    type: 'state_update',
                                    players: nextPlayers,
                                    centerPile: centerPile,
                                    turn: turn,
                                    currentStep: currentStep,
                                    currentCall: currentCall,
                                    flyingCard: flyingCard,
                                    gameState: gameState
                                });
                            });
                            return nextPlayers;
                        });
                    }
                    return nextConns;
                });
            };

            // Shared ICE config for all PeerJS connections
            const buildIceConfig = () => ({
                iceServers: [
                    // Google STUN servers
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun3.l.google.com:19302' },
                    { urls: 'stun:stun4.l.google.com:19302' },
                    // Other STUN servers
                    { urls: 'stun:stun.cloudflare.com:3478' },
                    { urls: 'stun:stun.nextcloud.com:3478' },
                    { urls: 'stun:freestun.net:3478' },
                    // Open Relay TURN servers (UDP + TCP + TLS)
                    { urls: 'turn:openrelay.metered.ca:80',      username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443',     username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:openrelay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
                    // freeturn.net TURN servers (different provider)
                    { urls: 'turn:freeturn.net:3478',  username: 'free', credential: 'free' },
                    { urls: 'turns:freeturn.net:5349', username: 'free', credential: 'free' },
                    // relay.metered.ca TURN
                    { urls: 'turn:relay.metered.ca:80',          username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:relay.metered.ca:443',         username: 'openrelayproject', credential: 'openrelayproject' },
                    { urls: 'turn:relay.metered.ca:443?transport=tcp', username: 'openrelayproject', credential: 'openrelayproject' },
                ]
            });

            const createOnlineRoom = () => {
                try {
                    const silent = new SpeechSynthesisUtterance("");
                    silent.lang = 'zh-TW';
                    window.speechSynthesis.speak(silent);
                } catch(e){}

                destroyPeer();
                const code = Math.floor(1000 + Math.random() * 9000).toString();
                setRoomCode(code);
                setOnlineRole('host');
                setOnlineStatusText('正在建立房間...');
                setOnlineStatusType('info');

                const nickname = document.getElementById('online-nickname')?.value.trim() || '房主';

                try {
                    const hostPeerId = 'heart-attack-' + code;
                    const iceConfig = buildIceConfig();
                    const peer = new Peer(hostPeerId, {
                        host: '0.peerjs.com',
                        port: 443,
                        secure: true,
                        config: iceConfig,
                        debug: 1
                    });

                    peer.on('open', () => {
                        setMyPeer(peer);
                        setLobbyPlayers([{ id: 0, name: `${nickname} (你)`, isHost: true }]);
                        setOnlineStatusText(`房間建立成功！房號：${code}`);
                        setOnlineStatusType('success');
                        setIsOnlineMode(true);
                    });

                    peer.on('connection', (conn) => {
                        if (connections.length >= 3) {
                            conn.on('open', () => {
                                conn.send({ type: 'error', message: '房間已滿！' });
                                setTimeout(() => conn.close(), 500);
                            });
                            return;
                        }

                        conn.on('open', () => {
                            conn.on('data', (data) => {
                                if (data.type === 'join_lobby') {
                                    const nextIdx = connections.length + 1;
                                    conn.playerIdx = nextIdx;
                                    conn.playerName = data.playerName || `玩家 ${nextIdx}`;
                                    
                                    setConnections(prev => {
                                        const newConns = [...prev, conn];
                                        const updatedLobby = [
                                            { id: 0, name: `${nickname} (你)`, isHost: true },
                                            ...newConns.map((c) => ({ id: c.playerIdx, name: c.playerName, isHost: false }))
                                        ];
                                        setLobbyPlayers(updatedLobby);
                                        
                                        newConns.forEach((c) => {
                                            c.send({
                                                type: 'lobby_update',
                                                lobbyPlayers: updatedLobby,
                                                myIndex: c.playerIdx
                                            });
                                        });
                                        return newConns;
                                    });
                                }

                                if (data.type === 'flip_request') {
                                    if (gameState === 'playing' && turn === data.playerIdx && !isAnimating && !punishingCard) {
                                        hostExecutePlayTurn();
                                    }
                                }

                                if (data.type === 'slap_request') {
                                    if (!punishingCard && centerPile.length > 0) {
                                        hostExecuteSlap(data.playerIdx);
                                    }
                                }
                            });
                        });

                        conn.on('close', () => {
                            handleGuestDisconnect(conn);
                        });

                        conn.on('error', (err) => {
                            console.error(err);
                            handleGuestDisconnect(conn);
                        });
                    });

                    peer.on('error', (err) => {
                        console.error(err);
                        if (err.type === 'unavailable-id') {
                            createOnlineRoom();
                        } else {
                            setOnlineStatusText('建立房間失敗，請重試！');
                            setOnlineStatusType('error');
                        }
                    });
                } catch (e) {
                    console.error(e);
                    setOnlineStatusText('建立房間異常，請重試！');
                    setOnlineStatusType('error');
                }
            };

            const joinOnlineRoom = (code) => {
                const cleaned = (code || '').trim();
                if (!cleaned || cleaned.length !== 4) {
                    setOnlineStatusText('請輸入 4 位數房號！');
                    setOnlineStatusType('error');
                    return;
                }

                try {
                    const silent = new SpeechSynthesisUtterance("");
                    silent.lang = 'zh-TW';
                    window.speechSynthesis.speak(silent);
                } catch(e){}

                destroyPeer();
                setRoomCode(cleaned);
                setOnlineRole('guest');
                setOnlineStatusText('正在連線加入房間...');
                setOnlineStatusType('info');

                const nickname = document.getElementById('online-nickname')?.value.trim() || '訪客';

                try {
                    const iceConfig = buildIceConfig();
                    const peer = new Peer(null, {
                        host: '0.peerjs.com',
                        port: 443,
                        secure: true,
                        config: iceConfig,
                        debug: 1
                    });

                    peer.on('open', () => {
                        const conn = peer.connect('heart-attack-' + cleaned, { reliable: true });

                        // 15-second connection timeout
                        const connTimeout = setTimeout(() => {
                            if (conn.open) return;
                            setOnlineStatusText('連線逾時！請確認房主是否已開房，或網路環境是否支援 P2P 連線。');
                            setOnlineStatusType('error');
                            peer.destroy();
                        }, 15000);
                        
                        conn.on('open', () => {
                            clearTimeout(connTimeout);
                            conn.send({
                                type: 'join_lobby',
                                playerName: nickname
                            });
                            
                            setMyPeer(peer);
                            setConnections([conn]);
                            setIsOnlineMode(true);
                            setOnlineStatusText('已連線加入，進入連線大廳！');
                            setOnlineStatusType('success');
                        });

                        conn.on('data', (data) => {
                            if (data.type === 'error') {
                                setOnlineStatusText(data.message);
                                setOnlineStatusType('error');
                                peer.destroy();
                            }
                            if (data.type === 'lobby_update') {
                                setLobbyPlayers(data.lobbyPlayers);
                                setMyPlayerIdx(data.myIndex);
                            }
                            if (data.type === 'start_game') {
                                setMultiplier(data.multiplier);
                                setDifficulty(data.difficulty);
                                setAiLevel(data.aiLevel);
                                setPlayers(data.players);
                                setTurn(data.turn);
                                setCurrentStep(data.currentStep);
                                setCenterPile([]);
                                setCurrentCall(null);
                                setSlapResults([]);
                                setWinner(null);
                                setPunishingCard(null);
                                setErrorMsg("");
                                aiSlapScheduledRef.current = false;
                                
                                setGameState('dealing');
                                setDealingProgress(0);
                            }
                            if (data.type === 'state_update') {
                                setPlayers(data.players);
                                setCenterPile(data.centerPile);
                                setTurn(data.turn);
                                setCurrentStep(data.currentStep);
                                setCurrentCall(data.currentCall);
                                setFlyingCard(data.flyingCard);
                                setGameState(data.gameState);
                                setIsAnimating(data.isAnimating);
                                if (data.slapResults) setSlapResults(data.slapResults);
                            }
                            if (data.type === 'penalty_update') {
                                playSoundEffect('slap');
                                setPunishingCard(data.punishingCard);
                                setCurrentCall(null);
                                setTimeout(() => {
                                    setPlayers(data.players);
                                    setCenterPile(data.centerPile);
                                    setSlapResults([]);
                                    setPunishingCard(null);
                                    setErrorMsg("");
                                    setGameState('playing');
                                    setTurn(data.nextTurn);
                                    setCurrentStep(data.nextStep);
                                    aiSlapScheduledRef.current = false;
                                }, 800);
                            }
                            if (data.type === 'error_slap') {
                                playSoundEffect('error');
                                setErrorMsg(data.errorMsg);
                                setSlapResults([data.slapPlayerIdx]);
                                setPunishingCard(data.punishingCard);
                                setTimeout(() => {
                                    setPlayers(data.players);
                                    setCenterPile(data.centerPile);
                                    setSlapResults([]);
                                    setPunishingCard(null);
                                    setErrorMsg("");
                                    setGameState('playing');
                                    setTurn(data.nextTurn);
                                    setCurrentStep(data.nextStep);
                                    aiSlapScheduledRef.current = false;
                                }, 800);
                            }
                            if (data.type === 'game_over') {
                                setWinner(data.winner);
                                setGameState('gameOver');
                            }
                            if (data.type === 'lobby_return') {
                                setGameState('menu');
                                setPlayers([]);
                                setCenterPile([]);
                                setCurrentCall(null);
                                setSlapResults([]);
                                setWinner(null);
                                setPunishingCard(null);
                                setErrorMsg("");
                            }
                        });

                        conn.on('close', () => {
                            setOnlineStatusText('與房主的連線已斷開！');
                            setOnlineStatusType('error');
                            setGameState('menu');
                            destroyPeer();
                        });

                        conn.on('error', (err) => {
                            clearTimeout(connTimeout);
                            console.error(err);
                            setOnlineStatusText('與房主的資料通道連線失敗！請確認防火牆設定，或嘗試改用手機熱點後重試。');
                            setOnlineStatusType('error');
                        });
                    });

                    peer.on('error', (err) => {
                        console.error(err);
                        if (err.type === 'peer-not-found') {
                            setOnlineStatusText('找不到該房間，請確認房號是否正確！');
                        } else if (err.type === 'network') {
                            setOnlineStatusText('網路連線問題，請檢查網路後重試！');
                        } else if (err.type === 'server-error') {
                            setOnlineStatusText('連線伺服器錯誤，請稍後重試！');
                        } else {
                            setOnlineStatusText(`連線錯誤（${err.type}），請確認房號或改用手機熱點重試！`);
                        }
                        setOnlineStatusType('error');
                    });
                } catch (e) {
                    console.error(e);
                    setOnlineStatusText('連線異常，請重試！');
                    setOnlineStatusType('error');
                }
            };

            const startOnlineGame = () => {
                if (onlineRole !== 'host') return;
                
                let deck = [];
                for (let i = 1; i <= 10; i++) {
                    for (let j = 0; j < CARDS_PER_TYPE; j++) {
                        deck.push({
                            id: `${i}-${j}-${Math.random()}`,
                            value: multiplier * i,
                            rot: Math.random() * 20 - 10,
                            ox: Math.random() * 10 - 5,
                            oy: Math.random() * 10 - 5,
                            dealRot: Math.random() * 60 - 30,
                            dealOx: Math.random() * 30 - 15,
                            dealOy: Math.random() * 30 - 15
                        });
                    }
                }
                for (let i = deck.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [deck[i], deck[j]] = [deck[j], deck[i]];
                }
                
                const newPlayers = [];
                newPlayers.push({
                    id: 0,
                    name: lobbyPlayers[0]?.name || '你 (房主)',
                    cards: [],
                    isAI: false
                });
                
                for (let i = 1; i < 4; i++) {
                    const guestConn = connections.find(c => c.playerIdx === i);
                    if (guestConn) {
                        newPlayers.push({
                            id: i,
                            name: guestConn.playerName,
                            cards: [],
                            isAI: false
                        });
                    } else {
                        newPlayers.push({
                            id: i,
                            name: `電腦 ${i}`,
                            cards: [],
                            isAI: true
                        });
                    }
                }
                
                const mainDeckCopy = [...deck];
                for (let i = 0; i < 60; i++) {
                    const targetIdx = i % 4;
                    const card = mainDeckCopy.pop();
                    newPlayers[targetIdx].cards.push(card);
                }
                
                const randomStartTurn = Math.floor(Math.random() * 4);
                const startStep = difficulty === 'easy' ? 1 : 10;
                
                connections.forEach(c => {
                    c.send({
                        type: 'start_game',
                        multiplier: multiplier,
                        difficulty: difficulty,
                        aiLevel: aiLevel,
                        players: newPlayers,
                        turn: randomStartTurn,
                        currentStep: startStep
                    });
                });
                
                setPlayers(newPlayers);
                setCenterPile([]);
                setTurn(randomStartTurn);
                setCurrentStep(startStep);
                setCurrentCall(null);
                setSlapResults([]);
                setWinner(null);
                setPunishingCard(null);
                setErrorMsg("");
                aiSlapScheduledRef.current = false;
                
                setGameState('dealing');
                setDealingProgress(0);
            };

            const returnToLobby = () => {
                connections.forEach(c => c.send({ type: 'lobby_return' }));
                setGameState('menu');
                setPlayers([]);
                setCenterPile([]);
                setCurrentCall(null);
                setSlapResults([]);
                setWinner(null);
                setPunishingCard(null);
                setErrorMsg("");
            };

            const broadcastStateUpdate = (state) => {
                connections.forEach(c => {
                    c.send({
                        type: 'state_update',
                        players: state.players || players,
                        centerPile: state.centerPile || centerPile,
                        turn: state.turn !== undefined ? state.turn : turn,
                        currentStep: state.currentStep !== undefined ? state.currentStep : currentStep,
                        currentCall: state.currentCall !== undefined ? state.currentCall : currentCall,
                        flyingCard: state.flyingCard !== undefined ? state.flyingCard : flyingCard,
                        gameState: state.gameState || gameState,
                        isAnimating: state.isAnimating !== undefined ? state.isAnimating : isAnimating,
                        slapResults: state.slapResults || slapResults
                    });
                });
            };

            const broadcastGameOver = (w) => {
                connections.forEach(c => {
                    c.send({
                        type: 'game_over',
                        winner: w
                    });
                });
            };

            const hostExecutePlayTurn = () => {
                if (gameState !== 'playing' || isAnimating || punishingCard) return;

                const playersWithCards = players.filter(p => p.cards.length > 0);
                if (playersWithCards.length === 0) {
                    setGameState('gameOver');
                    setWinner(null);
                    broadcastGameOver(null);
                    return;
                }
                
                if (players[turn].cards.length === 0) {
                    const next = findNextPlayerWithCards(turn);
                    if (next !== null) {
                        setTurn(next);
                        broadcastStateUpdate({
                            players,
                            centerPile,
                            turn: next,
                            currentStep,
                            currentCall,
                            flyingCard: null,
                            gameState: 'playing'
                        });
                    }
                    return;
                }

                playSoundEffect('flip');
                setIsAnimating(true);
                setShowIdleHint(false);
                
                const newPlayers = [...players];
                const card = newPlayers[turn].cards.pop();
                const callValue = multiplier * currentStep;
                
                const newCall = { playerIdx: turn, text: `${multiplier} × ${currentStep} = ${callValue}` };
                const newFlying = { value: card.value, fromPlayer: turn };
                
                setCurrentCall(newCall);
                setFlyingCard(newFlying);
                
                broadcastStateUpdate({
                    players: newPlayers,
                    centerPile,
                    turn,
                    currentStep,
                    currentCall: newCall,
                    flyingCard: newFlying,
                    gameState: 'playing',
                    isAnimating: true
                });

                setTimeout(() => {
                    const newPile = [...centerPile, card];
                    setCenterPile(newPile);
                    setFlyingCard(null);
                    setPlayers(newPlayers);
                    setIsAnimating(false);
                    
                    if (card.value === callValue) {
                        setGameState('slapping');
                        aiSlapScheduledRef.current = false;
                        
                        broadcastStateUpdate({
                            players: newPlayers,
                            centerPile: newPile,
                            turn,
                            currentStep,
                            currentCall: newCall,
                            flyingCard: null,
                            gameState: 'slapping',
                            isAnimating: false
                        });
                    } else {
                        newPlayers.forEach((p, idx) => {
                            if (p.isAI) {
                                if (isDangerousPair(card.value, callValue)) {
                                    const chance = aiLevel === 'easy' ? 0.5 : aiLevel === 'normal' ? 0.3 : 0.1;
                                    if (Math.random() < chance) {
                                        setTimeout(() => {
                                            if (onlineRole === 'host') {
                                                hostExecuteSlap(idx);
                                            }
                                        }, (Math.random() * 500 + 300) * getAiSlapMultiplier());
                                    }
                                }
                            }
                        });

                        const next = findNextPlayerWithCards(turn);
                        let nextSt = currentStep;
                        if (next !== null) {
                            if (difficulty === 'easy') nextSt = (currentStep === 10 ? 1 : currentStep + 1);
                            else nextSt = (currentStep === 1 ? 10 : currentStep - 1);
                        }
                        
                        setTurn(next !== null ? next : turn);
                        setCurrentStep(nextSt);
                        
                        if (next === null) {
                            setGameState('gameOver');
                            setWinner(null);
                            broadcastGameOver(null);
                        } else {
                            broadcastStateUpdate({
                                players: newPlayers,
                                centerPile: newPile,
                                turn: next,
                                currentStep: nextSt,
                                currentCall: newCall,
                                flyingCard: null,
                                gameState: 'playing',
                                isAnimating: false
                            });
                        }
                    }
                }, 600);
            };

            const hostExecuteSlap = (slapPlayerIdx) => {
                if (punishingCard || centerPile.length === 0) return;
                const isMatch = centerPile[centerPile.length - 1].value === multiplier * currentStep;
                
                if (gameState === 'slapping') {
                    setSlapResults(prev => {
                        if (prev.includes(slapPlayerIdx)) return prev;
                        const newResults = [...prev, slapPlayerIdx];
                        playSoundEffect('slap');
                        
                        broadcastStateUpdate({
                            players,
                            centerPile,
                            turn,
                            currentStep,
                            currentCall,
                            flyingCard: null,
                            gameState: 'slapping',
                            slapResults: newResults
                        });

                        if (players[slapPlayerIdx].cards.length === 0 && newResults.length <= 3) {
                            setWinner(players[slapPlayerIdx]);
                            setGameState('gameOver');
                            broadcastGameOver(players[slapPlayerIdx]);
                            return newResults;
                        }

                        if (newResults.length === 3) {
                            const loserIndex = [0, 1, 2, 3].find(idx => !newResults.includes(idx));
                            
                            playSoundEffect('slap');
                            const punishing = { toPlayer: loserIndex, pileSnapshot: centerPile.slice(-8) };
                            setPunishingCard(punishing);
                            setCurrentCall(null);
                            
                            const nextSt = (difficulty === 'easy') ? (currentStep === 10 ? 1 : currentStep + 1) : (currentStep === 1 ? 10 : currentStep - 1);
                            
                            connections.forEach(c => {
                                c.send({
                                    type: 'penalty_update',
                                    punishingCard: punishing,
                                    players: players.map((p, idx) => idx === loserIndex ? { ...p, cards: [...centerPile, ...p.cards] } : p),
                                    centerPile: [],
                                    nextTurn: loserIndex,
                                    nextStep: nextSt
                                });
                            });

                            setTimeout(() => {
                                const newPlayers = [...players];
                                newPlayers[loserIndex].cards = [...centerPile, ...newPlayers[loserIndex].cards];
                                setPlayers(newPlayers);
                                setCenterPile([]);
                                setSlapResults([]);
                                setPunishingCard(null);
                                setErrorMsg("");
                                setGameState('playing');
                                setTurn(loserIndex);
                                setCurrentStep(nextSt);
                                aiSlapScheduledRef.current = false;
                            }, 800);
                        }
                        return newResults;
                    });
                } else if (gameState === 'playing' && !isMatch) {
                    if (slapResults.length === 0) {
                        playSoundEffect('error');
                        setErrorMsg(`${players[slapPlayerIdx].name} 拍錯了！`);
                        setSlapResults([slapPlayerIdx]);
                        
                        const punishing = { toPlayer: slapPlayerIdx, pileSnapshot: centerPile.slice(-8) };
                        setPunishingCard(punishing);
                        setCurrentCall(null);
                        
                        const nextSt = (difficulty === 'easy') ? (currentStep === 10 ? 1 : currentStep + 1) : (currentStep === 1 ? 10 : currentStep - 1);

                        connections.forEach(c => {
                            c.send({
                                type: 'error_slap',
                                errorMsg: `${players[slapPlayerIdx].name} 拍錯了！`,
                                slapPlayerIdx: slapPlayerIdx,
                                punishingCard: punishing,
                                players: players.map((p, idx) => idx === slapPlayerIdx ? { ...p, cards: [...centerPile, ...p.cards] } : p),
                                centerPile: [],
                                nextTurn: slapPlayerIdx,
                                nextStep: nextSt
                            });
                        });

                        setTimeout(() => {
                            const newPlayers = [...players];
                            newPlayers[slapPlayerIdx].cards = [...centerPile, ...newPlayers[slapPlayerIdx].cards];
                            setPlayers(newPlayers);
                            setCenterPile([]);
                            setSlapResults([]);
                            setPunishingCard(null);
                            setErrorMsg("");
                            setGameState('playing');
                            setTurn(slapPlayerIdx);
                            setCurrentStep(nextSt);
                            aiSlapScheduledRef.current = false;
                        }, 800);
                    }
                }
            };

            useEffect(() => {
                if (gameState === 'dealing') {
                    if (dealingProgress < 60) {
                        const timer = setTimeout(() => {
                            playSoundEffect('deal');
                            const targetIdx = dealingProgress % PLAYERS_COUNT;
                            setMainDeck(prev => prev.slice(0, -1));
                            setPlayers(prev => prev.map((p, idx) => idx === targetIdx ? { ...p, cards: [...p.cards, mainDeck[mainDeck.length - 1]] } : p ));
                            setDealingProgress(prev => prev + 1);
                        }, 50);
                        return () => clearTimeout(timer);
                    } else {
                        if (isOnlineMode) {
                            if (onlineRole === 'host') {
                                setGameState('playing');
                                broadcastStateUpdate({ gameState: 'playing' });
                            }
                        } else {
                            const randomStartTurn = Math.floor(Math.random() * PLAYERS_COUNT);
                            setTurn(randomStartTurn);
                            setStartPrompt(`發牌完畢！由 ${players[randomStartTurn]?.name || "你"} 先出牌！`);
                            setGameState('starting');
                            setTimeout(() => { setGameState('playing'); setStartPrompt(""); }, 2000);
                        }
                    }
                }
            }, [gameState, dealingProgress, mainDeck, players, isOnlineMode, onlineRole]);

            const executePenalty = (loserIndex) => {
                if (punishingCard) return;
                playSoundEffect('slap');
                setPunishingCard({ toPlayer: loserIndex, pileSnapshot: centerPile.slice(-8) });
                setCurrentCall(null); 
                const nextStep = (difficulty === 'easy') ? (currentStep === 10 ? 1 : currentStep + 1) : (currentStep === 1 ? 10 : currentStep - 1);

                setTimeout(() => {
                    const newPlayers = [...players];
                    newPlayers[loserIndex].cards = [...centerPile, ...newPlayers[loserIndex].cards];
                    setPlayers(newPlayers);
                    setCenterPile([]); setSlapResults([]); setPunishingCard(null); setErrorMsg(""); setGameState('playing');
                    setTurn(loserIndex); setCurrentStep(nextStep); aiSlapScheduledRef.current = false;
                }, 800);
            };

            const findNextPlayerWithCards = (currentTurn) => {
                let next = (currentTurn + 1) % PLAYERS_COUNT;
                let count = 0;
                while (players[next].cards.length === 0 && count < PLAYERS_COUNT) {
                    next = (next + 1) % PLAYERS_COUNT;
                    count++;
                }
                return count >= PLAYERS_COUNT ? null : next;
            };

            const playTurn = (isManual = false) => {
                if (gameState !== 'playing' || isAnimating || punishingCard) return;
                if (isManual && turn !== 0) return; 

                const playersWithCards = players.filter(p => p.cards.length > 0);
                if (playersWithCards.length === 0) { setGameState('gameOver'); setWinner(null); return; }
                
                if (players[turn].cards.length === 0) {
                    const next = findNextPlayerWithCards(turn);
                    if (next !== null) setTurn(next);
                    return;
                }

                playSoundEffect('flip');
                setIsAnimating(true); setShowIdleHint(false); 
                const newPlayers = [...players];
                const card = newPlayers[turn].cards.pop();
                const callValue = multiplier * currentStep;
                
                setCurrentCall({ playerIdx: turn, text: `${multiplier} × ${currentStep} = ${callValue}` });
                setFlyingCard({ value: card.value, fromPlayer: turn });
                
                setTimeout(() => {
                    const newPile = [...centerPile, card];
                    setCenterPile(newPile); setFlyingCard(null); setPlayers(newPlayers);
                    
                    if (card.value === callValue) {
                        setGameState('slapping'); aiSlapScheduledRef.current = false; setIsAnimating(false);
                    } else {
                        players.forEach((p, idx) => {
                            if (p.isAI) {
                                if (isDangerousPair(card.value, callValue)) {
                                    const chance = aiLevel === 'easy' ? 0.5 : aiLevel === 'normal' ? 0.3 : 0.1;
                                    if (Math.random() < chance) setTimeout(() => handleSlap(idx), (Math.random() * 500 + 300) * getAiSlapMultiplier());
                                }
                            }
                        });

                        const next = findNextPlayerWithCards(turn);
                        if (next !== null) {
                            setTurn(next);
                            if (difficulty === 'easy') setCurrentStep(currentStep === 10 ? 1 : currentStep + 1);
                            else setCurrentStep(currentStep === 1 ? 10 : currentStep - 1);
                        } else { setGameState('gameOver'); setWinner(null); }
                        setIsAnimating(false);
                    }
                }, 600); 
            };

            const handleSlap = (playerIndex) => {
                if (punishingCard || centerPile.length === 0) return;
                const isMatch = centerPile.length > 0 && centerPile[centerPile.length - 1].value === multiplier * currentStep;
                
                if (gameState === 'slapping') {
                    setSlapResults(prev => {
                        if (prev.includes(playerIndex)) return prev;
                        const newResults = [...prev, playerIndex];
                        playSoundEffect('slap');
                        
                        if (players[playerIndex].cards.length === 0 && newResults.length <= 3) {
                            setWinner(players[playerIndex]);
                            setGameState('gameOver');
                            return newResults;
                        }

                        if (newResults.length === 3) {
                            const loserIndex = [0, 1, 2, 3].find(idx => !newResults.includes(idx));
                            executePenalty(loserIndex);
                        }
                        return newResults;
                    });
                } else if (gameState === 'playing' && !isMatch) {
                    if (slapResults.length === 0) {
                        playSoundEffect('error'); setErrorMsg(`${players[playerIndex].name} 拍錯了！`); setSlapResults([playerIndex]); executePenalty(playerIndex);
                    }
                }
            };

            useEffect(() => {
                if (gameState === 'playing' && turn === myIndex && !isAnimating && !punishingCard) {
                    idleTimerRef.current = setTimeout(() => setShowIdleHint(true), 5000);
                } else {
                    setShowIdleHint(false); if (idleTimerRef.current) clearTimeout(idleTimerRef.current);
                }
                return () => clearTimeout(idleTimerRef.current);
            }, [turn, gameState, isAnimating, punishingCard, centerPile, myIndex]);

            // Authoritative AI execution triggers
            useEffect(() => {
                if (gameState === 'playing' && players[turn]?.isAI && !isAnimating && !punishingCard) {
                    if (isOnlineMode && onlineRole !== 'host') return;
                    const isFirstCard = centerPile.length === 0;
                    const delay = (aiLevel === 'easy' && isFirstCard) ? 100 : (1500 * getAiSpeedMultiplier());
                    timeoutRef.current = setTimeout(() => {
                        if (isOnlineMode) {
                            hostExecutePlayTurn();
                        } else {
                            playTurn(false);
                        }
                    }, delay);
                }
                return () => clearTimeout(timeoutRef.current);
            }, [turn, gameState, isAnimating, punishingCard, aiLevel, centerPile.length, isOnlineMode, onlineRole, players]);

            useEffect(() => {
                if (gameState === 'slapping' && !aiSlapScheduledRef.current) {
                    if (isOnlineMode && onlineRole !== 'host') return;
                    aiSlapScheduledRef.current = true;
                    players.forEach((p, idx) => {
                        if (p.isAI) {
                            const delay = (Math.random() * 800 + 400) * getAiSlapMultiplier();
                            setTimeout(() => {
                                if (isOnlineMode) {
                                    if (onlineRole === 'host') {
                                        setGameState(curr => { if (curr === 'slapping') hostExecuteSlap(idx); return curr; });
                                    }
                                } else {
                                    setGameState(curr => { if (curr === 'slapping') handleSlap(idx); return curr; });

            // Rendering sub-blocks

            if (gameState === 'menu') {

                            <p className="text-slate-400 mb-8 font-bold text-sm md:text-base">請將房號告知好友，最多支援 4 人。未滿 4 人開始將安排 AI 玩家。</p>
                            
                            <div className="flex flex-col gap-6 w-full max-w-md mb-8">
                                <div className="bg-slate-800 p-6 rounded-3xl shadow-xl border border-slate-700">

                                    <ul className="flex flex-col gap-3 text-left">
                                        {[0, 1, 2, 3].map((idx) => {
                                            const lp = lobbyPlayers.find(p => p.id === idx);
                                            return (

                                    </div>
                                    <span className={`text-lg font-bold transition-colors ${difficulty === 'hard' ? 'text-orange-500' : 'text-slate-500'}`}>倒背</span>

                            </div>

                                <input type="range" min="0" max="2" step="1" value={aiLevel === 'easy' ? 0 : aiLevel === 'normal' ? 1 : 2} onChange={(e) => { const val = e.target.value; setAiLevel(val === "0" ? 'easy' : val === "1" ? 'normal' : 'hard'); }} className="w-full h-4 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-blue-500 custom-range" />

                        </div>
                    </div>
                );

            return (

                    {(gameState === 'starting' || errorMsg) && (

                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_var(--tw-gradient-stops))] from-emerald-800 to-emerald-950 opacity-40" />

                    {players.map((player, idx) => {
                        const layouts = [
                            // Player 0 (Bottom / Human)
                            { 
                                pos: "bottom-4 left-1/2 -translate-x-1/2 md:bottom-8", 
                                call: "bottom-full mb-2 left-1/2 -translate-x-1/2 md:bottom-auto md:mb-0 md:left-full md:ml-4 md:top-1/2 md:-translate-y-1/2", 
                                cardAlign: "bottom-full mb-2 left-1/2 -translate-x-1/2 md:bottom-auto md:mb-0 md:left-[110%] md:top-1/2 md:-translate-y-1/2 md:translate-x-0" 
                            },
                            // Player 1 (Left)
                            { 
                                pos: "left-2 top-1/2 -translate-y-1/2 md:left-12", 
                                call: "left-full ml-2 top-1/2 -translate-y-1/2 md:ml-4", 
                                cardAlign: "" 
                            },
                            // Player 2 (Top)
                            { 
                                pos: "top-4 left-1/2 -translate-x-1/2 md:top-8", 
                                call: "top-full mt-2 left-1/2 -translate-x-1/2 md:top-1/2 md:-translate-y-1/2 md:left-full md:ml-4 md:mt-0 md:translate-x-0", 
                                cardAlign: ""

                                pos: "right-2 top-1/2 -translate-y-1/2 md:right-12",

                                cardAlign: "" 
                            }
                        ];
                        const cfg = layouts[idx];
                        const active = turn === idx;
                        const isCallForMe = currentCall && currentCall.playerIdx === idx;
                        
                        const unifiedCallBoxClass = "bg-yellow-400 text-slate-900 px-4 py-2 md:px-8 md:py-6 rounded-[20px] md:rounded-[40px] text-2xl md:text-5xl font-black shadow-2xl border-2 md:border-4 border-white whitespace-nowrap";

                                            {player.isAI ? "🤖" : "🙋"}

                                        {idx !== 0 && isCallForMe && idx !== myIndex && (

                                    </div>

                                                     if (onlineRole === 'host') {
                                                         if (turn === 0) hostExecutePlayTurn();

                                                         if (turn === myIndex) {
                                                             connections[0].send({ type: 'flip_request', playerIdx: myIndex });
                                                         }
                                                     }
                                                 } else {
                                                     playTurn(true);
                                                 }
                                             }}>
                                            {player.cards.length > 0 ? [...Array(Math.min(Math.ceil(player.cards.length / 1.5), 15))].map((_, i) => {

                            {errorMsg && (<div className="absolute z-[160] bg-yellow-400 px-4 py-2 md:px-6 md:py-4 rounded-xl border-2 md:border-4 border-white shadow-2xl animate-pulse whitespace-nowrap pointer-events-none text-center text-slate-900"><h3 className="text-lg md:text-2xl font-black">{errorMsg}</h3></div>)}
                            {flyingCard && (<div className={`fixed top-1/2 left-1/2 w-32 h-44 md:w-48 md:h-64 bg-white rounded-lg md:rounded-2xl shadow-2xl flex items-center justify-center text-4xl md:text-7xl font-black text-slate-900 z-[100] border-2 md:border-4 border-slate-200 pointer-events-none animate-fly-${flyingCard.fromPlayer}`}>{flyingCard.value}</div>)}
                            {punishingCard && (<div className={`fixed top-1/2 left-1/2 z-[150] pointer-events-none animate-return-${punishingCard.toPlayer}`}><div className="relative w-32 h-44 md:w-48 md:h-64">{punishingCard.pileSnapshot.map((card, i) => (<div key={card.id} className="absolute inset-0 bg-white rounded-lg md:rounded-2xl border-2 md:border-4 border-slate-100 shadow-xl flex items-center justify-center text-4xl md:text-7xl font-black text-slate-900" style={{ transform: `rotate(${card.rot}deg) translate(${card.ox}px, ${card.oy}px)`, zIndex: i }}>{i === punishingCard.pileSnapshot.length - 1 ? card.value : ""}</div>))}</div></div>)}
                            {slapResults.map((pIdx, i) => (<div key={`${pIdx}-${i}`} className={`absolute text-6xl md:text-9xl z-[110] transition-all duration-200 pointer-events-none drop-shadow-2xl ${pIdx === 0 ? 'translate-y-16 md:translate-y-24' : ''} ${pIdx === 1 ? '-translate-x-16 md:-translate-x-24 -rotate-90' : ''} ${pIdx === 2 ? '-translate-y-16 md:-translate-y-24 rotate-180' : ''} ${pIdx === 3 ? 'translate-x-16 md:translate-x-24 rotate-90' : ''}`} style={{ opacity: 1 - (i * 0.1) }}>✋</div>))}
                        </div>
                    </div>
                    {showIdleHint && (<div className="fixed bottom-32 md:bottom-40 left-1/2 -translate-x-1/2 z-[100] bg-white text-emerald-800 px-4 py-2 md:px-6 md:py-3 rounded-full shadow-2xl border-2 md:border-4 border-yellow-400 font-black text-lg md:text-2xl flex items-center gap-2 animate-pulse text-center"><AlertCircle className="text-yellow-500" /> 輪到你了！</div>)}
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
