                                                </div>

                                                {/* 姓名與手牌數方框 (字體放大兩號 text-base，獨立高層級 z-30，與手牌拉開距離不遮擋) */}
                                                <div className="z-30 bg-slate-900/90 backdrop-blur-md text-white px-4 py-1.5 rounded-full text-base font-black border-2 border-white/30 text-center shadow-lg whitespace-nowrap">
                                                    {p.name} {p.cards.length === 0 ? "（搶拍奪冠）" : `(${p.cards.length}張)`}
                                                </div>

                                                {/* 手牌牌庫 (與上方姓名方框保持 mt-3.5 充足間距，卡牌向下向右堆疊，徹底避免遮蔽姓名) */}
                                                <div 
                                                    className="relative mt-3.5 cursor-pointer group z-20"
                                                    onClick={() => isMe && playTurn(true)}
                                                >
                                                    <div className={`relative w-20 h-28 rounded-xl transition-transform duration-200 ${isCurrentTurn && isMe && !isAnimating && !punishingCard && !isPenaltyCooling ? 'ring-4 ring-yellow-400 shadow-[0_0_20px_rgba(251,191,36,0.8)] scale-105 animate-pulse' : ''}`}>
                                                        {p.cards.length > 0 ? (
                                                            [...Array(Math.min(p.cards.length, 10))].map((_, i) => (
                                                                <div 
                                                                    key={i} 
                                                                    className="absolute inset-0 bg-blue-600 rounded-xl border-2 border-white shadow-md flex items-center justify-center"
                                                                    style={{ transform: `translate(${i * 1.5}px, ${i * 1.2}px)` }}
                                                                >
                                                                    {/* 撲克牌背面：無 99 數字，精美幾何飾框 */}
                                                                    <div className="w-14 h-20 border-2 border-blue-300/40 rounded-lg flex items-center justify-center bg-blue-700/60">
                                                                        <div className="w-9 h-14 border border-blue-300/30 rounded flex items-center justify-center">
                                                                            <div className="w-5 h-8 border border-blue-400/20 rounded-sm"></div>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            ))
                                                        ) : (
                                                            <div className="w-20 h-28 border-2 border-dashed border-white/30 rounded-xl flex items-center justify-center text-white/40 font-black text-base">
                                                                已出完
                                                            </div>
                                                        )}
                                                    </div>
                                                </div>
                                            </div>
                                        </Fragment>
                                    );
                                })}

                                {/* 中央出牌與拍牌區 (經典原版拍牌區) */}
                                <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-52 h-64">
                                    <div 
                                        className={`relative w-full h-full bg-emerald-800/40 rounded-[40px] border-4 border-dashed transition-all duration-300 flex items-center justify-center cursor-pointer select-none slap-area ${gameState === 'slapping' ? 'border-amber-400 bg-amber-500/30 shadow-[0_0_40px_rgba(251,191,36,0.8)] scale-105' : 'border-white/25 hover:border-white/50 hover:bg-emerald-800/60'}`}
                                        onClick={() => handleSlap(mySeatIndex)}
                                    >
                                        {/* 發牌動畫 */}
                                        {isDealing ? (
                                            <div className="relative w-36 h-48">
                                                {[...Array(Math.min(mainDeck.length, 20))].map((_, i) => (
                                                    <div key={i} className="absolute inset-0 bg-blue-500 rounded-2xl shadow-xl border-2 border-white" style={{ transform: `translate(${i}px, ${-i}px)` }} />
                                                ))}
                                                {dealingProgress < 54 && (
                                                    <div className={`absolute top-1/2 left-1/2 w-20 h-28 bg-blue-500 rounded-xl border-2 border-white z-50 animate-deal-${getRelativeSlot(dealingProgress % playerCount)}`} />
                                                )}
                                            </div>
                                        ) : punishingCard ? (
                                            /* 受罰牌堆飛往輸家動畫 */
                                            <div className="relative w-36 h-48">
                                                {punishingCard.pileSnapshot.map((card, i) => (
                                                    <div 
                                                        key={card.id || i} 
                                                        className={`absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center text-7xl font-black text-slate-900 border-4 border-slate-50 animate-return-${getRelativeSlot(punishingCard.toPlayer)}`}
                                                        style={{ zIndex: i }}
                                                    >
                                                        {i === punishingCard.pileSnapshot.length - 1 ? card.value : ""}
                                                    </div>
                                                ))}
                                            </div>
                                        ) : (centerPile.length > 0 || flyingCard) ? (
                                            /* 中央牌堆正常顯示 (卡牌數字放大至 text-7xl) */
                                            <div className="relative w-36 h-48">
                                                {centerPile.slice(-8).map((card, i) => (
                                                    <div key={card.id} className="absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center text-7xl font-black text-slate-900 border-4 border-slate-50" style={{ transform: `rotate(${card.rot}deg) translate(${card.ox}px, ${card.oy}px)`, zIndex: i }}>
                                                        {i === centerPile.slice(-8).length - 1 ? card.value : ""}
                                                    </div>
                                                ))}
                                                {flyingCard && (
                                                    <div className={`absolute inset-0 bg-white rounded-2xl shadow-2xl flex items-center justify-center text-7xl font-black text-slate-900 border-4 border-amber-300 z-50 animate-fly-${getRelativeSlot(flyingCard.fromPlayer)}`}>
                                                        {flyingCard.value}
                                                    </div>
                                                )}
                                            </div>
                                        ) : (gameState !== 'dealing') && (
                                            <div className="text-white/20 font-black text-4xl uppercase tracking-widest text-center pointer-events-none whitespace-nowrap">
                                                拍牌區
                                            </div>
                                        )}

                                        {/* 拍牌特效 */}
                                        {slapRipple && <div className="slap-ripple" />}
                                        {slapHands.map(h => (
                                            <div key={h.id} className={`slap-hand slap-hand-${getRelativeSlot(h.playerIndex)}`}>
                                                ✋
                                            </div>
                                        ))}

                                        {/* 錯誤或狀態提示橫幅 (字體放大至 text-3xl) */}
                                        {errorMsg && (
                                            <div className="absolute z-[160] bg-yellow-400 px-8 py-4 rounded-2xl border-4 border-white text-slate-900 font-black shadow-2xl animate-bounce text-center whitespace-nowrap">
                                                <h3 className="text-3xl font-black">{errorMsg}</h3>
                                            </div>
                                        )}
                                    </div>
                                </div>

                                {/* 輪到出牌閒置提示 (字體放大至 text-2xl) */}
                                {showIdleHint && (
                                    <div className="absolute bottom-36 left-1/2 -translate-x-1/2 z-[100] bg-white text-emerald-800 px-8 py-3.5 rounded-full font-black text-2xl shadow-2xl border-4 border-yellow-400 animate-bounce flex items-center gap-3 whitespace-nowrap">
                                        <AlertCircle className="text-yellow-500" size={28} /> 輪到你出牌囉！點擊你的手牌！
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 開局倒數 3, 2, 1 */}
                        {gameState === 'starting' && (
                            <div className="absolute inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm pointer-events-none">
                                <h2 className="text-9xl font-black text-yellow-400 animate-ping">
                                    {startPrompt}
                                </h2>
                            </div>
                        )}

                        {/* 遊戲結束勝利畫面 */}
                        {gameState === 'gameOver' && winner && (
                            <div className="absolute inset-0 z-[200] flex items-center justify-center bg-slate-900/90 backdrop-blur-md">
                                <div className="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-2xl text-center max-w-md flex flex-col items-center">
                                    <Trophy size={80} className="text-amber-400 mb-3 animate-bounce" />
                                    <h2 className="text-5xl font-black text-white mb-3">🎉 恭喜獲勝！</h2>
                                    <div className="text-6xl my-2">{winner.avatar}</div>
                                    <div className="text-4xl font-black text-amber-300 mb-2">{winner.name}</div>
                                    <p className="text-slate-300 text-xl mb-6">成功出完所有手牌，奪得冠軍！</p>
                                    <div className="flex gap-4 w-full">
                                        <button
                                            onClick={() => {
                                                if (isOnline) {
                                                    if (isHost) startOnlineGame();
                                                } else {
                                                    startLocalGame(multiplier);
                                                }
                                            }}
                                            className="flex-1 py-4 bg-amber-400 hover:bg-amber-300 text-slate-900 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition cursor-pointer whitespace-nowrap"
                                        >
                                            再玩一局
                                        </button>
                                        <button
                                            onClick={() => {
                                                cleanupPeer();
                                                setGameState('menu');
                                            }}
                                            className="flex-1 py-4 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-black text-xl active:scale-95 transition cursor-pointer whitespace-nowrap"
                                        >
                                            回主選單
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
