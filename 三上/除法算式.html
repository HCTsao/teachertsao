    <script>
        // --- 狀態管理 ---
        let state = {
            mode: 'menu', // menu, exact, remainder
            activeTab: 'incl_minus', 
            step: 0,
            explStep: 0,
            total: 12,
            divisor: 3,
            showSettings: false,
            itemsInitialized: false,
            phase: 'moving' 
        };

        const childEmojis = ['🧒', '👧', '👦', '🧒🏻', '👧🏼', '👦🏽', '🧒🏾', '👧🏿', '🧒🏼', '👦🏻'];

        function toChineseNum(num) {
            const dict = { 
                0:'零', 1:'一', 2:'二', 3:'三', 4:'四', 5:'五', 6:'六', 7:'七', 8:'八', 9:'九', 10:'十',
                11:'十一', 12:'十二', 13:'十三', 14:'十四', 15:'十五', 16:'十六', 17:'十七', 18:'十八', 19:'十九', 20:'二十'
            };
            return dict[num] || num;
        }

        // --- 模式切換與設定 ---
        function startMode(mode) {
            state.mode = mode;
            state.showSettings = false;
            state.itemsInitialized = false;
            if (mode === 'exact') {
                state.activeTab = 'incl_minus';
                state.total = 12;
                state.divisor = 3;
                state.step = 0;
                state.explStep = 0;
            } else {
                state.activeTab = 'inclusion';
                state.total = 13;
                state.divisor = 3;
                state.step = 0;
                state.explStep = 0;
                state.phase = 'moving';
            }
            document.getElementById('exact-history-list').innerHTML = '';
            render();
        }

        function goBackToMenu() {
            state.mode = 'menu';
            render();
        }

        function setActiveTab(tab) {
            state.activeTab = tab;
            state.step = 0;
            state.explStep = 0;
            state.showSettings = false;
            state.itemsInitialized = false;
            if (state.mode === 'exact') {
                if (tab.startsWith('incl')) {
                    if (state.total > 20) state.total = 12;
                    if (state.divisor > 6) state.divisor = 3;
                } else {
                    if (state.total > 20) state.total = 20;
                    if (state.divisor > 6) state.divisor = 5;
                }
                document.getElementById('exact-history-list').innerHTML = '';
            } else {
                state.phase = 'moving';
                state.total = tab === 'inclusion' ? 13 : 9;
                state.divisor = tab === 'inclusion' ? 3 : 2;
            }
            render();
        }

        function toggleSettings() {
            state.showSettings = !state.showSettings;
            render();
        }

        function adjustTotal(delta) {
            if (state.mode === 'exact') {
                let newTotal = Math.max(state.divisor, Math.min(20, state.total + delta));
                const remainder = newTotal % state.divisor;
                if (remainder !== 0) {
                    newTotal = (delta > 0) ? newTotal + (state.divisor - remainder) : newTotal - remainder;
                }
                if (newTotal > 0 && newTotal <= 20) {
                    state.total = newTotal;
                    state.step = 0;
                    state.explStep = 0;
                    state.itemsInitialized = false;
                    document.getElementById('exact-history-list').innerHTML = '';
                    render();
                }
            } else {
                state.total = Math.max(state.divisor + 1, Math.min(20, state.total + delta));
                state.itemsInitialized = false;
                resetAll();
            }
        }

        function adjustDivisor(delta) {
            if (state.mode === 'exact') {
                let newDiv = Math.max(2, Math.min(6, state.divisor + delta));
                if (state.total % newDiv === 0) {
                    state.divisor = newDiv;
                } else {
                    let targetTotal = state.total;
                    while (targetTotal % newDiv !== 0 && targetTotal <= 20) targetTotal++;
                    if (targetTotal > 20) {
                        targetTotal = state.total;
                        while (targetTotal % newDiv !== 0 && targetTotal > 0) targetTotal--;
                    }
                    state.total = targetTotal;
                    state.divisor = newDiv;
                }
                state.step = 0;
                state.explStep = 0;
                state.itemsInitialized = false;
                document.getElementById('exact-history-list').innerHTML = '';
                render();
            } else {
                state.divisor = Math.max(2, Math.min(6, state.divisor + delta));
                if (state.total <= state.divisor) state.total = state.divisor + 1;
                state.itemsInitialized = false;
                resetAll();
            }
        }

        function handleAction() {
            if (state.mode === 'exact') {
                const maxStep = state.total / state.divisor;
                if (state.step < maxStep) {
                    state.step++;
                    state.explStep = 0;
                    render();
                }
            } else {
                const quotient = Math.floor(state.total / state.divisor);
                if (state.phase === 'moving') {
                    if (state.step < quotient) {
                        state.step++;
                        if (state.step === quotient) {
                            state.phase = 'multi';
                        }
                    }
                } else if (state.phase === 'multi') {
                    state.phase = 'minus';
                } else if (state.phase === 'minus') {
                    state.phase = 'formula';
                } else if (state.phase === 'formula') {
                    state.phase = 'finished';
                }
                render();
            }
        }

        function resetAll() {
            state.step = 0;
            state.explStep = 0;
            state.showSettings = false;
            if (state.mode === 'exact') {
                document.getElementById('exact-history-list').innerHTML = '';
            } else {
                state.phase = 'moving';
            }
            render();
        }

        function setExplStep(s) {
            state.explStep = s;
            render();
        }

        // --- 核心渲染引擎 ---
        function render() {
            if (state.mode === 'menu') {
                document.getElementById('menu-screen').classList.remove('hidden');
                document.getElementById('learning-screen').classList.add('hidden');
                document.getElementById('menu-back-btn').classList.add('hidden');
                return;
            } else {
                document.getElementById('menu-screen').classList.add('hidden');
                document.getElementById('learning-screen').classList.remove('hidden');
                document.getElementById('menu-back-btn').classList.remove('hidden');
            }

            const isExact = state.mode === 'exact';
            const isIncl = isExact ? state.activeTab.startsWith('incl') : state.activeTab === 'inclusion';
            const isMinus = isExact ? state.activeTab.endsWith('minus') : false;
            
            const quotient = Math.floor(state.total / state.divisor);
            const remainder = isExact ? 0 : (state.total % state.divisor);
            const maxStep = isExact ? (state.total / state.divisor) : quotient;
            const finished = isExact ? (state.step === maxStep) : (state.phase === 'finished');
            
            const itemEmoji = isExact ? (isIncl ? '🍰' : '🍪') : (isIncl ? '🍓' : '🎈');
            const itemName = isExact ? (isIncl ? '蛋糕' : '餅乾') : (isIncl ? '草莓' : '氣球');

            // 1. 標籤頁導覽
            const tabContainer = document.getElementById('tab-container');
            if (isExact) {
                tabContainer.className = "grid grid-cols-2 md:grid-cols-4 bg-slate-100 p-2 gap-2";
                tabContainer.innerHTML = `
                    <button onclick="setActiveTab('incl_minus')" id="tab-incl_minus" class="tab-btn py-2 px-1 rounded-xl font-bold text-sm transition">分裝(連減)</button>
                    <button onclick="setActiveTab('incl_multi')" id="tab-incl_multi" class="tab-btn py-2 px-1 rounded-xl font-bold text-sm transition">分裝(乘法)</button>
                    <button onclick="setActiveTab('part_minus')" id="tab-part_minus" class="tab-btn py-2 px-1 rounded-xl font-bold text-sm transition">平分(連減)</button>
                    <button onclick="setActiveTab('part_multi')" id="tab-part_multi" class="tab-btn py-2 px-1 rounded-xl font-bold text-sm transition">平分(乘法)</button>
                `;
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    const id = btn.id.replace('tab-', '');
                    btn.className = `tab-btn py-2 px-1 rounded-xl font-bold text-sm transition ${id === state.activeTab ? 'bg-white shadow-md text-indigo-600 border-b-4 border-indigo-500 scale-105' : 'text-slate-500 hover:bg-slate-50'}`;
                });
            } else {
                tabContainer.className = "grid grid-cols-2 bg-slate-100 p-2 gap-2";
                tabContainer.innerHTML = `
                    <button onclick="setActiveTab('inclusion')" id="tab-inclusion" class="tab-btn py-3 px-1 rounded-xl font-bold transition text-lg">模式一：分裝</button>
                    <button onclick="setActiveTab('partitive')" id="tab-partitive" class="tab-btn py-3 px-1 rounded-xl font-bold transition text-lg">模式二：平分</button>
                `;
                document.getElementById('tab-inclusion').className = `tab-btn py-3 px-1 rounded-xl font-bold transition ${isIncl ? 'bg-white shadow-md text-indigo-600 border-b-4 border-indigo-500 scale-105' : 'text-slate-500 hover:bg-slate-50'}`;
                document.getElementById('tab-partitive').className = `tab-btn py-3 px-1 rounded-xl font-bold transition ${!isIncl ? 'bg-white shadow-md text-indigo-600 border-b-4 border-indigo-500 scale-105' : 'text-slate-500 hover:bg-slate-50'}`;
            }

            // 2. 說明欄位
            document.getElementById('scenario-title').innerText = isIncl ? '分裝' : '平分';
            let descText = '';
            if (isExact) {
                descText = isIncl ? `把 ${state.total} 個蛋糕，${state.divisor} 個裝一盤，最多可以裝成幾盤？` : `把 ${state.total} 片餅乾，平分給 ${state.divisor} 個小朋友，一個小朋友分到幾片餅乾？`;
            } else {
                descText = isIncl 
                    ? `妮妮把 ${state.total} 顆草莓，每 ${state.divisor} 顆裝一盤，最多可以裝成幾盤？還剩下幾顆草莓？`
                    : `有 ${state.total} 顆氣球，平分給 ${state.divisor} 個小朋友，盡量分完，每個人可以分到幾顆？還剩下幾顆氣球？`;
            }
            document.getElementById('scenario-desc').innerText = descText;

            // 3. 設定面板
            document.getElementById('settings-panel').classList.toggle('hidden', !state.showSettings);
            document.getElementById('display-total').innerText = state.total;
            document.getElementById('display-divisor').innerText = state.divisor;
            document.getElementById('divisor-label').innerText = isIncl ? '每盤裝幾個：' : '小朋友人數：';

            // 4. 物品繪製 (保留渲染，防止閃爍)
            const itemsGrid = document.getElementById('items-grid');
            if (!state.itemsInitialized) {
                itemsGrid.innerHTML = '';
                for (let i = 0; i < state.total; i++) {
                    const div = document.createElement('div');
                    div.id = `item-stable-${i}`;
                    div.className = `text-4xl transition-all duration-700 flex items-center justify-center scale-100 opacity-100`;
                    div.innerText = itemEmoji;
                    itemsGrid.appendChild(div);
                }
                state.itemsInitialized = true;
            }
            for (let i = 0; i < state.total; i++) {
                const node = document.getElementById(`item-stable-${i}`);
                if (node) {
                    const gone = i < state.step * state.divisor;
                    node.style.opacity = gone ? '0' : '1';
                    node.style.transform = gone ? 'scale(0)' : 'scale(1)';
                }
            }

            // 5. 盤子與分配對象繪製
            const platesContainer = document.getElementById('plates-container');
            let displayPlateCount = isIncl 
                ? (isExact ? (finished ? maxStep : state.step + 1) : (state.step === quotient ? quotient : state.step + 1)) 
                : state.divisor;
            
            if (platesContainer.children.length !== displayPlateCount) {
                platesContainer.innerHTML = '';
                for (let i = 0; i < displayPlateCount; i++) {
                    const wrapper = document.createElement('div');
                    wrapper.className = "relative group animate-zoom-in";
                    if (!isIncl) {
                        const kid = document.createElement('div');
                        kid.className = "absolute -top-8 left-1/2 -translate-x-1/2 text-2xl animate-bounce-child";
                        kid.style.animationDelay = `${i * 0.2}s`;
                        kid.innerText = childEmojis[i % childEmojis.length];
                        wrapper.appendChild(kid);
                    }
                    const plate = document.createElement('div');
                    plate.id = `plate-body-${i}`;
                    const plateGrid = document.createElement('div');
                    plateGrid.id = `plate-grid-${i}`;
                    plateGrid.className = "grid grid-cols-2 gap-1 p-1";
                    plate.appendChild(plateGrid);
                    wrapper.appendChild(plate);
                    platesContainer.appendChild(wrapper);
                }
            }

            for (let i = 0; i < displayPlateCount; i++) {
                const plateBody = document.getElementById(`plate-body-${i}`);
                const plateGrid = document.getElementById(`plate-grid-${i}`);
                if (!plateBody || !plateGrid) continue;

                const isActive = isIncl ? (i < state.step) : (state.step > 0);
                plateBody.className = `relative w-24 h-24 rounded-full border-2 transition-all flex items-center justify-center ${isActive ? 'bg-white border-orange-400 shadow-md scale-105' : 'bg-slate-50/50 border-slate-100 opacity-20'} ${!isIncl ? 'border-blue-200' : ''}`;

                const countShouldBe = isIncl ? (i < state.step ? state.divisor : 0) : state.step;
                const countCurrent = plateGrid.children.length;

                if (countCurrent < countShouldBe) {
                    for (let j = countCurrent; j < countShouldBe; j++) {
                        const span = document.createElement('span');
                        span.className = "text-xl animate-zoom-in";
                        span.innerText = itemEmoji;
                        plateGrid.appendChild(span);
                    }
                } else if (countCurrent > countShouldBe) {
                    plateGrid.innerHTML = '';
                }
            }

            // 6. 下一步動作按鈕狀態
            const mainActionBtn = document.getElementById('main-action-btn');
            if (isExact) {
                mainActionBtn.disabled = finished;
                mainActionBtn.className = finished 
                    ? "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-slate-300 text-white cursor-not-allowed" 
                    : "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-indigo-500 hover:bg-indigo-600 text-white transition active:scale-95";
                mainActionBtn.innerText = finished ? '分完了！' : (isIncl ? `裝第 ${state.step + 1} 盤(${state.divisor}個)` : `每人各發 1 個`);
            } else {
                if (state.phase === 'moving') {
                    mainActionBtn.disabled = false;
                    mainActionBtn.innerText = isIncl ? `裝第 ${state.step + 1} 盤` : `每人各發 1 個`;
                    mainActionBtn.className = "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-orange-500 hover:bg-orange-600 text-white transition active:scale-95";
                } else if (state.phase === 'multi') {
                    mainActionBtn.disabled = false;
                    mainActionBtn.innerText = isIncl ? '步驟 1：盤子裡裝了幾顆草莓？' : '步驟 1：小朋友一共拿了幾顆氣球？';
                    mainActionBtn.className = "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-blue-500 hover:bg-blue-600 text-white transition active:scale-95";
                } else if (state.phase === 'minus') {
                    mainActionBtn.disabled = false;
                    mainActionBtn.innerText = isIncl ? '步驟 2：還剩下幾顆草莓？' : '步驟 2：還剩下幾顆氣球？';
                    mainActionBtn.className = "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-red-500 hover:bg-red-600 text-white transition active:scale-95";
                } else if (state.phase === 'formula') {
                    mainActionBtn.disabled = false;
                    mainActionBtn.innerText = '步驟 3：用除法算式記下來';
                    mainActionBtn.className = "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-indigo-600 hover:bg-indigo-700 text-white transition active:scale-95";
                } else {
                    mainActionBtn.disabled = true;
                    mainActionBtn.innerText = '除法練習完成！✨';
                    mainActionBtn.className = "flex-1 py-4 rounded-xl font-bold text-xl shadow-md bg-slate-300 text-white cursor-not-allowed";
                }
            }

            // 7. 右側面板控制與顯示
            const exactHistoryPanel = document.getElementById('exact-history-panel');
            const stepMultiCard = document.getElementById('step-multi-card');
            const stepMinusCard = document.getElementById('step-minus-card');
            const summaryPanel = document.getElementById('summary-panel');

            if (isExact) {
                exactHistoryPanel.classList.remove('hidden');
                stepMultiCard.classList.add('hidden');
                stepMinusCard.classList.add('hidden');
                
                const historyHeader = document.getElementById('exact-history-header');
                const historyList = document.getElementById('exact-history-list');
                
                if (isMinus) {
                    historyHeader.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><line x1="5" y1="12" x2="19" y2="12"></line></svg> 連減過程紀錄`;
                    historyHeader.className = "flex items-center gap-2 mb-3 font-bold border-b pb-1 text-sm text-red-700 border-red-200";
                    exactHistoryPanel.className = "p-5 rounded-2xl border-2 min-h-[180px] flex flex-col shadow-sm bg-red-50 border-red-100";
                    document.getElementById('exact-current-plates').className = "text-2xl font-black text-red-700";
                    document.getElementById('exact-status-prefix').innerText = isIncl ? '目前裝了 ' : '目前每個人分了 ';
                    document.getElementById('exact-status-unit').innerText = isIncl ? ' 盤' : ' 個';
                } else {
                    historyHeader.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mr-1"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg> 乘法累積紀錄`;
                    historyHeader.className = "flex items-center gap-2 mb-3 font-bold border-b pb-1 text-sm text-blue-700 border-blue-200";
                    exactHistoryPanel.className = "p-5 rounded-2xl border-2 min-h-[180px] flex flex-col shadow-sm bg-blue-50 border-blue-100";
                    document.getElementById('exact-current-plates').className = "text-2xl font-black text-blue-700";
                    document.getElementById('exact-status-prefix').innerText = isIncl ? '目前裝了 ' : '目前每個人分了 ';
                    document.getElementById('exact-status-unit').innerText = isIncl ? ' 盤' : ' 個';
                }

                if (state.step === 0) {
                    historyList.innerHTML = '<p class="text-slate-300 text-sm italic text-center">點擊按鈕開始分配</p>';
                } else {
                    if (historyList.children.length !== state.step || historyList.querySelector('p')) {
                        historyList.innerHTML = '';
                        for (let i = 0; i < state.step; i++) {
                            const div = document.createElement('div');
                            div.className = `text-xl font-mono animate-slide-in-left ${isMinus ? 'text-red-600' : 'text-blue-600'}`;
                            if (isMinus) {
                                let currVal = state.total - (i * state.divisor);
                                div.innerText = `${currVal} - ${state.divisor} = ${currVal - state.divisor}`;
                            } else {
                                const v1 = isIncl ? state.divisor : (i + 1);
                                const v2 = isIncl ? (i + 1) : state.divisor;
                                div.innerText = `${v1} × ${v2} = ${v1 * v2}`;
                            }
                            historyList.appendChild(div);
                        }
                    }
                }
                document.getElementById('exact-current-plates').innerText = state.step;
            } else {
                exactHistoryPanel.classList.add('hidden');
                
                const distributedTotal = quotient * state.divisor;
                
                if (state.phase === 'minus' || state.phase === 'formula' || state.phase === 'finished') {
                    stepMultiCard.classList.remove('hidden');
                    document.getElementById('step-multi-title').innerText = isIncl ? '步驟 1：盤子裡裝了幾顆草莓？' : '步驟 1：小朋友一共拿了幾顆氣球？';
                    const formulaHTML = isIncl 
                        ? `${state.divisor} × <span class="underline decoration-4 decoration-blue-600 underline-offset-8 font-black">${quotient}</span> = ${distributedTotal}`
                        : `<span class="underline decoration-4 decoration-blue-600 underline-offset-8 font-black">${quotient}</span> × ${state.divisor} = ${distributedTotal}`;
                    document.getElementById('multi-formula').innerHTML = formulaHTML;
                    document.getElementById('multi-hint').innerText = isIncl 
                        ? `每盤裝 ${state.divisor} 顆${itemName}，裝了 ${quotient} 盤，總共裝了 ${distributedTotal} 顆${itemName}`
                        : `每人分到 ${quotient} 顆${itemName}，分給 ${state.divisor} 個人，總共拿走 ${distributedTotal} 顆${itemName}`;
                } else {
                    stepMultiCard.classList.add('hidden');
                }

                if (state.phase === 'formula' || state.phase === 'finished') {
                    stepMinusCard.classList.remove('hidden');
                    document.getElementById('step-minus-title').innerText = isIncl ? '步驟 2：還剩下幾顆草莓？' : '步驟 2：還剩下幾顆氣球？';
                    document.getElementById('minus-formula').innerHTML = `${state.total} - ${distributedTotal} = <span class="font-black text-red-600 underline decoration-4 decoration-red-600 underline-offset-8">${remainder}</span>`;
                    document.getElementById('minus-hint').innerText = isIncl
                        ? `總共有 ${state.total} 顆${itemName}，盤子裡裝了 ${distributedTotal} 顆，還剩下 ${remainder} 顆`
                        : `總共有 ${state.total} 顆${itemName}，小朋友拿走 ${distributedTotal} 顆，還剩下 ${remainder} 顆`;
                } else {
                    stepMinusCard.classList.add('hidden');
                }
            }

            // 8. 總結面板 (除法算式展示)
            if (finished) {
                summaryPanel.classList.remove('hidden');
                document.getElementById('summary-title').innerText = isExact ? '除法算式與說數學' : '步驟 3：用除法算式記下來';

                const exactFormula = document.getElementById('exact-summary-formula');
                const remainderFormula = document.getElementById('remainder-summary-formula');
                const explButtonsContainer = document.getElementById('expl-buttons-container');

                if (isExact) {
                    exactFormula.classList.remove('hidden');
                    remainderFormula.classList.add('hidden');
                    
                    document.getElementById('formula-total').innerText = state.total;
                    document.getElementById('formula-divisor').innerText = state.divisor;
                    document.getElementById('formula-result').innerText = quotient;

                    document.getElementById('formula-total').className = (state.explStep === 1) ? 'text-yellow-300 font-black scale-110 transition-all' : 'transition-all';
                    document.getElementById('formula-divide').className = (state.explStep === 2) ? 'text-yellow-300 font-black scale-110 transition-all' : 'text-white/40 transition-all';
                    document.getElementById('formula-divisor').className = (state.explStep === 2) ? 'text-yellow-300 font-black scale-110 transition-all' : 'transition-all';
                    document.getElementById('formula-result').className = (state.explStep === 3) ? 'text-yellow-300 font-black scale-110 transition-all' : 'transition-all';
                    
                    document.getElementById('arrow-1').classList.toggle('hidden', state.explStep !== 1);
                    document.getElementById('arrow-2').classList.toggle('hidden', state.explStep !== 2);
                    document.getElementById('arrow-3').classList.toggle('hidden', state.explStep !== 3);

                    explButtonsContainer.innerHTML = `
                        <button onclick="setExplStep(1)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">1</button>
                        <button onclick="setExplStep(2)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">2</button>
                        <button onclick="setExplStep(3)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">3</button>
                    `;

                    const explText = document.getElementById('expl-text');
                    if (state.explStep === 0) {
                        explText.innerHTML = '<span class="text-white font-bold text-lg animate-pulse">說說看每個數字代表什麼意思？</span>';
                    } else {
                        if (state.explStep === 1) explText.innerText = `「${state.total}」代表總共有 ${state.total} 個${isIncl ? '蛋糕' : '餅乾'}`;
                        else if (state.explStep === 2) explText.innerText = isIncl ? `「÷${state.divisor}」代表每 ${state.divisor} 個裝成一盤` : `「÷${state.divisor}」代表平分給 ${state.divisor} 個小朋友`;
                        else if (state.explStep === 3) explText.innerText = isIncl ? `「${quotient}」代表最後裝成了 ${quotient} 盤` : `「${quotient}」代表一個小朋友分到 ${quotient} 片`;
                    }

                    const readText = `${toChineseNum(state.total)}除以${toChineseNum(state.divisor)}等於${toChineseNum(quotient)}`;
                    const readAloud = document.getElementById('read-aloud');
                    readAloud.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <span>讀作：<span class="text-yellow-300">${toChineseNum(state.total)}</span> 除以 <span class="text-yellow-300">${toChineseNum(state.divisor)}</span> 等於 <span class="text-yellow-300">${toChineseNum(quotient)}</span></span>
                            <button onclick="speakFormula('${readText}')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center transition-all cursor-pointer" title="播放語音">🔊</button>
                        </div>
                    `;
                } else {
                    exactFormula.classList.add('hidden');
                    remainderFormula.classList.remove('hidden');

                    document.getElementById('f-total').innerText = state.total;
                    document.getElementById('f-divisor').innerText = state.divisor;
                    document.getElementById('f-quotient').innerText = quotient;
                    document.getElementById('f-remainder').innerText = remainder;

                    document.getElementById('f-total').className = (state.explStep === 1) ? 'text-yellow-300 font-black scale-110 transition-all' : 'transition-all';
                    document.getElementById('f-divide').className = (state.explStep === 2) ? 'text-yellow-300 font-black scale-110 transition-all' : 'text-white/40 transition-all';
                    document.getElementById('f-divisor').className = (state.explStep === 2) ? 'text-yellow-300 font-black scale-110 transition-all' : 'transition-all';
                    document.getElementById('f-quotient').className = (state.explStep === 3) ? 'text-yellow-300 font-black scale-110 transition-all' : 'transition-all';
                    document.getElementById('f-remainder').className = (state.explStep === 4) ? 'text-yellow-400 font-black scale-110 transition-all' : 'text-yellow-300 transition-all';

                    document.getElementById('a-1').classList.toggle('hidden', state.explStep !== 1);
                    document.getElementById('a-2').classList.toggle('hidden', state.explStep !== 2);
                    document.getElementById('a-3').classList.toggle('hidden', state.explStep !== 3);
                    document.getElementById('a-4').classList.toggle('hidden', state.explStep !== 4);

                    explButtonsContainer.innerHTML = `
                        <button onclick="setExplStep(1)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">1</button>
                        <button onclick="setExplStep(2)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">2</button>
                        <button onclick="setExplStep(3)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">3</button>
                        <button onclick="setExplStep(4)" class="expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all">4</button>
                    `;

                    const explText = document.getElementById('expl-text');
                    if (state.explStep === 0) explText.innerHTML = '<span class="text-white font-bold text-2xl animate-pulse">說說看每個數字代表什麼意思？</span>';
                    else if (state.explStep === 1) explText.innerText = `「${state.total}」代表總共有 ${state.total} 顆${itemName}`;
                    else if (state.explStep === 2) explText.innerText = isIncl ? `「÷${state.divisor}」代表每 ${state.divisor} 顆裝一盤` : `「÷${state.divisor}」代表平分給 ${state.divisor} 個人`;
                    else if (state.explStep === 3) explText.innerText = isIncl ? `「${quotient}」代表最後裝成了 ${quotient} 盤` : `「${quotient}」代表每個人拿到 ${quotient} 顆`;
                    else if (state.explStep === 4) explText.innerText = `「${remainder}」代表還剩下 ${remainder} 顆`;

                    const readText = `${toChineseNum(state.total)}除以${toChineseNum(state.divisor)}等於${toChineseNum(quotient)}餘${toChineseNum(remainder)}`;
                    const readAloud = document.getElementById('read-aloud');
                    readAloud.innerHTML = `
                        <div class="flex items-center justify-center gap-2">
                            <span>讀作：<span class="text-yellow-300">${toChineseNum(state.total)}</span> 除以 <span class="text-yellow-300">${toChineseNum(state.divisor)}</span> 等於 <span class="text-yellow-300">${toChineseNum(quotient)}</span> 餘 <span class="text-yellow-300">${toChineseNum(remainder)}</span></span>
                            <button onclick="speakFormula('${readText}')" class="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 active:scale-90 flex items-center justify-center transition-all cursor-pointer" title="播放語音">🔊</button>
                        </div>
                    `;
                }

                document.querySelectorAll('.expl-btn').forEach((b, i) => {
                    b.className = (state.explStep === i + 1) 
                        ? "expl-btn w-12 h-12 rounded-full font-bold bg-yellow-400 text-indigo-900 scale-110 shadow-lg text-xl transition-all" 
                        : "expl-btn w-12 h-12 rounded-full font-bold bg-white/10 text-white hover:bg-white/20 text-xl transition-all";
                });
            } else {
                summaryPanel.classList.add('hidden');
            }
        }

        function speakFormula(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW';
                utterance.rate = 0.8;
                
                const voices = window.speechSynthesis.getVoices();
                const twVoice = voices.find(voice => voice.lang.includes('ZH-TW') || voice.lang.includes('zh-TW'));
                if (twVoice) utterance.voice = twVoice;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音合成功能！');
            }
        }

        render();
    </script>
</body>
</html>
