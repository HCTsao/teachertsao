<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>可口分數披薩(遊戲)</title>
  <!-- 引入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    /* 隱藏預設數字輸入框的上下箭頭 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
    
    /* 統一設定字體為 18px */
    body, button, input, span, p, div {
      font-size: 18px;
    }

    /* 手繪風格字體 */
    .handwritten {
      font-family: "Comic Sans MS", "Chalkboard SE", "Microsoft JhengHei", sans-serif;
    }

    /* 手繪風歪斜 wobbly 邊框 */
    .wobbly-border {
      border: 3.5px solid #3f2021;
      border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    }
    
    .wobbly-btn {
      border: 3px solid #3f2021;
      border-radius: 255px 20px 225px 15px/15px 200px 18px 255px;
      transition: transform 0.1s ease, background-color 0.2s;
    }
    .wobbly-btn:active {
      transform: scale(0.95) rotate(-1deg);
    }

    /* 街機立體巨型按鈕 (Arcade Console Buttons) */
    .arcade-btn-circle-red {
      background: radial-gradient(circle, #f87171 0%, #ef4444 100%);
      color: #ffffff;
      border: 4px solid #3f2021;
      border-radius: 9999px;
      box-shadow: 0 8px 0 #3f2021;
      transition: all 0.05s ease;
      text-shadow: 0 2px 2px rgba(0,0,0,0.3);
    }
    .arcade-btn-circle-red:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #3f2021;
    }

    .arcade-btn-circle-yellow {
      background: radial-gradient(circle, #fbbf24 0%, #f59e0b 100%);
      color: #3f2021;
      border: 4px solid #3f2021;
      border-radius: 9999px;
      box-shadow: 0 8px 0 #3f2021;
      transition: all 0.05s ease;
    }
    .arcade-btn-circle-yellow:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #3f2021;
    }

    /* 氣泡對話泡泡小尾巴 (指向顧客大頭照) */
    .bubble-pointer {
      position: relative;
      background: #fffdf5;
      border: 3px solid #3f2021;
      border-radius: 16px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .bubble-pointer::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-width: 12px 10px 0;
      border-style: solid;
      border-color: #fffdf5 transparent;
      display: block;
    }
    .bubble-pointer::before {
      content: '';
      position: absolute;
      bottom: -16px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-width: 15px 12px 0;
      border-style: solid;
      border-color: #3f2021 transparent;
      display: block;
      z-index: -1;
    }

    /* 飛出包裝盒動畫 */
    @keyframes box-serve-fly {
      0% { transform: scale(1) translate(0, 0) rotate(0deg); opacity: 1; }
      100% { transform: scale(0.2) translate(300px, -200px) rotate(20deg); opacity: 0; }
    }
    .box-serve-animate {
      animation: box-serve-fly 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    /* 搖晃與震動 */
    @keyframes element-shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-active {
      animation: element-shake 0.3s ease-in-out;
    }

    /* 分數直式寫法 (維持字體比例) */
    .vertical-fraction {
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
      margin: 0 2px;
    }
    .vertical-fraction .num-den {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .vertical-fraction .numerator {
      border-bottom: 2.5px solid #3f2021;
      padding-bottom: 1px;
      text-align: center;
      width: 100%;
      font-family: monospace;
      font-weight: 900;
      font-size: 16px;
    }
    .vertical-fraction .denominator {
      padding-top: 1px;
      text-align: center;
      width: 100%;
      font-family: monospace;
      font-weight: 900;
      font-size: 16px;
    }
    .vertical-fraction .whole-num {
      font-size: 24px;
      font-weight: 900;
      margin-right: 1px;
      font-family: monospace;
    }

    /* 顧客彈跳滑入 (Bounce-in) */
    @keyframes customer-enter {
      0% { transform: translateY(120px) scale(0.6); opacity: 0; }
      70% { transform: translateY(-12px) scale(1.05); opacity: 0.9; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-cust-enter {
      animation: customer-enter 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 顧客答對退場滑出 */
    @keyframes customer-leave-success {
      0% { transform: translateX(0) scale(1); opacity: 1; }
      100% { transform: translateX(250px) scale(0.6); opacity: 0; }
    }
    .animate-cust-leave-success {
      animation: customer-leave-success 0.5s ease-in forwards;
    }

    /* 顧客超時生氣退場 */
    @keyframes customer-leave-fail {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(150px) scale(0.8); opacity: 0; }
    }
    .animate-cust-leave-fail {
      animation: customer-leave-fail 0.5s ease-in forwards;
    }

    /* 披薩小盒子果凍彈跳擺放 */
    @keyframes pizza-pop {
      0% { transform: scale(0.3); opacity: 0; }
      70% { transform: scale(1.18); }
      100% { transform: scale(1); opacity: 1; }
    }
    .animate-pizza-pop {
      animation: pizza-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
  </style>
</head>
<body class="bg-[#ebd5bd] text-[#3f2021] handwritten overflow-x-hidden min-h-screen p-2 md:p-4 flex flex-col items-center justify-center">
  <audio id="bg-music" src="披薩小店節拍.mp3" loop></audio>
  <img src="https://api.visitorbadge.io/api/visitors?path=hctsao.teachertsao&label=Views&labelColor=%23475569&countColor=%23ea580c" alt="Visitor Counter" style="display: none;">
  
  <!-- HOME_BUTTON_START -->
  <a href="../index.html" style="position: fixed; top: 12px; left: 12px; z-index: 999999; background: #fdf6e2; color: #3f2021; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold; border: 3px solid #3f2021; transition: all 0.2s ease; box-shadow: 0 4px 0px #3f2021;" onmouseover="this.style.background='#f5ebd0'" onmouseout="this.style.background='#fdf6e2'">&#127969; 回首頁</a>
  <script>(function() { function adjustViewport() { var targetWidth = 1024; var screenWidth = window.innerWidth || document.documentElement.clientWidth || window.screen.width; if (screenWidth > 0 && screenWidth < targetWidth) { var scale = screenWidth / targetWidth; var meta = document.querySelector('meta[name="viewport"]'); if (!meta) { meta = document.createElement('meta'); meta.setAttribute('name', 'viewport'); document.head.appendChild(meta); } meta.setAttribute('content', 'width=' + targetWidth + ', initial-scale=' + scale + ', minimum-scale=' + scale + ', maximum-scale=2.0, user-scalable=yes'); } else { var meta = document.querySelector('meta[name="viewport"]'); if (meta) { meta.setAttribute('content', 'width=device-width, initial-scale=1.0'); } } } adjustViewport(); var timer = null; window.addEventListener('resize', function() { clearTimeout(timer); timer = setTimeout(adjustViewport, 300); }); window.addEventListener('orientationchange', function() { clearTimeout(timer); timer = setTimeout(adjustViewport, 300); }); })();</script>

  <!-- 頂部返回主選單按鈕 (跟隨回首頁按鈕置左且放在其下方) -->
  <button id="lobby-back-btn" onclick="goHome()" class="hidden" style="position: fixed; top: 60px; left: 12px; z-index: 999999; background: #fdf6e2; color: #3f2021; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold; border: 3px solid #3f2021; transition: all 0.2s ease; box-shadow: 0 4px 0px #3f2021;" onmouseover="this.style.background='#f5ebd0'" onmouseout="this.style.background='#fdf6e2'">
    🍕 回主選單
  </button>

  <!-- 網頁左側固定音量調整器 (跟隨回主選單按鈕下方) -->
  <div id="fixed-volume-control" class="hidden" style="position: fixed; top: 110px; left: 12px; z-index: 999999; background: #fdf6e2; color: #3f2021; padding: 8px 12px; border-radius: 15px; border: 3px solid #3f2021; box-shadow: 0 4px 0px #3f2021; width: 110px; display: flex; flex-direction: column; items: center; justify-content: center; gap: 4px;">
    <span style="font-size: 11px; font-weight: bold; color: #3f2021;">🎵 音量調整</span>
    <input type="range" id="volume-slider-game" min="0" max="1" step="0.05" value="0.5" style="width: 100%; cursor: pointer;" class="accent-[#542a2b]" oninput="adjustBgVolume(this.value)">
  </div>

  <!-- 總遊戲大外框 (強制以 4:3 比例縮放，完全用 HTML/CSS/SVG 街機佈局) -->
  <div class="aspect-[4/3] w-full max-w-[850px] relative wobbly-border bg-[#faebdd] shadow-[0_8px_0_#3f2021] overflow-hidden">
    
    <!-- ================= 餐廳背景元素 (手繪風) ================= -->
    <!-- 烤爐 -->
    <div class="absolute top-[8%] left-[10%] w-[18%] h-[30%] z-0 opacity-40">
      <svg viewBox="0 0 100 120" class="w-full h-full">
        <path d="M 10,120 A 40,40 0 0,1 90,120 Z" fill="#d97706" stroke="#3f2021" stroke-width="3"/>
        <path d="M 20,120 A 30,30 0 0,1 80,120 Z" fill="#78350f" stroke="#3f2021" stroke-width="3"/>
        <path d="M 35,120 Q 50,85 65,120 Z" fill="#ea580c"/>
      </svg>
    </div>



    <!-- 累積得分與剩餘總時間 (置於右側頂部) -->
    <div id="score-board" class="absolute top-[3%] left-[68%] w-[28%] h-[12%] bg-[#854d0e] border-[3px] border-[#3f2021] rounded shadow-md z-10 p-1 flex justify-around items-center text-white">
      <div class="flex flex-col items-center">
        <span class="text-[9px] font-black text-amber-200">累積得分</span>
        <span id="score-val" class="text-sm md:text-base font-black text-yellow-300 font-mono" style="font-size:24px;">0</span>
      </div>
      <div class="h-6 w-[1px] bg-amber-700/60"></div>
      <div class="flex flex-col items-center">
        <span class="text-[9px] font-black text-slate-300">剩餘時間</span>
        <span id="global-timer-val" class="text-sm md:text-base font-black text-rose-300 font-mono" style="font-size:24px;">120s</span>
      </div>
      <!-- 隱藏 Combo 傳遞以防 JS 崩潰 -->
      <span id="combo-val" class="hidden"></span>
    </div>

    <!-- 寬木頭櫃檯桌面 (前景底部 36%，鎖定前後景) -->
    <div class="absolute bottom-0 inset-x-0 h-[36%] bg-[#c68a4c] border-t-[4px] border-[#3f2021] shadow-inner z-10">
      <svg class="absolute inset-0 w-full h-full opacity-10" preserveAspectRatio="none">
        <line x1="0" y1="30%" x2="100%" y2="30%" stroke="#3f2021" stroke-width="4"/>
        <line x1="0" y1="70%" x2="100%" y2="70%" stroke="#3f2021" stroke-width="4"/>
      </svg>
    </div>

    <!-- ================= 首頁畫面 ================= -->
    <div id="home-screen" class="absolute inset-0 bg-[#3f2021]/30 backdrop-blur-[2px] flex items-center justify-center p-4 z-40">
      <div class="bg-[#fefcf3] wobbly-border shadow-[0_8px_0_#3f2021] p-6 max-w-md w-full text-center relative flex flex-col items-center">
        
        <!-- 招牌 -->
        <div class="mb-4 transform hover:rotate-12 transition-transform duration-300 cursor-pointer">
          <svg class="w-16 h-16 drop-shadow" viewBox="0 0 100 100">
            <circle cx="50" cy="50" r="45" fill="#facc15" stroke="#3f2021" stroke-width="3"/>
            <circle cx="50" cy="50" r="38" fill="#fef08a"/>
            <circle cx="35" cy="35" r="5" fill="#dc2626" stroke="#3f2021" stroke-width="1.5"/>
            <circle cx="65" cy="35" r="5" fill="#dc2626" stroke="#3f2021" stroke-width="1.5"/>
            <circle cx="50" cy="65" r="5" fill="#dc2626" stroke="#3f2021" stroke-width="1.5"/>
          </svg>
        </div>

        <h1 class="text-3xl font-black text-[#3f2021] mb-8 font-serif">
          分數披薩店
        </h1>

        <div class="flex flex-col gap-3 w-full px-4 mb-4">
          <button onclick="startGame('I2M')" class="wobbly-btn w-full flex items-center justify-center py-4 px-4 text-base font-black text-white bg-[#542a2b] hover:bg-[#783f40] shadow-[0_4px_0_#3f2021] hover:translate-y-[2px] hover:shadow-[0_2px_0_#3f2021]">
            <span class="flex items-center gap-1.5" style="font-size: 18px;">
              <i data-lucide="pizza" class="w-5 h-5"></i> 挑戰一：假分數 ➔ 帶分數
            </span>
          </button>

          <button onclick="startGame('M2I')" class="wobbly-btn w-full flex items-center justify-center py-4 px-4 text-base font-black text-[#3f2021] bg-[#fdf6e2] hover:bg-[#f5ebd0] shadow-[0_4px_0_#3f2021] hover:translate-y-[2px] hover:shadow-[0_2px_0_#3f2021]">
            <span class="flex items-center gap-1.5" style="font-size: 18px;">
              <i data-lucide="scissors" class="w-5 h-5"></i> 挑戰二：帶分數 ➔ 假分數
            </span>
          </button>
        </div>

        <!-- 音量調整器 (首頁大廳) -->
        <div class="mt-2 flex items-center justify-center gap-2 bg-[#fdf6e2] px-4 py-2 rounded-xl border-2 border-[#3f2021] text-xs font-black shadow shadow-orange-950/10">
          <span>🎵 音量調整:</span>
          <input type="range" id="volume-slider-home" min="0" max="1" step="0.05" value="0.5" class="w-32 accent-[#542a2b] cursor-pointer" oninput="adjustBgVolume(this.value)">
        </div>
      </div>
    </div>

    <!-- ================= 遊戲核心畫面 ================= -->
    <div id="game-screen" class="absolute inset-0 hidden">

      <!-- 1. 左側三位排隊顧客區域 (置於左側中) -->
      <div id="customers-container" class="absolute top-[16%] left-[3%] w-[42%] h-[46%] z-0 flex justify-around items-end px-1">
        <!-- Slot 0 -->
        <div id="cust-slot-0" class="relative w-[31%] h-full flex flex-col justify-end items-center transition-all duration-300">
          <!-- 氣泡對話框 (直接浮在頭頂，全民漢堡的感覺) -->
          <div id="cust-bubble-0" class="bubble-pointer absolute -top-[80px] w-[140px] px-1 py-1.5 bg-[#fffdf5] text-center font-black leading-tight z-20">
            載入中...
          </div>
          <div id="cust-meta-0" class="absolute top-[25%] bg-[#fffdf2] border border-[#3f2021] rounded px-1 w-[90%] text-[8px] font-black shadow flex flex-col items-center leading-none z-10">
            <span id="cust-timer-0" class="text-rose-600">⏱️ 60s</span>
            <div class="w-full bg-slate-200 h-1 rounded-full overflow-hidden mt-0.5 border border-[#3f2021]/30">
              <div id="cust-progress-bar-0" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%;"></div>
            </div>
            <span id="cust-satisfy-0" class="text-amber-700 mt-1 text-[8px] hidden">❤️ 100分</span>
          </div>
          <div id="avatar-0" class="w-full h-[65%] flex items-end"></div>
        </div>
        <!-- Slot 1 -->
        <div id="cust-slot-1" class="relative w-[31%] h-full flex flex-col justify-end items-center transition-all duration-300">
          <div id="cust-bubble-1" class="bubble-pointer absolute -top-[80px] w-[140px] px-1 py-1.5 bg-[#fffdf5] text-center font-black leading-tight z-20">
            載入中...
          </div>
          <div id="cust-meta-1" class="absolute top-[25%] bg-[#fffdf2] border border-[#3f2021] rounded px-1 w-[90%] text-[8px] font-black shadow flex flex-col items-center leading-none z-10">
            <span id="cust-timer-1" class="text-rose-600">⏱️ 60s</span>
            <div class="w-full bg-slate-200 h-1 rounded-full overflow-hidden mt-0.5 border border-[#3f2021]/30">
              <div id="cust-progress-bar-1" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%;"></div>
            </div>
            <span id="cust-satisfy-1" class="text-amber-700 mt-1 text-[8px] hidden">❤️ 100分</span>
          </div>
          <div id="avatar-1" class="w-full h-[65%] flex items-end"></div>
        </div>
        <!-- Slot 2 -->
        <div id="cust-slot-2" class="relative w-[31%] h-full flex flex-col justify-end items-center transition-all duration-300">
          <div id="cust-bubble-2" class="bubble-pointer absolute -top-[80px] w-[140px] px-1 py-1.5 bg-[#fffdf5] text-center font-black leading-tight z-20">
            載入中...
          </div>
          <div id="cust-meta-2" class="absolute top-[25%] bg-[#fffdf2] border border-[#3f2021] rounded px-1 w-[90%] text-[8px] font-black shadow flex flex-col items-center leading-none z-10">
            <span id="cust-timer-2" class="text-rose-600">⏱️ 60s</span>
            <div class="w-full bg-slate-200 h-1 rounded-full overflow-hidden mt-0.5 border border-[#3f2021]/30">
              <div id="cust-progress-bar-2" class="h-full bg-emerald-500 transition-all duration-300" style="width: 100%;"></div>
            </div>
            <span id="cust-satisfy-2" class="text-amber-700 mt-1 text-[8px] hidden">❤️ 100分</span>
          </div>
          <div id="avatar-2" class="w-full h-[65%] flex items-end"></div>
        </div>
      </div>

      <!-- 2. 中間/右側大型開放式外帶紙盒工作台 (置於右側中，高 50% 寬 49%) -->
      <div id="pizza-box-container" class="absolute top-[16%] left-[48%] w-[49%] h-[46%] z-10 flex flex-col justify-between p-2 bg-[#fffdf8] wobbly-border shadow-md">
        <!-- 備料紙盒標題與說明 -->
        <div class="flex justify-between items-center text-xs font-black text-amber-950 bg-white/70 px-2 py-0.5 rounded border border-[#3f2021]/15">
          <span class="flex items-center gap-1">📦 <span id="box-slot-title">披薩打包盒 (顧客 1)</span></span>
          <span id="flavor-display-tag" class="text-[9px] bg-amber-900 text-white px-1.5 py-0.5 rounded">鮮蔬起司</span>
        </div>

        <!-- 紙盒內部砧板與披薩渲染 (高空間，可放置極多切片) -->
        <div class="flex-grow bg-[#fffdf6] p-1 flex flex-col justify-center items-center relative overflow-hidden mt-1 min-h-0">
          <div id="pizza-container" class="flex flex-wrap gap-1.5 justify-start items-start w-full h-full overflow-y-auto p-1 content-start">
            <!-- JS 動態繪製 -->
          </div>
          
          <!-- 出餐打包蓋盒動畫 -->
          <div id="serving-box-cover" class="absolute inset-0 bg-[#eddccb] border-4 border-[#3f2021] rounded-2xl flex items-center justify-center font-black text-[#3f2021] text-xs hidden">
            📦 包裝出餐中...
          </div>
        </div>
      </div>

      <!-- 3. 底部全幅式街機控制台面板 (新增送出按鈕，字體放大至 20 號字) -->
      <div class="absolute bottom-[2%] inset-x-[3%] h-[27%] bg-[#dfba9d] border-[3.5px] border-[#3f2021] rounded-2xl shadow-[0_6px_0_#3f2021] z-20 p-2 flex items-center justify-between gap-2">
        
        <!-- 左側配置：清空 + 切片數(分母)設定控制 (佔 28% 寬) -->
        <div class="w-[28%] h-full flex flex-col justify-between items-center py-0.5">
          <button onclick="triggerTrashClear()" class="w-full py-1 bg-rose-50 border-2 border-[#3f2021] font-black rounded-lg hover:bg-rose-100 transition-colors shadow" style="font-size: 18px;">
            🗑️ 清空重做
          </button>
          
          <!-- 實時分母設定 -->
          <div class="flex flex-col items-center justify-center bg-white border-2 border-[#3f2021] rounded-xl px-2 py-0.5 shadow-inner w-full flex-grow mt-1">
            <span class="font-black text-slate-700 leading-tight block mb-1 text-center" style="font-size: 18px;">每個Pizza切成幾片？</span>
            <div class="flex items-center justify-center gap-3 w-full mt-0.5">
              <button onclick="adjustDenInConsole(-1)" class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-[#542a2b] text-white font-black flex items-center justify-center active:scale-90 shadow border-2 border-[#3f2021]" style="font-size: 28px; line-height: 1;">-</button>
              <span id="console-den-val" class="font-black text-[#542a2b] font-mono leading-none" style="font-size: 32px;">3</span>
              <button onclick="adjustDenInConsole(1)" class="w-10 h-10 md:w-11 md:h-11 rounded-full bg-[#542a2b] text-white font-black flex items-center justify-center active:scale-90 shadow border-2 border-[#3f2021]" style="font-size: 28px; line-height: 1;">+</button>
            </div>

    // ==========================================================================
    // Web Audio API 8-bit 音效合成器
    // ==========================================================================
    class SoundSynth {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      }
      playClick() {
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.05);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.05);
      }
      playSlice() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const bufferSize = this.ctx.sampleRate * 0.07;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.value = 1300;
        
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start(now);
      }
      playBell() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const playTone = (freq, start, duration) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + start);
          gain.gain.setValueAtTime(0.05, now + start);
          gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now + start); osc.stop(now + start + duration);
        };
        playTone(2100, 0, 0.2); 
        playTone(2600, 0.03, 0.25); 
      }
      playCoin() {
        this.init(); if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const playTone = (freq, start, duration) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + start);
          gain.gain.setValueAtTime(0.04, now + start);
          gain.gain.exponentialRampToValueAtTime(0.001, now + start + duration);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(now + start); osc.stop(now + start + duration);
        };
        playTone(987.77, 0, 0.08); // B5
        playTone(1318.51, 0.08, 0.22); // E6
      }
      playHurt() {
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(140, this.ctx.currentTime);
        osc.frequency.linearRampToValueAtTime(70, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
    }

    // ==========================================================================

    function startGame(selectedMode) {

      if (bgMusic) {
        const currentVol = parseFloat(document.getElementById('volume-slider-home').value) || 0.5;
        bgMusic.volume = currentVol;
        bgMusic.play().catch(e => console.log("Audio play blocked by browser policies."));

      mode = selectedMode;

    // ==========================================================================
    // 產生隨機顧客資料

    function createCustomerData() {
      const den = Math.floor(Math.random() * 5) + 2; // 分母 2 ~ 6
      const whole = Math.floor(Math.random() * 3) + 1; // 整數 1 ~ 3
      const numPart = Math.floor(Math.random() * (den - 1)) + 1; // 分子
      const impNum = (whole * den) + numPart;
      
      const avatarKeys = Object.keys(AVATARS);
      const avatar = avatarKeys[Math.floor(Math.random() * avatarKeys.length)];
      const flavorObj = FLAVORS[Math.floor(Math.random() * FLAVORS.length)];
      
      return {
        den, whole, numPart, impNum,
        avatar: avatar,
        flavor: flavorObj.id,
        flavorName: flavorObj.name,
        timeRemaining: 30, // 每個顧客時間大約 30 秒
        satisfaction: 100,
        
        // 儲存此顧客的個別進度
        playerWholeCount: 0,
        playerSliceCount: 0,
        playerDen: 3, // 預設控制台分母切3片
        receiptNum: 0
      };
    }

    // ==========================================================================
    // 補滿顧客插槽
    // ==========================================================================
    function refillSlots() {
      let maxSlots = 1;
      if (totalCustomersServed >= 4) {
        maxSlots = 2;
      }

      if (maxSlots === 1) {
        document.getElementById('cust-slot-0').classList.add('hidden');
        document.getElementById('cust-slot-1').classList.remove('hidden');
        document.getElementById('cust-slot-2').classList.add('hidden');
        
        activeSlots[0] = null;
        activeSlots[2] = null;
        if (!activeSlots[1]) {
          activeSlots[1] = createCustomerData();
          triggerEnterAnimation(1);
        }
        selectedSlotIdx = 1;
      } else if (maxSlots === 2) {
        document.getElementById('cust-slot-0').classList.remove('hidden');
        document.getElementById('cust-slot-1').classList.add('hidden');
        document.getElementById('cust-slot-2').classList.remove('hidden');
        
        activeSlots[1] = null;
        if (!activeSlots[0]) {
          activeSlots[0] = createCustomerData();
          triggerEnterAnimation(0);
        }
        if (!activeSlots[2]) {
          activeSlots[2] = createCustomerData();
          triggerEnterAnimation(2);
        }
        if (selectedSlotIdx === 1) {
          selectedSlotIdx = 0;
        }
      } else {
        document.getElementById('cust-slot-0').classList.remove('hidden');
        document.getElementById('cust-slot-1').classList.remove('hidden');
        document.getElementById('cust-slot-2').classList.remove('hidden');
        
        for (let i = 0; i < 3; i++) {
          if (!activeSlots[i]) {
            activeSlots[i] = createCustomerData();
            triggerEnterAnimation(i);
          }
        }
      }

    // ==========================================================================
    // 計時器心跳 (時間倒數與總計時結束判定)
    // ==========================================================================
    function startTimer() {
      if (gameInterval) clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        if (isFrozen || isPaused) return;

        // 總遊戲時間倒數
        globalTimeRemaining--;
        document.getElementById('global-timer-val').innerText = `${globalTimeRemaining}s`;
        if (globalTimeRemaining <= 0) {
          endGame();
          return;
        }

        for (let i = 0; i < 3; i++) {
          const cust = activeSlots[i];
          if (cust) {
            cust.timeRemaining--;
            cust.satisfaction = Math.max(10, Math.ceil((cust.timeRemaining / 30) * 100));

            document.getElementById(`cust-timer-${i}`).innerText = `⏱️ ${cust.timeRemaining}s`;
            document.getElementById(`cust-satisfy-${i}`).innerText = `❤️ ${cust.satisfaction}分`;

            const pct = (cust.timeRemaining / 30) * 100;
            const pbar = document.getElementById(`cust-progress-bar-${i}`);
            if (pbar) {
              pbar.style.width = pct + '%';
              if (pct > 50) pbar.className = "h-full bg-emerald-500 transition-all duration-300";
              else if (pct > 25) pbar.className = "h-full bg-amber-500 transition-all duration-300";
              else pbar.className = "h-full bg-red-500 transition-all duration-300";
            }

            const metaEl = document.getElementById(`cust-meta-${i}`);
            if (cust.timeRemaining <= 5) {
              metaEl.className = "absolute top-[25%] bg-red-100 border-2 border-red-500 rounded px-1 w-[90%] text-[8px] font-black shadow flex flex-col items-center leading-none z-10 text-red-600 animate-pulse";
            } else {
              metaEl.className = "absolute top-[25%] bg-[#fffdf2] border border-[#3f2021] rounded px-1 w-[90%] text-[8px] font-black shadow flex flex-col items-center leading-none z-10 text-[#3f2021]";
            }

            if (cust.timeRemaining <= 0) {
              handleCustomerTimeout(i);
            }
          }
        }
      }, 1000);
    }

    function endGame() {
      if (gameInterval) clearInterval(gameInterval);
      synth.playBell();
      isFrozen = true;
      isPaused = true;

      document.getElementById('final-score-val').innerText = `${globalScore}分`;
      document.getElementById('final-customers-val').innerText = `${totalCustomersServed}位`;
      document.getElementById('game-over-screen').classList.remove('hidden');
    }

    function handleCustomerTimeout(idx) {
      if (isFrozen || isPaused) return;
      synth.playHurt();
      isFrozen = true;

      comboCount = 0;
      document.getElementById('combo-val').innerText = '🔥 Combo x0';

      // 1. 在對話框中顯示生氣的表情符號，文字放大
      const bubble = document.getElementById(`cust-bubble-${idx}`);
      bubble.innerHTML = `<span class="block py-1" style="font-size: 24px; line-height: 1;">😡 💢</span>`;

      const slotEl = document.getElementById(`cust-slot-${idx}`);

      // 2. 讓玩家看一眼表情符號後，顧客向下滑動離開
      setTimeout(() => {
        slotEl.classList.add('animate-cust-leave-fail');
        
        globalScore = Math.max(0, globalScore - 10);
        document.getElementById('score-val').innerText = globalScore;

        setTimeout(() => {
          slotEl.classList.remove('animate-cust-leave-fail');

          activeSlots[idx] = createCustomerData();
          document.getElementById(`avatar-${idx}`).innerHTML = AVATARS[activeSlots[idx].avatar];
          slotEl.classList.add('animate-cust-enter');

          isFrozen = false;
          refillSlots();
        }, 500); // 下滑動畫時間約 500ms
      }, 800); // 氣泡生氣停留 800ms
    }

    // ==========================================================================
    // 披薩口味圖案 SVG 渲染
    // ==========================================================================
    function drawPizzaSVG(filled, total, flavor = 'pepperoni') {
      let svg = `<svg viewBox="0 0 100 100" class="w-full h-full drop-shadow-md">`;
      
      const drawToppings = (rx, ry, flav) => {
        let toppingSvg = '';
        if (flav === 'pepperoni') {
          toppingSvg += `<circle cx="${rx}" cy="${ry}" r="4" fill="#dc2626" stroke="#3f2021" stroke-width="1.2"/>`;
        } else if (flav === 'hawaii') {
          toppingSvg += `<rect x="${rx-2}" y="${ry-3}" width="4" height="6" rx="1.5" fill="#facc15" stroke="#3f2021" stroke-width="1" transform="rotate(30, ${rx}, ${ry})"/>`;
          toppingSvg += `<rect x="${rx+1}" y="${ry+1}" width="4" height="4" fill="#fca5a5" stroke="#3f2021" stroke-width="1"/>`;
        } else if (flav === 'veggie') {
          toppingSvg += `<rect x="${rx-3}" y="${ry-2}" width="2.5" height="5" rx="1" fill="#16a34a" stroke="#3f2021" stroke-width="1" transform="rotate(-40, ${rx}, ${ry})"/>`;
          toppingSvg += `<path d="M ${rx} ${ry+1} A 3.5 3.5 0 0 1 ${rx+7} ${ry+1} Z" fill="#b45309" stroke="#3f2021" stroke-width="1"/>`;
        }
        return toppingSvg;
      };

      const radiusCrust = 45;
      const radiusCheese = 37;

      if (total === 1) {
        svg += `<circle cx="50" cy="50" r="46" fill="#d97706" stroke="#3f2021" stroke-width="2.5"/>`;
        svg += `<circle cx="50" cy="50" r="38" fill="#fbbf24" stroke="#3f2021" stroke-width="1.5"/>`;
        svg += drawToppings(36, 36, flavor);
        svg += drawToppings(64, 36, flavor);
        svg += drawToppings(50, 65, flavor);
        svg += drawToppings(50, 46, flavor);
      } else {
        for (let i = 0; i < filled; i++) {
          const a1 = i * (2 * Math.PI / total) - Math.PI / 2;
          const a2 = (i + 1) * (2 * Math.PI / total) - Math.PI / 2;
          
          const cx1 = 50 + radiusCrust * Math.cos(a1);
          const cy1 = 50 + radiusCrust * Math.sin(a1);
          const cx2 = 50 + radiusCrust * Math.cos(a2);
          const cy2 = 50 + radiusCrust * Math.sin(a2);
          svg += `<path d="M 50,50 L ${cx1},${cy1} A ${radiusCrust},${radiusCrust} 0 0,1 ${cx2},${cy2} Z" fill="#d97706" stroke="#3f2021" stroke-width="2.5"/>`;
          
          const zx1 = 50 + radiusCheese * Math.cos(a1);
          const zy1 = 50 + radiusCheese * Math.sin(a1);
          const zx2 = 50 + radiusCheese * Math.cos(a2);
          const zy2 = 50 + radiusCheese * Math.sin(a2);
          svg += `<path d="M 50,50 L ${zx1},${zy1} A ${radiusCheese},${radiusCheese} 0 0,1 ${zx2},${zy2} Z" fill="#fbbf24" stroke="#3f2021" stroke-width="1.5"/>`;
          
          const aMid = a1 + (Math.PI / total);
          const rx = 50 + 22 * Math.cos(aMid);
          const ry = 50 + 22 * Math.sin(aMid);
          svg += drawToppings(rx, ry, flavor);
          
          svg += `<line x1="50" y1="50" x2="${cx1}" y2="${cy1}" stroke="#3f2021" stroke-width="2"/>`;
          svg += `<line x1="50" y1="50" x2="${cx2}" y2="${cy2}" stroke="#3f2021" stroke-width="2"/>`;
        }
      }

      svg += `</svg>`;
      return svg;
    }

    // ==========================================================================
    // 渲染打包盒

    function renderPizzaVisuals() {
      const container = document.getElementById('pizza-container');
      container.innerHTML = '';

      const cur = activeSlots[selectedSlotIdx];
      if (!cur) return;

      const flavor = cur.flavor || 'pepperoni';

      if (mode === 'I2M') {

          wrap.innerHTML = drawPizzaSVG(den, den, flavor);
          container.appendChild(wrap);
        }

        if (playerSliceCount > 0) {
          const wrap = document.createElement('div');
          wrap.className = "w-20 h-20 md:w-24 md:h-24 relative transition-transform transform hover:scale-105 mb-1 animate-pizza-pop";
          wrap.innerHTML = drawPizzaSVG(playerSliceCount, den, flavor);
          container.appendChild(wrap);
        }
      } else {
        const den = currentDenPickerVal;
        for (let i = 0; i < playerSliceCount; i++) {
          const wrap = document.createElement('div');
          wrap.className = "w-9 h-9 md:w-10 md:h-10 relative transition-transform transform hover:scale-105 p-0.5 bg-amber-50/20 border border-[#3f2021]/30 rounded-lg flex items-center justify-center animate-pizza-pop";
          wrap.innerHTML = drawPizzaSVG(1, den, flavor);

        }
      }

      if (container.children.length === 0) {
        container.innerHTML = `<span class="text-amber-800/40 text-xs font-black py-4 w-full text-center">請拍擊下方街機按鈕快速製作！</span>`;
      }
    }

    // ==========================================================================
    // 控制台即時變更分母 (自動判定答案是否正確，正確自動出餐)
    // ==========================================================================
    function adjustDenInConsole(delta) {
      if (isFrozen || isPaused) return;
      synth.playClick();
      
      currentDenPickerVal = Math.max(2, currentDenPickerVal + delta);
      document.getElementById('console-den-val').innerText = currentDenPickerVal;
      
      if (mode === 'I2M') {
        document.getElementById('ans-i2m-den').value = currentDenPickerVal;
      } else {
        document.getElementById('ans-m2i-den').value = currentDenPickerVal;
      }

      // 保存至當前 slot 快照
      activeSlots[selectedSlotIdx].playerDen = currentDenPickerVal;

      // 變更分母時自動重置備料 (重新切割)
      playerSliceCount = 0;
      playerWholeCount = 0;

      renderPizzaVisuals();
      onInputsChange();
    }

    // ==========================================================================
    // 炸裂報廢與灑花
    // ==========================================================================
    function animatePizzaExplosion(callback) {
      const container = document.getElementById('pizza-container');
      const items = container.querySelectorAll('div');
      
      if (items.length === 0) {
        if (callback) callback();
        return;
      }

      items.forEach(item => {
        const angle = Math.random() * Math.PI * 2;
        const dist = 100 + Math.random() * 80;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - 35;
        const rot = 180 + Math.random() * 360;

        item.style.transition = 'all 0.4s cubic-bezier(0.1, 0.8, 0.3, 1)';
        item.style.transform = `translate(${tx}px, ${ty}px) rotate(${rot}deg) scale(0.2)`;
        item.style.opacity = '0';
      });

      setTimeout(() => {
        if (callback) callback();
      }, 400);
    }

    function spawnConfetti(parentEl) {
      const rect = parentEl.getBoundingClientRect();
      const cx = rect.width / 2;
      const cy = rect.height / 2;
      
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'absolute rounded-full pointer-events-none z-50';
        const colors = ['#facc15', '#dc2626', '#16a34a', '#2563eb', '#c084fc', '#fb923c'];
        p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        const size = Math.floor(Math.random() * 8) + 6;
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        
        parentEl.appendChild(p);
        
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random() * 80;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist - (30 + Math.random() * 30);
        
        p.style.transition = 'all 0.6s cubic-bezier(0.1, 0.8, 0.3, 1)';
        void p.offsetWidth;
        p.style.transform = `translate(${tx}px, ${ty}px) scale(0)`;
        p.style.opacity = '0';
        
        setTimeout(() => p.remove(), 600);
      }
    }

    // ==========================================================================
    // 實時自動檢驗答案是否正確 (做出正確答案立刻自動送餐給客人，免手動敲鈴)
    // ==========================================================================
    function checkCorrectInstant() {
      if (isFrozen || isPaused) return false;

      // 檢查目前打包盒內容是否符合任何一位活躍客人的訂單
      for (let i = 0; i < 3; i++) {
        const cur = activeSlots[i];
        if (!cur) continue;

        let isCorrect = false;

        if (mode === 'I2M') {
          if (playerWholeCount === cur.whole && playerSliceCount === cur.numPart && currentDenPickerVal === cur.den) {
            isCorrect = true;
          }
        } else {
          // 帶分數換假分數無收據欄位，只要披薩盒中裝的總片數等於假分數分子、且切片分母相符即可！
          if (playerSliceCount === cur.impNum && currentDenPickerVal === cur.den) {
            isCorrect = true;
          }
        }

        if (isCorrect) {
          selectedSlotIdx = i; // 設定當前出餐的顧客 Slot 索引
          handleCorrect();
          return true;
        }
      }
      return false;
    }

    // ==========================================================================
    function serveOrder() {
      if (isFrozen || isPaused) return;
      const ok = checkCorrectInstant();
      if (!ok) {
        handleIncorrect();
      }
    }

          <i data-lucide="party-popper" class="w-6 h-6 text-emerald-500 inline-block mr-1"></i>

          <span class="vertical-fraction"><span class="whole-num">${cur.whole}</span><span class="num-den"><span class="numerator">${cur.numPart}</span><span class="denominator">${cur.den}</span></span></span>

      const box = document.getElementById('pizza-box-container');
      box.classList.add('shake-active');
      setTimeout(() => box.className = "absolute top-[16%] left-[48%] w-[49%] h-[46%] z-10 flex flex-col justify-between p-2 bg-[#fffdf8] wobbly-border shadow-md", 300);

      document.getElementById('feedback-incorrect-text').innerText = "這披薩不對啊，重做！";
      document.getElementById('feedback-incorrect').classList.remove('hidden');

      animatePizzaExplosion(() => {
        playerWholeCount = 0;
        playerSliceCount = 0;
        activeSlots[selectedSlotIdx].playerWholeCount = 0;
        activeSlots[selectedSlotIdx].playerSliceCount = 0;
        activeSlots[selectedSlotIdx].receiptNum = 0;
        
        if (mode === 'M2I') {
          document.getElementById('ans-m2i-num').value = 0;
        }

        setTimeout(() => {
          document.getElementById('feedback-incorrect').classList.add('hidden');
          isFrozen = false;
          updateSlotSelectionUI();
        }, 800);
      });
    }

    function clickSure() {
      // 略過 OK 彈窗
    }
  </script>
</body>
</html>
