                                            {/* 非自己出牌時的口訣浮現氣泡 */}
                                            {!isMe && isCallForPlayer && (
                                                <div className={`absolute ${cfg.call} z-40 pointer-events-none animate-bounce`}>
                                                    <div className={unifiedCallBoxClass}>
                                                        {currentCall.text}
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="mt-2 bg-slate-900/80 backdrop-blur-sm text-white px-4 py-1 rounded-full text-sm font-bold border border-white/20 text-center min-w-[120px]">
                                            {player.name} {isMe ? '(你)' : ''} {player.cards.length === 0 ? "（搶拍奪冠）" : `(${player.cards.length}張)`}
                                        </div>

                                        {/* 手牌疊牌區 */}
                                        <div className="relative mt-3 w-16 h-24 flex justify-center items-center">
                                            <div 
                                                className={`relative w-full h-full transition-all duration-300 ${isMe && gameState === 'playing' && player.cards.length > 0 && active ? 'hover:scale-110 active:scale-95 cursor-pointer ring-4 ring-yellow-400 rounded-xl' : ''}`} 
                                                onClick={() => isMe && playTurn(true)}
                                            >
                                                {player.cards.length > 0 ? [...Array(Math.min(Math.ceil(player.cards.length / 1.5), 15))].map((_, i) => {
                                                    const cd = player.cards[player.cards.length - 1 - i] || {};
                                                    return (
                                                        <div key={i} className="absolute w-full h-full rounded-xl border-2 shadow-sm" style={{ 
                                                            top: isDealing ? cd.dealOy : -i * 2, 
                                                            left: isDealing ? cd.dealOx : i * 0.5, 
                                                            transform: `rotate(${isDealing ? cd.dealRot : 0}deg)`, 
                                                            zIndex: 20 - i, 
                                                            backgroundColor: (isDealing || i === 0) ? '#3b82f6' : '#f8fafc', 
                                                            borderColor: (isDealing || i === 0) ? '#2563eb' : '#cbd5e1' 
                                                        }} />
                                                    );
                                                }) : (
                                                    <div className="w-full h-full rounded-xl border-2 border-dashed border-white/30 flex items-center justify-center text-white/30 font-black text-sm">
                                                        空牌
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                </Fragment>
                            );
                        })}

                        {/* 中央卡牌與拍牌區 */}
                        <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-10 w-52 h-64">
                            <div 
                                className={`relative w-full h-full bg-emerald-800/40 rounded-[40px] border-4 border-dashed border-white/20 flex items-center justify-center cursor-pointer transition-colors slap-area ${gameState === 'slapping' ? 'bg-red-500/30 border-red-500 animate-pulse' : ''}`} 
                                onClick={() => handleSlap(mySeatIndex)}
                            >
                                {isDealing ? (
                                    <div className="relative w-36 h-48">
                                        {[...Array(Math.min(mainDeck.length, 20))].map((_, i) => (
                                            <div key={i} className="absolute inset-0 bg-blue-500 rounded-2xl shadow-xl border-2 border-blue-600" style={{ top: -i * 1.5, left: i * 0.2, zIndex: 100 - i }} />
                                        ))}
                                        {dealingProgress < 54 && (
                                            <div className={`fixed top-1/2 left-1/2 w-20 h-28 bg-blue-500 rounded-xl border-2 border-blue-600 shadow-lg z-[200] animate-deal-${getRelativeSlot(dealingProgress % playerCount)}`} />
                                        )}
                                    </div>
                                ) : punishingCard ? (
                                    <div className="relative w-36 h-48">
                                        {punishingCard.pileSnapshot.map((card, i) => (
                                            <div 
                                                key={card.id || i} 
                                                className={`absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center text-5xl font-black text-slate-900 border-4 border-slate-50 animate-return-${getRelativeSlot(punishingCard.toPlayer)}`} 
                                                style={{ zIndex: i }}
                                            >
                                                {i === punishingCard.pileSnapshot.length - 1 ? card.value : ""}
                                            </div>
                                        ))}
                                    </div>
                                ) : (centerPile.length > 0 || flyingCard) ? (
                                    <div className="relative w-36 h-48">
                                        {centerPile.slice(-8).map((card, i) => (
                                            <div key={card.id} className="absolute inset-0 bg-white rounded-2xl shadow-xl flex items-center justify-center text-5xl font-black text-slate-900 border-4 border-slate-50" style={{ zIndex: i }}>
                                                {i === centerPile.slice(-8).length - 1 ? card.value : ""}
                                            </div>
                                        ))}
                                        {flyingCard && (
                                            <div className={`absolute inset-0 bg-white rounded-2xl shadow-2xl flex items-center justify-center text-5xl font-black text-slate-900 z-[100] border-4 border-slate-200 pointer-events-none animate-fly-${getRelativeSlot(flyingCard.fromPlayer)}`}>
                                                {flyingCard.value}
                                            </div>
                                        )}
                                    </div>
                                ) : (gameState !== 'dealing') && (
                                    <div className="text-white/20 font-black text-lg uppercase tracking-widest text-center">拍牌區</div>
                                )}

                                {/* 拍牌波紋動畫 */}
                                {slapRipple && <div className="slap-ripple" />}
                                {slapHands.map(h => (
                                    <div key={h.id} className={`slap-hand slap-hand-${getRelativeSlot(h.playerIndex)}`}>✋</div>
                                ))}

                                {errorMsg && (
                                    <div className="absolute z-[160] bg-yellow-400 px-4 py-3 rounded-xl border-4 border-white shadow-2xl animate-pulse whitespace-nowrap pointer-events-none text-center text-slate-900">
                                        <h3 className="text-xl font-black">{errorMsg}</h3>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* 閒置提示 */}
                        {showIdleHint && (
                            <div className="fixed bottom-40 left-1/2 -translate-x-1/2 z-[100] bg-white text-emerald-800 px-6 py-3 rounded-full shadow-2xl border-4 border-yellow-400 font-black text-2xl flex items-center gap-2 animate-pulse text-center">
                                <AlertCircle className="text-yellow-500" /> 輪到你出牌了！請點擊手牌！
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <div className="relative min-h-screen w-screen bg-slate-950 flex items-center justify-center overflow-hidden select-none font-sans">
                    <a href="../index.html" className="fixed top-3 left-3 z-[999999] bg-slate-900/90 text-white hover:bg-slate-800 px-4 py-2 rounded-full font-bold text-sm border border-white/20 transition-all shadow-lg flex items-center gap-1.5 no-underline cursor-pointer">
                        🏠 回首頁
                    </a>
                    {gameState !== 'menu' && (
                        <button 
                            onClick={() => { cleanupPeer(); setGameState('menu'); }} 
                            className="fixed top-[56px] left-3 z-[999999] bg-slate-900/90 text-white hover:bg-slate-800 px-4 py-2 rounded-full font-bold text-sm border border-white/20 transition-all shadow-lg flex items-center gap-1.5 cursor-pointer"
                        >
                            ↩️ 回主選單
                        </button>
                    )}
                    <div className="w-[1024px] h-[768px] shrink-0 relative bg-emerald-900 rounded-[40px] border-4 border-emerald-800 shadow-2xl overflow-hidden" style={{ transform: `scale(${scale})`, transformOrigin: 'center center' }}>
                        {renderScreen()}
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
