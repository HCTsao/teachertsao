    <!-- Web Audio API Synth Sound Effects -->
    <script>
        const synthAudio = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playFlip() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(360, this.ctx.currentTime + 0.12);
                
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            },
            playDeal() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(160, this.ctx.currentTime + 0.08);
                
                gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            },
            playMatch() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                
                // Play a sweet major triad chord C5 -> E5 -> G5
                const notes = [523.25, 659.25, 783.99];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.04);
                    
                    gain.gain.setValueAtTime(0.06, now + idx * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.25);
                    
                    osc.start(now + idx * 0.04);
                    osc.stop(now + idx * 0.04 + 0.25);
                });
            },
            playError() {
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(90, this.ctx.currentTime + 0.22);
                
                gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.22);
                
                osc.start();
                osc.stop(this.ctx.currentTime + 0.22);
            },
            playWin() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25, 659.25, 783.99, 1046.50]; // Arpeggio C4->C6
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, now + idx * 0.08);
                    
                    gain.gain.setValueAtTime(0.08, now + idx * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.08 + 0.3);
                    
                    osc.start(now + idx * 0.08);
                    osc.stop(now + idx * 0.08 + 0.3);
                });
            }
        };
    </script>

            { val: 1.7, frac: "1 7/10", dec: "1.7", perc: "170%", isAdvanced: true },
            { val: 2.3, frac: "2 3/10", dec: "2.3", perc: "230%", isAdvanced: true },
            { val: 1.1, frac: "1 1/10", dec: "1.1", perc: "110%", isAdvanced: true },

            // 進階題 (小於等於 1.0 的分母 20, 25 真分數，用於百分率互換的普通/困難版)
            { val: 0.15, frac: "3/20", dec: "0.15", perc: "15%", isAdvanced: true },
            { val: 0.35, frac: "7/20", dec: "0.35", perc: "35%", isAdvanced: true },
            { val: 0.45, frac: "9/20", dec: "0.45", perc: "45%", isAdvanced: true },
            { val: 0.55, frac: "11/20", dec: "0.55", perc: "55%", isAdvanced: true },
            { val: 0.65, frac: "13/20", dec: "0.65", perc: "65%", isAdvanced: true },
            { val: 0.85, frac: "17/20", dec: "0.85", perc: "85%", isAdvanced: true },
            { val: 0.95, frac: "19/20", dec: "0.95", perc: "95%", isAdvanced: true },
            { val: 0.12, frac: "3/25", dec: "0.12", perc: "12%", isAdvanced: true },
            { val: 0.16, frac: "4/25", dec: "0.16", perc: "16%", isAdvanced: true },
            { val: 0.24, frac: "6/25", dec: "0.24", perc: "24%", isAdvanced: true },
            { val: 0.28, frac: "7/25", dec: "0.28", perc: "28%", isAdvanced: true },
            { val: 0.32, frac: "8/25", dec: "0.32", perc: "32%", isAdvanced: true },
            { val: 0.36, frac: "9/25", dec: "0.36", perc: "36%", isAdvanced: true },
            { val: 0.44, frac: "11/25", dec: "0.44", perc: "44%", isAdvanced: true },
            { val: 0.48, frac: "12/25", dec: "0.48", perc: "48%", isAdvanced: true }
        ];

        // --- State Variables ---
        let currentMode = 'frac-dec'; // 'frac-dec', 'frac-perc', 'dec-perc'
        let currentDifficulty = 'easy'; // 'easy' (5), 'normal' (10), 'hard' (15)
        
        let cards = [];
        let flippedIndices = [];
        let matchedPairIds = [];
        let moves = 0;
        let isProcessing = false;
        let previewCountdown = 10;
        let previewTimerId = null;

        // --- BGM and Volume Control Logic ---
        let isMuted = false;
        let preMuteVolume = 0.3; // Default BGM volume is 30%

        function initBGM() {
            const audio = document.getElementById('bgm');
            if (audio) {
                audio.volume = preMuteVolume;
            }
        }

        function playBGM() {
            const audio = document.getElementById('bgm');
            if (audio && audio.paused) {
                audio.play().catch(err => {
                    console.log("BGM autoplay blocked by browser, waiting for user click.", err);
                });
            }
        }

        function adjustVolume(val) {
            const audio = document.getElementById('bgm');
            const volVal = document.getElementById('volume-value');
            const volIcon = document.getElementById('volume-icon');
            
            // Try to start BGM if not already playing
            playBGM();

            if (audio) {
                audio.volume = val;
            }
            
            // Update percentage text
            volVal.textContent = Math.round(val * 100) + '%';
            
            // Update icon
            if (parseFloat(val) === 0) {
                volIcon.textContent = '🔇';
                isMuted = true;
            } else {
                volIcon.textContent = parseFloat(val) < 0.5 ? '🔉' : '🔊';
                isMuted = false;
                preMuteVolume = parseFloat(val);
            }
        }

        function toggleMute() {
            const audio = document.getElementById('bgm');
            const slider = document.getElementById('volume-slider');
            const volIcon = document.getElementById('volume-icon');
            const volVal = document.getElementById('volume-value');
            
            // Try to start BGM if not already playing
            playBGM();

            if (isMuted) {
                // Unmute
                slider.value = preMuteVolume;
                adjustVolume(preMuteVolume);
            } else {
                // Mute
                preMuteVolume = parseFloat(slider.value);
                slider.value = 0;
                adjustVolume(0);
            }
        }

        // --- Helper: Convert Mixed Fraction to Improper Fraction ---
        function convertMixedToImproper(fracStr) {
            if (!fracStr.includes(' ')) return fracStr; // 真分數
            const parts = fracStr.split(' ');
            const integer = parseInt(parts[0], 10);
            const fraction = parts[1];
            const [num, den] = fraction.split('/').map(n => parseInt(n, 10));
            const newNumerator = integer * den + num;
            return `${newNumerator}/${den}`;
        }

        // --- Menu Button Handlers ---
        function setMenuMode(mode) {
            currentMode = mode;
            synthAudio.playFlip();
            playBGM();
            // Update Mode buttons UI
            ['frac-dec', 'frac-perc', 'dec-perc'].forEach(m => {
                const btn = document.getElementById(`menu-btn-${m}`);
                if (m === mode) {
                    btn.className = "py-3 px-2 rounded-xl text-xs md:text-sm font-bold border transition-all flex flex-col items-center gap-1.5 bg-indigo-900/40 border-indigo-500 text-indigo-200";
                } else {
                    btn.className = "py-3 px-2 rounded-xl text-xs md:text-sm font-bold border transition-all flex flex-col items-center gap-1.5 bg-slate-800/80 border-slate-700 text-slate-400 hover:border-slate-500";
                }
            });
        }

        function setMenuDifficulty(difficulty) {
            currentDifficulty = difficulty;
            synthAudio.playFlip();
            playBGM();
            // Update Difficulty buttons UI
            ['easy', 'normal', 'hard'].forEach(d => {
                const btn = document.getElementById(`menu-btn-${d}`);
                let activeColor = d === 'easy' ? 'bg-emerald-950/40 border-emerald-500 text-emerald-200' :
                                  d === 'normal' ? 'bg-slate-800/40 border-amber-500/80 text-amber-200' :
                                  'bg-rose-950/40 border-rose-500 text-rose-200';
                
                if (d === difficulty) {
                    btn.className = `py-3 px-2 rounded-xl text-xs md:text-sm font-bold border transition-all flex flex-col items-center gap-1 ${activeColor}`;
                } else {
                    btn.className = "py-3 px-2 rounded-xl text-xs md:text-sm font-bold border transition-all flex flex-col items-center gap-1 bg-slate-800/80 border-slate-700 text-slate-400 hover:border-slate-500";
                }
            });
        }

        // --- Start Game ---
        function startGame() {
            synthAudio.playFlip();
            playBGM();
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-header').classList.remove('hidden');
            document.getElementById('game-playboard').classList.remove('hidden');
            
            // Set Header Status Label Text
            const modeText = currentMode === 'frac-dec' ? '分數 ↔ 小數' :
                             currentMode === 'frac-perc' ? '分數 ↔ 百分率' : '小數 ↔ 百分率';
            const diffText = currentDifficulty === 'easy' ? '簡單 (5對)' :
                             currentDifficulty === 'normal' ? '普通 (10對)' : '困難 (15對)';
            
            document.getElementById('status-label').textContent = `${modeText} (${diffText})`;
            
            initGame();
        }

        // --- Return to Main Menu ---
        function backToMenu() {
            synthAudio.playFlip();
            playBGM();
            // Clear preview timer if active
            if (previewTimerId) {
                clearInterval(previewTimerId);
                previewTimerId = null;
            }
            document.getElementById('preview-timer-container').classList.add('hidden');
            document.getElementById('game-header').classList.add('hidden');
            document.getElementById('game-playboard').classList.add('hidden');
            document.getElementById('win-modal').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
        }

        // --- Initialize Game Deck & Layout ---
        function initGame() {
            moves = 0;
            flippedIndices = [];
            matchedPairIds = [];
            isProcessing = true; // Lock clicking during preview and shuffle
            
            document.getElementById('move-count').textContent = moves;
            document.getElementById('win-modal').classList.add('hidden');

            const numPairs = currentDifficulty === 'easy' ? 5 : (currentDifficulty === 'normal' ? 10 : 15);
            document.getElementById('match-label').textContent = `0/${numPairs}`;

            // Adjust grid columns based on number of pairs
            const gridTop = document.getElementById('grid-top');
            const gridBottom = document.getElementById('grid-bottom');
            
            // Set responsive grids: Easy (5) has 5 columns, Normal (10) has 5 columns, Hard (15) has 5 columns.
            // On mobile, grid is 5 cols. Let's make sure it has the right classes.
            gridTop.className = "grid grid-cols-5 gap-1.5 sm:gap-2.5 md:gap-4 max-w-3xl mx-auto w-full justify-items-center justify-center";
            gridBottom.className = "grid grid-cols-5 gap-1.5 sm:gap-2.5 md:gap-4 max-w-3xl mx-auto w-full justify-items-center justify-center";

            // Filter math data based on difficulty and mode rules (Never exceed 100% in percentage modes)
            let eligibleData = [];
            
            if (currentMode.includes('perc')) {
                // Percentage modes: NEVER exceed 100% (val <= 1.0)
                if (currentDifficulty === 'easy') {
                    eligibleData = mathData.filter(item => !item.isAdvanced && item.val <= 1.0);
                } else {
                    eligibleData = mathData.filter(item => item.val <= 1.0);
                }
            } else {
                // Non-percentage modes: can have val > 1.0 in Normal/Hard (mixed/improper fractions)
                if (currentDifficulty === 'easy') {
                    eligibleData = mathData.filter(item => !item.isAdvanced);
                } else {
                    eligibleData = mathData.filter(item => true);
                }
            }

            // Shuffle eligible data and pick required number of pairs
            const selectedItems = [...eligibleData].sort(() => 0.5 - Math.random()).slice(0, numPairs);

            let deckTop = [];
            let deckBottom = [];

            selectedItems.forEach((item, index) => {
                let contentA, contentB, labelA, labelB;
                
                // Formulate fractions depending on 50% coin flip (mixed vs improper) for advanced items
                let displayFrac = item.frac;
                if (item.isAdvanced && Math.random() < 0.5) {
                    displayFrac = convertMixedToImproper(item.frac);
                }

                switch (currentMode) {
                    case 'frac-dec':
                        contentA = displayFrac; labelA = '分數';
                        contentB = item.dec; labelB = '小數';
                        break;
                    case 'frac-perc':
                        contentA = displayFrac; labelA = '分數';
                        contentB = item.perc; labelB = '百分率';
                        break;
                    case 'dec-perc':
                        contentA = item.dec; labelA = '小數';
                        contentB = item.perc; labelB = '百分率';
                        break;
                }

                // Top Deck: Blue Card (Type A)
                deckTop.push({
                    id: `card-${index}-a`,
                    pairId: index,
                    content: contentA,
                    type: labelA,
                    theme: 'blue',
                    suit: Math.random() < 0.5 ? '♠' : '♣'
                });

                // Bottom Deck: Red Card (Type B)
                deckBottom.push({
                    id: `card-${index}-b`,
                    pairId: index,
                    content: contentB,
                    type: labelB,
                    theme: 'red',
                    suit: Math.random() < 0.5 ? '♥' : '♦'
                });
            });

            // Shuffle each row independently
            deckTop.sort(() => 0.5 - Math.random());
            deckBottom.sort(() => 0.5 - Math.random());

            // Merge deck
            // Indices 0 to numPairs-1: Top Row
            // Indices numPairs to 2*numPairs-1: Bottom Row
            cards = [...deckTop, ...deckBottom];

            renderGrid(numPairs);
            startPreviewCountdown();
        }

        // --- Render Cards to grids ---
        function renderGrid(numPairs) {
            const gridTop = document.getElementById('grid-top');
            const gridBottom = document.getElementById('grid-bottom');
            gridTop.innerHTML = '';
            gridBottom.innerHTML = '';

            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                
                // Card size classes adjusted based on card counts to avoid overflow
                let cardSizeClass = "w-[60px] h-[84px] sm:w-[84px] sm:h-[118px] md:w-[108px] md:h-[150px]"; // Default
                if (numPairs === 15) {
                    cardSizeClass = "w-[56px] h-[78px] sm:w-[76px] sm:h-[106px] md:w-[94px] md:h-[132px]";
                }

                cardEl.className = `card-container relative ${cardSizeClass} cursor-pointer preserve-3d transition-transform duration-500 hover:-translate-y-1.5`;
                cardEl.dataset.index = index;
                cardEl.onclick = () => handleCardClick(index);

                const backClass = card.theme === 'blue' ? 'poker-card-back-blue' : 'poker-card-back-red';
                const colorClass = card.theme === 'blue' ? 'text-blue-500' : 'text-red-500';
                const contentHTML = generateCardContentHTML(card.content);

                cardEl.innerHTML = `
                    <div class="card-inner absolute inset-0 w-full h-full preserve-3d shadow-xl rounded-xl rotate-y-180 transition-transform duration-700">
                        <!-- Back Face -->
                        <div class="absolute inset-0 w-full h-full backface-hidden rounded-xl flex items-center justify-center ${backClass}">
                            <div class="card-medallion">
                                <span class="text-yellow-400 text-lg md:text-xl font-bold">${card.suit}</span>
                            </div>
                        </div>
                        <!-- Front Face (Initially face-up during preview) -->
                        <div class="card-front absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-xl border border-slate-200 flex flex-col justify-between p-1 bg-white text-slate-800 shadow-md">
                            <!-- Top-left Corner -->
                            <div class="flex flex-col items-start leading-none p-0.5">
                                <span class="text-[9px] md:text-[11px] font-bold text-slate-500 tracking-tighter">${card.type}</span>
                                <span class="text-xs md:text-sm ${colorClass} font-black mt-0.5">${card.suit}</span>
                            </div>
                            <!-- Value Display -->
                            <div class="flex-grow flex items-center justify-center p-0.5">
                                ${contentHTML}
                            </div>
                            <!-- Bottom-right Corner -->
                            <div class="flex flex-col items-end leading-none p-0.5 rotate-180">
                                <span class="text-[9px] md:text-[11px] font-bold text-slate-500 tracking-tighter">${card.type}</span>
                                <span class="text-xs md:text-sm ${colorClass} font-black mt-0.5">${card.suit}</span>
                            </div>
                        </div>
                    </div>
                `;

                if (index < numPairs) {
                    gridTop.appendChild(cardEl);
                } else {
                    gridBottom.appendChild(cardEl);
                }
            });
        }

        // --- Helper: Generate Card Content HTML (Force 20px font-size) ---
        function generateCardContentHTML(val) {
            if (typeof val === 'string' && val.includes('/')) {
                // Fraction (can be proper, improper, mixed)
                const parts = val.split(' ');
                let integerPart = null;
                let fraction = val;

                if (parts.length > 1) {
                    integerPart = parts[0];
                    fraction = parts[1];
                }

                const [num, den] = fraction.split('/');
                
                return `
                    <div class="flex items-center justify-center gap-0.5 text-slate-800" style="font-size: 20px;">
                        ${integerPart ? `<span class="font-black mr-0.5" style="font-size: 20px; line-height: 1;">${integerPart}</span>` : ''}
                        <div class="flex flex-col items-center leading-none">
                            <span class="font-black border-b-2 border-slate-800 px-0.5 pb-0.5" style="font-size: 20px; line-height: 0.85;">${num}</span>
                            <span class="font-black pt-0.5" style="font-size: 20px; line-height: 0.85;">${den}</span>
                        </div>
                    </div>
                `;
            }
            
            // Decimal or Percentage
            return `<span class="font-black font-mono tracking-tight text-slate-800" style="font-size: 20px; line-height: 1;">${val}</span>`;
        }

        // --- Preview Phase Timer (10 Seconds) ---
        function startPreviewCountdown() {
            previewCountdown = 10;
            document.getElementById('preview-timer').textContent = previewCountdown;
            document.getElementById('preview-timer-container').classList.remove('hidden');
            
            isProcessing = true; // Lock flipping during countdown

            if (previewTimerId) clearInterval(previewTimerId);

            previewTimerId = setInterval(() => {
                previewCountdown--;
                document.getElementById('preview-timer').textContent = previewCountdown;
                if (previewCountdown <= 0) {
                    clearInterval(previewTimerId);
                    previewTimerId = null;
                    startShufflingNow();
                }
            }, 1000);
        }

        // --- Flip Cards Down directly (No redealing/shuffling animation) ---
        function startShufflingNow() {
            if (previewTimerId) {
                clearInterval(previewTimerId);
                previewTimerId = null;
            }
            document.getElementById('preview-timer-container').classList.add('hidden');
            
            // Flip cards face-down directly
            const cardInners = document.querySelectorAll('.card-inner');
            cardInners.forEach(inner => {
                inner.classList.remove('rotate-y-180');
            });
            synthAudio.playFlip();

            // Unlock board immediately so the player can play
            isProcessing = false;
        }

        // --- Card Click Handler ---
        function handleCardClick(index) {
            playBGM();
            // If clicking during preview countdown, instantly skip countdown, flip down, and start playing!
            if (previewTimerId) {
                startShufflingNow();
                return;
            }

            if (isProcessing) return;
            if (flippedIndices.includes(index)) return;
            if (matchedPairIds.includes(cards[index].pairId)) return;

            const numPairs = currentDifficulty === 'easy' ? 5 : (currentDifficulty === 'normal' ? 10 : 15);

            // Restrict flipping rules:
            // One card must be from the top row (0 to numPairs-1)
            // One card must be from the bottom row (numPairs to 2*numPairs-1)
            if (flippedIndices.length === 1) {
                const firstIndex = flippedIndices[0];
                const clickInTopRow = index < numPairs;
                const firstInTopRow = firstIndex < numPairs;
                
                // Player clicked a card in the same row as the first one: reject
                if (clickInTopRow === firstInTopRow) return;
            }

            // Flip card visually
            flippedIndices.push(index);
            const cardEl = document.querySelector(`.card-container[data-index='${index}']`);
            const innerEl = cardEl.querySelector('.card-inner');
            innerEl.classList.add('rotate-y-180');
            synthAudio.playFlip();

            // Check if two cards are chosen
            if (flippedIndices.length === 2) {
                moves++;
                document.getElementById('move-count').textContent = moves;
                checkCardMatch(numPairs);
            }
        }

        // --- Check for match logic ---
        function checkCardMatch(numPairs) {
            isProcessing = true;
            const [idx1, idx2] = flippedIndices;
            const card1 = cards[idx1];
            const card2 = cards[idx2];

            if (card1.pairId === card2.pairId) {
                // It's a MATCH!
                matchedPairIds.push(card1.pairId);
                
                // Show green borders
                setTimeout(() => {
                    [idx1, idx2].forEach(idx => {
                        const cardEl = document.querySelector(`.card-container[data-index='${idx}']`);
                        const frontEl = cardEl.querySelector('.card-front');
                        frontEl.className = "card-front absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-xl border-4 border-emerald-400 bg-emerald-50 text-slate-800 shadow-md flex flex-col justify-between p-1";
                    });
                    synthAudio.playMatch();
                }, 200);

                // Fade out/dim the matched cards
                setTimeout(() => {
                    [idx1, idx2].forEach(idx => {
                        const cardEl = document.querySelector(`.card-container[data-index='${idx}']`);
                        cardEl.classList.add('matched');
                    });
                    
                    document.getElementById('match-label').textContent = `${matchedPairIds.length}/${numPairs}`;
                    flippedIndices = [];
                    isProcessing = false;
                    checkGameOver(numPairs);
                }, 1000);

            } else {
                // MISMATCH
                setTimeout(() => {
                    [idx1, idx2].forEach(idx => {
                        const cardEl = document.querySelector(`.card-container[data-index='${idx}']`);
                        const frontEl = cardEl.querySelector('.card-front');
                        frontEl.className = "card-front absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-xl border-4 border-rose-500 bg-rose-50 text-slate-800 shadow-md flex flex-col justify-between p-1";
                    });
                    synthAudio.playError();
                }, 200);

                // Flip them back face-down
                setTimeout(() => {
                    [idx1, idx2].forEach(idx => {
                        const cardEl = document.querySelector(`.card-container[data-index='${idx}']`);
                        const innerEl = cardEl.querySelector('.card-inner');
                        innerEl.classList.remove('rotate-y-180');
                        
                        // Reset borders back to original
                        setTimeout(() => {
                            const frontEl = cardEl.querySelector('.card-front');
                            frontEl.className = "card-front absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-xl border border-slate-200 flex flex-col justify-between p-1 bg-white text-slate-800 shadow-md";
                        }, 500);
                    });
                    flippedIndices = [];
                    isProcessing = false;
                }, 1200);
            }
        }

        // --- Check Game Win ---
        function checkGameOver(numPairs) {
            if (matchedPairIds.length === numPairs) {
                synthAudio.playWin();
                document.getElementById('final-moves').textContent = moves;
                setTimeout(() => {
                    document.getElementById('win-modal').classList.remove('hidden');
                }, 600);
            }
        }

        // --- Reset/Restart Current Mode (Flip back face-down directly without redealing) ---
        function resetGame() {
            synthAudio.playFlip();
            playBGM();
            document.getElementById('win-modal').classList.add('hidden');
            
            moves = 0;
            flippedIndices = [];
            matchedPairIds = [];
            isProcessing = false; // Player can click immediately
            
            document.getElementById('move-count').textContent = moves;
            const numPairs = currentDifficulty === 'easy' ? 5 : (currentDifficulty === 'normal' ? 10 : 15);
            document.getElementById('match-label').textContent = `0/${numPairs}`;

            // Reset card visuals: flip all face-down, remove matched style
            const cardContainers = document.querySelectorAll('.card-container');
            cardContainers.forEach(cardEl => {
                cardEl.classList.remove('matched');
                cardEl.style.transform = ''; // Clear any residual shuffle transforms
                cardEl.style.transition = '';
                
                const innerEl = cardEl.querySelector('.card-inner');
                innerEl.classList.remove('rotate-y-180');
                
                // Reset card front borders back to default style
                const frontEl = cardEl.querySelector('.card-front');
                frontEl.className = "card-front absolute inset-0 w-full h-full backface-hidden rotate-y-180 rounded-xl border border-slate-200 flex flex-col justify-between p-1 bg-white text-slate-800 shadow-md";
            });
        }

        // --- Run Lucide Icon Loader ---
        lucide.createIcons();

        // --- Init BGM Volume ---
        initBGM();
    </script>
</body>
