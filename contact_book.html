<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>二年甲班電子聯絡簿</title>
  
  <!-- 引入 Google 字型 (思源黑體與可愛的圓體字 Quicksand/Fredoka) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome 圖標引入用於裝飾 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* 全域 CSS 變數：精選馬卡龍配色系統 */
    :root {
      --primary-color: #7dd3fc; /* 天空藍 */
      --secondary-color: #a7f3d0; /* 薄荷綠 */
      --accent-color: #fef08a; /* 鵝黃色 */
      --text-dark: #334155;
      --text-light: #64748b;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(255, 255, 255, 0.5);
      --shadow-sm: 0 4px 6px -1px rgb(0 0 0 / 0.05), 0 2px 4px -2px rgb(0 0 0 / 0.05);
      --shadow-md: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --shadow-lg: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
      
      --color-chinese: #f97316; /* 國語 */
      --color-math: #3b82f6; /* 數學 */
      --color-english: #10b981; /* 英文 */
      --color-memo: #ec4899; /* 備忘 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', 'Noto Sans TC', sans-serif;
      color: var(--text-dark);
      background: linear-gradient(135deg, #f0f9ff 0%, #fffbeb 50%, #f0fdf4 100%);
      background-attachment: fixed;
      line-height: 1.6;
      padding-bottom: 30px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }

    .hero-banner {
      width: 100%;
      height: 160px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: var(--shadow-md);
      position: relative;
      margin-bottom: 20px;
    }

    .hero-banner img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .hero-banner:hover img {
      transform: scale(1.03);
    }

    .glass-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .header-section {
      text-align: center;
      padding: 12px 10px;
    }

    .class-title {
      font-size: 1.8rem;
      font-weight: 700;
      color: #0369a1;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .class-title i {
      color: #f59e0b;
      animation: spin 8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .teacher-badge {
      display: inline-block;
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 4px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 12px;
      border: 1px solid rgba(3, 105, 161, 0.15);
    }

    .date-badge-container {
      background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 100%);
      color: white;
      border-radius: 16px;
      padding: 12px;
      box-shadow: var(--shadow-md);
      margin-bottom: 8px;
    }

    .date-roc {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .section-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .contact-nav-tabs {
      display: flex;
      gap: 10px;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    .contact-tab-btn {
      padding: 10px 18px;
      border-radius: 20px;
      border: none;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      background: #e2e8f0;
      color: #475569;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .contact-tab-btn:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <div class="hero-banner">
      <img src="classroom_banner.jpg" alt="二年甲班班級橫幅" onerror="this.src='https://images.unsplash.com/photo-1503676260728-1c00da094a0b?auto=format&fit=crop&w=600&q=80'">
    </div>

    <div class="glass-card header-section">
      <h1 class="class-title">
        <i class="fa-solid fa-star"></i> 二年甲班電子聯絡簿
      </h1>
      <div class="teacher-badge">導師：曹泓棋</div>
      
      <div class="date-badge-container">
        <div class="date-roc" id="dateRoc">民國 115 年 7 月 2 日 (星期四)</div>
      </div>
      
      <!-- 要求: 按下一字千金頁籤直接開啟獨立網頁 -->
      <div class="contact-nav-tabs">
        <a href="生字挑戰/生字大冒險.html" target="_blank" class="contact-tab-btn" style="background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: white; box-shadow: 0 4px 6px -1px rgba(245, 158, 11, 0.3);">
          <i class="fa-solid fa-trophy"></i> 一字千金
        </a>
        <a href="pokemon_trainer.html" class="contact-tab-btn" style="background: linear-gradient(135deg, #10b981 0%, #059669 100%); color: white;">
          <i class="fa-solid fa-gamepad"></i> 寶可夢集點卡
        </a>
        <button onclick="window.location.href='pokemon_admin.html'" class="contact-tab-btn" style="background: linear-gradient(135deg, #64748b 0%, #475569 100%); color: white;">
          <i class="fa-solid fa-shield-halved"></i> 教師後台
        </button>
      </div>
    </div>

    <!-- 今日作業區 -->
    <div class="glass-card">
      <h2 class="section-title homework">
        <i class="fa-solid fa-pencil"></i> 今日作業
      </h2>
      <div id="homeworkContainer" class="homework-container">
        <!-- 由 JS 生成 -->
      </div>
    </div>

  </div>

</body>
</html>
