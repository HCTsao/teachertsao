            --primary-hover: #4338ca;
            --error: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {

            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: var(--panel-bg);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);

            text-align: center;
            backdrop-filter: blur(10px);

        h1 {
            font-size: 1.8rem;
            color: var(--text-primary);

        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* Firebase 未設定警示 */
        .config-warning {
            background: rgba(245, 158, 11, 0.1);
            border: 2px dashed var(--warning);
            color: #b45309;
            padding: 15px;
            border-radius: 16px;
            margin-bottom: 25px;
            font-size: 0.95rem;
            line-height: 1.5;
            text-align: left;
        }

        .config-warning code {
            background: rgba(0, 0, 0, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: Consolas, monospace;
            font-weight: bold;
        }

        /* 功能控制列 */
        .controls-row {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid var(--border-glow);
            background: #fff;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.1);
        }

        .filter-select {
            padding: 12px 15px;
            border-radius: 12px;
            border: 2px solid var(--border-glow);
            background: #fff;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-select:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 2px solid rgba(239, 68, 68, 0.2);
        }

        .btn-danger:hover {
            background: var(--error);
            color: #fff;
            border-color: var(--error);
        }

        /* 課程場次卡片 */

            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
        }

        .session-card {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 16px;

            margin-bottom: 10px;

            text-align: left;
            font-size: 0.95rem;

            padding: 14px 16px;

            color: var(--text-secondary);

            height: 24px;

            border-radius: 12px;

            border-radius: 50%;

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }

        /* 詳細歷程彈出視窗 (Modal) */
        .modal-overlay {

            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            backdrop-filter: blur(4px);

            justify-content: center;
            align-items: center;

        .modal-box {

            flex-direction: column;

            justify-content: space-between;
            align-items: center;

        .modal-title {

            font-weight: bold;
        }

        .modal-close {

            color: var(--text-secondary);

            background: transparent;
            width: 32px;
            height: 32px;

            align-items: center;
            justify-content: center;

        .modal-close:hover {

        }

        .modal-body {
            padding: 25px;
            overflow-y: auto;
            text-align: left;
        }

        .student-summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .summary-card {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 16px;
            border: 1px solid rgba(0,0,0,0.02);
        }

        .summary-card .label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .summary-card .value {
            font-size: 1.1rem;
            font-weight: bold;
        }

        .step-record-card {
            background: #fff;
            border: 1px solid rgba(99, 102, 241, 0.12);
            border-left: 6px solid var(--primary);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;

        .step-record-card.step-1 { border-left-color: #6366f1; }
        .step-record-card.step-2 { border-left-color: #f59e0b; }
        .step-record-card.step-3 { border-left-color: #10b981; }

        .step-header {

            border-radius: 6px;
        }

        .step-meaning {
            font-size: 0.95rem;
            line-height: 1.5;
            color: var(--text-primary);
        }
    </style>
</head>

    <script>
        // ==========================================
        // 💡 老師請在此填入您的 Firebase 設定 (Config)
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyCFNaVRETt862_As1hF7Mfyr22pKM5-lvk",
            authDomain: "chickenrabbit-ea442.firebaseapp.com",
            databaseURL: "https://chickenrabbit-ea442-default-rtdb.firebaseio.com",
            projectId: "chickenrabbit-ea442",
            storageBucket: "chickenrabbit-ea442.appspot.com",
            messagingSenderId: "65728951973",
            appId: "1:65728951973:web:efff912caf5f6f185abf4c"
        };

        // 初始化 Firebase (僅在有填寫時初始化)
        let isFirebaseActive = false;
        let db = null;
        let allRecords = {}; // 快取所有紀錄
        let allTeachers = {}; // 快取所有開課老師

        if (typeof firebase !== 'undefined' && firebaseConfig.apiKey !== "請在此填入您的ApiKey") {
            try {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isFirebaseActive = true;
                document.getElementById('config-banner').style.display = 'none';
                console.log("Firebase 連結成功！");
                

            } catch (e) {
                console.error("Firebase 初始化失敗：", e);
            }
        }

        // 頁面載入後自動開始監聽
        window.onload = function() {
            if (isFirebaseActive) {
                listenToRecords();
            } else {
                document.getElementById('loading-el').innerHTML = `
                    <p style="color: var(--error); font-weight: bold;">⚠️ 尚未配置 Firebase 連線</p>
                    <p style="font-size: 0.85rem; margin-top: 10px;">請參照上方虛線區塊說明填入資料庫 Config，即可取得學生作答。</p>
                `;
            }

            // 監聽搜尋與過濾事件
            document.getElementById('search-input').addEventListener('input', renderTable);
            document.getElementById('scenario-filter').addEventListener('change', renderTable);
        };

        // 即時監聽資料庫變更
        function listenToRecords() {
            if (!isFirebaseActive) return;

            document.getElementById('loading-el').style.display = 'flex';

            // 監聽開課教師清單 (改為監聽 classes 節點)
            db.ref('classes').on('value', (snapshot) => {
                allTeachers = snapshot.val() || {};
                renderTable(); // 教師清單更新時重新渲染
            });

            // 監聽學生紀錄
            db.ref('records').on('value', (snapshot) => {
                allRecords = snapshot.val() || {};
                


                document.getElementById('loading-el').style.display = 'none';
                renderTable();
            }, (error) => {
                console.error("讀取資料失敗", error);
                document.getElementById('loading-el').innerHTML = `
                    <p style="color: var(--error);">讀取資料失敗：${error.message}</p>
                `;
            });
        }

        // 手動整理
        function loadData() {
            if (!isFirebaseActive) return;
            listenToRecords();
        }

        // 渲染表格
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = "";

            const searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
            const scenarioFilter = document.getElementById('scenario-filter').value;

            // 將記錄物件轉成陣列並依時間排序 (新 -> 舊)
            const recordsArray = Object.keys(allRecords).map(key => {
                return { id: key, ...allRecords[key] };
            }).sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

            // 自動將資料分組為「場次」並渲染卡片
            groupedSessions = groupRecordsIntoSessions(recordsArray);
            renderSessionCards();

            let visibleCount = 0;

            recordsArray.forEach(rec => {
                // 搜尋與篩選過濾
                const studentName = (rec.student || "").toLowerCase();
                const matchesSearch = studentName.includes(searchQuery);
                const matchesScenario = scenarioFilter === 'all' || rec.scenario === scenarioFilter;

                if (!matchesSearch || !matchesScenario) return;

                visibleCount++;
                const tr = document.createElement('tr');
                
                // 時間格式化 (例如: 10:45:30)
                const dateObj = new Date(rec.timestamp);
                const timeStr = dateObj.toLocaleDateString() + ' ' + dateObj.toTimeString().split(' ')[0];
                
                // 解題耗時
                const minutes = Math.floor((rec.durationSeconds || 0) / 60);
                const seconds = (rec.durationSeconds || 0) % 60;
                const timeTakenStr = minutes > 0 ? `${minutes}分${seconds}秒` : `${seconds}秒`;

                // 解題路徑樣式
                const pathText = rec.solvedPath === 'A' ? 'A (便宜)' : (rec.solvedPath === 'B' ? 'B (貴重)' : rec.solvedPath);
                const pathClass = rec.solvedPath === 'A' || rec.solvedPath === 'B' ? rec.solvedPath : '';

                // 答錯次數樣式
                const attempts = rec.failedAttempts || 0;
                const attemptsClass = attempts === 0 ? 'clean' : 'dirty';

                tr.innerHTML = `
                    <td>${timeStr}</td>
                    <td style="font-weight: bold; color: var(--primary);">${escapeHtml(rec.teacherName || "未填")}/${escapeHtml(rec.student)}</td>

                    <td><span class="attempts-badge ${attemptsClass}">${attempts} 次</span></td>

        // HTML 轉義防護
        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return {
                    "&": "&amp;",
                    "<": "&lt;",
                    ">": "&gt;",
                    '"': '&quot;',
                    "'": '&#39;'
                }[s];
            });
        }

                let attemptsListHtml = "";

                        attemptsListHtml += `
                            <li style="margin-bottom: 6px;">
                                <span style="font-family: monospace; font-weight: bold; color: var(--primary);">${escapeHtml(att.eq)}</span>
                                <span style="color: var(--text-secondary); margin-left: 10px;">解釋：</span><span>${escapeHtml(att.meaning)}</span>

        // --- 純前端 Excel 分組與下載邏輯 ---
        let groupedSessions = [];

        function groupRecordsIntoSessions(recordsArray) {
            const sessionsMap = {};
            
            // 1. 先把所有開課老師加入 map (現在 allTeachers 的 key 是 classPassword)
            Object.keys(allTeachers).forEach(pwd => {
                const classData = allTeachers[pwd];
                sessionsMap[pwd] = {
                    id: 'session_' + pwd,
                    teacherName: classData.teacherName,
                    classPassword: pwd,
                    records: [],
                    startTime: new Date(classData.timestamp || Date.now()),
                    endTime: new Date(classData.timestamp || Date.now())
                };
            });

            // 2. 把學生紀錄掛上去
            if (recordsArray && recordsArray.length > 0) {
                recordsArray.forEach(rec => {
                    const pwd = (rec.classPassword || "").trim();
                    if (!pwd) return; // 無課堂密碼的舊資料或訪客不打包
                    
                    if (!sessionsMap[pwd]) {
                        // 紀錄裡的密碼不在目前的 classes 節點中 (可能是被刪除的課堂殘留紀錄)
                        sessionsMap[pwd] = {
                            id: 'session_' + pwd,
                            teacherName: rec.teacherName || "未知教師",
                            classPassword: pwd,
                            records: [],
                            startTime: new Date(rec.timestamp),
                            endTime: new Date(rec.timestamp)
                        };
                    }
                    
                    const session = sessionsMap[pwd];
                    session.records.push(rec);
                    
                    const recTime = new Date(rec.timestamp);
                    if (recTime < session.startTime) session.startTime = recTime;
                    if (recTime > session.endTime) session.endTime = recTime;
                });
            }
            
            // 轉換為陣列，依據最後作答/開課時間新到舊排序
            const sessions = Object.values(sessionsMap).sort((a, b) => b.endTime - a.endTime);
            return sessions;
        }

        function renderSessionCards() {
            const container = document.getElementById('sessions-area');
            if (!container) return;
            container.innerHTML = "";
            
            if (groupedSessions.length === 0) return;
            
            groupedSessions.forEach(session => {
                const dateStr = session.endTime.toLocaleDateString();
                
                const card = document.createElement('div');
                card.className = 'session-card';
                card.innerHTML = `
                    <div class="session-info">
                        <strong>👨‍🏫 指導教師：${session.teacherName}</strong><br>
                        <small>📅 最後作答：${dateStr}</small><br>
                        <small>👥 紀錄筆數：共 ${session.records.length} 筆</small>
                    </div>
                    <button class="btn btn-primary" style="background: #10b981; margin-bottom: 8px; width: 100%; justify-content: center;" onclick="downloadExcel('${session.id}')">

                    </button>
                    <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="downloadPDF('${session.id}')">

                </button>

    // 刪除開課設定與紀錄
    async function deleteSession(classPassword, teacherName) {
        const pwd = prompt(`請輸入「${teacherName}」的課堂密碼（或管理員密碼）以刪除開課資料：`);
        if (pwd === null) return;
        
        if (pwd !== "0987912307" && pwd !== classPassword) {
            alert("❌ 密碼錯誤！無法刪除。");
            return;
        }

        if (!confirm(`確定要刪除「${teacherName}」的開課設定與所有相關的學生資料嗎？\n(⚠️ 此動作無法復原)`)) return;

        try {
            // 刪除開課設定
            await db.ref('classes/' + classPassword).remove();
            
            // 刪除該老師名下所有的學生紀錄
            const keys = Object.keys(allRecords);
            const updates = {};
            keys.forEach(k => {
                if (allRecords[k].classPassword === classPassword) {
                    updates[k] = null;
                }
            });
            if (Object.keys(updates).length > 0) {
                await db.ref('records').update(updates);
            }
            alert(`✅ 已成功刪除該堂課的開課設定與所有學生資料！`);
        } catch (err) {
            console.error("刪除失敗", err);
            alert("刪除失敗，請檢查連線狀態。");
        }
    }

    async function downloadExcel(sessionId) {
            const session = groupedSessions.find(s => s.id === sessionId);
            if (!session) return alert("找不到場次資料！");

            const pwd = prompt(`請輸入「${session.teacherName}」的課堂密碼以授權下載 Excel：`);
            if (pwd === null) return;
            
            if (typeof firebase !== 'undefined' && firebase.database) {
                try {
                    const snap = await firebase.database().ref('teachers/' + session.teacherName).once('value');
                    if (!snap.exists() || snap.val().password !== pwd) {
                        alert("❌ 密碼錯誤或該教師尚未設定密碼！");
                        return;
                    }
                } catch (e) {
                    alert("連線驗證失敗，請檢查網路！");
                    return;
                }
            }

            if (typeof XLSX === 'undefined') {
                alert("Excel 套件尚未載入完成，請稍候再試。");
                return;
            }
            
            const sheetData = [];
            // 擴充欄位加入詳細答錯紀錄
            sheetData.push([
                '作答時間', '指導教師', '座號姓名', '挑戰情境', '題目設定', '解題路徑', '總答錯數', '答題耗時(秒)', '過關狀態',
                '步驟1答錯紀錄', '步驟2答錯紀錄', '步驟3答錯紀錄', '步驟4答錯紀錄', '步驟5答錯紀錄'
            ]);
            
            // 準備要放入 Excel 的資料，依照作答時間遞增 (舊 -> 新)
            const exportRecords = [...session.records].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));

            exportRecords.forEach(rec => {
                const dateObj = new Date(rec.timestamp);
                const timeStr = dateObj.toLocaleDateString() + ' ' + dateObj.toTimeString().split(' ')[0];
                const pathText = rec.solvedPath === 'A' ? 'A (便宜)' : (rec.solvedPath === 'B' ? 'B (貴重)' : rec.solvedPath);
                
                // 整理各步驟的答錯紀錄
                const errLogs = ["", "", "", "", ""];
                if (rec.stepAnswers) {
                    for (let s = 1; s <= 5; s++) {
                        const stepAns = rec.stepAnswers[s];
                        if (stepAns && stepAns.attempts && stepAns.attempts.length > 0) {
                            // 只抓出答錯的嘗試紀錄
                            const invalidAttempts = stepAns.attempts.filter(att => !att.valid);
                            if (invalidAttempts.length > 0) {
                                errLogs[s-1] = invalidAttempts.map((att, idx) => 
                                    `[${idx+1}] 算式: ${att.eq} | 解釋: ${att.meaning}`
                                ).join('\n');
                            }
                        }
                    }
                }
                
                sheetData.push([
                    timeStr,
                    rec.teacherName || '',
                    rec.student || '',
                    rec.scenario || '',
                    '共 ' + rec.totalCount + ' 個 / ' + rec.totalCost + ' 元',
                    pathText,
                    rec.failedAttempts || 0,
                    rec.durationSeconds || 0,
                    (rec.failedAttempts === 0 ? '無錯過關' : '有錯過關'),
                    errLogs[0], errLogs[1], errLogs[2], errLogs[3], errLogs[4]
                ]);
            });
            
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.aoa_to_sheet(sheetData);
            
            // 欄寬設定
            ws['!cols'] = [
                {wch: 20}, {wch: 15}, {wch: 20}, {wch: 15}, {wch: 20}, 
                {wch: 15}, {wch: 10}, {wch: 15}, {wch: 15},
                {wch: 40}, {wch: 40}, {wch: 40}, {wch: 40}, {wch: 40} // 步驟答錯紀錄加寬
            ];
            
            XLSX.utils.book_append_sheet(wb, ws, "作答紀錄");
            
            const dateStr = session.endTime.toLocaleDateString().replace(/\//g, '-');
            const filename = `${session.teacherName}_雞兔問題紀錄_${dateStr}.xlsx`;
            
            XLSX.writeFile(wb, filename);
        }

            const tPwd = document.getElementById('setup-class-pwd').value.trim();
            if (!tName || !tPwd) {
                alert("請完整輸入「教師姓名」與「課堂密碼」！");
                return;
            }
            if (!isFirebaseActive) {
                alert("Firebase 尚未啟用，無法儲存設定！");
                return;
            }
            
            // 檢查密碼是否已經被使用
            firebase.database().ref('classes/' + tPwd).once('value').then(snap => {
                if (snap.exists()) {
                    alert("❌ 此課堂密碼已經被使用了！請更換一組新的密碼。");
                    return;
                }
                
                // 寫入新課堂
                firebase.database().ref('classes/' + tPwd).set({
                    teacherName: tName,
                    timestamp: Date.now()
                }).then(() => {
                    alert(`✅ 成功建立課堂！\n\n教師姓名：${tName}\n課堂密碼：${tPwd}\n\n請將【課堂密碼】提供給學生輸入，才能將資料正確拋轉進您的後台。`);
                    document.getElementById('setup-teacher-name').value = '';
                    document.getElementById('setup-class-pwd').value = '';
                }).catch(err => {
                    console.error("寫入開課設定失敗：", err);
                    alert("儲存失敗，請檢查網路連線。");
                });
            }).catch(err => {
                console.error("檢查密碼失敗：", err);
                alert("驗證密碼失敗，請檢查網路。");
            });
        }
    </script>
</body>
</html>
