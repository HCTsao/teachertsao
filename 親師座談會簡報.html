<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>115學年度上學期 興華國小二年甲班 親師座談會簡報 (可愛大字版)</title>
  <!-- Google Fonts for cute rounded Japanese/Chinese typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-sky: #E0F2FE;
      --bg-cream: #FEF9C3;
      --bg-pink: #FCE7F3;
      --card-bg: #FFFFFF;
      --text-dark: #1E293B;
      --text-muted: #475569;
      
      /* Cute pastel palette */
      --cute-pink: #FF6B8B;
      --cute-blue: #38BDF8;
      --cute-amber: #F59E0B;
      --cute-green: #10B981;
      --cute-purple: #8B5CF6;
      --cute-rose: #FB7185;

      --shadow-bubble: 0 14px 30px rgba(0, 0, 0, 0.08), 0 6px 0 rgba(203, 213, 225, 0.6);
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Zen Maru Gothic', 'Fredoka', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #FFFBEB 0%, #E0F2FE 50%, #FCE7F3 100%);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
      position: relative;
    }

    /* 可愛背景裝飾圖案 (Bubbles) */
    body::before {
      content: "";
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(254, 240, 138, 0.4) 0%, rgba(255,255,255,0) 70%);
      top: -100px;
      left: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    body::after {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(244, 114, 182, 0.25) 0%, rgba(255,255,255,0) 70%);
      bottom: -150px;
      right: -100px;
      border-radius: 50%;
      pointer-events: none;
    }

    /* 頂部導覽列 */
    .pres-header {
      height: 76px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 3px solid #BAE6FD;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      z-index: 100;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .brand-title {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #0F172A;
      font-weight: 900;
      font-size: 1.25rem;
    }

    .brand-badge {
      background: linear-gradient(135deg, #FF6B8B, #F59E0B);
      color: #fff;
      font-size: 0.9rem;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      box-shadow: 0 4px 10px rgba(255, 107, 139, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      background: #FFFFFF;
      color: #334155;
      border: 2px solid #CBD5E1;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: var(--transition);
      box-shadow: 0 3px 0 #CBD5E1;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #94A3B8;
      border-color: #94A3B8;
    }

    .btn-action.active {
      background: #F59E0B;
      border-color: #D97706;
      color: #FFFFFF;
      box-shadow: 0 4px 0 #B45309;
    }

    .btn-action.btn-save {
      background: linear-gradient(135deg, #10B981, #059669);
      border-color: #047857;
      color: white;
      box-shadow: 0 4px 0 #065F46;
    }

    /* 頂部進度條 */
    .progress-bar-wrap {
      width: 100%;
      height: 6px;
      background: rgba(226, 232, 240, 0.8);
    }

    .progress-bar-fill {
      height: 100%;
      width: 7%;
      background: linear-gradient(90deg, #FF6B8B, #F59E0B, #38BDF8, #10B981);
      border-radius: 0 4px 4px 0;
      transition: width 0.4s ease;
    }

    /* 主簡報舞台 */
    .presentation-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 28px;
      position: relative;
    }

    .slide-card {
      width: 100%;
      max-width: 1180px;
      height: min(720px, calc(100vh - 170px));
      background: var(--card-bg);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow-bubble);
      display: flex;
      flex-direction: column;
      padding: 40px 52px;
      position: relative;
      overflow-y: auto;
      animation: bounceIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      border: 4px solid #F1F5F9;
    }

    @keyframes bounceIn {
      0% { opacity: 0; transform: scale(0.92) translateY(24px); }
      60% { opacity: 1; transform: scale(1.02) translateY(-4px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* 簡報頁頭 (超大醒目) */
    .slide-header {
      margin-bottom: 24px;
      position: relative;
    }

    .slide-tag-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 1.05rem;
      font-weight: 800;
      background: #EFF6FF;
      color: #2563EB;
      padding: 6px 18px;
      border-radius: 20px;
      border: 2px solid #BFDBFE;
      margin-bottom: 8px;
    }

    .slide-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: #0F172A;
      line-height: 1.25;
      letter-spacing: -0.5px;
    }

    .slide-subtitle {
      font-size: 1.25rem;
      color: #64748B;
      font-weight: 700;
      margin-top: 6px;
    }

    .slide-divider {
      height: 6px;
      width: 90px;
      background: linear-gradient(90deg, #FF6B8B, #F59E0B);
      border-radius: 3px;
      margin-top: 14px;
    }

    /* 簡報內容區域 */
    .slide-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    /* 可愛卡片與元件超大字體 */
    .big-card-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    .cute-card {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: var(--radius-lg);
      padding: 24px 30px;
      transition: var(--transition);
      position: relative;
    }

    .cute-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.06);
      border-color: #CBD5E1;
    }

    .cute-card.accent-pink { border-color: #FBCFE8; background: #FFF1F2; }
    .cute-card.accent-blue { border-color: #BAE6FD; background: #F0F9FF; }
    .cute-card.accent-yellow { border-color: #FDE68A; background: #FEFCE8; }
    .cute-card.accent-green { border-color: #A7F3D0; background: #F0FDF4; }
    .cute-card.accent-purple { border-color: #DDD6FE; background: #F5F3FF; }

    .cute-card-title {
      font-size: 1.7rem;
      font-weight: 900;
      color: #0F172A;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .big-text-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .big-text-list li {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.6;
      color: #1E293B;
      position: relative;
      padding-left: 36px;
    }

    .big-text-list li::before {
      content: "✨";
      font-size: 1.4rem;
      position: absolute;
      left: 0;
      top: 2px;
    }

    .big-bullet-item {
      background: #FFFFFF;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 22px 28px;
      font-size: 1.65rem;
      font-weight: 800;
      color: #1E293B;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
      transition: var(--transition);
      line-height: 1.6;
    }

    .big-bullet-item:hover {
      transform: translateX(6px);
      border-color: #38BDF8;
    }

    .bullet-num {
      background: linear-gradient(135deg, #FF6B8B, #F59E0B);
      color: white;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 900;
      flex-shrink: 0;
      box-shadow: 0 4px 8px rgba(255, 107, 139, 0.3);
    }

    /* QR Code 展示區塊 */
    .qr-card-container {
      display: flex;
      align-items: center;
      gap: 36px;
      background: #F0F9FF;
      border: 4px solid #BAE6FD;
      border-radius: 28px;
      padding: 28px 36px;
    }

    .qr-image-box {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.08);
      border: 2px solid #E2E8F0;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .qr-image-box img {
      width: 180px;
      height: 180px;
      object-fit: contain;

    }

    /* 封面特大樣式 */
    .cover-box {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 24px;
    }

    .cover-icon {
      font-size: 4.5rem;
      animation: floatBounce 3s ease-in-out infinite;
    }

    @keyframes floatBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    .cover-title {
      font-size: 3.6rem;
      font-weight: 900;
      color: #0F172A;
      line-height: 1.2;
      background: linear-gradient(135deg, #1E3A8A, #2563EB);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .cover-subtitle {
      font-size: 1.7rem;
      color: #475569;
      font-weight: 700;
    }

    .cover-teacher-pill {
      background: #FFFFFF;
      border: 4px solid #FCD34D;
      border-radius: 40px;
      padding: 18px 48px;
      display: inline-flex;
      gap: 36px;
      box-shadow: 0 10px 25px rgba(245, 158, 11, 0.2);
    }

    .pill-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 800;
      color: #1E293B;
    }

    /* 圖片展示區域 (最適尺寸與關閉上傳UI) */
    .image-display-container {
      width: 100%;
      height: 480px;
      max-height: calc(100vh - 280px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
      position: relative;
      overflow: hidden;
      margin: 0 auto;
    }

    .image-preview {
      max-width: 100%;
      max-height: 480px;
      width: auto;
      height: auto;
      object-fit: contain;
      border-radius: 20px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      border: 3px solid #CBD5E1;
      background: #FFFFFF;
      cursor: zoom-in;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .image-preview:hover {
      transform: scale(1.02);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
    }

    /* 全螢幕圖片 Lightbox Modal 樣式 */
    .lightbox-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(10px);
      z-index: 3000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }

    .lightbox-modal.active {
      display: flex;
    }

    .lightbox-img {
      max-width: 95vw;
      max-height: 95vh;
      object-fit: contain;
      border-radius: 16px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      animation: zoomIn 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .lightbox-close-btn {
      position: absolute;
      top: 24px;
      right: 32px;
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 2px solid rgba(255, 255, 255, 0.4);
      padding: 10px 24px;
      border-radius: 30px;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: var(--transition);
    }

    .lightbox-close-btn:hover {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(1.05);
    }

    /* 翻頁底欄 */
    .pres-footer {
      height: 76px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(12px);
      border-top: 3px solid #BAE6FD;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 36px;
      z-index: 100;
    }

    .slide-counter {
      color: #64748B;
      font-size: 1.15rem;
      font-weight: 800;
    }

    .slide-counter span {
      color: #2563EB;
      font-size: 1.4rem;
      font-weight: 900;
    }

    .nav-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-nav {
      background: linear-gradient(135deg, #FF6B8B, #F59E0B);
      color: #FFFFFF;
      border: none;
      padding: 12px 28px;
      border-radius: 20px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition);
      box-shadow: 0 5px 0 #D97706, 0 8px 16px rgba(245, 158, 11, 0.3);
    }

    .btn-nav:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #D97706, 0 10px 20px rgba(245, 158, 11, 0.4);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* 可編輯模式元素 */
    [contenteditable="true"] {
      outline: 3px dashed #F59E0B !important;
      outline-offset: 6px;
      background: rgba(254, 240, 138, 0.4) !important;
      border-radius: 8px;
      padding: 4px 8px;
      cursor: text;
      user-select: text !important;
    }

    .edit-mode-banner {
      position: absolute;
      top: 18px;
      right: 24px;
      background: #F59E0B;
      color: #FFFFFF;
      padding: 8px 18px;
      border-radius: 30px;
      font-size: 0.95rem;
      font-weight: 900;
      display: none;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.4);
      z-index: 10;
    }

    .edit-mode-active .edit-mode-banner {
      display: flex;
    }

    /* 九宮格 Modal 總覽 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(8px);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #FFFFFF;
      width: 100%;
      max-width: 1050px;
      max-height: 85vh;
      border-radius: 32px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      border: 4px solid #BAE6FD;
    }

    .modal-header {
      padding: 20px 32px;
      background: #0F172A;
      color: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-grid {
      padding: 32px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      overflow-y: auto;
    }

    .overview-card {
      background: #F8FAFC;
      border: 3px solid #E2E8F0;
      border-radius: 20px;
      padding: 18px;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .overview-card:hover, .overview-card.active {
      border-color: #38BDF8;
      background: #F0F9FF;
      transform: translateY(-4px);
    }

    .overview-card-num {
      font-size: 0.88rem;
      font-weight: 900;
      color: #2563EB;
    }

    .overview-card-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #0F172A;
    }

    /* Toast 通知 */
    .toast-box {
      position: fixed;
      bottom: 96px;
      left: 50%;
      transform: translateX(-50%);
      background: #0F172A;
      color: #FFFFFF;
      padding: 14px 32px;
      border-radius: 30px;
      font-weight: 900;
      font-size: 1.05rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-10px);
    }

    /* 全螢幕模式 (Fullscreen Mode) 隱藏最上排工具列與按鈕 */
    :fullscreen .pres-header,
    :-webkit-full-screen .pres-header,
    :-moz-full-screen .pres-header,
    :-ms-fullscreen .pres-header,
    .fullscreen-active .pres-header,
    :fullscreen .progress-bar-wrap,
    :-webkit-full-screen .progress-bar-wrap,
    :-moz-full-screen .progress-bar-wrap,
    :-ms-fullscreen .progress-bar-wrap,
    .fullscreen-active .progress-bar-wrap {
      display: none !important;
    }

    :fullscreen .presentation-stage,
    :-webkit-full-screen .presentation-stage,
    .fullscreen-active .presentation-stage {
      padding: 12px 18px !important;
    }

    :fullscreen .slide-card,
    :-webkit-full-screen .slide-card,
    .fullscreen-active .slide-card {
      max-width: 100vw !important;
      height: min(900px, calc(100vh - 100px)) !important;
      border-radius: 24px !important;
    }

    /* 列印樣式 */
    @media print {
      body { background: #FFFFFF !important; overflow: visible !important; }
      .pres-header, .pres-footer, .progress-bar-wrap, .edit-mode-banner, .btn-action, .dropzone-controls { display: none !important; }
      .presentation-stage { padding: 0 !important; }
      .slide-card { max-width: 100% !important; height: auto !important; box-shadow: none !important; border: none !important; page-break-after: always; }
    }
  </style>
</head>
<body>

  <!-- 頂部導覽列 -->
  <header class="pres-header">
    <div class="brand-title">
      <span style="font-size: 1.6rem;">🎈</span>
      <span>115學年度上學期 興華國小二年甲班 親師座談會</span>
      <span class="brand-badge">導師：曹泓棋 老師</span>
    </div>

    <div class="header-actions">
      <button class="btn-action" id="btn-toggle-edit" onclick="toggleEditMode()">
        <span>✏️</span> <span id="edit-text">編輯模式</span>
      </button>
      <button class="btn-action btn-save" onclick="saveEdits()">
        <span>💾</span> 儲存修改
      </button>
      <button class="btn-action" onclick="resetEdits()">
        <span>🔄</span> 重置內容
      </button>
      <button class="btn-action" onclick="toggleOverview()">
        <span>📜</span> 總覽 (O)
      </button>
      <button class="btn-action" onclick="window.print()">
        <span>🖨️</span> 列印簡報
      </button>
      <button class="btn-action" onclick="toggleFullscreen()">
        <span>🖥️</span> 全螢幕 (F)
      </button>
    </div>
  </header>

  <!-- 頂部進度條 -->
  <div class="progress-bar-wrap">
    <div class="progress-bar-fill" id="progress-bar"></div>
  </div>

  <!-- 簡報舞台 -->
  <main class="presentation-stage">
    <div class="slide-card" id="slide-card">
      <div class="edit-mode-banner">
        <span>✏️</span> 編輯模式已開啟 (點擊文字即可修改)
      </div>

      <div class="slide-header" id="slide-header-box">
        <div class="slide-tag-badge" id="slide-tag">✨ P.1 ‧ 封面</div>
        <h1 class="slide-title" id="slide-title">封面</h1>
        <div class="slide-subtitle" id="slide-subtitle">副標題</div>

    let slides = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadSavedData();
      renderSlide(curIndex);
      renderOverviewGrid();
      document.addEventListener('keydown', handleKeyDown);
      document.addEventListener('fullscreenchange', () => {
        if (document.fullscreenElement) {
          document.body.classList.add('fullscreen-active');
        } else {
          document.body.classList.remove('fullscreen-active');
        }
      });
    });

    function loadSavedData() {
      const savedSlides = localStorage.getItem('pts_slides_115_v5');
      const savedImages = localStorage.getItem('pts_images_115_v5') || localStorage.getItem('pts_images_115_v4') || localStorage.getItem('pts_images_115_v3') || localStorage.getItem('pts_images_115_v2') || localStorage.getItem('pts_images_115');

      if (savedSlides) {
        try { 
          slides = JSON.parse(savedSlides);
          // 檢查若包含舊版按鈕 HTML 或殘留文字，強制恢復預設最新模板
          slides.forEach((s, idx) => {
            if (s.content && (s.content.includes('btn-sm-upload') || s.content.includes('triggerFileUpload') || s.content.includes('promptImageUrl') || s.content.includes('上傳') || s.content.includes('網址'))) {
              slides[idx].content = defaultSlides[idx].content;
            }
          });
        } catch(e) { 
          slides = JSON.parse(JSON.stringify(defaultSlides)); 
        }
      } else {
        slides = JSON.parse(JSON.stringify(defaultSlides));
      }

      storedImages = {};
      if (savedImages) {
        try { storedImages = JSON.parse(savedImages); } catch(e) {}
      }
      if (!storedImages['schedule_img'] && localStorage.getItem('schedule_img')) {
        storedImages['schedule_img'] = localStorage.getItem('schedule_img');
      }
      if (!storedImages['assessment_img'] && localStorage.getItem('assessment_img')) {
        storedImages['assessment_img'] = localStorage.getItem('assessment_img');
      }
    }

    function renderSlide(index) {
      if (index < 0 || index >= slides.length) return;
      curIndex = index;
      const slide = slides[curIndex];

      const card = document.getElementById('slide-card');
      card.style.animation = 'none';
      card.offsetHeight;
      card.style.animation = 'bounceIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';

      document.getElementById('slide-tag').textContent = slide.tag || `P.${curIndex + 1}`;
      document.getElementById('slide-title').textContent = slide.title || '';
      document.getElementById('slide-subtitle').textContent = slide.subtitle || '';
      
      const contentElem = document.getElementById('slide-content');
      contentElem.innerHTML = slide.content;

      if (slide.hasImageUpload && slide.imageKey) {
        updateImagePreview(slide.imageKey);
      }

      document.getElementById('cur-slide-num').textContent = curIndex + 1;
      document.getElementById('total-slide-num').textContent = slides.length;
      
      const pct = ((curIndex + 1) / slides.length) * 100;
      document.getElementById('progress-bar').style.width = `${pct}%`;

      document.getElementById('btn-prev').disabled = (curIndex === 0);
      document.getElementById('btn-next').disabled = (curIndex === slides.length - 1);

      applyEditState();
    }

    function nextSlide() {
      if (curIndex < slides.length - 1) renderSlide(curIndex + 1);
    }

    function prevSlide() {
      if (curIndex > 0) renderSlide(curIndex - 1);
    }

    function handleKeyDown(e) {
      if (e.key === 'Escape') {
        closeLightbox();
        const modal = document.getElementById('overview-modal');
        if (modal && modal.classList.contains('active')) toggleOverview();
        return;
      }

      if (e.target.getAttribute('contenteditable') === 'true') return;

      if (e.key === 'ArrowRight' || e.key === 'Space' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key === 'f' || e.key === 'F') {
        toggleFullscreen();
      } else if (e.key === 'o' || e.key === 'O') {
        toggleOverview();
      }
    }

    function toggleEditMode() {
      isEditMode = !isEditMode;
      const btn = document.getElementById('btn-toggle-edit');
      const card = document.getElementById('slide-card');

      if (isEditMode) {
        btn.classList.add('active');
        document.getElementById('edit-text').textContent = "離開編輯";
        card.classList.add('edit-mode-active');
        showToast('✏️ 編輯模式已開啟，可點擊文字直接修改！');
      } else {
        btn.classList.remove('active');
        document.getElementById('edit-text').textContent = "編輯模式";
        card.classList.remove('edit-mode-active');
        saveCurrentSlideHTML();
        showToast('✅ 已離開編輯模式');
      }
      applyEditState();
    }

    function applyEditState() {
      const editables = document.querySelectorAll('[editable="true"], [contenteditable]');
      editables.forEach(elem => {
        if (isEditMode) {
          elem.setAttribute('contenteditable', 'true');
        } else {
          elem.removeAttribute('contenteditable');
        }
      });
    }

    function saveCurrentSlideHTML() {
      const contentElem = document.getElementById('slide-content');
      slides[curIndex].content = contentElem.innerHTML;
    }

    function saveEdits() {
      saveCurrentSlideHTML();
      localStorage.setItem('pts_slides_115_v5', JSON.stringify(slides));
      localStorage.setItem('pts_images_115_v5', JSON.stringify(storedImages));
      showToast('💾 簡報內文與圖片已成功儲存至本機！');
    }

    function resetEdits() {
      if (confirm('確定要恢復預設簡報內容與圖片嗎？所有修改將會重置。')) {
        ['pts_slides_115_v5','pts_slides_115_v4','pts_slides_115_v3','pts_slides_115_v2','pts_slides_115','pts_images_115_v5','pts_images_115_v4','pts_images_115_v3','pts_images_115_v2','pts_images_115'].forEach(k => localStorage.removeItem(k));
        slides = JSON.parse(JSON.stringify(defaultSlides));
        storedImages = {};
        renderSlide(curIndex);
        showToast('🔄 已重置為預設簡報');
      }
    }

    function updateImagePreview(key) {
      let previewBoxId = (key === 'schedule_img') ? 'dz-preview-schedule' : 'dz-preview-assessment';
      let dzId = (key === 'schedule_img') ? 'dz-schedule' : 'dz-assessment';
      
      const previewBox = document.getElementById(previewBoxId);
      const dz = document.getElementById(dzId);

      if (storedImages[key] && previewBox && dz) {
        dz.classList.add('has-image');
        previewBox.innerHTML = `<img src="${storedImages[key]}" class="image-preview" alt="圖表" onclick="openLightbox(this.src)" title="點擊放大全螢幕查看">`;
      }
    }

    function openLightbox(src) {
      const modal = document.getElementById('lightbox-modal');
      const img = document.getElementById('lightbox-img');
      if (modal && img) {
        img.src = src;
        modal.classList.add('active');
      }
    }

    function closeLightbox() {
      const modal = document.getElementById('lightbox-modal');
      if (modal) modal.classList.remove('active');
    }

    function toggleOverview() {
      const modal = document.getElementById('overview-modal');
      if (modal.classList.contains('active')) {
        modal.classList.remove('active');
      } else {
        renderOverviewGrid();
        modal.classList.add('active');
      }
    }

    function renderOverviewGrid() {
      const grid = document.getElementById('modal-grid');
      grid.innerHTML = '';
      slides.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = `overview-card ${idx === curIndex ? 'active' : ''}`;
        card.onclick = () => {
          renderSlide(idx);
          toggleOverview();
        };
        card.innerHTML = `
          <div class="overview-card-num">P.${idx + 1} ‧ ${s.tag || ''}</div>
          <div class="overview-card-title">${s.title}</div>
        `;
        grid.appendChild(card);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-box');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }
  </script>
</body>
</html>
